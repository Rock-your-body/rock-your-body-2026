<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steps</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app-config.js"></script><script src="./common.js"></script><style>body{font-family:Arial,'Noto Sans Thai';background:#eef4ff;color:#08245b}.wrap{max-width:600px;margin:auto;padding:20px}.card{background:#fff;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 8px 25px #1233}.input{width:100%;padding:15px;font-size:22px;box-sizing:border-box;border:1px solid #ccd8ea;border-radius:12px}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#0b4fc0;color:#fff;font-weight:900;margin-top:10px}</style></head><body><main class="wrap"><section class="card"><h1>👟 STEPS</h1><p>บันทึกจำนวนก้าววันนี้</p><input id="steps" class="input" type="number" min="0" placeholder="เช่น 6842"><button class="btn" onclick="save()">บันทึก</button><button class="btn" onclick="ROCK.goHome()">กลับ HOME</button><p id="s"></p></section></main><script>(async()=>{try{await ROCK.initLiff();const d=await ROCK.fetchDashboard();document.getElementById('steps').value=d.steps||0}catch(e){document.getElementById('s').textContent=e.message}})();async function save(){try{const r=await ROCK.callPlayerApi({action:'saveSteps',steps:document.getElementById('steps').value});document.getElementById('s').textContent='✅ บันทึกแล้ว '+r.steps.today.toLocaleString()+' ก้าว'}catch(e){document.getElementById('s').textContent='❌ '+e.message}}</script></body></html>
