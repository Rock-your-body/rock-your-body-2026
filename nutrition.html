<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - NUTRITION</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef5ff;font-family:Arial,"Noto Sans Thai",sans-serif;color:#08245f}
    .app{max-width:760px;margin:auto;padding:14px}
    .card{background:#fff;border:2px solid #d7e5f5;border-radius:22px;padding:18px;box-shadow:0 5px 15px #163f8120}
    h1{margin:0 0 6px;font-size:26px}
    .sub{color:#607493;margin-bottom:16px}
    .ring-wrap{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}
    .ring{width:190px;height:190px;border-radius:50%;background:conic-gradient(#174fe5 0 25%,#17a53a 25% 50%,#ff7b10 50% 75%,#e60018 75% 100%);position:relative;margin:auto}
    .ring:after{content:"";position:absolute;inset:25px;background:#fff;border-radius:50%}
    .ring-center{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700}
    .ring-center strong{font-size:34px}
    .metrics{display:grid;gap:12px}
    .metric{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #d9e2ed;padding:8px 0}
    .bar{height:48px;border-radius:8px}.blue{background:#174fe5}.green{background:#17a53a}.orange{background:#ff7b10}.red{background:#e60018}
    .metric b{font-size:18px}.metric span{font-size:17px}
    .meal-title{margin:22px 0 10px;font-size:20px}
    .meals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .meal{border:1px solid #d7e2f0;border-radius:15px;padding:12px;background:#f8fbff}
    .meal b{display:block;margin-bottom:6px}
    .meal small{color:#607493}
    button{width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:700;color:white;background:#008999;margin-top:16px}
    .back{background:#073783}
    dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px)}
    dialog .box{padding:20px}
    label{display:block;font-weight:700;margin-top:10px}
    input,select,textarea{width:100%;padding:12px;border:1px solid #ccd9e8;border-radius:10px;font-size:16px;margin-top:5px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .notice{padding:10px;background:#fff7dd;border-radius:10px;margin-top:12px;color:#725300}
    #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17395f;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:99}
    @media(max-width:600px){.ring-wrap{grid-template-columns:1fr}.ring{width:160px;height:160px}.ring:after{inset:22px}.meals{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>🥗 NUTRITION</h1>
    <div class="sub">เป้าหมายโภชนาการจากข้อมูลสุขภาพล่าสุด • ไม่มีข้อมูลแสดง 0</div>

    <div class="ring-wrap">
      <div class="ring">
        <div class="ring-center"><strong id="pct">0%</strong><span>พลังงานวันนี้</span></div>
      </div>

      <div class="metrics">
        <div class="metric"><i class="bar blue"></i><b>พลังงาน</b><span><strong id="calDone">0</strong> / <strong id="calGoal">0</strong> kcal</span></div>
        <div class="metric"><i class="bar green"></i><b>โปรตีน</b><span><strong id="proDone">0</strong> / <strong id="proGoal">0</strong> g</span></div>
        <div class="metric"><i class="bar orange"></i><b>ไขมัน</b><span><strong id="fatDone">0</strong> / <strong id="fatGoal">0</strong> g</span></div>
        <div class="metric"><i class="bar red"></i><b>คาร์โบไฮเดรต</b><span><strong id="carbDone">0</strong> / <strong id="carbGoal">0</strong> g</span></div>
      </div>
    </div>

    <div class="meal-title">เป้าหมาย / ที่รับประทานจริงแต่ละมื้อ</div>
    <div class="meals" id="meals"></div>

    <button onclick="openMeal()">📝 บันทึกการรับประทานอาหาร</button>
    <button class="back" onclick="location.href='./mission.html'">← กลับ MISSION</button>
    <div class="notice">* เป้าหมายเป็นการประมาณเพื่อ Wellness จากข้อมูลล่าสุด ไม่ใช่คำสั่งทางการแพทย์</div>
  </div>
</div>

<dialog id="mealDialog">
  <div class="box">
    <h2>บันทึกอาหาร</h2>
    <label>มื้ออาหาร</label>
    <select id="mealType">
      <option value="breakfast">มื้อเช้า</option>
      <option value="lunch">มื้อกลางวัน</option>
      <option value="dinner">มื้อเย็น</option>
      <option value="snack">ของว่าง</option>
    </select>
    <label>ชื่ออาหาร</label><input id="mealName" placeholder="เช่น ข้าว + อกไก่ + ผัก">
    <label>รายละเอียด</label><textarea id="mealDesc" rows="2"></textarea>
    <div class="grid2">
      <div><label>พลังงาน kcal</label><input id="calories" type="number" min="0" value="0"></div>
      <div><label>โปรตีน g</label><input id="protein" type="number" min="0" step="0.1" value="0"></div>
      <div><label>ไขมัน g</label><input id="fat" type="number" min="0" step="0.1" value="0"></div>
      <div><label>คาร์โบไฮเดรต g</label><input id="carbs" type="number" min="0" step="0.1" value="0"></div>
    </div>
    <label>รูปอาหาร (ถ้ามี)</label><input id="photo" type="file" accept="image/*">
    <button onclick="saveMeal()">บันทึก</button>
    <button class="back" onclick="mealDialog.close()">ยกเลิก</button>
  </div>
</dialog>
<div id="toast"></div>

<script>
const LIFF_ID = window.APP_CONFIG?.LIFF_ID || "2011201679-uNWz5yqF";
const API = window.APP_CONFIG?.getApi ? window.APP_CONFIG.getApi("NUTRITION")
  : (window.APP_CONFIG?.API?.NUTRITION || "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/nutrition");

const $ = id => document.getElementById(id);
const n = v => Number(v) || 0;
const fmt = v => n(v).toLocaleString("th-TH",{maximumFractionDigits:1});
const mealDialog = $("mealDialog");

function toast(t){ const x=$("toast"); x.textContent=t; x.style.display="block"; setTimeout(()=>x.style.display="none",2500); }

async function initLine(){
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return false; }
  if(!liff.getIDToken()){ liff.logout(); liff.login({redirectUri:location.href}); return false; }
  return true;
}

async function api(action, data={}){
  const idToken=liff.getIDToken();
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",
    body:JSON.stringify({action,idToken,...data})});
  const j=await r.json().catch(()=>({}));
  const msg=String(j.error||j.message||"").toLowerCase();
  if(r.status===401 || msg.includes("expired")){
    liff.logout(); liff.login({redirectUri:location.href}); return new Promise(()=>{});
  }
  if(!r.ok || j.success===false) throw new Error(j.error||j.message||`HTTP ${r.status}`);
  return j.data ?? j;
}

function render(d={}){
  const g=d.goals||{}, c=d.consumed||{};
  $("calGoal").textContent=fmt(g.calories);
  $("proGoal").textContent=fmt(g.protein);
  $("fatGoal").textContent=fmt(g.fat);
  $("carbGoal").textContent=fmt(g.carbs);
  $("calDone").textContent=fmt(c.calories);
  $("proDone").textContent=fmt(c.protein);
  $("fatDone").textContent=fmt(c.fat);
  $("carbDone").textContent=fmt(c.carbs);
  $("pct").textContent=(n(g.calories)>0 ? Math.min(100,Math.round(n(c.calories)/n(g.calories)*100)) : 0)+"%";

  const names={breakfast:"มื้อเช้า",lunch:"มื้อกลางวัน",dinner:"มื้อเย็น",snack:"ของว่าง"};
  const splits={breakfast:.25,lunch:.35,dinner:.30,snack:.10};
  const actual=d.meals||{};
  $("meals").innerHTML=Object.keys(names).map(k=>{
    const m=actual[k]||{};
    return `<div class="meal"><b>${names[k]}</b>
      <small>พลังงาน ${fmt(m.calories)} / ${fmt(n(g.calories)*splits[k])} kcal</small><br>
      <small>P ${fmt(m.protein)} / ${fmt(n(g.protein)*splits[k])} g ·
      F ${fmt(m.fat)} / ${fmt(n(g.fat)*splits[k])} g ·
      C ${fmt(m.carbs)} / ${fmt(n(g.carbs)*splits[k])} g</small></div>`;
  }).join("");
}

function openMeal(){ mealDialog.showModal(); }

async function saveMeal(){
  try{
    const file=$("photo").files[0];
    let photoBase64=null, photoName=null, photoType=null;
    if(file){
      photoName=file.name; photoType=file.type;
      photoBase64=await new Promise((resolve,reject)=>{
        const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(",")[1]); fr.onerror=reject; fr.readAsDataURL(file);
      });
    }
    await api("saveMeal",{
      meal_type:$("mealType").value,
      meal_name:$("mealName").value.trim(),
      description:$("mealDesc").value.trim(),
      calories:n($("calories").value), protein:n($("protein").value),
      fat:n($("fat").value), carbs:n($("carbs").value),
      photo_base64:photoBase64, photo_name:photoName, photo_type:photoType
    });
    mealDialog.close(); toast("บันทึกอาหารแล้ว"); await load();
  }catch(e){ toast("บันทึกไม่สำเร็จ: "+e.message); }
}

async function load(){
  try{ render(await api("dashboard")); }
  catch(e){ render({}); toast("โหลดข้อมูลไม่สำเร็จ: "+e.message); }
}

(async()=>{ try{ if(await initLine()) await load(); }catch(e){ render({}); toast(e.message); } })();
</script>
</body>
</html>
