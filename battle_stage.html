<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE STAGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260830-battle-flow-v36"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#031022;
      font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;
      color:#fff;
    }
    body{display:flex;justify-content:center}

    #stage{
      position:relative;
      width:min(100vw,1000px);
      min-height:100vh;
      overflow:hidden;
      background:#10263a;
    }

    .stage-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
    }

    .shade{
      position:absolute;
      inset:0;
      z-index:1;
      background:
        linear-gradient(180deg,rgba(0,15,50,.38),transparent 28%,transparent 72%,rgba(0,8,30,.58));
      pointer-events:none;
    }

    .topbar{
      position:relative;
      z-index:10;
      display:grid;
      grid-template-columns:56px 1fr 150px;
      gap:10px;
      padding:12px;
      align-items:center;
    }

    .back{
      width:48px;height:48px;
      border:2px solid #7db9ff;
      border-radius:14px;
      background:#062f78;
      color:#fff;
      font-size:28px;
      font-weight:900;
    }

    .boss-card{
      min-width:0;
      padding:10px 18px;
      border:2px solid #397ee8;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(5,30,83,.95),rgba(1,12,50,.95));
      text-align:center;
      box-shadow:0 5px 18px rgba(0,0,0,.3);
    }

    #bossName{
      font-size:clamp(17px,3.4vw,30px);
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .hp-track{
      height:18px;
      margin-top:7px;
      border-radius:999px;
      background:#173d78;
      border:1px solid rgba(255,255,255,.45);
      overflow:hidden;
    }

    #hpFill{
      width:100%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(180deg,#ff3b25,#db0000);
      transition:width .45s ease;
    }

    #hpText{
      margin-top:4px;
      font-size:15px;
      font-weight:800;
    }

    .energy-box{
      padding:10px;
      border:2px solid #397ee8;
      border-radius:16px;
      background:rgba(3,28,77,.94);
      text-align:center;
    }

    .energy-label{font-size:11px;font-weight:800}
    #energyValue{
      margin-top:3px;
      color:#ffd43b;
      font-size:21px;
      font-weight:900;
    }

    .battle-field{
      position:relative;
      z-index:5;
      min-height:62vh;
    }

    #playerCharacter{
      position:absolute;
      left:4%;
      bottom:7%;
      width:31%;
      max-height:58vh;
      object-fit:contain;
      object-position:left bottom;
      filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));
      transition:transform .18s ease;
    }

    #monsterImage{
      position:absolute;
      right:4%;
      bottom:8%;
      width:44%;
      max-height:59vh;
      object-fit:contain;
      object-position:right bottom;
      filter:drop-shadow(0 15px 17px rgba(0,0,0,.48));
      transition:transform .25s ease,filter .25s ease;
    }

    #vs{
      position:absolute;
      left:50%;
      top:43%;
      transform:translate(-50%,-50%);
      color:#ffd24a;
      font-size:clamp(42px,10vw,90px);
      font-weight:900;
      font-style:italic;
      text-shadow:0 3px 0 #8d4200,0 0 18px #ffce45;
    }

    .damage{
      position:absolute;
      right:32%;
      top:33%;
      z-index:20;
      color:#ffef3a;
      font-size:clamp(34px,7vw,70px);
      font-weight:900;
      text-shadow:0 4px 0 #9c0000,0 0 12px #fff;
      opacity:0;
      transform:translateY(15px) scale(.7);
      pointer-events:none;
    }

    .damage.show{
      animation:damagePop .7s ease;
    }

    @keyframes damagePop{
      0%{opacity:0;transform:translateY(20px) scale(.5)}
      25%{opacity:1;transform:translateY(0) scale(1.2)}
      80%{opacity:1}
      100%{opacity:0;transform:translateY(-35px) scale(.9)}
    }

    .bottom{
      position:relative;
      z-index:12;
      display:grid;
      grid-template-columns:1fr 1.35fr;
      gap:12px;
      padding:0 14px 18px;
      margin-top:-10px;
    }

    .cost-card{
      min-height:82px;
      border:2px solid #3a78d9;
      border-radius:18px;
      background:linear-gradient(180deg,#082b6a,#031845);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      box-shadow:0 6px 16px rgba(0,0,0,.3);
    }

    .cost-label{font-size:14px;font-weight:700}
    #energyCost{margin-top:5px;color:#ffd440;font-size:27px;font-weight:900}

    #attackButton{
      min-height:82px;
      border:3px solid #fff1a7;
      border-radius:21px;
      background:linear-gradient(180deg,#ffd85b,#ed9a00);
      color:#251400;
      font-size:clamp(25px,5vw,48px);
      font-weight:900;
      box-shadow:0 7px 0 #a85600,0 10px 22px rgba(0,0,0,.35);
    }

    #attackButton:disabled{
      opacity:.55;
      filter:grayscale(.45);
    }

    #battleStatus{
      position:relative;
      z-index:15;
      margin:0 14px 14px;
      padding:10px 14px;
      border-radius:13px;
      background:rgba(0,22,62,.88);
      text-align:center;
      font-size:13px;
      font-weight:800;
    }

    /* RESULT */
    #resultModal{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,5,22,.78);
      backdrop-filter:blur(4px);
    }
    #resultModal.show{display:flex}

    .result-box{
      width:min(92vw,510px);
      padding:24px;
      border:3px solid #7eb6ff;
      border-radius:24px;
      background:linear-gradient(180deg,#0b3b8b,#031c56);
      color:#fff;
      text-align:center;
      box-shadow:0 20px 55px rgba(0,0,0,.48);
    }

    #resultIcon{font-size:62px}
    #resultTitle{margin-top:6px;font-size:35px;font-weight:900}
    #resultText{margin-top:10px;line-height:1.5;font-size:15px}
    #resultReward{
      margin-top:14px;
      padding:12px;
      border-radius:14px;
      background:rgba(255,255,255,.1);
      font-size:17px;
      font-weight:800;
      line-height:1.6;
    }

    .result-actions{
      margin-top:17px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .result-actions button{
      min-height:50px;
      border:0;
      border-radius:13px;
      color:#fff;
      font-weight:900;
    }

    #mapButton{background:#0b62cf}
    #nextButton{background:#10a54c}

    @media(max-width:650px){
      .topbar{grid-template-columns:42px 1fr 95px;padding:7px;gap:5px}
      .back{width:38px;height:38px;border-radius:10px;font-size:22px}
      .boss-card{padding:7px 9px;border-radius:11px}
      #bossName{font-size:15px}
      .hp-track{height:11px;margin-top:4px}
      #hpText{font-size:10px}
      .energy-box{padding:6px;border-radius:10px}
      .energy-label{font-size:8px}
      #energyValue{font-size:14px}
      .battle-field{min-height:56vh}
      #playerCharacter{width:34%;bottom:10%}
      #monsterImage{width:48%;bottom:10%}
      .bottom{padding:0 8px 11px;gap:7px}
      .cost-card,#attackButton{min-height:62px;border-radius:13px}
      .cost-label{font-size:10px}
      #energyCost{font-size:19px}
      #battleStatus{margin:0 8px 9px;font-size:10px}
    }
  </style>
</head>

<body>
<main id="stage">
  <img id="stageBackground" class="stage-bg" src="" alt="Battle Stage Background">
  <div class="shade"></div>

  <header class="topbar">
    <button class="back" type="button" onclick="goMap()">‹</button>

    <div class="boss-card">
      <div id="bossName">กำลังโหลด...</div>
      <div class="hp-track"><div id="hpFill"></div></div>
      <div id="hpText">-- / --</div>
    </div>

    <div class="energy-box">
      <div class="energy-label">⚡ MY ENERGY</div>
      <div id="energyValue">--</div>
    </div>
  </header>

  <section class="battle-field">
    <img id="playerCharacter" src="" alt="Player">
    <div id="vs">VS</div>
    <img id="monsterImage" src="" alt="Monster">
    <div id="damageText" class="damage">-0</div>
  </section>

  <div id="battleStatus">กำลังตรวจสอบข้อมูลผู้เล่น...</div>

  <section class="bottom">
    <div class="cost-card">
      <div class="cost-label">ใช้พลังงาน</div>
      <div id="energyCost">⚡ --</div>
    </div>

    <button id="attackButton" type="button" disabled>
      ⚔️ โจมตีเลย!
    </button>
  </section>
</main>


<div id="resultModal">
  <div class="result-box">
    <div id="resultIcon">🏆</div>
    <div id="resultTitle">VICTORY!</div>
    <div id="resultText"></div>
    <div id="resultReward"></div>

    <div class="result-actions">
      <button id="mapButton" type="button">กลับ Battle Map</button>
      <button id="nextButton" type="button">ไปด่านถัดไป</button>
    </div>
  </div>
</div>


<script>
"use strict";

const $ = id => document.getElementById(id);

const PARAMS = new URLSearchParams(window.location.search);
const STAGE_ID = Math.max(1,Math.min(10,Number(PARAMS.get("stage")) || 1));

const ASSET_ROOT =
  "https://nztvqdzatdpauufpvdaa.supabase.co/storage/v1/object/public/rock-assets/%20battle";

const MONSTER_BASE = ASSET_ROOT + "/monster";
const STAGE_BASE = ASSET_ROOT + "/stages";
const CHARACTER_BASE = ASSET_ROOT + "/characters";

const STATIC_STAGE = {
  1:{name:"เจ้าจอมเอื่อย",energy:300,hp:1200,monster:"stage-001-germ.png"},
  2:{name:"จอมหวาน",energy:900,hp:1800,monster:"stage-002-donut.png"},
  3:{name:"ปีศาจของทอด",energy:1500,hp:2400,monster:"stage-003-fries.png"},
  4:{name:"จอมเค็ม",energy:2100,hp:3000,monster:"stage-004-salt.png"},
  5:{name:"ราชาอาหารไร้ประโยชน์",energy:2700,hp:3600,monster:"stage-005-burger-king.png"},
  6:{name:"ปีศาจพักผ่อนน้อย",energy:3300,hp:4200,monster:"stage-006-rest.png"},
  7:{name:"จอมเนือยนิ่ง",energy:3900,hp:4800,monster:"stage-007-sedentary.png"},
  8:{name:"ปีศาจพฤติกรรมเสี่ยง",energy:4500,hp:5400,monster:"stage-008-risk.png"},
  9:{name:"ราชาความเสี่ยงสุขภาพ",energy:5100,hp:6000,monster:"stage-009-risk-king.png"},
  10:{name:"จอมมารโรคร้าย",energy:5700,hp:7000,monster:"stage-010-boss.png"}
};

let stageData = {...STATIC_STAGE[STAGE_ID]};
let playerEnergy = 0;
let maxEnergy = 200;
let unlockedStage = 1;
let attacking = false;

function n(v,f=0){
  const x = Number(v);
  return Number.isFinite(x) ? x : f;
}

function pick(...xs){
  for(const x of xs){
    if(x !== undefined && x !== null && x !== "") return x;
  }
  return null;
}

function fmt(v){
  return Math.round(n(v,0)).toLocaleString("en-US");
}

function getApi(name){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi(name);
  const url = window.APP_CONFIG?.API?.[name];
  if(!url) throw new Error("ไม่พบ API." + name);
  return url;
}

async function initLiff(){
  if(typeof liff === "undefined") throw new Error("LINE LIFF SDK ไม่พร้อม");

  await liff.init({
    liffId:window.APP_CONFIG?.LIFF_ID || "2011201679-uNWz5yqF"
  });

  if(!liff.isLoggedIn()){
    liff.login({redirectUri:window.location.href});
    return false;
  }

  if(!liff.getIDToken()) throw new Error("ไม่พบ LINE ID Token");
  return true;
}

async function battleApi(payload){
  const response = await fetch(getApi("BATTLE"),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({
      ...payload,
      idToken:liff.getIDToken()
    })
  });

  const raw = await response.text();
  let data = {};

  try{
    data = raw ? JSON.parse(raw) : {};
  }catch{
    throw new Error("Battle API ตอบกลับไม่ใช่ JSON");
  }

  if(!response.ok || data?.success === false){
    throw new Error(data?.error || data?.message || `HTTP ${response.status}`);
  }

  return data;
}

async function playerApi(payload){
  const response = await fetch(getApi("PLAYER"),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({
      ...payload,
      idToken:liff.getIDToken()
    })
  });

  const raw = await response.text();
  let data = {};
  try{ data = raw ? JSON.parse(raw) : {}; }catch{}

  if(!response.ok || data?.success === false){
    throw new Error(data?.error || data?.message || `HTTP ${response.status}`);
  }
  return data;
}

function renderAssets(){
  $("stageBackground").src =
    `${STAGE_BASE}/battle-stage-${String(STAGE_ID).padStart(2,"0")}-bg.jpeg`;

  $("monsterImage").src =
    `${MONSTER_BASE}/${stageData.monster}`;

  // ใช้ตัวละครผู้เล่นชุดเดียวกับ Battle Stage เดิม
  $("playerCharacter").src =
    `${CHARACTER_BASE}/male/player-male-battle.png`;

  $("bossName").textContent = stageData.name;
  $("energyCost").textContent = "⚡ " + fmt(stageData.energy);
  renderHp(stageData.hp,stageData.hp);
}

function renderHp(current,max){
  const c = Math.max(0,n(current,0));
  const m = Math.max(1,n(max,1));
  const pct = Math.max(0,Math.min(100,c/m*100));
  $("hpText").textContent = `${fmt(c)} / ${fmt(m)}`;
  $("hpFill").style.width = pct + "%";
}

function renderEnergy(){
  $("energyValue").textContent = `${fmt(playerEnergy)} / ${fmt(maxEnergy)}`;
}

function setStatus(text){
  $("battleStatus").textContent = text;
}

function showDamage(value){
  const el = $("damageText");
  el.textContent = "-" + fmt(value);
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

function goMap(){
  window.location.href = "./battle_maps.html";
}

function showResult(result){
  const won = result?.mission_status === "success";
  const modal = $("resultModal");

  if(won){
    $("resultIcon").textContent = STAGE_ID === 10 ? "👑" : "🏆";
    $("resultTitle").textContent = result?.already_success ? "ผ่านด่านนี้แล้ว" : "VICTORY!";
    $("resultText").textContent =
      result?.already_success
        ? `${stageData.name} ถูกพิชิตแล้ว`
        : STAGE_ID < 10
          ? `พิชิต ${stageData.name} สำเร็จ • Stage ${STAGE_ID + 1} ถูกปลดล็อก`
          : "สุดยอด! คุณพิชิต FINAL BOSS สำเร็จ";

    const rewardStatus = result?.reward_status || "pending";
    $("resultReward").innerHTML =
      `🪙 +${fmt(result?.reward_coin || 0)} ROCK COIN<br>` +
      `⚡ +${fmt(result?.reward_energy || 0)} ENERGY<br>` +
      `🏆 +${fmt(result?.reward_exp || 0)} EXP<br>` +
      `<small>สถานะรางวัล: ${rewardStatus === "pending" ? "รอ Admin อนุมัติ" : rewardStatus}</small>`;

    $("nextButton").style.display = STAGE_ID < 10 ? "" : "none";
  }else{
    $("resultIcon").textContent = "⚡";
    $("resultTitle").textContent = "ENERGY NOT ENOUGH";
    $("resultText").textContent =
      `Energy ปัจจุบัน ${fmt(result?.energy_before ?? playerEnergy)} • ต้องใช้มากกว่า ${fmt(stageData.energy)} เพื่อผ่านด่าน`;
    $("resultReward").textContent =
      result?.energy_refunded
        ? "ระบบคืน Energy ให้แล้ว • ไม่มีรางวัลจากการโจมตีครั้งนี้"
        : "ไม่มีรางวัล";
    $("nextButton").style.display = "none";
  }

  modal.classList.add("show");
}

async function loadState(){
  const [battleResult,homeResult] = await Promise.all([
    battleApi({action:"battleStatus"}),
    playerApi({action:"dashboard"})
  ]);

  const bp = battleResult?.player || {};
  const bs = battleResult?.stage || {};

  unlockedStage = Math.max(1,n(bp.unlockedStage ?? bp.unlocked_stage,1));

  if(STAGE_ID > unlockedStage){
    throw new Error(`Stage ${STAGE_ID} ยังไม่ปลดล็อก`);
  }

  const hd = homeResult?.data ?? homeResult?.dashboard ?? homeResult ?? {};
  const hu = hd?.user ?? hd?.player ?? {};
  const he = hd?.energy && typeof hd.energy === "object" ? hd.energy : {};

  playerEnergy = n(
    he.current ??
    hd.energyCurrent ??
    hd.current_energy ??
    (typeof hd.energy === "number" ? hd.energy : null) ??
    hu.energy ??
    bp.energy,
    0
  );

  maxEnergy = Math.max(1,n(
    he.max ??
    hd.maxEnergy ??
    hd.max_energy ??
    hu.maxEnergy ??
    hu.max_energy ??
    bp.maxEnergy ??
    200,
    200
  ));

  // Battle API stage detail ใช้เฉพาะเมื่อเป็น current unlocked stage
  if(STAGE_ID === unlockedStage){
    stageData = {
      ...stageData,
      name:pick(bs.name,bs.monster_name,stageData.name),
      energy:n(pick(bs.energy_cost,bs.energyCost,stageData.energy),stageData.energy),
      hp:n(pick(bs.max_hp,bs.maxHp,bs.hp,stageData.hp),stageData.hp)
    };
  }

  renderAssets();
  renderEnergy();

  if(STAGE_ID < unlockedStage){
    setStatus("ด่านนี้ผ่านแล้ว • เปิดดูได้ แต่ระบบจะไม่แจก Reward ซ้ำ");
  }else if(playerEnergy <= stageData.energy){
    setStatus(`Energy ยังไม่พอ • ต้องมีมากกว่า ⚡ ${fmt(stageData.energy)}`);
  }else{
    setStatus("พร้อมต่อสู้ • กดโจมตีเลย!");
  }

  $("attackButton").disabled = false;
}

async function attack(){
  if(attacking) return;

  attacking = true;
  $("attackButton").disabled = true;
  setStatus("กำลังโจมตี...");

  try{
    const result = await battleApi({
      action:"attackStage",
      stageId:STAGE_ID
    });

    if(result?.mission_status === "success"){
      renderHp(0,stageData.hp);
      showDamage(stageData.hp);

      if(result?.energy_after !== undefined){
        playerEnergy = n(result.energy_after,playerEnergy);
        renderEnergy();
      }

      setTimeout(()=>showResult(result),500);
    }else{
      const hp = n(result?.monster_hp,stageData.hp);
      renderHp(hp,stageData.hp);
      showDamage(Math.max(0,stageData.hp - hp));

      if(result?.energy_after_refund !== undefined){
        playerEnergy = n(result.energy_after_refund,playerEnergy);
        renderEnergy();
      }

      setTimeout(()=>showResult(result),500);
    }

  }catch(error){
    console.error("ATTACK ERROR",error);
    setStatus(error?.message || "โจมตีไม่สำเร็จ");
  }finally{
    attacking = false;
    $("attackButton").disabled = false;
  }
}

$("attackButton").addEventListener("click",attack);
$("mapButton").addEventListener("click",goMap);
$("nextButton").addEventListener("click",()=>{
  if(STAGE_ID >= 10){
    goMap();
    return;
  }
  window.location.href = `./battle_stage.html?stage=${STAGE_ID + 1}`;
});

(async()=>{
  try{
    renderAssets();

    const ready = await initLiff();
    if(ready === false) return;

    await loadState();
  }catch(error){
    console.error("BATTLE STAGE INIT",error);
    setStatus(error?.message || "เปิด Battle Stage ไม่สำเร็จ");
    $("attackButton").disabled = true;
  }
})();
</script>
</body>
</html>
