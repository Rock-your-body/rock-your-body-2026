<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE STAGE</title>

  <script src="./app-config.js?v=20260824-06"></script>
  <script src="./common.js?v=20260824-06"></script>

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:#020b22;
      font-family:Arial,"Prompt",sans-serif;
      overflow-x:hidden;
    }
    button{font:inherit}

    .battle-page{
      min-height:100svh;
      background:#020b22;
    }

    /*
      รูป Stage ที่ผู้ใช้ส่งมาเป็น 1080 x 1344
      ใช้รูปเป็น Template ทั้งหน้า
    */
    .stage{
      position:relative;
      width:100%;
      max-width:1080px;
      margin:0 auto;
      aspect-ratio:1080 / 1344;
      overflow:hidden;
      background:#06163a;
      user-select:none;
      -webkit-user-select:none;
    }

    .stage-bg{
      position:absolute;
      inset:0;
      z-index:1;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
      pointer-events:none;
    }

    /* =========================================================
       LIVE OVERLAYS
       วางทับตัวเลขเดิมบน Template
    ========================================================= */

    .live{
      position:absolute;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:900;
      pointer-events:none;
    }

    /* HP number เช่น 1,200 / 1,200 */
    .hp-live{
      left:60.5%;
      top:33.2%;
      width:29.5%;
      height:3.4%;
      color:#fff;
      font-size:clamp(12px,3vw,28px);
      text-shadow:
        0 2px 2px #000,
        0 0 5px #000;
    }

    /* Energy ของผู้เล่นซ้ายล่าง */
    .energy-live{
      left:7.5%;
      top:80.7%;
      width:18%;
      height:4.1%;
      color:#ffd728;
      font-size:clamp(14px,4vw,34px);
      text-shadow:
        0 2px 2px #111,
        0 0 5px #000;
    }

    /* ใช้พลังงาน ขวาล่าง */
    .cost-live{
      left:83.0%;
      top:82.2%;
      width:11.5%;
      height:3.8%;
      color:#fff;
      font-size:clamp(11px,3vw,26px);
      text-shadow:
        0 2px 2px #000,
        0 0 5px #000;
    }

    /* Regen timer */
    .regen-live{
      left:14.5%;
      top:87.6%;
      width:15.5%;
      height:3.0%;
      color:#fff;
      font-size:clamp(8px,2.4vw,21px);
      text-shadow:
        0 1px 2px #000;
    }

    /* =========================================================
       HP BAR
    ========================================================= */

    .hp-track{
      position:absolute;
      z-index:19;
      left:60.8%;
      top:32.65%;
      width:29.0%;
      height:2.2%;
      border-radius:999px;
      overflow:hidden;
      background:rgba(60,0,0,.75);
      pointer-events:none;
    }

    .hp-fill{
      height:100%;
      width:100%;
      border-radius:999px;
      background:linear-gradient(180deg,#ff3424,#b50000);
      transition:width .25s ease;
    }

    /* =========================================================
       HOTSPOTS
    ========================================================= */

    .hotspot{
      position:absolute;
      z-index:40;
      border:0;
      padding:0;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .hotspot:focus-visible{
      outline:3px solid #fff;
      outline-offset:-3px;
    }

    .back-hit{
      left:1.5%;
      top:1.2%;
      width:11.8%;
      height:7.7%;
    }

    .attack-hit{
      left:24.5%;
      top:89.0%;
      width:51.5%;
      height:9.1%;
      border-radius:16%;
    }

    /* =========================================================
       HIT / DAMAGE EFFECT
    ========================================================= */

    .damage{
      position:absolute;
      z-index:60;
      left:68%;
      top:50%;
      transform:translate(-50%,-50%);
      color:#fff836;
      font-size:clamp(34px,9vw,86px);
      font-weight:900;
      opacity:0;
      text-shadow:
        0 4px 0 #a62a00,
        0 7px 15px rgba(0,0,0,.55);
      pointer-events:none;
    }

    .damage.show{
      animation:damagePop .55s ease;
    }

    @keyframes damagePop{
      0%{
        opacity:0;
        transform:translate(-50%,10%) scale(.5);
      }
      35%{
        opacity:1;
        transform:translate(-50%,-40%) scale(1.2);
      }
      100%{
        opacity:0;
        transform:translate(-50%,-100%) scale(.95);
      }
    }

    .flash{
      position:absolute;
      inset:0;
      z-index:50;
      background:rgba(255,255,255,.0);
      pointer-events:none;
    }

    .flash.hit{
      animation:flashHit .18s ease;
    }

    @keyframes flashHit{
      0%{background:rgba(255,255,255,0)}
      35%{background:rgba(255,255,255,.38)}
      100%{background:rgba(255,255,255,0)}
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .status{
      position:absolute;
      z-index:30;
      left:23%;
      top:86.0%;
      width:54%;
      min-height:2.5%;
      color:#d7e8ff;
      font-size:clamp(7px,1.8vw,16px);
      font-weight:800;
      text-align:center;
      pointer-events:none;
      text-shadow:0 2px 3px rgba(0,0,0,.8);
    }

    .test-badge{
      position:absolute;
      z-index:80;
      left:50%;
      top:9%;
      transform:translateX(-50%);
      display:none;
      padding:6px 11px;
      border-radius:999px;
      background:#ffe600;
      color:#5b4300;
      font-size:clamp(8px,1.8vw,13px);
      font-weight:900;
      box-shadow:0 5px 15px rgba(0,0,0,.25);
    }

    .test-badge.show{display:block}

    /* =========================================================
       RESULT
    ========================================================= */

    .result{
      position:fixed;
      inset:0;
      z-index:100000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,10,31,.8);
      backdrop-filter:blur(5px);
    }

    .result.show{display:flex}

    .result-card{
      width:min(92vw,430px);
      padding:24px 18px;
      border-radius:24px;
      background:#fff;
      color:#133a76;
      text-align:center;
      box-shadow:0 18px 48px rgba(0,0,0,.36);
    }

    .result-icon{font-size:60px}

    .result-title{
      margin-top:8px;
      font-size:28px;
      font-weight:900;
    }

    .result-title.win{color:#079548}
    .result-title.lose{color:#d52e32}

    .result-text{
      margin-top:8px;
      color:#677b99;
      font-size:13px;
      line-height:1.6;
      font-weight:600;
    }

    .result-reward{
      margin-top:13px;
      padding:11px;
      border-radius:14px;
      background:#edf5ff;
      color:#16437e;
      font-size:14px;
      line-height:1.7;
      font-weight:900;
    }

    .result-button{
      width:100%;
      min-height:48px;
      margin-top:14px;
      border:0;
      border-radius:13px;
      background:#0877e7;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .result-button.secondary{
      margin-top:8px;
      background:#e8eff9;
      color:#234d84;
    }

    @media(max-width:700px){
      .stage{
        width:100vw;
        max-width:none;
      }
    }
  </style>
</head>

<body>

<main class="battle-page">

  <section id="stage" class="stage" aria-label="Battle Stage">

    <!--
      รูปจะเลือกอัตโนมัติจาก stage=1..10
    -->
    <img
      id="stageBackground"
      class="stage-bg"
      src=""
      alt="Battle Stage"
      draggable="false"
    >

    <div class="hp-track">
      <div id="hpFill" class="hp-fill"></div>
    </div>

    <div id="hpLive" class="live hp-live">1,200 / 1,200</div>
    <div id="energyLive" class="live energy-live">0</div>
    <div id="costLive" class="live cost-live">300</div>
    <div id="regenLive" class="live regen-live">00:25:30</div>

    <div id="battleStatus" class="status"></div>

    <div id="damageText" class="damage">-300</div>
    <div id="screenFlash" class="flash"></div>

    <div id="testBadge" class="test-badge">
      TEST MODE • ไม่หัก Energy จริง
    </div>

    <button
      class="hotspot back-hit"
      type="button"
      onclick="goBattleMap()"
      aria-label="ย้อนกลับ"
    ></button>

    <button
      id="attackButton"
      class="hotspot attack-hit"
      type="button"
      onclick="attackMonster()"
      aria-label="โจมตีเลย"
    ></button>

  </section>

</main>


<div id="resultModal" class="result">
  <section class="result-card">

    <div id="resultIcon" class="result-icon">🏆</div>
    <div id="resultTitle" class="result-title win">YOU WIN!</div>
    <div id="resultText" class="result-text"></div>
    <div id="resultReward" class="result-reward"></div>

    <button
      id="primaryResultButton"
      class="result-button"
      type="button"
      onclick="resultPrimary()"
    >
      ไป Stage ถัดไป
    </button>

    <button
      class="result-button secondary"
      type="button"
      onclick="goBattleMap()"
    >
      กลับหน้า Fight Monster
    </button>

  </section>
</div>


<script>
/* =========================================================
   STAGE CONFIG
   รูปหน้า Stage เป็น Template เต็มหน้า
========================================================= */

const STAGES = [

  {
    id:1,
    name:"เจ้าจอมเอื่อย",
    energy:300,
    hp:1200,
    damage:300,
    coin:100,
    exp:50,
    image:"./battle-stage-01-bg.jpeg"
  },

  {
    id:2,
    name:"จอมหวาน",
    energy:900,
    hp:1800,
    damage:450,
    coin:200,
    exp:100,
    image:"./battle-stage-02-bg.jpeg"
  },

  {
    id:3,
    name:"ปีศาจของทอด",
    energy:1500,
    hp:2400,
    damage:600,
    coin:300,
    exp:150,
    image:"./battle-stage-03-bg.jpeg"
  },

  {
    id:4,
    name:"จอมเค็ม",
    energy:2100,
    hp:3000,
    damage:750,
    coin:400,
    exp:200,
    image:"./battle-stage-04-bg.jpeg"
  },

  {
    id:5,
    name:"ราชาอาหารไร้ประโยชน์",
    energy:2700,
    hp:3600,
    damage:900,
    coin:500,
    exp:250,
    image:"./battle-stage-05-bg.jpeg"
  },

  {
    id:6,
    name:"ปีศาจพักผ่อนน้อย",
    energy:3300,
    hp:4200,
    damage:1050,
    coin:600,
    exp:300,
    image:"./battle-stage-06-bg.jpeg"
  },

  {
    id:7,
    name:"จอมเนือยนิ่ง",
    energy:3900,
    hp:4800,
    damage:1200,
    coin:700,
    exp:350,
    image:"./battle-stage-07-bg.jpeg"
  },

  {
    id:8,
    name:"ปีศาจพฤติกรรมเสี่ยง",
    energy:4500,
    hp:5400,
    damage:1350,
    coin:800,
    exp:400,
    image:"./battle-stage-08-bg.jpeg"
  },

  {
    id:9,
    name:"ราชาความเสี่ยงสุขภาพ",
    energy:5100,
    hp:6000,
    damage:1500,
    coin:900,
    exp:450,
    image:"./battle-stage-09-bg.jpeg"
  },

  {
    id:10,
    name:"จอมมารโรคร้าย",
    energy:5700,
    hp:7000,
    damage:1750,
    coin:1000,
    exp:500,
    image:"./battle-stage-10-bg.jpeg",
    boss:true
  }

];


/* =========================================================
   PARAMS
========================================================= */

const PARAMS =
  new URLSearchParams(
    window.location.search
  );

const STAGE_ID =
  Math.max(
    1,
    Math.min(
      10,
      Number(
        PARAMS.get("stage")
      ) || 1
    )
  );

const TEST_MODE =
  PARAMS.get("test") === "1";

const CURRENT_STAGE =
  STAGES.find(
    stage =>
      stage.id === STAGE_ID
  ) || STAGES[0];


/* =========================================================
   STATE
========================================================= */

let playerEnergy =
  Number(
    localStorage.getItem(
      "rockEnergy"
    )
  ) || 0;

let monsterHp =
  CURRENT_STAGE.hp;

let runId =
  null;

let battleStarted =
  false;

let battleFinished =
  false;


/* =========================================================
   RENDER
========================================================= */

function renderStage(){

  document
    .getElementById(
      "stageBackground"
    )
    .src =
      CURRENT_STAGE.image;


  /*
    fallback สำหรับ Stage 1
    หาก repository ยังใช้ชื่อ (3)
  */
  if(
    CURRENT_STAGE.id === 1
  ){

    const image =
      document.getElementById(
        "stageBackground"
      );

    image.addEventListener(
      "error",
      () => {

        if(
          image.dataset.fallback !== "1"
        ){

          image.dataset.fallback =
            "1";

          image.src =
            "./battle-stage-01-bg(3).jpeg";
        }
      },
      {
        once:true
      }
    );
  }


  if(TEST_MODE){

    document
      .getElementById(
        "testBadge"
      )
      .classList
      .add("show");

    playerEnergy =
      Math.max(
        playerEnergy,
        CURRENT_STAGE.energy
      );
  }


  updateEnergyUI();
  updateHpUI();
}


/* =========================================================
   ENERGY
========================================================= */

function updateEnergyUI(){

  document
    .getElementById(
      "energyLive"
    )
    .textContent =
      Math.max(
        0,
        playerEnergy
      )
      .toLocaleString(
        "en-US"
      );


  document
    .getElementById(
      "costLive"
    )
    .textContent =
      CURRENT_STAGE.energy
        .toLocaleString(
          "en-US"
        );
}


/* =========================================================
   HP
========================================================= */

function updateHpUI(){

  monsterHp =
    Math.max(
      0,
      monsterHp
    );


  document
    .getElementById(
      "hpLive"
    )
    .textContent =
      `${monsterHp.toLocaleString("en-US")} / ${CURRENT_STAGE.hp.toLocaleString("en-US")}`;


  const percent =
    CURRENT_STAGE.hp > 0
      ? monsterHp /
        CURRENT_STAGE.hp *
        100
      : 0;


  document
    .getElementById(
      "hpFill"
    )
    .style.width =
      `${percent}%`;
}


/* =========================================================
   EFFECT
========================================================= */

function showDamage(
  damage
){

  const damageText =
    document.getElementById(
      "damageText"
    );


  damageText.textContent =
    `-${damage.toLocaleString("en-US")}`;


  damageText.classList.remove(
    "show"
  );


  void damageText.offsetWidth;


  damageText.classList.add(
    "show"
  );


  const flash =
    document.getElementById(
      "screenFlash"
    );


  flash.classList.remove(
    "hit"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "hit"
  );
}


/* =========================================================
   BATTLE API
========================================================= */

async function callBattleApi(
  payload
){

  const api =
    window.APP_CONFIG
      ?.API
      ?.BATTLE;


  if(!api){

    throw new Error(
      "ไม่พบ BATTLE API"
    );
  }


  const idToken =
    window.ROCK
      ?.getIdToken
      ?.();


  if(!idToken){

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      api,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            ...payload,
            idToken
          })
      }
    );


  const raw =
    await response.text();


  let result = {};


  try{

    result =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      `Battle API ตอบกลับไม่ถูกต้อง HTTP ${response.status}`
    );
  }


  if(
    !response.ok ||
    result?.success === false
  ){

    const error =
      new Error(
        result?.error ||
        result?.message ||
        `HTTP ${response.status}`
      );


    error.data =
      result;


    throw error;
  }


  return result;
}


/* =========================================================
   START BATTLE
========================================================= */

async function ensureBattleStarted(){

  if(battleStarted){
    return true;
  }


  if(TEST_MODE){

    battleStarted =
      true;

    runId =
      `test-stage-${CURRENT_STAGE.id}`;

    monsterHp =
      CURRENT_STAGE.hp;

    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        "TEST MODE: เริ่มการต่อสู้แล้ว";

    updateHpUI();

    return true;
  }


  document
    .getElementById(
      "battleStatus"
    )
    .textContent =
      "กำลังตรวจสอบ Energy...";


  try{

    const result =
      await callBattleApi({
        action:"startBattle",
        stageId:CURRENT_STAGE.id
      });


    runId =
      result?.run?.id ||
      result?.runId ||
      null;


    const serverHp =
      Number(
        result?.run?.monster_hp ??
        result?.run?.monsterHp
      );


    if(
      Number.isFinite(
        serverHp
      )
    ){

      monsterHp =
        serverHp;
    }


    const energy =
      Number(
        result?.player?.energy
      );


    if(
      Number.isFinite(
        energy
      )
    ){

      playerEnergy =
        energy;


      localStorage.setItem(
        "rockEnergy",
        String(energy)
      );
    }


    battleStarted =
      true;


    updateEnergyUI();
    updateHpUI();


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        result?.resumed
          ? "กลับเข้าสู่ Battle เดิม"
          : "เริ่ม Battle แล้ว!";


    return true;


  }catch(error){

    console.error(
      "START BATTLE:",
      error
    );


    if(
      error?.message ===
        "ENERGY_NOT_ENOUGH" ||
      error?.data?.error ===
        "ENERGY_NOT_ENOUGH"
    ){

      showResult(
        false,
        `Energy ไม่เพียงพอ ต้องใช้ ⚡ ${CURRENT_STAGE.energy.toLocaleString("en-US")}`
      );

      return false;
    }


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        error?.message ||
        "เริ่ม Battle ไม่สำเร็จ";


    return false;
  }
}


/* =========================================================
   ATTACK
========================================================= */

async function attackMonster(){

  if(battleFinished){
    return;
  }


  const button =
    document.getElementById(
      "attackButton"
    );


  button.disabled =
    true;


  try{

    const ready =
      await ensureBattleStarted();


    if(!ready){
      return;
    }


    let damage =
      CURRENT_STAGE.damage;


    let result = {};


    /*
      TEST MODE
      ใช้ทดสอบฆ่า Monster
      ไม่หัก Energy จริง
    */

    if(TEST_MODE){

      monsterHp =
        Math.max(
          0,
          monsterHp -
          damage
        );


      result = {
        damage,
        monsterHp,
        win:monsterHp <= 0
      };


    }else{

      document
        .getElementById(
          "battleStatus"
        )
        .textContent =
          "กำลังโจมตี...";


      result =
        await callBattleApi({
          action:"attack",
          runId
        });


      damage =
        Number(
          result?.damage
        ) ||
        CURRENT_STAGE.damage;


      const serverHp =
        Number(
          result?.monsterHp ??
          result?.monster_hp
        );


      if(
        Number.isFinite(
          serverHp
        )
      ){

        monsterHp =
          serverHp;

      }else{

        monsterHp =
          Math.max(
            0,
            monsterHp -
            damage
          );
      }
    }


    showDamage(
      damage
    );


    updateHpUI();


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        `⚔️ Damage ${damage.toLocaleString("en-US")}`;


    if(
      result?.win === true ||
      monsterHp <= 0
    ){

      setTimeout(
        winBattle,
        350
      );
    }


  }catch(error){

    console.error(
      "ATTACK:",
      error
    );


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        error?.message ||
        "โจมตีไม่สำเร็จ";


  }finally{

    if(!battleFinished){

      button.disabled =
        false;
    }
  }
}


/* =========================================================
   WIN
========================================================= */

function winBattle(){

  if(battleFinished){
    return;
  }


  battleFinished =
    true;


  document
    .getElementById(
      "attackButton"
    )
    .disabled =
      true;


  const nextStage =
    Math.min(
      10,
      CURRENT_STAGE.id + 1
    );


  localStorage.setItem(
    "rockUnlockedStage",
    String(nextStage)
  );


  showResult(
    true,
    CURRENT_STAGE.id < 10
      ? `พิชิต ${CURRENT_STAGE.name} สำเร็จ และปลดล็อก Stage ${CURRENT_STAGE.id + 1}`
      : "สุดยอด! คุณพิชิต FINAL BOSS สำเร็จ"
  );
}


/* =========================================================
   RESULT
========================================================= */

function showResult(
  win,
  message
){

  const modal =
    document.getElementById(
      "resultModal"
    );


  const icon =
    document.getElementById(
      "resultIcon"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  const text =
    document.getElementById(
      "resultText"
    );


  const reward =
    document.getElementById(
      "resultReward"
    );


  const primary =
    document.getElementById(
      "primaryResultButton"
    );


  if(win){

    icon.textContent =
      CURRENT_STAGE.id === 10
        ? "👑"
        : "🏆";


    title.textContent =
      "YOU WIN!";


    title.className =
      "result-title win";


    reward.innerHTML =
      `🪙 +${CURRENT_STAGE.coin} ROCK COIN<br>` +
      `🏆 +${CURRENT_STAGE.exp} EXP`;


    primary.textContent =
      CURRENT_STAGE.id < 10
        ? "ไป Stage ถัดไป"
        : "กลับหน้า Fight Monster";


  }else{

    battleFinished =
      true;


    icon.textContent =
      "⚡";


    title.textContent =
      "ENERGY NOT ENOUGH";


    title.className =
      "result-title lose";


    reward.textContent =
      "";


    primary.textContent =
      "กลับหน้า Fight Monster";
  }


  text.textContent =
    message || "";


  modal.classList.add(
    "show"
  );
}


/* =========================================================
   RESULT PRIMARY
========================================================= */

function resultPrimary(){

  if(
    monsterHp <= 0 &&
    CURRENT_STAGE.id < 10
  ){

    window.location.href =
      `./battle_stage.html?stage=${CURRENT_STAGE.id + 1}${TEST_MODE ? "&test=1" : ""}`;

    return;
  }


  goBattleMap();
}


/* =========================================================
   BACK
========================================================= */

function goBattleMap(){

  window.location.href =
    `./battle.html?fight=1${TEST_MODE ? "&test=1" : ""}`;
}


/* =========================================================
   REGEN TIMER
========================================================= */

const REGEN_TOTAL =
  30 * 60;


let regenSeconds =
  Number(
    localStorage.getItem(
      "rockRegenSeconds"
    )
  );


if(
  !Number.isFinite(
    regenSeconds
  ) ||
  regenSeconds <= 0 ||
  regenSeconds >
    REGEN_TOTAL
){

  regenSeconds =
    25 * 60 + 30;
}


function renderTimer(){

  const h =
    Math.floor(
      regenSeconds /
      3600
    );


  const m =
    Math.floor(
      (
        regenSeconds %
        3600
      ) /
      60
    );


  const s =
    regenSeconds %
    60;


  document
    .getElementById(
      "regenLive"
    )
    .textContent =
      `${String(h).padStart(2,"0")}:` +
      `${String(m).padStart(2,"0")}:` +
      `${String(s).padStart(2,"0")}`;
}


function startTimer(){

  renderTimer();


  setInterval(
    () => {

      regenSeconds--;


      if(
        regenSeconds <
        0
      ){

        regenSeconds =
          REGEN_TOTAL;
      }


      localStorage.setItem(
        "rockRegenSeconds",
        String(regenSeconds)
      );


      renderTimer();

    },
    1000
  );
}


/* =========================================================
   LOAD PLAYER ENERGY
========================================================= */

async function loadPlayerEnergy(){

  try{

    if(
      !window.ROCK ||
      typeof ROCK.fetchDashboard !==
        "function"
    ){

      return;
    }


    const result =
      await ROCK.fetchDashboard();


    const energy =
      Number(
        result?.energy?.current ??
        result?.energy ??
        result?.player?.energy ??
        result?.user?.energy
      );


    if(
      Number.isFinite(
        energy
      )
    ){

      playerEnergy =
        energy;


      localStorage.setItem(
        "rockEnergy",
        String(energy)
      );


      updateEnergyUI();
    }


  }catch(error){

    console.warn(
      "LOAD PLAYER ENERGY:",
      error
    );
  }
}


/* =========================================================
   START PAGE
========================================================= */

async function startStage(){

  renderStage();

  startTimer();


  if(TEST_MODE){

    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        `TEST MODE: กดโจมตี ${Math.ceil(CURRENT_STAGE.hp / CURRENT_STAGE.damage)} ครั้งเพื่อฆ่า Monster`;

    return;
  }


  try{

    if(
      window.ROCK &&
      typeof ROCK.initLiff ===
        "function"
    ){

      const ready =
        await ROCK.initLiff();


      if(!ready){
        return;
      }


      await loadPlayerEnergy();
    }


  }catch(error){

    console.warn(
      "STAGE INIT:",
      error
    );
  }
}


document.addEventListener(
  "DOMContentLoaded",
  startStage
);

</script>
