<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE STAGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260831-battle-v60"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:#020817;font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif}
    body{display:flex;justify-content:center}
    #scene{position:relative;width:min(100vw,1080px);aspect-ratio:1080/1344;overflow:hidden;background:radial-gradient(circle at center,#173c70,#020817 70%)}
    #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
    #monster{position:absolute;z-index:20;left:25%;top:20%;width:50%;height:40%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5));transition:.4s}
    #monster.dead{opacity:0;transform:scale(.15) rotate(15deg)}
    #player{position:absolute;z-index:25;left:3%;bottom:16%;width:34%;height:40%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
    #top{position:absolute;z-index:40;left:4%;right:4%;top:3%;display:flex;justify-content:space-between;color:#fff;font-weight:1000;font-size:clamp(14px,3vw,32px)}
    #panel{position:absolute;z-index:40;left:8%;right:8%;top:12%;padding:14px;border-radius:18px;background:rgba(0,17,54,.82);color:#fff;text-align:center}
    #hpTrack{height:22px;border-radius:999px;background:#491b28;overflow:hidden;border:2px solid rgba(255,255,255,.65)}
    #hpFill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:.35s}
    #attack{position:absolute;z-index:60;left:21%;bottom:5%;width:58%;height:8%;border:0;border-radius:18px;background:linear-gradient(#ffcf35,#ef7b00);font-weight:1000;font-size:clamp(18px,4vw,38px);color:#5d2300;box-shadow:0 8px 0 #9d3e00;cursor:pointer}
    #attack:disabled{opacity:.45}
    #damage{position:absolute;z-index:90;left:43%;top:42%;font-size:clamp(34px,8vw,82px);font-weight:1000;color:#fff447;text-shadow:0 4px 0 #c53a00,0 7px 18px #000;opacity:0}
    #damage.show{animation:pop .75s ease}
    @keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.5)}20%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:translateY(-90px)}}
    #slash{position:absolute;z-index:80;left:25%;top:41%;width:50%;height:10px;background:linear-gradient(90deg,transparent,#fff,#fff46c,transparent);transform:rotate(-35deg) scaleX(0);opacity:0}
    #slash.show{animation:slash .4s ease}
    @keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.1)}30%{opacity:1;transform:rotate(-35deg) scaleX(1.2)}100%{opacity:0;transform:rotate(-35deg) scaleX(.2)}}
    #result{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,8,28,.78)}
    #result.show{display:flex}
    .card{width:min(440px,100%);padding:26px;border-radius:24px;background:#fff;text-align:center}
    .big{font-size:72px}
    #resultTitle{font-size:30px;font-weight:1000}
    #resultText{line-height:1.65;color:#536a83}
    .card button{width:100%;margin-top:14px;border:0;border-radius:13px;padding:13px;background:#164fa8;color:#fff;font-weight:900}
    #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:11000;display:none;padding:12px 16px;border-radius:14px;background:#173c70;color:#fff;font-weight:900;max-width:calc(100vw - 28px);text-align:center}
    #toast.show{display:block}
    #toast.error{background:#c62828}
  </style>
</head>
<body>

<main id="scene">
  <img id="bg" src="./battle%20map.jpeg?v=20260831-v60" alt="">
  <img id="monster" src="" alt="Monster">
  <img id="player" src="./battle-player.png?v=20260831-v60" alt="Battle Player">

  <div id="top">
    <div id="stageTitle">STAGE</div>
    <div id="energy">⚡ -- / 200</div>
  </div>

  <div id="panel">
    <div id="monsterName" style="font-size:clamp(16px,3vw,30px);font-weight:1000;margin-bottom:8px">MONSTER</div>
    <div id="hpTrack"><div id="hpFill"></div></div>
    <div id="hpText" style="margin-top:7px;font-weight:1000">-- / --</div>
    <div id="costText" style="margin-top:5px;font-weight:900;color:#ffe55d">ต้องใช้ Energy --</div>
  </div>

  <div id="damage">-0</div>
  <div id="slash"></div>

  <button id="attack" type="button">⚔️ โจมตี</button>
</main>

<div id="result">
  <section class="card">
    <div id="resultIcon" class="big">🏆</div>
    <div id="resultTitle">ชนะ!</div>
    <div id="resultText"></div>
    <button id="resultBtn" type="button">กลับ Battle Map</button>
  </section>
</div>

<div id="toast"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const STAGE_ID=Math.max(1,Math.min(10,Number(new URLSearchParams(location.search).get("stage"))||1));
let state=null;
let attacking=false;

function monsterFile(stageNo){
  const map={
    1:"battle-monster-stage-001-germ.png",
    2:"battle-monster-stage-002-donut.png",
    3:"battle-monster-stage-003-fries.png",
    4:"battle-monster-stage-004-salt.png",
    5:"battle-monster-stage-005-burger-king.png",
    6:"battle-monster-stage-006-rest.png",
    7:"battle-monster-stage-007-sedentary.png",
    8:"battle-monster-stage-008-risk.png",
    9:"battle-monster-stage-009-risk-king.png",
    10:"battle-monster-stage-010-boss.png"
  };
  return map[Number(stageNo)];
}

function apiUrl(){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi("BATTLE");
  return window.APP_CONFIG?.API?.BATTLE;
}

async function initLine(){
  await liff.init({liffId:window.APP_CONFIG?.LIFF_ID||"2011201679-uNWz5yqF"});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return false}
  const token=liff.getIDToken();
  if(!token||token.split(".").length!==3){liff.logout();liff.login({redirectUri:location.href});return false}
  return true;
}

async function post(action,payload={}){
  const res=await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({action,idToken:liff.getIDToken(),...payload})
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error("Battle API ตอบกลับไม่ใช่ JSON")}
  if(!res.ok||data?.success===false) throw new Error(data?.error||data?.message||`HTTP ${res.status}`);
  return data;
}

function toast(text,error=false){
  const el=$("toast");
  el.textContent=text;
  el.classList.toggle("error",error);
  el.classList.add("show");
  clearTimeout(window.__t);
  window.__t=setTimeout(()=>el.classList.remove("show"),error?4500:2200);
}

function render(data){
  state=data;
  const s=data?.stage||{};
  const p=data?.progress||{};
  const e=data?.healthEnergy||{};

  $("stageTitle").textContent=`STAGE ${s.id||STAGE_ID}`;
  $("monsterName").textContent=s.name||`Monster ${STAGE_ID}`;
  $("energy").textContent=`⚡ ${Number(e.available||0)} / ${Number(e.max||200)}`;
  $("costText").textContent=`ต้องใช้ Energy ${Number(s.attackCost||0)}`;

  const maxHp=Math.max(1,Number(s.maxHp||1));
  const hp=Math.max(0,Number(p.currentHp??maxHp));
  $("hpText").textContent=`${hp.toLocaleString()} / ${maxHp.toLocaleString()}`;
  $("hpFill").style.width=`${Math.max(0,Math.min(100,hp/maxHp*100))}%`;

  $("monster").src="./"+monsterFile(STAGE_ID)+"?v=20260831-v60";
  $("monster").classList.toggle("dead",!!p.completed);

  $("attack").disabled=!s.unlocked||!!p.completed;

  if(!s.unlocked){
    toast(s.lockReason||"Stage ยังไม่ปลดล็อก",true);
  }
}

function attackFx(damage){
  $("damage").textContent=`-${Number(damage||0).toLocaleString()}`;
  $("damage").classList.remove("show");
  $("slash").classList.remove("show");
  void $("damage").offsetWidth;
  $("damage").classList.add("show");
  $("slash").classList.add("show");
}

function showResult(result){
  const success=!!result?.missionSuccess;

  $("resultIcon").textContent=success?"🏆":"❌";
  $("resultTitle").textContent=success?"ชนะ!":"การโจมตีล้มเหลว";

  if(success){
    $("monster").classList.add("dead");
    $("resultText").innerHTML=
      `ผ่าน Stage ${STAGE_ID} แล้ว ✅<br>`+
      `ใช้ Energy ${Number(result?.requiredEnergy||result?.stage?.attackCost||0)}<br>`+
      `Energy คงเหลือ ${Number(result?.healthEnergy?.available||result?.energyAfter||0)} / ${Number(result?.healthEnergy?.max||200)}<br>`+
      `<br>🎁 ของรางวัลถูกส่งเป็น <b>pending</b> รอ Admin`;
  }else{
    $("resultText").innerHTML=
      `${result?.reason||"Energy ไม่ถึงเกณฑ์"}<br>`+
      `<br><small>Energy จะไม่ถูกหักเมื่อการโจมตีล้มเหลว</small>`;
  }

  $("result").classList.add("show");
}

async function attack(){
  if(attacking)return;
  attacking=true;
  $("attack").disabled=true;

  try{
    const result=await post("attackV5",{stageId:STAGE_ID});

    if(result?.insufficientEnergy){
      showResult({...result,missionSuccess:false});
      return;
    }

    if(result?.locked){
      showResult({
        ...result,
        missionSuccess:false,
        reason:result?.reason||"Stage ยังไม่ปลดล็อก"
      });
      return;
    }

    attackFx(result?.damage||0);

    setTimeout(()=>{
      render(result);
      showResult(result);
    },300);

  }catch(error){
    console.error(error);
    toast(error?.message||String(error),true);
  }finally{
    setTimeout(()=>{
      attacking=false;
      if(state&&!state?.progress?.completed) $("attack").disabled=false;
    },700);
  }
}

$("attack").onclick=attack;
$("resultBtn").onclick=()=>location.href="./battle_maps.html";

(async()=>{
  try{
    const ok=await initLine();
    if(ok===false)return;
    render(await post("stageV5",{stageId:STAGE_ID}));
  }catch(error){
    console.error(error);
    toast(error?.message||String(error),true);
  }
})();
</script>
</body>
</html>
