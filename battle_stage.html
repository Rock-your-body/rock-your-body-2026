<script>
"use strict";

/* =========================================================
   ROCK YOUR BODY 2026
   BATTLE STAGE V3.2

   RULE V3.2:
   1) Energy <= Energy Cost
      -> ปุ่มโจมตียังกดได้
      -> Backend หัก Energy ชั่วคราว
      -> MISSION FAILED_STAGE_{stage}
      -> Monster ไม่ตาย
      -> Backend คืน Energy ให้ทันที
      -> ไม่สร้าง Reward Request

   2) Energy > Energy Cost
      -> Backend หัก Energy จริง
      -> Monster HP = 0
      -> MISSION SUCCESS
      -> สร้าง Reward Request = pending
      -> รอ Admin อนุมัติก่อนแจก Reward

   Identity:
   LINE ID Token -> Edge Function -> players -> player_id

   Frontend NEVER trusts line_user_id/player_id from browser.
========================================================= */


const LIFF_ID =
  window.APP_CONFIG?.LIFF_ID ||
  "2011201679-uNWz5yqF";


const $ =
  id =>
    document.getElementById(id);


const state = {
  stageId:1,
  monsterName:"MONSTER",
  monsterLevel:1,

  currentHp:0,
  maxHp:0,

  energy:0,
  maxEnergy:
    Number(
      window.APP_CONFIG?.MAX_ENERGY ||
      200
    ),

  energyCost:0,
  coin:0,

  missionStatus:"loading",
  attacking:false
};


/* =========================================================
   HELPERS
========================================================= */

function num(
  value,
  fallback=0
){
  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function pick(
  ...values
){
  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      return value;
    }
  }

  return null;
}


function fmt(
  value
){
  const n =
    Number(value);

  return Number.isFinite(n)
    ? Math.round(n).toLocaleString("en-US")
    : "--";
}


function clamp(
  value,
  min,
  max
){
  return Math.max(
    min,
    Math.min(
      max,
      num(value,0)
    )
  );
}


function getApi(
  name
){
  if(
    window.APP_CONFIG?.getApi
  ){
    return window.APP_CONFIG.getApi(
      name
    );
  }

  const url =
    window.APP_CONFIG?.API?.[name];

  if(!url){
    throw new Error(
      `ไม่พบ API.${name}`
    );
  }

  return url;
}


function showToast(
  message,
  type=""
){
  const el =
    $("statusToast");

  el.textContent =
    message;

  el.className =
    "";

  el.classList.add(
    "show"
  );

  if(type){
    el.classList.add(
      type
    );
  }

  clearTimeout(
    window.__battleStageToast
  );

  window.__battleStageToast =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      type === "error"
        ? 5000
        : 2800
    );
}


/* =========================================================
   LIFF
========================================================= */

async function initLIFF(){

  if(
    typeof liff ===
    "undefined"
  ){
    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }

  if(!LIFF_ID){
    throw new Error(
      "ไม่พบ LIFF ID"
    );
  }

  /*
    แก้ error:
    liffId is necessary for liff.init()
  */
  await liff.init({
    liffId:
      LIFF_ID
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  const token =
    liff.getIDToken();

  if(!token){

    /*
      token ไม่มี/หมดอายุ:
      ให้ login ใหม่แทนการส่ง token เก่าไป backend
    */
    try{
      liff.logout();
    }catch{}

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }

  return true;
}


function idToken(){

  const token =
    liff.getIDToken();

  if(!token){
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  return token;
}


/* =========================================================
   API
========================================================= */

async function postJson(
  url,
  payload={}
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:"no-store",

        body:
          JSON.stringify({
            ...payload,
            idToken:
              idToken()
          })
      }
    );


  const raw =
    await response.text();

  let data = {};

  try{
    data =
      raw
        ? JSON.parse(raw)
        : {};
  }catch{
    throw new Error(
      `API ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
    );
  }


  if(
    !response.ok ||
    data?.success === false
  ){

    const message =
      String(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );

    const code =
      String(
        data?.code ||
        ""
      );


    /*
      สำคัญ:
      Energy ไม่พอไม่ใช่ระบบพัง
      แต่เป็น FAILED_STAGE
    */
    if(
      code === "ENERGY_NOT_ENOUGH" ||
      code === "INSUFFICIENT_ENERGY"
    ){

      const err =
        new Error(
          message ||
          "พลังงานไม่เพียงพอ"
        );

      err.code =
        "ENERGY_NOT_ENOUGH";

      err.payload =
        data;

      throw err;
    }


    if(
      response.status === 401 ||
      message
        .toLowerCase()
        .includes(
          "idtoken expired"
        )
    ){

      try{
        liff.logout();
      }catch{}

      liff.login({
        redirectUri:
          window.location.href
      });

      return await new Promise(()=>{});
    }


    throw new Error(
      message
    );
  }

  return data;
}


/* =========================================================
   PLAYER
========================================================= */

async function loadPlayer(){

  const result =
    await postJson(
      getApi("PLAYER"),
      {
        action:"dashboard"
      }
    );


  const data =
    result?.data ??
    result?.dashboard ??
    result ??
    {};

  const user =
    data?.user ??
    data?.player ??
    {};

  const energyObj =
    (
      data?.energy &&
      typeof data.energy ===
        "object"
    )
      ? data.energy
      : {};


  return {
    coin:
      num(
        pick(
          data.rockCoin,
          data.rock_coin,
          data.coin,
          user.rockCoin,
          user.rock_coin,
          user.coin
        ),
        0
      ),

    energy:
      num(
        pick(
          energyObj.current,
          data.energyCurrent,
          data.currentEnergy,
          data.current_energy,
          typeof data.energy ===
            "number"
            ? data.energy
            : null,
          user.energy
        ),
        0
      ),

    maxEnergy:
      num(
        pick(
          energyObj.max,
          data.maxEnergy,
          data.max_energy,
          user.maxEnergy,
          user.max_energy,
          window.APP_CONFIG?.MAX_ENERGY,
          200
        ),
        200
      )
  };
}


/* =========================================================
   BATTLE STAGE STATUS
========================================================= */

async function loadStageStatus(){

  const api =
    getApi(
      "BATTLE"
    );


  /*
    Production V3.1 action
  */
  try{

    return await postJson(
      api,
      {
        action:"stageStatus"
      }
    );

  }catch(error){

    const message =
      String(
        error?.message ||
        ""
      ).toLowerCase();


    /*
      Compatibility กับ Battle Function รุ่นก่อน
    */
    if(
      message.includes(
        "unknown action"
      ) ||
      message.includes(
        "unsupported action"
      )
    ){

      try{

        return await postJson(
          api,
          {
            action:
              "battleStatus"
          }
        );

      }catch(error2){

        return await postJson(
          api,
          {
            action:"status"
          }
        );
      }
    }

    throw error;
  }
}


function normalizeStage(
  raw
){

  const data =
    raw?.data ??
    raw ??
    {};

  const player =
    data?.player ??
    data?.user ??
    {};

  const stage =
    data?.stage ??
    data?.boss ??
    data?.monster ??
    {};

  const run =
    data?.activeRun ??
    data?.active_run ??
    (
      Array.isArray(
        data?.runs
      )
        ? data.runs.find(
            row =>
              String(
                row?.status ||
                ""
              ).toLowerCase() ===
              "active"
          )
        : null
    );


  const stageId =
    num(
      pick(
        stage.id,
        stage.stage_id,
        player.unlockedStage,
        player.unlocked_stage,
        data.currentStage,
        data.current_stage,
        1
      ),
      1
    );


  const maxHp =
    num(
      pick(
        run?.monster_max_hp,
        run?.monsterMaxHp,
        stage.max_hp,
        stage.maxHp,
        stage.hp,
        stage.monster_max_hp,
        100
      ),
      100
    );


  const currentHp =
    num(
      pick(
        run?.monster_hp,
        run?.monsterHp,
        stage.current_hp,
        stage.currentHp,
        maxHp
      ),
      maxHp
    );


  /*
    Cost ต้องมาจาก Battle backend/Stage config
    ไม่ให้ browser เป็นผู้กำหนดเอง
  */
  const energyCost =
    num(
      pick(
        stage.energy_cost,
        stage.energyCost,
        stage.required_energy,
        stage.requiredEnergy,
        stage.energy,
        data.energyCost,
        data.energy_cost,
        0
      ),
      0
    );


  return {
    stageId,

    monsterName:
      pick(
        stage.name,
        stage.monster_name,
        stage.monsterName,
        `MONSTER STAGE ${stageId}`
      ),

    monsterLevel:
      num(
        pick(
          stage.level,
          stage.stage_level,
          stageId
        ),
        stageId
      ),

    maxHp,

    currentHp,

    energyCost,

    missionStatus:
      String(
        pick(
          data.mission_status,
          data.missionStatus,
          run?.mission_status,
          run?.missionStatus,
          run?.status,
          "ready"
        )
      )
  };
}


/* =========================================================
   MISSION STATUS
========================================================= */

function failedMissionCode(){

  return `failed_stage_${
    state.stageId
  }`;
}


function setMissionStatus(
  status
){

  state.missionStatus =
    status;

  const box =
    $("missionResult");

  box.classList.remove(
    "failed",
    "success"
  );


  if(
    status ===
    "success"
  ){

    box.classList.add(
      "success"
    );

    box.textContent =
      `✅ MISSION SUCCESS • STAGE ${state.stageId}`;

    return;
  }


  if(
    String(status)
      .startsWith(
        "failed_stage_"
      )
  ){

    box.classList.add(
      "failed"
    );

    box.textContent =
      `❌ MISSION ${status.toUpperCase()} • MONSTER ยังไม่ตาย • ENERGY ถูกคืน`;

    return;
  }


  box.textContent =
    `MISSION: STAGE ${state.stageId} • READY`;
}


/* =========================================================
   ATTACK STATE V3.2
   ปุ่มโจมตีไม่ล็อกเพราะ Energy ไม่พอ
========================================================= */

function updateAttackState(){

  const monsterAlive =
    state.currentHp > 0;

  /*
    ล็อกเฉพาะ:
    - กำลังยิง request
    - Monster ตายแล้ว
    - ยังไม่มี Energy Cost ที่ถูกต้อง
  */
  $("attackButton").disabled =
    state.attacking ||
    !monsterAlive ||
    state.energyCost <= 0;


  if(
    state.currentHp <= 0
  ){

    $("attackNote")
      .textContent =
        "✅ มอนสเตอร์ถูกกำจัดแล้ว • รอ Admin อนุมัติรางวัล";

    setMissionStatus(
      "success"
    );

    return;
  }


  if(
    state.energyCost <= 0
  ){

    $("attackNote")
      .textContent =
        "⚠️ ยังไม่มีค่า Energy Cost ของ Stage จาก Battle API";

    return;
  }


  /*
    ตามกติกาใหม่:
    Energy <= Cost ยังโจมตีได้
    แต่จะ FAILED และระบบคืน Energy
  */
  if(
    state.energy <=
    state.energyCost
  ){

    $("attackNote")
      .textContent =
        `⚠️ Energy ${fmt(state.energy)} ≤ Cost ${fmt(state.energyCost)} • กดโจมตีได้ แต่ภารกิจจะ FAILED และระบบคืน Energy`;

    return;
  }


  $("attackNote")
    .textContent =
      `✅ Energy เพียงพอ • ใช้ ${fmt(state.energyCost)} Energy • สำเร็จแล้วรอ Admin อนุมัติรางวัล`;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  $("coinValue")
    .textContent =
      fmt(
        state.coin
      );

  $("topEnergy")
    .textContent =
      `${fmt(
        state.energy
      )}/${fmt(
        state.maxEnergy
      )}`;

  $("playerEnergy")
    .textContent =
      fmt(
        state.energy
      );

  $("playerEnergyMax")
    .textContent =
      `/ ${fmt(
        state.maxEnergy
      )} ENERGY`;

  $("energyCost")
    .textContent =
      fmt(
        state.energyCost
      );

  $("monsterName")
    .textContent =
      state.monsterName;

  $("monsterLevel")
    .textContent =
      `Lv. ${
        fmt(
          state.monsterLevel
        )
      }`;


  const pct =
    state.maxHp > 0
      ? clamp(
          (
            state.currentHp /
            state.maxHp
          ) * 100,
          0,
          100
        )
      : 0;


  $("hpFill")
    .style.width =
      `${pct}%`;

  $("hpText")
    .textContent =
      `${fmt(
        state.currentHp
      )} / ${fmt(
        state.maxHp
      )}`;


  updateAttackState();
}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  try{

    const ready =
      await initLIFF();

    if(
      ready === false
    ){
      return;
    }


    const [
      playerResult,
      stageResult
    ] =
      await Promise.all([
        loadPlayer(),
        loadStageStatus()
      ]);


    const stage =
      normalizeStage(
        stageResult
      );


    state.coin =
      playerResult.coin;

    state.energy =
      playerResult.energy;

    state.maxEnergy =
      playerResult.maxEnergy;

    state.stageId =
      stage.stageId;

    state.monsterName =
      stage.monsterName;

    state.monsterLevel =
      stage.monsterLevel;

    state.maxHp =
      stage.maxHp;

    state.currentHp =
      stage.currentHp;

    state.energyCost =
      stage.energyCost;


    /*
      ถ้า backend ระบุ success อยู่แล้ว
      ต้องคง success
    */
    if(
      stage.missionStatus ===
      "success"
    ){
      state.currentHp = 0;

      setMissionStatus(
        "success"
      );
    }


    render();

  }catch(error){

    console.error(
      "BATTLE STAGE LOAD ERROR:",
      error
    );

    showToast(
      error?.message ||
      "โหลด Battle Stage ไม่สำเร็จ",
      "error"
    );
  }
}


/* =========================================================
   ATTACK
========================================================= */

async function attack(){

  if(
    state.attacking
  ){
    return;
  }


  state.attacking =
    true;

  updateAttackState();

  $("attackNote")
    .textContent =
      "⚔️ กำลังโจมตี...";


  try{

    const api =
      getApi(
        "BATTLE"
      );


    let result;

    /*
      Production action V3.1
    */
    try{

      result =
        await postJson(
          api,
          {
            action:"attackStage",
            stageId:
              state.stageId
          }
        );

    }catch(error){

      const message =
        String(
          error?.message ||
          ""
        ).toLowerCase();


      /*
        Compatibility กับ backend ที่ใช้ action attack
      */
      if(
        message.includes(
          "unknown action"
        ) ||
        message.includes(
          "unsupported action"
        )
      ){

        result =
          await postJson(
            api,
            {
              action:"attack",
              stageId:
                state.stageId
            }
          );

      }else{
        throw error;
      }
    }


    const data =
      result?.data ??
      result ??
      {};


    const missionStatus =
      String(
        pick(
          data.mission_status,
          data.missionStatus,
          data.status,
          "success"
        )
      );


    const energyAfter =
      num(
        pick(
          data.energy_after,
          data.energyAfter,
          data.player?.energy,
          state.energy -
            state.energyCost
        ),
        Math.max(
          0,
          state.energy -
            state.energyCost
        )
      );


    const hpAfter =
      num(
        pick(
          data.monster_hp,
          data.monsterHp,
          data.hp_after,
          data.hpAfter,
          missionStatus ===
            "success"
            ? 0
            : state.currentHp
        ),
        0
      );


    state.energy =
      Math.max(
        0,
        energyAfter
      );

    state.currentHp =
      Math.max(
        0,
        hpAfter
      );


    if(
      missionStatus === "success" ||
      state.currentHp <= 0
    ){

      state.currentHp = 0;

      setMissionStatus(
        "success"
      );

      const rewardStatus =
        String(
          pick(
            data.reward_status,
            data.rewardStatus,
            data.reward_request_status,
            "pending"
          )
        );

      showToast(
        `🎉 STAGE ${state.stageId} SUCCESS • ฆ่ามอนสเตอร์สำเร็จ • รางวัล ${rewardStatus === "pending" ? "รอ Admin อนุมัติ" : rewardStatus}`,
        "success"
      );

    }else if(
      missionStatus.startsWith("failed_stage_")
    ){

      /*
        Backend ต้องคืน Energy แล้ว
        ใช้ energy_after_refund เป็นค่าหลัก
      */
      state.energy =
        num(
          pick(
            data.energy_after_refund,
            data.energyAfterRefund,
            data.energy_restored,
            data.energyRestored,
            data.energy_after,
            data.energyAfter,
            state.energy
          ),
          state.energy
        );

      /*
        FAILED = Monster ไม่ตาย
      */
      state.currentHp =
        num(
          pick(
            data.monster_hp,
            data.monsterHp,
            state.currentHp
          ),
          state.currentHp
        );

      setMissionStatus(
        missionStatus
      );

      showToast(
        `❌ ${missionStatus.toUpperCase()} • Energy ถูกคืนแล้ว • มอนสเตอร์ยังไม่ตาย`,
        "error"
      );

    }else{

      setMissionStatus(
        missionStatus
      );
    }


  }catch(error){

    console.error(
      "ATTACK ERROR:",
      error
    );


    /*
      Race condition:
      หน้าเว็บเห็นว่า Energy พอ
      แต่ backend ตรวจล่าสุดแล้วไม่พอ
      -> Backend เป็น source of truth
    */
    if(
      error?.code ===
      "ENERGY_NOT_ENOUGH"
    ){

      const payload =
        error?.payload ??
        {};

      state.energy =
        num(
          pick(
            payload.energy,
            payload.current_energy,
            payload.currentEnergy,
            state.energy
          ),
          state.energy
        );


      setMissionStatus(
        String(
          pick(
            payload.mission_status,
            payload.missionStatus,
            failedMissionCode()
          )
        )
      );


      showToast(
        "❌ Energy ไม่ถึงเกณฑ์ • ภารกิจไม่สำเร็จ • ระบบคืน Energy",
        "error"
      );

    }else{

      showToast(
        error?.message ||
        "โจมตีไม่สำเร็จ",
        "error"
      );
    }


  }finally{

    state.attacking =
      false;

    render();
  }
}
