<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#020817">

  <title>ROCK YOUR BODY 2026 - BATTLE STAGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260831-battle-stage-v7"></script>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#020817;
      font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;
      color:#fff;
    }

    body{
      overflow-x:hidden;
    }

    button{
      font-family:inherit;
    }

    /* ======================================================
       MAIN
    ====================================================== */

    #battleScreen{
      position:relative;

      width:min(100%,720px);
      min-height:100vh;

      margin:0 auto;

      overflow:hidden;

      background:
        radial-gradient(
          circle at 50% 35%,
          #11336c 0%,
          #071a3d 42%,
          #020817 100%
        );
    }

    /* ======================================================
       STAGE TEMPLATE

       ตรงนี้คือ Battle Stage 01 - 10
       ไม่ใช้ battle map.jpeg
    ====================================================== */

    #stageTemplate{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      z-index:1;

      user-select:none;
      pointer-events:none;
    }

    #darkOverlay{
      position:absolute;
      inset:0;

      z-index:2;

      background:
        linear-gradient(
          180deg,
          rgba(0,10,35,.10) 0%,
          rgba(0,10,35,.03) 35%,
          rgba(0,7,24,.18) 70%,
          rgba(0,5,18,.45) 100%
        );

      pointer-events:none;
    }

    /* ======================================================
       TOP
    ====================================================== */

    #topBar{
      position:relative;
      z-index:20;

      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:10px;

      align-items:center;

      padding:
        max(12px,env(safe-area-inset-top))
        14px
        8px;
    }

    .top-btn{
      border:1px solid rgba(255,255,255,.55);

      border-radius:14px;

      padding:9px 13px;

      background:
        linear-gradient(
          180deg,
          rgba(24,104,222,.97),
          rgba(5,51,133,.97)
        );

      color:#fff;

      font-size:14px;
      font-weight:1000;

      box-shadow:
        0 5px 15px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.25);

      cursor:pointer;
    }

    #stageTitle{
      text-align:center;

      font-size:clamp(20px,5vw,34px);
      font-weight:1000;

      font-style:italic;

      text-shadow:
        0 3px 0 #07152e,
        0 0 12px #1583ff;
    }

    #energyBox{
      min-width:112px;

      padding:9px 12px;

      border-radius:14px;

      text-align:center;

      background:
        linear-gradient(
          180deg,
          rgba(11,64,152,.96),
          rgba(2,31,89,.96)
        );

      border:1px solid rgba(255,255,255,.55);

      font-size:15px;
      font-weight:1000;

      box-shadow:
        0 5px 15px rgba(0,0,0,.32);
    }

    /* ======================================================
       MONSTER INFO
    ====================================================== */

    #monsterInfo{
      position:relative;
      z-index:20;

      width:calc(100% - 34px);

      margin:4px auto 0;

      padding:12px 16px;

      border-radius:18px;

      background:
        linear-gradient(
          180deg,
          rgba(5,36,94,.94),
          rgba(2,21,58,.92)
        );

      border:1px solid rgba(93,182,255,.60);

      box-shadow:
        0 8px 25px rgba(0,0,0,.36);
    }

    #monsterName{
      text-align:center;

      font-size:clamp(18px,4.5vw,28px);
      font-weight:1000;

      margin-bottom:8px;

      text-shadow:
        0 2px 5px rgba(0,0,0,.8);
    }

    .hp-row{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:8px;
    }

    .hp-label{
      font-size:15px;
      font-weight:1000;
    }

    #hpTrack{
      position:relative;

      width:100%;
      height:19px;

      border-radius:999px;

      background:#35121b;

      border:1px solid rgba(255,255,255,.65);

      overflow:hidden;
    }

    #hpFill{
      position:absolute;
      inset:0 auto 0 0;

      width:100%;

      background:
        linear-gradient(
          90deg,
          #c91f2f,
          #ff3448
        );

      transition:width .45s ease;
    }

    #hpText{
      position:absolute;
      inset:0;

      z-index:3;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:12px;
      font-weight:1000;

      text-shadow:0 1px 3px #000;
    }

    #energyRequired{
      margin-top:7px;

      text-align:center;

      color:#ffd633;

      font-size:13px;
      font-weight:1000;
    }

    /* ======================================================
       BATTLE FIELD
    ====================================================== */

    #battleField{
      position:relative;
      z-index:15;

      min-height:500px;

      margin-top:2px;
    }

    /* ======================================================
       PLAYER
    ====================================================== */

    #playerWrap{
      position:absolute;

      left:1%;
      bottom:65px;

      width:46%;
      height:70%;

      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    #playerImage{
      width:100%;
      max-height:100%;

      object-fit:contain;

      filter:
        drop-shadow(0 12px 15px rgba(0,0,0,.65));

      transform-origin:center bottom;
    }

    /* ======================================================
       MONSTER
    ====================================================== */

    #monsterWrap{
      position:absolute;

      right:1%;
      bottom:82px;

      width:51%;
      height:68%;

      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    #monsterImage{
      width:100%;
      max-height:100%;

      object-fit:contain;

      filter:
        drop-shadow(0 12px 17px rgba(0,0,0,.68));

      transform-origin:center center;
    }

    /* ======================================================
       VS
    ====================================================== */

    #vs{
      position:absolute;

      z-index:30;

      left:50%;
      top:44%;

      transform:
        translate(-50%,-50%)
        rotate(-7deg);

      color:#ffd117;

      font-size:clamp(44px,12vw,80px);
      font-weight:1000;
      font-style:italic;

      text-shadow:
        3px 3px 0 #a91d00,
        0 0 12px #ff5d00,
        0 0 25px #ff9b00;
    }

    /* ======================================================
       SLASH EFFECT
    ====================================================== */

    #slashEffect{
      position:absolute;

      z-index:100;

      left:50%;
      top:48%;

      width:230px;
      height:230px;

      transform:
        translate(-50%,-50%)
        rotate(-30deg)
        scale(.4);

      opacity:0;

      pointer-events:none;
    }

    #slashEffect::before,
    #slashEffect::after{
      content:"";

      position:absolute;

      left:50%;
      top:50%;

      width:230px;
      height:15px;

      border-radius:999px;

      background:#fff;

      box-shadow:
        0 0 7px #fff,
        0 0 18px #44caff,
        0 0 35px #008cff;

      transform:
        translate(-50%,-50%)
        rotate(45deg);
    }

    #slashEffect::after{
      transform:
        translate(-50%,-50%)
        rotate(-45deg);
    }

    #slashEffect.show{
      animation:
        slashAnim .55s ease-out;
    }

    @keyframes slashAnim{

      0%{
        opacity:0;
        transform:
          translate(-50%,-50%)
          rotate(-30deg)
          scale(.25);
      }

      25%{
        opacity:1;
      }

      75%{
        opacity:1;
        transform:
          translate(-50%,-50%)
          rotate(-30deg)
          scale(1.15);
      }

      100%{
        opacity:0;
        transform:
          translate(-50%,-50%)
          rotate(-30deg)
          scale(1.45);
      }

    }

    /* ======================================================
       PLAYER ATTACK
    ====================================================== */

    #playerImage.attack{
      animation:
        playerAttack .55s ease;
    }

    @keyframes playerAttack{

      0%{
        transform:
          translateX(0)
          rotate(0);
      }

      40%{
        transform:
          translateX(70px)
          rotate(5deg)
          scale(1.07);
      }

      100%{
        transform:
          translateX(0)
          rotate(0)
          scale(1);
      }

    }

    #monsterImage.hit{
      animation:
        monsterHit .55s ease;
    }

    @keyframes monsterHit{

      0%{
        transform:translateX(0);
        filter:
          drop-shadow(0 12px 17px rgba(0,0,0,.68));
      }

      20%{
        transform:
          translateX(15px)
          rotate(5deg);
      }

      40%{
        transform:
          translateX(-17px)
          rotate(-5deg);

        filter:
          brightness(2)
          drop-shadow(0 0 25px #fff);
      }

      60%{
        transform:
          translateX(12px);
      }

      100%{
        transform:
          translateX(0);
      }

    }

    #monsterImage.defeated{
      animation:
        monsterDefeated .8s ease forwards;
    }

    @keyframes monsterDefeated{

      0%{
        opacity:1;
        transform:
          scale(1)
          rotate(0);
      }

      60%{
        opacity:.55;
        transform:
          scale(.9)
          rotate(10deg);
      }

      100%{
        opacity:.16;
        transform:
          scale(.65)
          translateY(25px)
          rotate(18deg);
      }

    }

    /* ======================================================
       ATTACK
    ====================================================== */

    #attackArea{
      position:relative;
      z-index:40;

      width:calc(100% - 36px);

      margin:-55px auto 12px;

      text-align:center;
    }

    #attackButton{
      width:min(390px,88%);
      min-height:68px;

      border:2px solid #ffe295;

      border-radius:20px;

      background:
        linear-gradient(
          180deg,
          #ffc546,
          #f39100
        );

      color:#16120a;

      font-size:clamp(22px,6vw,34px);
      font-weight:1000;

      box-shadow:
        0 10px 25px rgba(0,0,0,.38),
        inset 0 2px 0 rgba(255,255,255,.6),
        0 0 20px rgba(255,157,0,.42);

      cursor:pointer;
    }

    #attackButton:active{
      transform:scale(.97);
    }

    #attackButton:disabled{
      opacity:.60;
      cursor:not-allowed;
    }

    /* ======================================================
       RESULT
    ====================================================== */

    #resultBox{
      display:none;

      position:fixed;
      z-index:10000;

      left:50%;
      top:50%;

      transform:translate(-50%,-50%);

      width:min(430px,calc(100vw - 30px));

      padding:23px 18px;

      border-radius:22px;

      background:
        linear-gradient(
          180deg,
          #092a62,
          #031737
        );

      border:2px solid #4ca9ff;

      box-shadow:
        0 18px 50px rgba(0,0,0,.65);

      text-align:center;
    }

    #resultBox.show{
      display:block;
    }

    #resultIcon{
      font-size:58px;
    }

    #resultTitle{
      margin-top:5px;

      font-size:30px;
      font-weight:1000;
    }

    #resultMessage{
      margin-top:10px;

      font-size:15px;
      font-weight:800;

      line-height:1.55;
    }

    #resultButton{
      margin-top:17px;

      min-width:145px;

      padding:11px 18px;

      border:0;
      border-radius:14px;

      background:#13a64c;

      color:#fff;

      font-size:16px;
      font-weight:1000;

      cursor:pointer;
    }

    /* ======================================================
       FAIL FLASH
    ====================================================== */

    #failMessage{
      position:absolute;

      z-index:150;

      left:50%;
      top:55%;

      transform:translate(-50%,-50%);

      width:80%;

      padding:15px;

      display:none;

      text-align:center;

      border-radius:18px;

      background:
        rgba(167,11,18,.93);

      border:2px solid #ff6068;

      font-size:23px;
      font-weight:1000;

      box-shadow:
        0 12px 30px rgba(0,0,0,.48);
    }

    #failMessage.show{
      display:block;

      animation:
        failAnim .38s ease;
    }

    @keyframes failAnim{

      0%{
        transform:
          translate(-50%,-50%)
          scale(.7);
      }

      70%{
        transform:
          translate(-50%,-50%)
          scale(1.08);
      }

      100%{
        transform:
          translate(-50%,-50%)
          scale(1);
      }

    }

    /* ======================================================
       FOOTER
    ====================================================== */

    #footer{
      position:relative;
      z-index:40;

      display:grid;
      grid-template-columns:1fr 1fr;

      gap:8px;

      padding:
        0 15px
        max(15px,env(safe-area-inset-bottom));
    }

    .footer-btn{
      min-height:43px;

      border-radius:13px;

      border:1px solid rgba(255,255,255,.42);

      background:
        rgba(4,38,94,.95);

      color:#fff;

      font-size:13px;
      font-weight:900;

      cursor:pointer;
    }

    /* ======================================================
       LOADING
    ====================================================== */

    #loading{
      position:fixed;
      inset:0;

      z-index:20000;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        rgba(1,8,25,.80);
    }

    #loading.hide{
      display:none;
    }

    #loadingBox{
      padding:16px 20px;

      border-radius:16px;

      background:#fff;

      color:#063b82;

      font-weight:1000;
    }

    /* ======================================================
       MOBILE
    ====================================================== */

    @media(max-width:600px){

      #topBar{
        grid-template-columns:auto 1fr auto;
        padding-left:8px;
        padding-right:8px;
      }

      .top-btn{
        padding:8px 9px;
        font-size:11px;
      }

      #energyBox{
        min-width:90px;
        padding:8px;
        font-size:12px;
      }

      #battleField{
        min-height:470px;
      }

      #playerWrap{
        width:48%;
      }

      #monsterWrap{
        width:52%;
      }

      #attackArea{
        margin-top:-48px;
      }

    }
  </style>
</head>


<body>

<main id="battleScreen">

  <!-- ====================================================
       TEMPLATE STAGE 01 - 10

  ===================================================== -->

  <img
    id="stageTemplate"
    alt="Battle Stage Template"
    draggable="false"
  >

  <div id="darkOverlay"></div>


  <!-- ====================================================

  ===================================================== -->

  <div id="topBar">

    <button
      class="top-btn"

  <section id="monsterInfo">

  </section>


  <!-- ====================================================

  <section id="battleField">

    <div id="playerWrap">

      <img
        id="playerImage"
        src="./battle-player.png"
        alt="ROCK Player"
        draggable="false"
      >

    </div>


    <div id="vs">
      VS
    </div>


    <div id="monsterWrap">

      <img
        id="monsterImage"
        alt="Monster"
        draggable="false"
      >

    </div>


    <div id="slashEffect"></div>

    <div id="failMessage">
      ❌ การโจมตีล้มเหลว
    </div>

  </section>


  <!-- ====================================================

  ===================================================== -->

  <section id="attackArea">

    <button
      id="attackButton"

    >
      ⚔️ โจมตี
    </button>

  </section>


  <!-- ====================================================

  ===================================================== -->

  <footer id="footer">

    <button
      class="footer-btn"
      onclick="goBack()"
    >
      ← ย้อนกลับ
    </button>

    <button

      onclick="reloadStage()"

      🔄 รีเฟรชสถานะ

  </footer>

</main>


<!-- ======================================================
     RESULT
====================================================== -->

<div id="resultBox">

  <div id="resultIcon">

  </div>

  <div id="resultTitle">

  </div>

  <div id="resultMessage"></div>

  <button

    type="button"
  >
    ตกลง
  </button>

     LOADING
====================================================== -->

  </div>

<script>
"use strict";


/* =========================================================
   ROCK YOUR BODY 2026
   BATTLE STAGE V7

   FLOW
   battle.html
   -> battle_map.html
   -> battle_stage.html?stage=N

   RULE
   Energy < attackCost
   = FAIL
   = HP ไม่ลด
   = Energy ไม่ลด
   = ไม่ผ่าน Stage
   = ไม่สร้าง Reward

   Energy >= attackCost
   = WIN ทันที
   = HP 0
   = หัก Energy
   = Stage completed
   = Reward pending
========================================================= */


const $ =
  id =>
    document.getElementById(id);


const CFG =
  window.APP_CONFIG ||
  {};


const LIFF_ID =
  CFG.LIFF_ID ||
  "2011201679-uNWz5yqF";


/* =========================================================
   CURRENT STAGE
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const STAGE_NO =
  Math.max(
    1,
    Math.min(
      10,
      Number(
        params.get("stage") ||
        1
      )
    )
  );


/* =========================================================
   CONFIG

   ใช้ Config นี้เป็น fallback
   Backend ยังเป็น source of truth
========================================================= */

const STAGES = {

  1:{
    name:"เจ้าจอมเอื่อย",
    hp:1200,
    attackCost:10,
    expRequired:0,
    monster:"battle-monster-stage-001-germ.png"
  },

  2:{
    name:"จอมหวาน",
    hp:2200,
    attackCost:20,
    expRequired:300,
    monster:"battle-monster-stage-002-donut.png"
  },

  3:{
    name:"ปีศาจของทอด",
    hp:3500,
    attackCost:30,
    expRequired:700,
    monster:"battle-monster-stage-003-fries.png"
  },

  4:{
    name:"จอมเค็ม",
    hp:5000,
    attackCost:40,
    expRequired:1200,
    monster:"battle-monster-stage-004-salt.png"
  },

  5:{
    name:"ราชาอาหารไร้ประโยชน์",
    hp:7000,
    attackCost:50,
    expRequired:1800,
    monster:"battle-monster-stage-005-burger-king.png"
  },

  6:{
    name:"ปีศาจพักผ่อนน้อย",
    hp:9500,
    attackCost:60,
    expRequired:2400,
    monster:"battle-monster-stage-006-rest.png"
  },

  7:{
    name:"จอมเนือยนิ่ง",
    hp:12500,
    attackCost:70,
    expRequired:3300,
    monster:"battle-monster-stage-007-sedentary.png"
  },

  8:{
    name:"ปีศาจพฤติกรรมเสี่ยง",
    hp:16000,
    attackCost:80,
    expRequired:4300,
    monster:"battle-monster-stage-008-risk.png"
  },

  9:{
    name:"ราชาความเสี่ยงสุขภาพ",
    hp:20000,
    attackCost:90,
    expRequired:5500,
    monster:"battle-monster-stage-009-risk-king.png"
  },

  10:{
    name:"จอมมาร Final Boss",
    hp:30000,
    attackCost:100,
    expRequired:7000,
    monster:"battle-monster-stage-010-boss.png"
  }

};


const FALLBACK_STAGE =
  STAGES[
    STAGE_NO
  ];


/* =========================================================
   TEMPLATE 01 - 10

   รองรับชื่อไฟล์หลายแบบ
   ระบบจะลองทีละชื่อจนเจอ

   แนะนำที่สุด:
   battle-stage-01.jpeg
   battle-stage-02.jpeg
   ...
   battle-stage-10.jpeg
========================================================= */

function stageNumber2(){

  return String(
    STAGE_NO
  ).padStart(
    2,
    "0"
  );
}


function templateCandidates(){

  const no =
    stageNumber2();


  return [

    `./battle-stage-${no}.jpeg`,

    `./battle-stage-${no}.jpg`,

    `./battle-stage-${no}.png`,

    `./battle stage ${no}.jpeg`,

    `./battle stage ${no}.jpg`,

    `./battle stage ${no}.png`,

    `./battle-stage-${no}-bg.jpeg`,

    `./battle-stage-${no}-bg.jpg`,

    `./battle-stage-${no}-bg.png`,

    /*
      รองรับไฟล์ Stage 1 ที่เคยใช้
    */
    `./battle-stage-${no}-bg(2).jpeg`

  ];
}


/* =========================================================
   TEMPLATE FALLBACK
========================================================= */

let templateIndex =
  0;


function loadStageTemplate(){

  const candidates =
    templateCandidates();


  templateIndex =
    0;


  const img =
    $("stageTemplate");


  function tryNext(){

    if(
      templateIndex >=
      candidates.length
    ){

      console.warn(
        "ไม่พบ Template Stage",
        STAGE_NO
      );


      /*
        ไม่ใช้ Battle Map เป็น fallback
        ปล่อยพื้นหลัง gradient
      */
      img.style.display =
        "none";


      return;
    }


    img.style.display =
      "block";


    img.src =
      candidates[
        templateIndex++
      ] +
      `?v=20260831-stage-${STAGE_NO}`;
  }


  img.onload =
    ()=>{

      console.log(
        "Battle template:",
        img.src
      );
    };


  img.onerror =
    tryNext;


  tryNext();
}


/* =========================================================
   STATE
========================================================= */

let state = {

  currentHp:
    FALLBACK_STAGE.hp,

  maxHp:
    FALLBACK_STAGE.hp,

  energy:
    0,

  maxEnergy:
    200,

  attackCost:
    FALLBACK_STAGE.attackCost,

  completed:
    false,

  attacking:
    false

};


/* =========================================================
   API
========================================================= */

function battleApi(){

  if(
    CFG?.getApi
  ){

    return CFG.getApi(
      "BATTLE"
    );
  }


  const url =
    CFG
      ?.API
      ?.BATTLE;


  if(!url){

    throw new Error(
      "ไม่พบ API.BATTLE"
    );
  }


  return url;
}


/* =========================================================
   LIFF
========================================================= */

async function initLine(){

  if(
    !window.liff
  ){

    throw new Error(
      "ไม่พบ LINE LIFF SDK"
    );
  }


  await liff.init({
    liffId:
      LIFF_ID
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        location.href
    });


    return false;
  }


  const idToken =
    liff.getIDToken();


  if(
    !idToken ||
    idToken
      .split(".")
      .length !==
      3
  ){

    liff.logout();


    liff.login({
      redirectUri:
        location.href
    });


    return false;
  }


  return true;
}


/* =========================================================
   POST BATTLE API
========================================================= */

async function postBattle(
  action,
  payload = {}
){

  const idToken =
    liff.getIDToken();


  if(!idToken){

    throw new Error(
      "INVALID_LINE_ID_TOKEN"
    );
  }


  const response =
    await fetch(
      battleApi(),
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:
          "no-store",

        body:
          JSON.stringify({

            action,
            idToken,

            ...payload

          })

      }
    );


  const raw =
    await response.text();


  let data =
    {};


  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    console.error(
      "RAW RESPONSE:",
      raw
    );


    throw new Error(
      "Battle API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    !response.ok ||
    data?.success ===
    false
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* =========================================================
   HELPERS
========================================================= */

function num(
  value,
  fallback = 0
){

  const n =
    Number(
      value
    );


  return Number.isFinite(n)
    ? n
    : fallback;
}


function getFirstNumber(
  values,
  fallback = 0
){

  for(
    const value of values
  ){

    if(
      value !==
      undefined &&
      value !==
      null &&
      value !==
      ""
    ){

      const result =
        Number(
          value
        );


      if(
        Number.isFinite(
          result
        )
      ){

        return result;
      }
    }
  }


  return fallback;
}


/* =========================================================
   NORMALIZE STAGE RESPONSE
========================================================= */

function normalizeStageData(
  data
){

  const stage =
    data?.stage ||
    data?.battleStage ||
    data?.data?.stage ||
    {};


  const player =
    data?.player ||
    data?.data?.player ||
    {};


  const healthEnergy =
    data?.healthEnergy ||
    data?.energy ||
    data?.wallet ||
    data?.data?.healthEnergy ||
    {};


  const maxHp =
    getFirstNumber(
      [
        stage.maxHp,
        stage.max_hp,
        stage.hp,
        data.maxHp,
        data.max_hp
      ],
      FALLBACK_STAGE.hp
    );


  const completed =
    Boolean(
      stage.completed ??
      data.completed ??
      false
    );


  const currentHp =
    completed
      ? 0
      : getFirstNumber(
          [
            stage.currentHp,
            stage.current_hp,
            data.currentHp,
            data.current_hp
          ],
          maxHp
        );


  const attackCost =
    getFirstNumber(
      [
        stage.attackCost,
        stage.attack_cost,
        data.attackCost,
        data.attack_cost
      ],
      FALLBACK_STAGE.attackCost
    );


  /*
    Battle Energy ต้องเป็น Energy เดียวกับ HOME
  */
  const energy =
    getFirstNumber(
      [
        healthEnergy.available,
        healthEnergy.energy,
        healthEnergy.current,
        player.energy,
        data.energyAvailable,
        data.availableEnergy
      ],
      0
    );


  const maxEnergy =
    getFirstNumber(
      [
        healthEnergy.max,
        healthEnergy.maxEnergy,
        healthEnergy.max_energy,
        player.max_energy
      ],
      CFG.MAX_ENERGY ||
      200
    );


  return {

    name:
      stage.monsterName ||
      stage.monster_name ||
      stage.name ||
      FALLBACK_STAGE.name,

    currentHp,

    maxHp,

    attackCost,

    energy,

    maxEnergy,

    completed

  };
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  $("stageTitle")
    .textContent =
      `BATTLE STAGE ${stageNumber2()}`;


  $("monsterName")

  $("monsterImage")
    .src =
      `./${FALLBACK_STAGE.monster}`;


  $("energyText")

      `${state.energy.toLocaleString()} / ${state.maxEnergy.toLocaleString()}`;


  $("energyRequired")
    .textContent =
      `⚡ ต้องใช้ Energy ${state.attackCost.toLocaleString()}`;


  const hpPercent =
    state.maxHp > 0
      ? Math.max(
          0,
          Math.min(
            100,
            (
              state.currentHp /
              state.maxHp
            ) *
            100
          )
        )
      : 0;


  $("hpFill")
    .style
    .width =
      `${hpPercent}%`;


  $("hpText")
    .textContent =
      `${state.currentHp.toLocaleString()} / ${state.maxHp.toLocaleString()}`;


  const attackButton =
    $("attackButton");


  if(
    state.completed
  ){

    attackButton.disabled =
      true;


    attackButton.textContent =
      "🏆 ผ่านด่านแล้ว";


    $("monsterImage")
      .classList
      .add(
        "defeated"
      );

  }else{

    attackButton.disabled =
      state.attacking;


    attackButton.textContent =
      state.attacking
        ? "⚔️ กำลังโจมตี..."
        : "⚔️ โจมตี";


    $("monsterImage")
      .classList
      .remove(
        "defeated"
      );
  }

}


/* =========================================================
   LOAD STAGE
========================================================= */

async function loadStage(){

  const data =
    await postBattle(
      "stageV5",
      {
        stage:
          STAGE_NO,

        stageNo:
          STAGE_NO
      }
    );


  const normalized =
    normalizeStageData(
      data
    );


  state.currentHp =
    normalized.currentHp;


  state.maxHp =
    normalized.maxHp;


  state.attackCost =
    normalized.attackCost;


  state.energy =
    normalized.energy;


  state.maxEnergy =
    normalized.maxEnergy;


  state.completed =
    normalized.completed;


  $("monsterName")
    .textContent =
      normalized.name;


  render();
}


/* =========================================================

========================================================= */

function attackEffect(){

  player.classList

      "attack"
    );


  monster.classList
    .remove(
      "hit"
    );


  slash.classList
    .remove(
      "show"
    );


  void player.offsetWidth;


  player.classList
    .add(
      "attack"
    );


  setTimeout(
    ()=>{

      slash.classList
        .add(
          "show"
        );


      monster.classList
        .add(
          "hit"
        );

  );


  setTimeout(
    ()=>{

      player.classList
        .remove(
          "attack"
        );


      monster.classList
        .remove(
          "hit"
        );

        .remove(

        );

  );
}

/* =========================================================
   NORMALIZE ATTACK RESULT
========================================================= */

function normalizeAttackResult(
  data
){

  const insufficientEnergy =
    Boolean(
      data?.insufficientEnergy ??
      data?.insufficient_energy ??
      data?.data?.insufficientEnergy ??
      false
    );


  const missionSuccess =
    data?.missionSuccess ??
    data?.successAttack ??
    data?.attackSuccess ??
    data?.win ??
    data?.data?.missionSuccess;


  const won =
    insufficientEnergy
      ? false
      : Boolean(
          missionSuccess ??
          data?.completed ??
          data?.stage?.completed ??
          false
        );


  const energy =
    getFirstNumber(
      [
        data?.energy,
        data?.availableEnergy,
        data?.energyAvailable,
        data?.healthEnergy?.available,
        data?.wallet?.energy,
        data?.player?.energy,
        data?.data?.energy
      ],
      state.energy
    );


  const maxEnergy =
    getFirstNumber(
      [
        data?.maxEnergy,
        data?.healthEnergy?.max,
        data?.wallet?.max_energy,
        data?.player?.max_energy
      ],
      state.maxEnergy
    );


  const currentHp =
    won
      ? 0
      : getFirstNumber(
          [
            data?.currentHp,
            data?.current_hp,
            data?.stage?.currentHp,
            data?.stage?.current_hp
          ],
          state.currentHp
        );


  return {

    insufficientEnergy,

    won,

    energy,

    maxEnergy,

    currentHp

  };
}


/* =========================================================
   ATTACK
========================================================= */

async function attack(){

  if(
    state.attacking ||
    state.completed
  ){

    return;
  }


  /*
    Frontend ตรวจเพื่อ UX ก่อน
    แต่ Backend ต้องตรวจซ้ำอีกครั้ง
  */
  if(
    state.energy <
    state.attackCost
  ){

    showAttackFail();


    /*
      สำคัญ:
      ไม่ลด HP
      ไม่ลด Energy
    */
    render();


    return;
  }


  state.attacking =
    true;


  render();


  attackEffect();


  try{

    const data =
      await postBattle(
        "attackV5",
        {
          stage:
            STAGE_NO,

          stageNo:
            STAGE_NO
        }
      );


    const result =
      normalizeAttackResult(
        data
      );


    /*
      =============================================
      ENERGY ไม่พอ
      =============================================
    */
    if(
      result.insufficientEnergy ||
      !result.won
    ){

      /*
        โหลดค่าจริงจาก Backend อีกครั้ง
        เพื่อยืนยันว่าไม่มีการหัก Energy
      */
      state.attacking =
        false;


      try{

        await loadStage();

      }catch(_){}


      showAttackFail();


      render();


      return;
    }


    /*
      =============================================
      WIN
      =============================================
    */

    state.energy =
      result.energy;


    state.maxEnergy =
      result.maxEnergy;


    state.currentHp =
      0;


    state.completed =
      true;


    state.attacking =
      false;


    render();


    $("monsterImage")
      .classList
      .add(
        "defeated"
      );


    setTimeout(
      ()=>{

        showWin();

      },
      650
    );


  }catch(error){

    console.error(
      "[BATTLE ATTACK]",
      error
    );


    state.attacking =
      false;


    /*
      ถ้า Backend แจ้ง Energy ไม่พอ
    */
    const message =
      String(
        error?.message ||
        ""
      );


    if(
      message
        .toLowerCase()
        .includes(
          "energy"
        )
    ){

      try{

        await loadStage();

      }catch(_){}


      showAttackFail();


      render();


      return;
    }


    alert(
      "โจมตีไม่สำเร็จ\n\n" +
      message
    );


    render();
  }

}
