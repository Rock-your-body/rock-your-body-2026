<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE STAGE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260830-battle-v40"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#020b22;font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif}
    button{font:inherit}

    .stage{
      position:relative;width:100%;max-width:1080px;margin:0 auto;aspect-ratio:1080/1344;
      overflow:hidden;background:#06163a
    }

    #stageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}

    .live{
      position:absolute;z-index:30;display:flex;align-items:center;justify-content:center;
      text-align:center;font-weight:1000;pointer-events:none;text-shadow:0 2px 5px rgba(0,0,0,.8)
    }

    #energyLive{left:5.5%;top:80%;width:23%;height:5%;color:#ffd92f;font-size:clamp(13px,3.5vw,34px)}
    #costLive{left:78%;top:80.8%;width:18%;height:5%;color:#fff;font-size:clamp(11px,3vw,28px)}
    #expLive{left:70%;top:3%;width:23%;height:4.5%;color:#fff;font-size:clamp(9px,2.2vw,22px)}
    #stageName{left:25%;top:4%;width:50%;height:6%;color:#fff;font-size:clamp(16px,4vw,42px)}

    .hot{position:absolute;z-index:50;border:0;background:transparent;padding:0;cursor:pointer}
    #backButton{left:1.5%;top:1.2%;width:12%;height:8%}
    #attackButton{left:22%;top:88.5%;width:56%;height:10%;border-radius:20%}

    #attackButton:disabled{cursor:not-allowed}

    .flash{position:absolute;inset:0;z-index:55;pointer-events:none}
    .flash.hit{animation:flash .35s ease}
    @keyframes flash{
      0%{background:rgba(255,255,255,0)}
      35%{background:rgba(255,255,255,.75)}
      100%{background:rgba(255,255,255,0)}
    }

    .slash{
      position:absolute;z-index:57;left:50%;top:50%;width:45%;height:8px;
      background:linear-gradient(90deg,transparent,#fff,#ffe100,transparent);
      transform:translate(-50%,-50%) rotate(-32deg) scaleX(0);pointer-events:none;
      filter:drop-shadow(0 0 9px #fff)
    }
    .slash.show{animation:slash .45s ease}
    @keyframes slash{
      0%{opacity:0;transform:translate(-50%,-50%) rotate(-32deg) scaleX(.1)}
      30%{opacity:1;transform:translate(-50%,-50%) rotate(-32deg) scaleX(1.25)}
      100%{opacity:0;transform:translate(-50%,-50%) rotate(-32deg) scaleX(.3)}
    }

    .shake{animation:shake .35s linear}
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)}
    }

    #resultModal{
      position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
      padding:20px;background:rgba(0,10,35,.76)
    }
    #resultModal.show{display:flex}

    .result-card{
      width:min(430px,100%);padding:24px;border-radius:24px;background:#fff;text-align:center;
      box-shadow:0 24px 70px rgba(0,0,0,.4)
    }
    #resultIcon{font-size:70px}
    #resultTitle{font-size:30px;font-weight:1000;margin:6px 0}
    #resultTitle.success{color:#078b45}
    #resultTitle.failed{color:#c92828}
    #resultText{color:#536a83;line-height:1.65}
    #giftBox{display:none;margin:12px auto;font-size:78px;animation:bounce 1s infinite}
    #giftBox.show{display:block}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    .result-card button{
      width:100%;margin-top:12px;border:0;border-radius:13px;padding:13px;background:#164fa8;color:#fff;font-weight:900
    }

    #status{
      position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
      z-index:11000;display:none;padding:12px 16px;border-radius:14px;background:#173c70;color:#fff;
      max-width:calc(100vw - 28px);font-weight:900;text-align:center
    }
    #status.show{display:block}
    #status.error{background:#c62828}
  </style>
</head>
<body>

<main id="battleScene" class="stage">
  <img id="stageBg" src="" alt="Battle Stage">

  <div id="stageName" class="live">STAGE</div>
  <div id="energyLive" class="live">⚡ --</div>
  <div id="costLive" class="live">⚡ --</div>
  <div id="expLive" class="live">EXP --</div>

  <div id="flash" class="flash"></div>
  <div id="slash" class="slash"></div>

  <button id="backButton" class="hot" type="button" aria-label="ย้อนกลับ"></button>
  <button id="attackButton" class="hot" type="button" aria-label="โจมตี"></button>
</main>

<div id="resultModal">
  <section class="result-card">
    <div id="resultIcon">🏆</div>
    <div id="resultTitle">MISSION SUCCESS</div>
    <div id="giftBox">🎁</div>
    <div id="resultText"></div>
    <button type="button" id="resultButton">กลับ Battle Map</button>
  </section>
</div>

<div id="status"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const STAGE_ID=Math.max(1,Math.min(10,Number(new URLSearchParams(location.search).get("stage"))||1));
let state=null;

function apiUrl(){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi("BATTLE");
  const url=window.APP_CONFIG?.API?.BATTLE;
  if(!url) throw new Error("ไม่พบ API.BATTLE");
  return url;
}

async function initLine(){
  await liff.init({liffId:window.APP_CONFIG?.LIFF_ID||"2011201679-uNWz5yqF"});
  if(!liff.isLoggedIn()){
    liff.login({redirectUri:location.href});
    return false;
  }
  if(!liff.getIDToken()){
    liff.logout();liff.login({redirectUri:location.href});return false;
  }
  return true;
}

async function post(action,payload={}){
  const res=await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({action,idToken:liff.getIDToken(),...payload})
  });
  const text=await res.text();let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error("Battle API ตอบกลับไม่ใช่ JSON")}
  if(res.status===401||String(data?.error||"").toLowerCase().includes("expired")){
    liff.logout();liff.login({redirectUri:location.href});return new Promise(()=>{});
  }
  if(!res.ok||data?.success===false) throw new Error(data?.error||data?.message||`HTTP ${res.status}`);
  return data;
}

function showStatus(text,error=false){
  const el=$("status");el.textContent=text;el.classList.toggle("error",error);el.classList.add("show");
  clearTimeout(window.__st);window.__st=setTimeout(()=>el.classList.remove("show"),error?5000:2500);
}

function stageImage(id){
  return `./battle-stage-${String(id).padStart(2,"0")}-bg.jpeg?v=20260830-v40`;
}

function render(data){
  state=data;
  const p=data?.player||{};
  const s=data?.stage||{};

  $("stageBg").src=stageImage(STAGE_ID);
  $("stageName").textContent=`STAGE ${s.id||STAGE_ID} • ${s.name||""}`;
  $("energyLive").textContent=`⚡ ${Number(p.energy||0).toLocaleString()}`;
  $("costLive").textContent=`⚡ ${Number(s.energyRequired||0).toLocaleString()}`;
  $("expLive").textContent=`EXP ${Number(s.expRequired||0).toLocaleString()}`;

  if(!s.unlocked){
    $("attackButton").disabled=true;
    showStatus(`🔒 ด่านนี้ต้องมี EXP ${Number(s.expRequired||0).toLocaleString()}`,true);
  }
}

function attackEffect(){
  $("flash").classList.remove("hit");
  $("slash").classList.remove("show");
  $("battleScene").classList.remove("shake");
  void $("flash").offsetWidth;
  $("flash").classList.add("hit");
  $("slash").classList.add("show");
  $("battleScene").classList.add("shake");
}

function showResult(result){
  const success=!!result?.missionSuccess;

  $("resultIcon").textContent=success?"🏆":"❌";
  $("resultTitle").textContent=success?"MISSION SUCCESS":"MISSION FAILED";
  $("resultTitle").className=success?"success":"failed";
  $("giftBox").classList.toggle("show",success);

  if(success){
    $("resultText").innerHTML=
      `ผ่าน Stage ${result?.stage?.id}<br>`+
      `ใช้ Energy ${Number(result?.stage?.energyRequired||0).toLocaleString()}<br>`+
      `Energy คงเหลือ ${Number(result?.player?.energy||0).toLocaleString()}<br><br>`+
      `<strong>🎁 ของขวัญกำลังรอ Admin อนุมัติ</strong><br>`+
      `เมื่อ Admin ตรวจสอบแล้ว จะดำเนินการส่งของขวัญการผ่านด่านให้ภายหลัง`;
  }else{
    $("resultText").innerHTML=
      `Energy ไม่เพียงพอสำหรับ Stage ${result?.stage?.id}<br>`+
      `ต้องใช้ ${Number(result?.stage?.energyRequired||0).toLocaleString()} Energy<br>`+
      `คุณมี ${Number(result?.player?.energy||0).toLocaleString()} Energy<br><br>`+
      `ไปทำ Mission เพื่อสะสม Energy แล้วกลับมาลองใหม่`;
  }

  $("resultModal").classList.add("show");
}

async function attackMonster(){
  if(!state?.stage?.unlocked){
    showStatus("Stage ยังไม่ปลดล็อก",true);
    return;
  }

  $("attackButton").disabled=true;
  attackEffect();

  try{
    await new Promise(r=>setTimeout(r,430));
    const result=await post("attackStage",{stageId:STAGE_ID});
    state=result;
    render(result);
    showResult(result);
  }catch(error){
    console.error(error);
    showStatus(error?.message||String(error),true);
    $("attackButton").disabled=false;
  }
}

$("attackButton").onclick=attackMonster;
$("backButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE_MAP||"./battle_maps.html";
$("resultButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE_MAP||"./battle_maps.html";

(async()=>{
  try{
    const ok=await initLine();if(ok===false)return;
    render(await post("stage",{stageId:STAGE_ID}));
  }catch(error){
    console.error(error);showStatus(error?.message||String(error),true);
  }
})();
</script>
</body>
</html>
