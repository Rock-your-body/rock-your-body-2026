<!-- =========================================================
     COMMON
========================================================= -->

<script src="./common.js"></script>


<script>

const ROCK =
  window.ROCK;


const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   NAVIGATION
========================================================= */

function goPage(name){

  const url =
    ROCK?.CFG?.PAGE?.[name];

  if(!url){
    return;
  }

  ROCK.go(url);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
){

  const el =
    $("status");

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.className =
    error
      ? "show error"
      : "show";
}


function hideStatus(){

  const el =
    $("status");

  if(el){
    el.className = "";
  }
}


/* =========================================================
   NUMBER
========================================================= */

function num(
  value,
  fallback = 0
){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


/* =========================================================
   DATE
========================================================= */

function formatDateOnly(value){

  if(!value){
    return "--/--/----";
  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "--/--/----";
  }

  return d.toLocaleDateString(
    "th-TH",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeDashboard(raw){

  raw =
    raw || {};

  const user =
    raw.user ||
    raw.player ||
    {};

  const weight =
    raw.weight &&
    typeof raw.weight === "object"
      ? raw.weight
      : {};

  const energy =
    raw.energy &&
    typeof raw.energy === "object"
      ? raw.energy
      : {};


  let exp =
    raw.exp ??
    user.exp ??
    0;


  if(
    exp &&
    typeof exp === "object"
  ){

    exp =
      exp.total ??
      exp.current ??
      0;
  }


  return {

    picture:
      user.pictureUrl ??
      user.picture_url ??
      raw.pictureUrl ??
      raw.picture_url ??
      "",


    exp:
      num(
        exp,
        0
      ),


    coin:
      num(
        raw.rockCoin ??
        raw.rock_coin ??
        user.rockCoin ??
        user.rock_coin,
        0
      ),


    energy:
      num(
        energy.current ??
        raw.energyCurrent ??
        user.energy,
        0
      ),


    maxEnergy:
      num(
        energy.max ??
        raw.maxEnergy ??
        user.max_energy ??
        user.maxEnergy,
        ROCK.CFG.MAX_ENERGY ||
        200
      ),


    currentWeight:
      weight.current ??
      weight.currentWeight ??
      weight.current_weight ??
      raw.currentWeight ??
      raw.current_weight ??
      user.currentWeight ??
      user.current_weight ??
      null,


    targetWeight:
      weight.target ??
      weight.targetWeight ??
      weight.target_weight ??
      raw.targetWeight ??
      raw.target_weight ??
      user.targetWeight ??
      user.target_weight ??
      null,


    startWeight:
      weight.start ??
      weight.startWeight ??
      weight.start_weight ??
      raw.startWeight ??
      raw.start_weight ??
      user.startWeight ??
      user.start_weight ??
      null,


    updatedAt:
      weight.updatedAt ??
      weight.updated_at ??
      weight.lastRecordedAt ??
      weight.last_recorded_at ??
      raw.weightUpdatedAt ??
      raw.weight_updated_at ??
      raw.updatedAt ??
      raw.updated_at ??
      user.updatedAt ??
      user.updated_at ??
      null,


    startDate:
      weight.startDate ??
      weight.start_date ??
      raw.startDate ??
      raw.start_date ??
      user.startDate ??
      user.start_date ??
      null
  };
}


/* =========================================================
   PROFILE
========================================================= */

function renderProfile(url){

  const image =
    $("profileImage");

  if(!image){
    return;
  }


  if(!url){

    image.removeAttribute(
      "src"
    );

    image.style.display =
      "none";

    return;
  }


  image.onload =
    function(){

      image.style.display =
        "block";
    };


  image.onerror =
    function(){

      image.style.display =
        "none";
    };


  image.src =
    url;
}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(raw){

  const p =
    normalizeDashboard(
      raw
    );


  /* PROFILE */

  renderProfile(
    p.picture
  );


  /* COIN */

  $("coin").textContent =
    ROCK.fmtInt(
      p.coin
    );


  /* ENERGY */

  $("energy").textContent =
    ROCK.fmtInt(
      p.energy
    ) +
    " / " +
    ROCK.fmtInt(
      p.maxEnergy
    );


  /* =====================================================
     LEVEL + EXP

     0 - 499 = Lv.1
     500 - 999 = Lv.2
     1000 - 1499 = Lv.3
  ====================================================== */

  const expPerLevel =
    num(
      ROCK.CFG.EXP_PER_LEVEL,
      500
    );


  const totalExp =
    Math.max(
      0,
      num(
        p.exp,
        0
      )
    );


  const level =
    Math.floor(
      totalExp /
      expPerLevel
    ) + 1;


  const expInLevel =
    totalExp %
    expPerLevel;


  const expPercent =
    expPerLevel > 0
      ? Math.max(
          0,
          Math.min(
            100,
            expInLevel /
            expPerLevel *
            100
          )
        )
      : 0;


  $("level").textContent =
    "Lv." +
    level;


  $("expText").textContent =
    ROCK.fmtInt(
      expInLevel
    ) +
    " / " +
    ROCK.fmtInt(
      expPerLevel
    );


  $("expBar").style.width =
    expPercent +
    "%";


  /* CURRENT */

  $("currentWeight")
    .textContent =
      ROCK.fmtWeight(
        p.currentWeight
      ) +
      " kg";


  /* TARGET */

  $("targetWeight")
    .textContent =
      ROCK.fmtWeight(
        p.targetWeight
      ) +
      " kg";


  /* DATES */

  $("updatedAt")
    .textContent =
      formatDateOnly(
        p.updatedAt
      );


  $("startDate")
    .textContent =
      formatDateOnly(
        p.startDate
      );


  /* REMAINING */

  const current =
    Number(
      p.currentWeight
    );

  const target =
    Number(
      p.targetWeight
    );


  if(
    Number.isFinite(current) &&
    Number.isFinite(target)
  ){

    $("remaining")
      .textContent =
        Math.max(
          0,
          current -
          target
        )
        .toFixed(1) +
        " kg";

  }else{

    $("remaining")
      .textContent =
        "--.- kg";
  }


  /* LOST */

  const start =
    Number(
      p.startWeight
    );


  if(
    Number.isFinite(start) &&
    Number.isFinite(current)
  ){

    $("lost")
      .textContent =
        Math.max(
          0,
          start -
          current
        )
        .toFixed(1) +
        " kg";

  }else{

    $("lost")
      .textContent =
        "--.- kg";
  }
}


/* =========================================================
   LOAD HOME
========================================================= */

let loading =
  false;


async function loadHome(){

  if(loading){
    return;
  }

  loading =
    true;

  try{

    const raw =
      await ROCK.fetchDashboard();


    console.log(
      "HOME DATA:",
      raw
    );


    renderHome(
      raw
    );


    hideStatus();

  }catch(error){

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );

  }finally{

    loading =
      false;
  }
}


/* =========================================================
   START
========================================================= */

(async()=>{

  try{

    if(!ROCK){

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );
    }


    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ok =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if(!ok){
      return;
    }


    await loadHome();


    setInterval(
      function(){

        if(
          document.visibilityState ===
          "visible"
        ){

          loadHome();
        }

      },
      num(
        ROCK.CFG.REFRESH_MS,
        30000
      )
    );


  }catch(error){

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();


/* =========================================================
   RETURN TO PAGE
========================================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
        "visible" &&
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ){

      loadHome();
    }
  }
);


window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ){

      loadHome();
    }
  }
);

</script>
