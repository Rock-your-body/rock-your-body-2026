  id="status"
  class="status"

<script src="common.js"></script>

<script>

/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(raw){

  const data =
    ROCK.normalize(raw);

  const p =
    data.player;


  /* COIN */

  ROCK.setText(
    "coin",
    ROCK.fmtInt(
      p.coin
    )
  );


  /* ENERGY */

  ROCK.setText(
    "energy",
    ROCK.fmtInt(
      p.energy
    ) +
    " / " +
    ROCK.fmtInt(
      p.maxEnergy
    )
  );


  /* PROFILE */

  ROCK.setImage(
    "profileImage",
    p.picture
  );


  /* LEVEL */

  ROCK.setText(
    "level",
    "Lv." +
    ROCK.fmtInt(
      p.level
    )
  );


  /* EXP */

  const expInLevel =
    p.exp %
    p.expPerLevel;


  ROCK.setText(
    "expText",
    ROCK.fmtInt(
      expInLevel
    ) +
    " / " +
    ROCK.fmtInt(
      p.expPerLevel
    )
  );


  ROCK.setBar(
    "expBar",
    expInLevel,
    p.expPerLevel
  );


  /* CURRENT WEIGHT */

  ROCK.setText(
    "currentWeight",
    ROCK.fmtWeight(
      p.currentWeight
    )
  );


  /* UPDATE DATE */

  ROCK.setText(
    "updatedAt",
    ROCK.formatDate(
      p.updatedAt
    )
  );


  /* TARGET */

  ROCK.setText(
    "targetWeight",
    ROCK.fmtWeight(
      p.targetWeight
    )
  );


  /* REMAINING */

  ROCK.setText(
    "remaining",
    p.remaining === null
      ? "--.- kg"
      : ROCK.fmtWeight(
          p.remaining
        ) +
        " kg"
  );


  /* LOST */

  ROCK.setText(
    "lost",
    p.lostWeight === null
      ? "--.- kg"
      : ROCK.fmtWeight(
          p.lostWeight
        ) +
        " kg"
  );


  /* START DATE */

  ROCK.setText(
    "startDate",
    ROCK.formatDate(
      p.startDate
    )
  );

}


/* =========================================================
   LOAD
========================================================= */

let loading = false;


async function loadHome(){

  if(loading){
    return;
  }

  loading = true;


  try{

    const raw =
      await ROCK.fetchDashboard();

    renderHome(raw);

    ROCK.hideStatus();

  }catch(error){

    console.error(error);

    ROCK.showStatus(
      error.message ||
      String(error),
      true
    );

  }finally{

    loading = false;
  }
}


/* =========================================================
   START
========================================================= */

(async()=>{

  try{

    ROCK.showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ok =
      await ROCK.initLIFF();


    if(!ok){
      return;
    }


    await loadHome();


    setInterval(
      ()=>{

        if(
          document.visibilityState ===
          "visible"
        ){
          loadHome();
        }

      },
      ROCK.CFG.REFRESH_MS
    );


  }catch(error){

    console.error(error);

    ROCK.showStatus(
      error.message ||
      String(error),
      true
    );
  }

})();

</script>
