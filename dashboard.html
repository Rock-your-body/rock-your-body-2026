<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROCK YOUR BODY 2026 - Home</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: #eef5ff; color: #08245b; font-family: Arial, "Noto Sans Thai", sans-serif; }
.page { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
.dashboard { position: relative; width: 100%; max-width: 1250px; aspect-ratio: 2500 / 1686; background: #fff; overflow: hidden; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
.dashboard-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }

/* รูปโปรไฟล์ LINE */
.profile-photo { position: absolute; z-index: 5; left: 18.8%; top: 38%; width: 27.5%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; pointer-events: none; }
.profile-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }

/* ตัวเลข Real-time */
.live-value { position: absolute; z-index: 20; display: flex; align-items: center; justify-content: center; font-weight: 900; text-align: center; white-space: nowrap; line-height: 1; pointer-events: none; }
#rockCoinValue { left: 80.8%; top: 6.1%; transform: translate(-50%, -50%); width: 8%; color: #08245b; font-size: clamp(12px, 1.5vw, 25px); }
#energyValue { left: 92.8%; top: 6.1%; transform: translate(-50%, -50%); width: 10%; color: #08245b; font-size: clamp(11px, 1.35vw, 23px); }
#currentWeightValue { left: 49.6%; top: 39.3%; transform: translate(-50%, -50%); width: 13%; color: #08245b; font-size: clamp(18px, 2.6vw, 43px); }
#targetWeightValue { left: 49.6%; top: 61.5%; transform: translate(-50%, -50%); width: 13%; color: #d31317; font-size: clamp(18px, 2.6vw, 43px); }
#levelValue { left: 29.45%; top: 64.3%; transform: translate(-50%, -50%); width: 4.5%; color: #fff; font-size: clamp(11px, 1.35vw, 22px); text-shadow: 0 2px 4px rgba(0,0,0,.5); }

/* ปุ่มคลิกต่างๆ และเมนูด้านล่าง */
.click-area { position: absolute; z-index: 30; border: 0; background: transparent; cursor: pointer; }
#weightCheckButton { left: 59%; top: 15%; width: 18%; height: 30%; }
#homeButton { left: 1%; top: 79%; width: 32%; height: 19%; }
#missionButton { left: 34%; top: 79%; width: 32%; height: 19%; }
#battleButton { left: 67%; top: 79%; width: 32%; height: 19%; }
</style>
</head>
<body>
<div class="page">
  <div class="dashboard">
    <img class="dashboard-bg" src="./rock-home-2500x1686-under1MB_2.jpg" alt="Home">
    
    <div class="profile-photo"><img id="profileImage" alt="Profile"></div>
    <div id="rockCoinValue" class="live-value"></div>
    <div id="energyValue" class="live-value"></div>
    <div id="currentWeightValue" class="live-value"></div>
    <div id="targetWeightValue" class="live-value"></div>
    <div id="levelValue" class="live-value"></div>

    <button id="weightCheckButton" class="click-area" onclick="location.href='https://liff.line.me/2011201679-uN62Coga'"></button>
    <button id="homeButton" class="click-area" onclick="location.href='dashboard.html'"></button>
    <button id="missionButton" class="click-area" onclick="location.href='mission.html'"></button>
    <button id="battleButton" class="click-area" onclick="location.href='battle.html'"></button>
  </div>
</div>

<script>
const LIFF_ID = "2011201679-uNWz5yqF";
const API_URL = "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";

async function initApp() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const idToken = liff.getIDToken();
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "dashboard", idToken })
    });
    const data = await res.json();

    if (data.success) {
      document.getElementById("rockCoinValue").textContent = Number(data.rockCoin || 0).toLocaleString();
      document.getElementById("energyValue").textContent = (data.energy?.current || 0) + "/" + (data.energy?.max || 200);
      document.getElementById("currentWeightValue").textContent = data.weight?.current ? Number(data.weight.current).toFixed(1) : "";
      document.getElementById("targetWeightValue").textContent = data.weight?.target ? Number(data.weight.target).toFixed(1) : "";
      document.getElementById("levelValue").textContent = data.level || 1;
      
      if (data.user?.pictureUrl) {
        const img = document.getElementById("profileImage");
        img.src = data.user.pictureUrl;
        img.style.display = "block";
      }
    }
  } catch (err) {
    console.error("Error:", err);
  }
}
initApp();
</script>
</body>
</html>
