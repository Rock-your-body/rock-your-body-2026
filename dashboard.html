<script>
"use strict";

/* =========================================================
   ROCK YOUR BODY 2026
   HOME V7.3 SIX-BOX ALIGN ONLY
   READ FLOW:
   LIFF ID Token
   -> PLAYER API
   -> action=dashboard
   -> JSON ก้อนเดียว
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const state = {

  raw:null,

  data:null

};


/* =========================================================
   HELPERS
========================================================= */

function num(
  value,
  fallback=0
){

  const parsed =
    Number(value);


  return Number.isFinite(
    parsed
  )
    ? parsed
    : fallback;
}


function pick(
  ...values
){

  for(
    const value
    of values
  ){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      return value;
    }
  }


  return null;
}


function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      num(
        value,
        0
      )
    )
  );
}


function formatNumber(
  value
){

  return Math.round(
    num(
      value,
      0
    )
  )
  .toLocaleString(
    "en-US"
  );
}


/*
  สำคัญ:
  Template มีคำ kg อยู่แล้ว
  จึงคืนค่าเฉพาะตัวเลข
*/
function formatWeightNumber(
  value
){

  const parsed =
    Number(value);


  return Number.isFinite(
    parsed
  )
    ? parsed.toFixed(1)
    : "--";
}


function showToast(
  message,
  isError=false
){

  const element =
    $("toast");


  if(
    !element
  ){
    return;
  }


  element.textContent =
    message;


  element.classList.toggle(
    "error",
    Boolean(
      isError
    )
  );


  element.classList.add(
    "show"
  );


  clearTimeout(
    window.__homeToast
  );


  window.__homeToast =
    setTimeout(
      ()=>{

        element.classList.remove(
          "show"
        );

      },
      isError
        ? 5000
        : 2800
    );
}


function getApi(
  name
){

  if(
    window.APP_CONFIG
      ?.getApi
  ){

    return window.APP_CONFIG
      .getApi(
        name
      );
  }


  const url =
    window.APP_CONFIG
      ?.API
      ?.[name];


  if(
    !url
  ){

    throw new Error(
      `ไม่พบ API.${name}`
    );
  }


  return url;
}


/* =========================================================
   LIFF
========================================================= */

async function initLiff(){

  if(
    typeof liff ===
    "undefined"
  ){

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  await liff.init({

    liffId:
      window.APP_CONFIG
        ?.LIFF_ID ||
      "2011201679-uNWz5yqF"

  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  const idToken =
    liff.getIDToken();


  if(
    !idToken
  ){

    try{

      liff.logout();

    }catch(error){

      console.warn(
        "LIFF logout:",
        error
      );
    }


    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  return true;
}


/* =========================================================
   PLAYER API
========================================================= */

async function getFreshIdToken(){

  if(
    typeof liff ===
    "undefined"
  ){

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  if(
    !liff.isLoggedIn()
  ){

    liff.login({

      redirectUri:
        window.location.href

    });


    return null;
  }


  const token =
    liff.getIDToken();


  if(
    !token
  ){

    try{

      liff.logout();

    }catch(error){

      console.warn(
        "LIFF logout:",
        error
      );
    }


    liff.login({

      redirectUri:
        window.location.href

    });


    return null;
  }


  return token;
}


function isTokenExpiredError(
  result,
  status
){

  const message =
    String(
      result?.error ||
      result?.message ||
      ""
    )
    .toLowerCase();


  return (
    status === 401 ||
    message.includes(
      "idtoken expired"
    ) ||
    message.includes(
      "id token expired"
    ) ||
    message.includes(
      "token expired"
    ) ||
    message.includes(
      "authentication failed"
    )
  );
}

async function playerApi(
  payload
){

  const idToken =
    await getFreshIdToken();


  if(
    !idToken
  ){

    return new Promise(
      ()=>{}
    );
  }


  const response =
    await fetch(
      getApi(
        "PLAYER"
      ),
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:
          "no-store",

        body:
          JSON.stringify({

            ...payload,

            idToken

          })

      }
    );


  const text =
    await response.text();


  let result = {};


  try{

    result =
      text
        ? JSON.parse(
            text
          )
        : {};

  }catch{

    throw new Error(
      "PLAYER API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    isTokenExpiredError(
      result,
      response.status
    )
  ){

    await renewLineLogin();


    return new Promise(
      ()=>{}
    );
  }


  if(
    !response.ok ||
    result?.success ===
      false
  ){

    throw new Error(
      result?.error ||
      result?.message ||
      `HTTP ${response.status}`
    );
  }


  return (
    result?.data ??
    result?.dashboard ??
    result
  );
}

/* =========================================================
   NORMALIZE API RESPONSE
========================================================= */

function normalizeHome(
  raw
){

  const player =
    raw?.player ??
    raw?.user ??
    {};


  const wallet =
    raw?.wallet ??
    {};


  const weight =
    raw?.weight ??
    {};


  const today =
    raw?.today ??
    raw?.health ??
    raw?.activity ??
    {};


  const energyObject =
    raw?.energy &&
    typeof raw.energy ===
      "object"
      ? raw.energy
      : {};


  const startWeight =
    pick(

      weight.start,

      weight.startWeight,

      weight.start_weight,

      raw.startWeight

    );


  const currentWeight =
    pick(

      weight.current,

      weight.currentWeight,

      weight.current_weight,

      raw.currentWeight

    );


  const targetWeight =
    pick(

      weight.target,

      weight.targetWeight,

      weight.target_weight,

      raw.targetWeight

    );


  const start =
    Number(
      startWeight
    );


  const current =
    Number(
      currentWeight
    );


  const target =
    Number(
      targetWeight
    );


  let progress =
    num(
      pick(

        weight.progressPercent,

        weight.progress,

        raw.weightProgressPct

      ),
      0
    );


  let lost =
    null;


  let remaining =
    null;


  if(
    Number.isFinite(
      start
    ) &&
    Number.isFinite(
      current
    )
  ){

    lost =
      Math.max(
        0,
        start -
        current
      );
  }


  if(
    Number.isFinite(
      current
    ) &&
    Number.isFinite(
      target
    )
  ){

    remaining =
      Math.max(
        0,
        current -
        target
      );
  }


  if(
    Number.isFinite(
      start
    ) &&
    Number.isFinite(
      current
    ) &&
    Number.isFinite(
      target
    ) &&
    start !==
      target
  ){

    progress =
      clamp(
        (
          (
            start -
            current
          ) /
          (
            start -
            target
          )
        ) *
        100,
        0,
        100
      );
  }


  return {

    player:{

      displayName:
        pick(

          player.displayName,

          player.lineDisplayName,

          player.line_display_name,

          raw.lineDisplayName

        ) ||
        "ROCK HERO",


      pictureUrl:
        pick(

          player.pictureUrl,

          player.picture_url,

          raw.pictureUrl

        ) ||
        "",


      level:
        num(
          pick(

            player.level,

            raw.level,

            raw?.exp?.level,

            raw?.progress?.exp?.level

          ),
          1
        )

    },


    wallet:{

      rockCoin:
        num(
          pick(

            wallet.rockCoin,

            wallet.rock_coin,

            raw.rockCoin,

            raw.rock_coin

          ),
          0
        ),


      energy:
        num(
          pick(

            wallet.energy,

            energyObject.current,

            typeof raw.energy ===
              "number"
              ? raw.energy
              : null

          ),
          0
        ),


      maxEnergy:
        99999

    },



    exp:{
      total:
        num(
          pick(
            raw?.exp?.total,
            raw?.progress?.exp?.total,
            raw?.experience?.total,
            player?.exp,
            typeof raw?.exp === "number" ? raw.exp : null
          ),
          0
        ),

      current:
        num(
          pick(
            raw?.exp?.current,
            raw?.progress?.exp?.current,
            raw?.experience?.current,
            typeof raw?.exp === "number" ? raw.exp : null,
            player?.exp
          ),
          0
        ),

      max:
        Math.max(
          1,
          num(
            pick(
              raw?.exp?.required,
              raw?.exp?.perLevel,
              raw?.exp?.max,
              raw?.progress?.exp?.required,
              raw?.progress?.exp?.perLevel,
              raw?.experience?.max,
              raw?.nextLevelExp,
              raw?.expNext,
              window.APP_CONFIG?.EXP_PER_LEVEL
            ),
            500
          )
        ),

      progress:
        num(
          pick(
            raw?.exp?.progress,
            raw?.progress?.exp?.progress
          ),
          0
        )
    },


    weight:{

      start:
        startWeight,

      current:
        currentWeight,

      target:
        targetWeight,

      progress,

      lost,

      remaining

    },


    today:{

      steps:
        num(
          pick(

            today.steps,

            raw.steps

          ),
          0
        ),


      calories:
        num(
          pick(

            today.calories,

            today.caloriesBurned,

            today.calories_burned,

            raw.calories

          ),
          0
        ),


      sleepMinutes:
        num(
          pick(

            today.sleepMinutes,

            today.sleep_minutes,

            raw.sleepMinutes

          ),
          0
        ),


      healthScore:
        pick(

          today.healthScore,

          today.health_score,

          raw.healthScore,

          raw.health?.healthScore,

          raw.activity?.healthScore

        )

    }

  };
}


/* =========================================================
   HEALTH SCORE FALLBACK
========================================================= */

function calculateHealthScoreFallback(
  data
){

  const steps =
    Math.max(
      0,
      Number(
        data?.today?.steps ||
        0
      )
    );


  const calories =
    Math.max(
      0,
      Number(
        data?.today?.calories ||
        0
      )
    );


  const sleepMinutes =
    Math.max(
      0,
      Number(
        data?.today?.sleepMinutes ||
        0
      )
    );


  const stepsScore =
    Math.min(
      1,
      steps /
      8000
    );


  const caloriesScore =
    Math.min(
      1,
      calories /
      300
    );


  const sleepScore =
    Math.min(
      1,
      sleepMinutes /
      420
    );


  return Math.round(
    (
      stepsScore +
      caloriesScore +
      sleepScore
    ) /
    3 *
    100
  );
}

    - ซ่อน /ค่าสูงสุด
    - ค่าสูงสุดระบบ = 99999
  */
  $("energy").textContent =
    formatNumber(
      data.wallet.energy
    );


  /* ---------- LINE ---------- */

  $("lineName").textContent =
    data.player.displayName;


  $("level").textContent =
    `Lv.${Math.max(
      1,
      Math.round(
        data.player.level
      )
    )}`;

    data.player.pictureUrl
  ){

    const image =
      $("profileImage");


    image.src =
      data.player.pictureUrl;


    image.style.display =
      "block";
  }


  /* ---------- EXP สะสมทั้งหมด ---------- */

  const expMax =
    Math.max(
      1,
      data.exp.max
    );


  const totalExp =
    Math.max(
      0,
      num(
        data.exp.total,
        0
      )
    );


  /*
    แถบ EXP ยังแสดงความคืบหน้าของ Level ปัจจุบัน
    แต่ข้อความแสดง EXP สะสมทั้งหมด
  */
  const expInLevel =
    (
      (
        totalExp %
        expMax
      ) +
      expMax
    ) %
    expMax;


  const expPercent =
    clamp(
      (
        expInLevel /
        expMax
      ) *
      100,
      0,
      100
    );


  $("expFill")
    .style
    .width =
      `${expPercent}%`;


  $("expValue")
    .textContent =
      `${formatNumber(
        totalExp
      )} `;


  /* ---------- WEIGHT ---------- */

  /*
    ไม่มี kg ใน dynamic
    เพราะ kg อยู่บน template แล้ว
  */
  $("currentWeight")
    .textContent =
      formatWeightNumber(
        data.weight.current
      );


  $("targetWeight")
    .textContent =
      formatWeightNumber(
        data.weight.target
      );


  const progress =
    clamp(
      data.weight.progress,
      0,
      100
    );


  $("weightProgressFill")
    .style
    .width =
      `${progress}%`;


  $("weightProgressPct")
    .textContent =
      `${Math.round(
        progress
      )}%`;


  /*
    ช่อง "ลดไปแล้ว" และ "เหลืออีก"
    Template ไม่มี kg จึงเติม kg จาก Dynamic
  */
  $("lostWeight")
    .textContent =
      data.weight.lost ===
        null
        ? "-- kg"
        : `${Number(
            data.weight.lost
          )
          .toFixed(
            1
          )} kg`;


  $("remainingWeight")
    .textContent =
      data.weight.remaining ===
        null
        ? "-- kg"
        : `${Number(
            data.weight.remaining
          )
          .toFixed(
            1
          )} kg`;


  /* ---------- HEALTH ---------- */

  $("steps").textContent =
    formatNumber(
      data.today.steps
    );


  /*
    ไม่มี kcal
    เพราะ Template มี kcal แล้ว
  */
  $("calories").textContent =
    formatNumber(
      data.today.calories
    );


  const sleepMinutes =
    Math.max(
      0,
      Math.round(
        data.today.sleepMinutes
      )
    );


  const sleepHours =
    Math.floor(
      sleepMinutes /
      60
    );


  const sleepRemain =
    sleepMinutes %
    60;


  /*
    แยกตัวเลขชั่วโมงและนาที
    ไม่ซ้อนคำ ชม. / นาที บน Template
  */
  $("sleepHours").textContent =
    formatNumber(
      sleepHours
    );


  $("sleepMinutes").textContent =
    formatNumber(
      sleepRemain
    );


  /*
    Template มี / 100 แล้ว
    จึงใส่เฉพาะคะแนน
  */

  const resolvedHealthScore =
    data.today.healthScore ===
      null ||
    data.today.healthScore ===
      undefined
      ? calculateHealthScoreFallback(
          data
        )
      : Math.round(
          num(
            data.today.healthScore,
            0
          )
        );


  $("healthScore").textContent =
    String(
      Math.max(
        0,
        Math.min(
          100,
          resolvedHealthScore
        )
      )
    );
}

/* =========================================================
   SLEEP
========================================================= */

function clockToMinutes(
  value
){

  const match =
    String(
      value ||
      ""
    )
    .match(
      /^(\d{1,2}):(\d{2})$/
    );


  if(
    !match
  ){

    return null;
  }


  const hour =
    Number(
      match[1]
    );


  const minute =
    Number(
      match[2]
    );


  if(
    hour < 0 ||
    hour > 23 ||
    minute < 0 ||
    minute > 59
  ){

    return null;
  }


  return (
    hour *
    60
  ) +
  minute;
}


function getSleepMinutes(){

  const start =
    clockToMinutes(
      $("sleepStart")
        ?.value
    );


  const wake =
    clockToMinutes(
      $("sleepWake")
        ?.value
    );


  if(
    start === null ||
    wake === null
  ){

    return 0;
  }


  let total =
    wake -
    start;


  /*
    เช่น 22:00 -> 06:30
    ถือว่าเวลาตื่นเป็นวันถัดไป
  */
  if(
    total <=
    0
  ){

    total +=
      24 *
      60;
  }


  return Math.max(
    0,
    Math.min(
      24 *
      60,
      total
    )
  );
}


function updateSleepStatus(){

  const total =
    getSleepMinutes();


  const hours =
    Math.floor(
      total /
      60
    );


  const minutes =
    total %

  $("sleepDuration")

    const reloginReason =
      sessionStorage.getItem(
        "ryb_relogin_reason"
      );


    if(
      reloginReason ===
      "token_expired"
    ){

      sessionStorage.removeItem(
        "ryb_relogin_reason"
      );


      showToast(
        "เชื่อมต่อ LINE ใหม่แล้ว"
      );
    }


    /*
      ตอนเปิด HOME:
      ยิง dashboard API เพียงครั้งเดียว
    */
    await refreshHome();


    /*
      refresh ตาม APP_CONFIG
      แต่ 1 รอบ = dashboard request เดียว
    */
    setInterval(
      ()=>{

        refreshHome()
          .catch(
            error =>{

              console.warn(
                "HOME REFRESH:",
                error
              );
            }
          );

      },
      Number(
        window.APP_CONFIG
          ?.REFRESH_MS ||
        30000
      )
    );

  }catch(error){

    console.error(
      "HOME INIT:",
      error
    );


    showToast(
      error?.message ||
      "โหลดข้อมูล HOME ไม่สำเร็จ",
      true
    );
  }

})();
</script>

</body>
</html>
