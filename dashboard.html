  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    let loading = false;
    let refreshTimer = null;

    function showStatus(message,isError=false){
      const el=$("status");
      el.textContent=message;
      el.classList.toggle("error",!!isError);
      el.style.display="block";
    }

    function hideStatus(){
      $("status").style.display="none";
    }

    function num(value,fallback=0){
      const n=Number(value);
      return Number.isFinite(n)?n:fallback;
    }

    function pick(...values){
      for(const v of values){
        if(v!==undefined && v!==null && v!=="") return v;
      }
      return null;
    }

    function clamp(value,min,max){
      return Math.max(min,Math.min(max,num(value,0)));
    }

    function fmtInt(v){
      return Math.round(num(v,0)).toLocaleString("en-US");
    }

    function fmtWeight(v){
      const n=Number(v);
      return Number.isFinite(n)?n.toFixed(1):"--.-";
    }

    function fmtDate(value){
      if(!value) return "--";
      const d=new Date(value);
      if(Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleDateString("th-TH",{day:"2-digit",month:"short",year:"numeric"});
    }

    function fmtDateShort(value){
      if(!value) return "--";
      const d=new Date(value);
      if(Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
    }

    function fmtSleep(value){
      if(value===null || value===undefined || value==="") return "--";
      if(typeof value==="string" && value.includes("ชม")) return value;

      const totalMinutes =
        typeof value==="object"
          ? num(pick(value.minutes,value.totalMinutes,value.total_minutes),0)
          : num(value,0);

      if(totalMinutes>24 && totalMinutes<=24*60){
        const h=Math.floor(totalMinutes/60);
        const m=Math.round(totalMinutes%60);
        return `${h} ชม. ${m} นาที`;
      }

      const hours =
        typeof value==="object"
          ? num(pick(value.hours,value.totalHours,value.total_hours),0)
          : num(value,0);

      if(hours>0 && hours<=24){
        const h=Math.floor(hours);
        const m=Math.round((hours-h)*60);
        return m?`${h} ชม. ${m} นาที`:`${h} ชม.`;
      }

      return "--";
    }

    function setBar(id,pct){
      const el=$(id);
      if(el) el.style.width=clamp(pct,0,100)+"%";
    }

    async function initLINE(){
      if(typeof liff==="undefined"){
        throw new Error("LINE LIFF SDK ไม่พร้อม");
      }

      const liffId=window.APP_CONFIG?.LIFF_ID;
      if(!liffId){
        throw new Error("ไม่พบ APP_CONFIG.LIFF_ID");
      }

      await liff.init({liffId});

      if(!liff.isLoggedIn()){
        liff.login({redirectUri:window.location.href});
        return false;
      }

      return true;
    }

    function getIdToken(){
      const token=liff.getIDToken();
      if(!token){
        throw new Error("ไม่พบ LINE ID Token กรุณาเข้าใหม่ผ่าน LINE");
      }
      return token;
    }

    async function postJson(url,payload){
      const response=await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });

      const text=await response.text();
      let data={};

      try{
        data=text?JSON.parse(text):{};
      }catch{
        throw new Error(`API ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`);
      }

      if(!response.ok || data?.success===false){
        throw new Error(data?.error || data?.message || `HTTP ${response.status}`);
      }

      return data;
    }

    async function fetchDashboard(){
      const api=window.APP_CONFIG?.API?.DASHBOARD;
      if(!api) throw new Error("ไม่พบ API.DASHBOARD ใน app-config.js");

      return postJson(api,{
        action:"dashboard",
        idToken:getIdToken()
      });
    }

    function normalizeDashboard(raw){
      const data=raw?.data ?? raw?.dashboard ?? raw ?? {};
      const user=data?.user ?? data?.player ?? {};
      const weight=(data?.weight && typeof data.weight==="object")?data.weight:{};
      const energy=(data?.energy && typeof data.energy==="object")?data.energy:{};
      const activity=data?.activity ?? data?.today ?? data?.health ?? {};
      const rewards=data?.rewards ?? data?.myRewards ?? data?.my_rewards ?? {};
      const project=data?.project ?? data?.campaign ?? {};
      const ranking=data?.ranking ?? data?.leaderboard ?? {};
      const expObj=(data?.exp && typeof data.exp==="object")?data.exp:{};

      const coin=num(pick(
        data.rockCoin,data.rock_coin,data.coin,
        user.rockCoin,user.rock_coin,user.coin
      ),0);

      const currentEnergy=num(pick(
        energy.current,data.energyCurrent,data.currentEnergy,data.current_energy,
        user.energy,typeof data.energy==="number"?data.energy:null
      ),0);

      const maxEnergy=num(pick(
        energy.max,data.maxEnergy,data.max_energy,user.maxEnergy,user.max_energy,
        window.APP_CONFIG?.MAX_ENERGY,200
      ),200);

      const currentWeight=pick(
        weight.current,weight.currentWeight,weight.current_weight,
        data.currentWeight,data.current_weight,user.currentWeight,user.current_weight
      );

      const targetWeight=pick(
        weight.target,weight.targetWeight,weight.target_weight,
        data.targetWeight,data.target_weight,user.targetWeight,user.target_weight
      );

      const startWeight=pick(
        weight.start,weight.startWeight,weight.start_weight,
        data.startWeight,data.start_weight,user.startWeight,user.start_weight
      );

      const totalExp=num(pick(
        expObj.total,expObj.current,
        typeof data.exp==="number"?data.exp:null,
        user.exp,user.experience
      ),0);

      const expPerLevel=num(window.APP_CONFIG?.EXP_PER_LEVEL,500) || 500;
      const level=num(pick(data.level,user.level),Math.floor(totalExp/expPerLevel)+1) || 1;

      const steps=num(pick(
        activity.steps,data.steps,data.todaySteps,data.today_steps,
        user.steps
      ),0);

      const stepsGoal=num(pick(
        activity.stepsGoal,activity.steps_goal,data.stepsGoal,data.steps_goal,10000
      ),10000);

      const calories=num(pick(
        activity.calories,activity.kcal,data.calories,data.kcal,
        data.caloriesBurned,data.calories_burned
      ),0);

      const caloriesGoal=num(pick(
        activity.caloriesGoal,activity.calories_goal,
        data.caloriesGoal,data.calories_goal,2000
      ),2000);

      const sleepValue=pick(
        activity.sleep,data.sleep,data.sleepMinutes,data.sleep_minutes,
        data.sleepHours,data.sleep_hours
      );

      const sleepMinutes = typeof sleepValue==="object"
        ? num(pick(sleepValue.minutes,sleepValue.totalMinutes,sleepValue.total_minutes),0)
        : (
            num(pick(data.sleepMinutes,data.sleep_minutes),NaN)
          );

      const sleepHours = typeof sleepValue==="object"
        ? num(pick(sleepValue.hours,sleepValue.totalHours,sleepValue.total_hours),0)
        : num(pick(data.sleepHours,data.sleep_hours),NaN);

      const sleepPercent = num(pick(
        activity.sleepPercent,activity.sleep_percent,
        data.sleepPercent,data.sleep_percent,
        Number.isFinite(sleepMinutes)?(sleepMinutes/480)*100:null,
        Number.isFinite(sleepHours)?(sleepHours/8)*100:null
      ),0);

      const healthScore=num(pick(
        activity.healthScore,activity.health_score,
        data.healthScore,data.health_score,
        data.overallHealthScore,data.overall_health_score
      ),0);

      const rewardCoin=num(pick(
        rewards.coin,rewards.rockCoin,rewards.rock_coin,
        data.rewardCoin,data.reward_coin,coin
      ),coin);

      const rewardEnergy=num(pick(
        rewards.energy,data.rewardEnergy,data.reward_energy,currentEnergy
      ),currentEnergy);

      const rewardBadge=pick(
        rewards.badge,rewards.badgeName,rewards.badge_name,
        data.badge,data.badgeName,data.badge_name,
        user.badge,user.badge_name
      ) ?? "--";

      const projectStart=pick(
        project.startDate,project.start_date,data.projectStartDate,data.project_start_date
      );

      const projectEnd=pick(
        project.endDate,project.end_date,data.projectEndDate,data.project_end_date
      );

      const elapsedDays=num(pick(
        project.elapsedDays,project.elapsed_days,data.elapsedDays,data.elapsed_days
      ),NaN);

      const remainingDays=num(pick(
        project.remainingDays,project.remaining_days,data.projectRemainingDays,data.project_remaining_days
      ),NaN);

      const totalDays=num(pick(
        project.totalDays,project.total_days,data.projectTotalDays,data.project_total_days
      ),NaN);

      const myRank=num(pick(
        ranking.myRank,ranking.my_rank,ranking.rank,
        data.myRank,data.my_rank,data.rank
      ),0);

      const participantCount=num(pick(
        ranking.totalParticipants,ranking.total_participants,ranking.participantCount,
        data.totalParticipants,data.total_participants,data.participantCount,data.participant_count
      ),0);

      const top = Array.isArray(ranking.top3)
        ? ranking.top3
        : Array.isArray(ranking.top)
          ? ranking.top
          : Array.isArray(data.top3)
            ? data.top3
            : [];

      return {
        raw:data,
        coin,
        energy:currentEnergy,
        maxEnergy,
        currentWeight,
        targetWeight,
        startWeight,
        level,
        totalExp,
        expPerLevel,

        picture:pick(
          user.pictureUrl,user.picture_url,data.pictureUrl,data.picture_url
        ) ?? "",

        teamName:pick(
          user.teamName,user.team_name,data.teamName,data.team_name,"HERO ROCK"
        ) ?? "HERO ROCK",

        steps,
        stepsGoal,
        calories,
        caloriesGoal,

        sleepValue,
        sleepPercent,
        healthScore,

        rewardCoin,
        rewardEnergy,
        rewardBadge,

        projectStart,
        projectEnd,
        elapsedDays,
        remainingDays,
        totalDays,

        myRank,
        participantCount,
        top
      };
    }

    async function renderProfile(url){
      const image=$("profileImage");

      let finalUrl=url;

      if(!finalUrl){
        try{
          const profile=await liff.getProfile();
          finalUrl=profile?.pictureUrl || "";
        }catch{}
      }

      if(!finalUrl){
        image.style.display="none";
        return;
      }

      image.onload=()=>image.style.display="block";
      image.onerror=()=>image.style.display="none";
      image.src=finalUrl;
    }

    function calculateProject(p){
      const now=new Date();
      const start=p.projectStart?new Date(p.projectStart):null;
      const end=p.projectEnd?new Date(p.projectEnd):null;

      let total=p.totalDays;
      let elapsed=p.elapsedDays;
      let remaining=p.remainingDays;

      if(start && end && !Number.isNaN(start.getTime()) && !Number.isNaN(end.getTime())){
        if(!Number.isFinite(total)){
          total=Math.max(1,Math.ceil((end-start)/86400000)+1);
        }
        if(!Number.isFinite(elapsed)){
          elapsed=clamp(Math.floor((now-start)/86400000)+1,0,total);
        }
        if(!Number.isFinite(remaining)){
          remaining=Math.max(0,total-elapsed);
        }
      }

      return {total,elapsed,remaining};
    }

    async function renderHome(raw){
      const p=normalizeDashboard(raw);

      await renderProfile(p.picture);

      $("teamName").textContent=p.teamName;

      $("coin").textContent=fmtInt(p.coin);
      $("energy").textContent=`${fmtInt(p.energy)} / ${fmtInt(p.maxEnergy)}`;

      $("level").textContent=`Lv.${fmtInt(p.level)}`;

      const expInLevel=((p.totalExp%p.expPerLevel)+p.expPerLevel)%p.expPerLevel;
      $("expText").textContent=`${fmtInt(expInLevel)} / ${fmtInt(p.expPerLevel)}`;
      setBar("expBar",(expInLevel/p.expPerLevel)*100);

      $("currentWeight").textContent=`${fmtWeight(p.currentWeight)} kg`;
      $("targetWeight").textContent=`${fmtWeight(p.targetWeight)} kg`;

      const current=Number(p.currentWeight);
      const target=Number(p.targetWeight);
      const start=Number(p.startWeight);

      let lost=NaN;
      let remaining=NaN;
      let weightPct=0;

      if(Number.isFinite(start) && Number.isFinite(current)){
        lost=Math.max(0,start-current);
      }
      if(Number.isFinite(current) && Number.isFinite(target)){
        remaining=Math.max(0,current-target);
      }
      if(Number.isFinite(start) && Number.isFinite(target) && Number.isFinite(current) && start!==target){
        weightPct=clamp(((start-current)/(start-target))*100,0,100);
      }

      $("lost").textContent=Number.isFinite(lost)?`${lost.toFixed(1)} kg`:"--.- kg";
      $("remaining").textContent=Number.isFinite(remaining)?`${remaining.toFixed(1)} kg`:"--.- kg";
      $("weightProgressPct").textContent=`${Math.round(weightPct)}%`;
      setBar("weightProgressBar",weightPct);

      $("steps").textContent=fmtInt(p.steps);
      setBar("stepsBar",p.stepsGoal>0?(p.steps/p.stepsGoal)*100:0);

      $("calories").textContent=`${fmtInt(p.calories)} kcal`;
      setBar("caloriesBar",p.caloriesGoal>0?(p.calories/p.caloriesGoal)*100:0);

      $("sleep").textContent=fmtSleep(p.sleepValue);
      setBar("sleepBar",p.sleepPercent);

      $("healthScore").textContent=`${fmtInt(p.healthScore)} / 100`;
      setBar("healthBar",p.healthScore);

      $("rewardCoin").textContent=fmtInt(p.rewardCoin);
      $("rewardEnergy").textContent=`${fmtInt(p.rewardEnergy)} / ${fmtInt(p.maxEnergy)}`;
      $("rewardBadge").textContent=String(p.rewardBadge);

      if(p.projectStart || p.projectEnd){
        $("projectRange").textContent=`${fmtDateShort(p.projectStart)} - ${fmtDateShort(p.projectEnd)}`;
      }else{
        $("projectRange").textContent="--";
      }

      const proj=calculateProject(p);
      $("projectElapsed").textContent=Number.isFinite(proj.elapsed)?`${fmtInt(proj.elapsed)} วัน`:"-- วัน";
      $("projectRemaining").textContent=Number.isFinite(proj.remaining)?`${fmtInt(proj.remaining)} วัน`:"-- วัน";
      setBar("projectBar",Number.isFinite(proj.total)&&proj.total>0&&Number.isFinite(proj.elapsed)?(proj.elapsed/proj.total)*100:0);

      $("myRank").textContent=p.myRank>0?`# ${fmtInt(p.myRank)}`:"# --";
      $("participantCount").textContent=p.participantCount>0?`${fmtInt(p.participantCount)} คน`:"-- คน";

      const top=p.top || [];
      $("top1Score").textContent=top[0]?.score!=null?fmtInt(top[0].score):"";
      $("top2Score").textContent=top[1]?.score!=null?fmtInt(top[1].score):"";
      $("top3Score").textContent=top[2]?.score!=null?fmtInt(top[2].score):"";
    }

    /* =====================================================
       INBODY
    ====================================================== */

    function normalizeInbodyHistory(raw){
      const data=raw?.data ?? raw ?? {};
      const list=data?.inbodyHistory ?? data?.inbody_history ?? data?.history ?? [];

      if(!Array.isArray(list)) return [];

      return list.map(item=>({
        score:num(pick(item.score,item.inbody_score,item.inbodyScore),NaN),
        measuredAt:pick(item.measuredAt,item.measured_at,item.date)
      }))
      .filter(item=>Number.isFinite(item.score) && item.measuredAt)
      .sort((a,b)=>new Date(a.measuredAt)-new Date(b.measuredAt));
    }

    function drawInbodyChart(history){
      const svg=$("inbodyChart");
      svg.innerHTML="";

      if(!history.length) return;

      const list=history.slice(-7);
      const scores=list.map(x=>x.score);
      let min=Math.min(...scores);
      let max=Math.max(...scores);

      if(max===min){min-=5;max+=5}
      else{
        const pad=Math.max(2,(max-min)*.15);
        min-=pad;max+=pad;
      }

      const W=220,H=80,L=8,R=8,T=8,B=8;

      const points=list.map((item,index)=>{
        const x=list.length===1?W/2:L+(index/(list.length-1))*(W-L-R);
        const y=H-B-((item.score-min)/(max-min))*(H-T-B);
        return {x,y,score:item.score};
      });

      const poly=document.createElementNS("http://www.w3.org/2000/svg","polyline");
      poly.setAttribute("points",points.map(p=>`${p.x},${p.y}`).join(" "));
      poly.setAttribute("fill","none");
      poly.setAttribute("stroke","#6736e8");
      poly.setAttribute("stroke-width","3");
      poly.setAttribute("stroke-linecap","round");
      poly.setAttribute("stroke-linejoin","round");
      svg.appendChild(poly);

      points.forEach(p=>{
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
        c.setAttribute("cx",p.x);
        c.setAttribute("cy",p.y);
        c.setAttribute("r","4");
        c.setAttribute("fill","#fff");
        c.setAttribute("stroke","#6736e8");
        c.setAttribute("stroke-width","2.5");
        svg.appendChild(c);
      });
    }

    function renderInbody(raw){
      const history=normalizeInbodyHistory(raw);
      const latest=history.length?history[history.length-1]:null;

      $("inbodyScore").textContent=latest?fmtInt(latest.score):"--";
      $("inbodyDate").textContent=latest?`(${fmtDateShort(latest.measuredAt)})`:"ยังไม่มีข้อมูล";
      drawInbodyChart(history);
    }

    async function fetchInbodyHistory(){
      const api=window.APP_CONFIG?.API?.INBODY;

      if(!api){
        return {success:true,inbodyHistory:[]};
      }

      return postJson(api,{
        action:"list",
        idToken:getIdToken()
      });
    }

    async function loadInbodyHistory(){
      try{
        const result=await fetchInbodyHistory();
        renderInbody(result);
      }catch(error){
        console.warn("INBODY HISTORY ERROR:",error);
        renderInbody({inbodyHistory:[]});
      }
    }

    function openInbodyModal(){
      const d=new Date();
      $("inbodyMeasuredDate").value=[
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
      ].join("-");
      $("inbodyScoreInput").value="";
      $("inbodyFileInput").value="";
      $("inbodyModal").classList.add("show");
    }

    function closeInbodyModal(){
      $("inbodyModal").classList.remove("show");
    }

    async function saveInbody(){
      const measuredDate=$("inbodyMeasuredDate").value;
      const score=Number($("inbodyScoreInput").value);
      const file=$("inbodyFileInput").files?.[0];
      const api=window.APP_CONFIG?.API?.INBODY;

      if(!api){
        showStatus("ไม่พบ API.INBODY ใน app-config.js",true);
        return;
      }
      if(!measuredDate){
        showStatus("กรุณาเลือกวันที่ตรวจ",true);
        return;
      }
      if(!Number.isFinite(score) || score<0 || score>150){
        showStatus("กรุณากรอก InBody Score 0-150",true);
        return;
      }
      if(!file){
        showStatus("กรุณาเลือกไฟล์ผล InBody",true);
        return;
      }

      const btn=$("inbodySave");

      try{
        btn.disabled=true;
        showStatus("กำลังอัปโหลดผล InBody...");

        const form=new FormData();
        form.append("action","upload");
        form.append("idToken",getIdToken());
        form.append("score",String(score));
        form.append("measuredDate",measuredDate);
        form.append("file",file);

        const response=await fetch(api,{method:"POST",body:form});
        const text=await response.text();

        let result={};
        try{result=text?JSON.parse(text):{}}
        catch{throw new Error("InBody API ตอบกลับไม่ใช่ JSON")}

        if(!response.ok || result?.success===false){
          throw new Error(result?.error || result?.message || `HTTP ${response.status}`);
        }

        closeInbodyModal();
        await loadInbodyHistory();

        showStatus("บันทึกผล InBody สำเร็จ");
        setTimeout(hideStatus,1600);

      }catch(error){
        console.error(error);
        showStatus(error?.message || "อัปโหลด InBody ไม่สำเร็จ",true);
      }finally{
        btn.disabled=false;
      }
    }

    /* =====================================================
       LOAD ALL HOME DATA
    ====================================================== */


    async function loadProjectSettings(){

      const api =
        window.APP_CONFIG
          ?.API
          ?.PROJECT;


      if(!api){
        return;
      }


      try{

        const result =
          await postJson(
            api,
            {
              action:
                "get"
            }
          );


        const project =
          result?.project ??
          {};


        if(
          project.start_date ||
          project.end_date
        ){

          $("projectRange")
            .textContent =
              `${fmtDateShort(project.start_date)} - ${fmtDateShort(project.end_date)}`;

        }


        $("projectElapsed")
          .textContent =
            `${fmtInt(project.elapsedDays ?? 0)} วัน`;


        $("projectRemaining")
          .textContent =
            `${fmtInt(project.remainingDays ?? 0)} วัน`;


        setBar(
          "projectBar",
          project.percent ??
          0
        );


      }catch(error){

        console.warn(
          "PROJECT SETTINGS ERROR:",
          error
        );

      }

    }


    async function loadHome(){
      if(loading) return;
      loading=true;

      try{
        const raw=await fetchDashboard();

        await renderHome(raw);

        /*
          สำคัญ:
          InBody โหลดแยกจาก Dashboard
          ต่อให้ InBody error ก็ไม่ทำให้ HOME ทั้งหน้าล้ม
        */
        await loadInbodyHistory();
        await loadProjectSettings();

        hideStatus();

      }catch(error){
        console.error("HOME LOAD ERROR:",error);
        showStatus(error?.message || "โหลดข้อมูล HOME ไม่สำเร็จ",true);
      }finally{
        loading=false;
      }
    }

    function goPage(name){
      const page=window.APP_CONFIG?.PAGE?.[name] ?? window.APP_CONFIG?.PAGES?.[name];
      if(!page){
        showStatus("ไม่พบหน้า "+name,true);
        return;
      }
      window.location.href=page;
    }

    $("weightButton").addEventListener("click",()=>goPage("WEIGHT"));
    $("progressButton").addEventListener("click",()=>goPage("PROGRESS"));
    $("projectSettingsButton").addEventListener("click",()=>goPage("PROJECT_SETTINGS"));
    $("rankingButton").addEventListener("click",()=>goPage("RANKING"));
    $("rewardsButton").addEventListener("click",()=>goPage("REWARDS"));
    $("homeButton").addEventListener("click",()=>goPage("HOME"));
    $("missionButton").addEventListener("click",()=>goPage("MISSION"));
    $("battleButton").addEventListener("click",()=>goPage("BATTLE"));

    $("inbodyViewButton").addEventListener("click",()=>goPage("PROGRESS"));
    $("inbodyUpload").addEventListener("click",openInbodyModal);
    $("inbodyCancel").addEventListener("click",closeInbodyModal);
    $("inbodySave").addEventListener("click",saveInbody);

    $("inbodyModal").addEventListener("click",event=>{
      if(event.target===$("inbodyModal")) closeInbodyModal();
    });

    async function startApp(){
      try{
        showStatus("กำลังเชื่อมต่อ LINE...");

        const ready=await initLINE();
        if(ready===false) return;

        await loadHome();

        const ms=num(window.APP_CONFIG?.REFRESH_MS,30000);
        refreshTimer=setInterval(loadHome,Math.max(10000,ms));

      }catch(error){
        console.error("START APP ERROR:",error);
        showStatus(error?.message || "เปิดแอปไม่สำเร็จ",true);
      }
    }

    startApp();
  </script>
