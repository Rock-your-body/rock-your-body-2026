<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>ROCK YOUR BODY 2026 - HOME</title>


  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- CONFIG -->
  <script src="./app-config.js?v=20260827-01"></script>

  <!-- COMMON -->
  <script src="./common.js?v=20260827-01"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #eef4ff;

      font-family:
        "Noto Sans Thai",
        Tahoma,
        Arial,
        sans-serif;

      color: #082b68;

    }


    body {

      display: flex;
      justify-content: center;

    }


    #loading {

      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eef4ff;

      font-size: 20px;
      font-weight: 700;

      text-align: center;

      padding: 30px;

    }


    #app {

      display: none;

      width: 100%;
      max-width: 1280px;

      padding: 20px;

    }


    .header {

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 20px;

    }


    .logo {

      font-size: 38px;
      font-weight: 900;
      font-style: italic;

      color: #102f78;

    }


    .logo span {

      color: #c91717;

    }


    .profile {

      display: flex;

      align-items: center;

      gap: 12px;

      background: white;

      padding: 10px 16px;

      border-radius: 18px;

      box-shadow:
        0 4px 16px rgba(0,0,0,.10);

    }


    #profileImage {

      width: 54px;
      height: 54px;

      border-radius: 50%;

      object-fit: cover;

      display: none;

    }


    .profile-name {

      font-size: 17px;
      font-weight: 800;

    }


    .top-stats {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 15px;

      margin-bottom: 20px;

    }


    .stat {

      background: white;

      border-radius: 20px;

      padding: 18px;

      text-align: center;

      box-shadow:
        0 4px 16px rgba(0,0,0,.10);

    }


    .stat-label {

      font-size: 14px;
      font-weight: 700;

      color: #65738b;

    }


    .stat-value {

      margin-top: 5px;

      font-size: 30px;
      font-weight: 900;

      color: #102f78;

    }


    .main-card {

      background: white;

      border-radius: 28px;

      padding: 25px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.10);

      margin-bottom: 20px;

    }


    .section-title {

      font-size: 24px;

      font-weight: 900;

      margin-bottom: 20px;

    }


    .weight-grid {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 15px;

    }


    .weight-box {

      padding: 20px;

      border-radius: 18px;

      background: #f3f6fc;

      text-align: center;

    }


    .weight-label {

      font-size: 14px;

      color: #65738b;

      font-weight: 700;

    }


    .weight-value {

      margin-top: 5px;

      font-size: 30px;

      font-weight: 900;

    }


    .exp-wrap {

      margin-top: 20px;

    }


    .exp-text {

      display: flex;

      justify-content: space-between;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .exp-track {

      height: 15px;

      background: #dfe5ee;

      border-radius: 99px;

      overflow: hidden;

    }


    #expBar {

      width: 0%;

      height: 100%;

      background: #102f78;

      border-radius: 99px;

      transition: width .5s ease;

    }


    .nav {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 12px;

    }


    .nav button {

      border: 0;

      padding: 16px 10px;

      border-radius: 16px;

      background: #102f78;

      color: white;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }


    @media(max-width:700px){

      #app {
        padding: 12px;
      }

      .logo {
        font-size: 28px;
      }

      .top-stats,
      .weight-grid,
      .nav {
        grid-template-columns: 1fr 1fr;
      }

      .header {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<div id="loading">
  กำลังเชื่อมต่อ ROCK YOUR BODY...
</div>


<main id="app">


  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      ROCK <span>YOUR</span> BODY
      <small>2026</small>
    </div>


    <div class="profile">

      <img
        id="profileImage"
        alt="LINE Profile"
      >

      <div>

        <div
          id="profileName"
          class="profile-name"
        >
          สมาชิก ROCK YOUR BODY
        </div>

        <div>
          Lv.<span id="level">1</span>
        </div>

      </div>

    </div>

  </header>


  <!-- TOP STATS -->

  <section class="top-stats">


    <div class="stat">

      <div class="stat-label">
        ROCK COIN
      </div>

      <div
        id="coin"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        ENERGY
      </div>

      <div
        id="energy"
        class="stat-value"
      >
        0 / 200
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        EXP
      </div>

      <div
        id="expText"
        class="stat-value"
      >
        0 / 500
      </div>

    </div>


  </section>


  <!-- WEIGHT -->

  <section class="main-card">


    <div class="section-title">
      น้ำหนักของฉัน
    </div>


    <div class="weight-grid">


      <div class="weight-box">

        <div class="weight-label">
          น้ำหนักเริ่มต้น
        </div>

        <div
          id="startWeight"
          class="weight-value"
        >
          --.-
        </div>

        <div>kg</div>

      </div>


      <div class="weight-box">

        <div class="weight-label">
          น้ำหนักปัจจุบัน
        </div>

        <div
          id="currentWeight"
          class="weight-value"
        >
          --.-
        </div>

        <div>kg</div>

      </div>


      <div class="weight-box">

        <div class="weight-label">
          เป้าหมาย
        </div>

        <div
          id="targetWeight"
          class="weight-value"
        >
          --.-
        </div>

        <div>kg</div>

      </div>


    </div>


    <div class="exp-wrap">

      <div class="exp-text">

        <span>
          Level Progress
        </span>

        <span id="expPercent">
          0%
        </span>

      </div>


      <div class="exp-track">

        <div id="expBar"></div>

      </div>

    </div>


  </section>


  <!-- EXTRA -->

  <section class="main-card">

    <div class="section-title">
      สถานะโปรแกรม
    </div>


    <div class="weight-grid">

      <div class="weight-box">

        <div class="weight-label">
          ลดไปแล้ว
        </div>

        <div
          id="lostWeight"
          class="weight-value"
        >
          0.0
        </div>

        <div>kg</div>

      </div>


      <div class="weight-box">

        <div class="weight-label">
          เหลืออีก
        </div>

        <div
          id="remainingWeight"
          class="weight-value"
        >
          0.0
        </div>

        <div>kg</div>

      </div>


      <div class="weight-box">

        <div class="weight-label">
          อัปเดตล่าสุด
        </div>

        <div
          id="updatedAt"
          class="weight-value"
          style="font-size:20px"
        >
          -
        </div>

      </div>

    </div>

  </section>


  <!-- NAV -->

  <nav class="nav">

    <button onclick="window.ROCK.goMission()">
      MISSION
    </button>

    <button onclick="window.ROCK.goBattle()">
      BATTLE
    </button>

    <button onclick="window.ROCK.goRewards()">
      REWARD
    </button>

    <button onclick="window.ROCK.goRanking()">
      RANKING
    </button>

  </nav>


</main>


<script>

(function(){

  "use strict";


  function setText(
    id,
    value
  ){

    const el =
      document.getElementById(id);

    if(el){

      el.textContent =
        value;

    }

  }


  function num(
    value
  ){

    const n =
      Number(value);

    return Number.isFinite(n)
      ? Math.round(n).toLocaleString("en-US")
      : "0";

  }


  function weight(
    value
  ){

    const n =
      Number(value);

    return Number.isFinite(n)
      ? n.toFixed(1)
      : "--.-";

  }


  function date(
    value
  ){

    if(!value){

      return "-";

    }


    const d =
      new Date(value);


    if(
      Number.isNaN(
        d.getTime()
      )
    ){

      return "-";

    }


    return d.toLocaleDateString(
      "th-TH"
    );

  }


  async function loadHome(){

    const loading =
      document.getElementById(
        "loading"
      );


    try{

      if(
        !window.ROCK
      ){

        throw new Error(
          "common.js โหลดไม่สำเร็จ"
        );

      }


      if(
        typeof window.ROCK.initLiff !==
        "function"
      ){

        throw new Error(
          "ROCK.initLiff ไม่พร้อม"
        );

      }


      const ready =
        await window.ROCK.initLiff();


      if(
        ready === false
      ){

        return;

      }


      const profile =
        await window.ROCK.getProfile();


      if(profile){

        setText(
          "profileName",
          profile.displayName ||
          "สมาชิก ROCK YOUR BODY"
        );


        if(
          profile.pictureUrl
        ){

          const img =
            document.getElementById(
              "profileImage"
            );

          img.src =
            profile.pictureUrl;

          img.style.display =
            "block";

        }

      }


      const result =
        await window.ROCK.fetchDashboard();


      if(!result){

        throw new Error(
          "ไม่สามารถโหลด Dashboard"
        );

      }


      console.log(
        "HOME DASHBOARD:",
        result
      );


      const d =
        result.data ||
        result.dashboard ||
        result;


      const user =
        d.user ||
        d.player ||
        {};


      const energy =
        d.energy ||
        {};


      const exp =
        d.exp ||
        {};


      const w =
        d.weight ||
        {};


      const coin =
        Number(
          d.rockCoin ??
          d.rock_coin ??
          user.rockCoin ??
          user.rock_coin ??
          0
        );


      const currentEnergy =
        Number(
          energy.current ??
          d.energyCurrent ??
          user.energy ??
          0
        );


      const maxEnergy =
        Number(
          energy.max ??
          d.energyMax ??
          user.maxEnergy ??
          200
        );


      const totalExp =
        Number(
          exp.total ??
          d.totalExp ??
          user.exp ??
          0
        );


      const expPerLevel =
        Number(
          window.APP_CONFIG?.EXP_PER_LEVEL
        ) || 500;


      const level =
        Math.max(
          1,
          Number(
            d.level ??
            user.level ??
            Math.floor(
              totalExp /
              expPerLevel
            ) + 1
          )
        );


      const currentWeight =
        w.current ??
        w.currentWeight ??
        d.currentWeight ??
        null;


      const targetWeight =
        w.target ??
        w.targetWeight ??
        d.targetWeight ??
        null;


      const startWeight =
        w.start ??
        w.startWeight ??
        d.startWeight ??
        null;


      const updatedAt =
        w.updatedAt ??
        w.updated_at ??
        d.updatedAt ??
        null;


      /* ---------------------------------------------
         RENDER
      --------------------------------------------- */


      setText(
        "coin",
        num(coin)
      );


      setText(
        "energy",
        `${num(currentEnergy)} / ${num(maxEnergy)}`
      );


      setText(
        "level",
        num(level)
      );


      setText(
        "currentWeight",
        weight(currentWeight)
      );


      setText(
        "targetWeight",
        weight(targetWeight)
      );


      setText(
        "startWeight",
        weight(startWeight)
      );


      setText(
        "updatedAt",
        date(updatedAt)
      );


      const expInLevel =
        Math.max(
          0,
          totalExp %
          expPerLevel
        );


      const percent =
        Math.min(
          100,
          (
            expInLevel /
            expPerLevel
          ) * 100
        );


      setText(
        "expText",
        `${num(expInLevel)} / ${num(expPerLevel)}`
      );


      setText(
        "expPercent",
        `${Math.round(percent)}%`
      );


      document
        .getElementById(
          "expBar"
        )
        .style.width =
        `${percent}%`;


      const cw =
        Number(currentWeight);


      const tw =
        Number(targetWeight);


      const sw =
        Number(startWeight);


      if(
        Number.isFinite(cw) &&
        Number.isFinite(tw)
      ){

        setText(
          "remainingWeight",
          Math.max(
            0,
            cw - tw
          ).toFixed(1)
        );

      }


      if(
        Number.isFinite(sw) &&
        Number.isFinite(cw)
      ){

        setText(
          "lostWeight",
          Math.max(
            0,
            sw - cw
          ).toFixed(1)
        );

      }


      loading.style.display =
        "none";


      document
        .getElementById(
          "app"
        )
        .style.display =
        "block";


    }catch(error){

      console.error(
        "HOME ERROR:",
        error
      );


      loading.innerHTML =
        `
        <div>
          <div>
            ไม่สามารถโหลดข้อมูลได้
          </div>

          <br>

          <small>
            ${error.message}
          </small>
        </div>
        `;

    }

  }


  loadHome();


})();

</script>


</body>
</html>
