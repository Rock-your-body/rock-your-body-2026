<div

<script>

/* =========================================================
   CONFIG
========================================================= */

const DASHBOARD_LIFF_ID =
  "2011201679-uNWz5yqF";


const WEIGHT_LIFF_URL =
  "https://liff.line.me/2011201679-uN62Coga";


const PLAYER_API =
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";


const EXP_PER_LEVEL =
  500;


const MAX_ENERGY =
  200;


const REFRESH_MS =
  30000;


/* =========================================================
   ELEMENT
========================================================= */

function $(
  id
) {

  return document
    .getElementById(
      id
    );
}


/* =========================================================
   NUMBER
========================================================= */

function numberValue(
  value,
  fallback = 0
) {

  const number =
    Number(
      value
    );


  return Number.isFinite(
    number
  )
    ? number
    : fallback;
}


/* =========================================================
   FORMAT INTEGER
========================================================= */

function formatInteger(
  value
) {

  return Math.round(
    numberValue(
      value,
      0
    )
  ).toLocaleString(
    "en-US"
  );
}


/* =========================================================
   FORMAT WEIGHT
========================================================= */

function formatWeight(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "--.-";
  }


  const number =
    Number(
      value
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "--.-";
  }


  return number
    .toFixed(1);
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
  value
) {

  if (!value) {

    return "--/--/----";
  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "--/--/----";
  }


  return date
    .toLocaleDateString(
      "th-TH",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    );
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    $("status");


  if (!status) {

    return;
  }


  status.textContent =
    message;


  status.className =
    error
      ? "status show error"
      : "status show";
}


function hideStatus() {

  const status =
    $("status");


  if (status) {

    status.className =
      "status";
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

function go(
  url
) {

  window.location.href =
    url;
}


function openWeightCheck() {

  window.location.href =
    WEIGHT_LIFF_URL;
}


function reloadHome() {

  window.location.reload();
}


/* =========================================================
   INIT LIFF
========================================================= */

async function initLiff() {

  if (
    typeof liff ===
    "undefined"
  ) {

    throw new Error(
      "ไม่สามารถโหลด LINE LIFF SDK"
    );
  }


  await liff.init({
    liffId:
      DASHBOARD_LIFF_ID
  });


  if (
    !liff.isLoggedIn()
  ) {

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  const idToken =
    liff.getIDToken();


  if (!idToken) {

    liff.logout();


    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  return true;
}


/* =========================================================
   FETCH DASHBOARD
========================================================= */

async function fetchDashboard() {

  const idToken =
    liff.getIDToken();


  if (!idToken) {

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      PLAYER_API,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            action:
              "dashboard",

            idToken:
              idToken
          })
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(
        text
      );

  } catch {

    console.error(
      "PLAYER API RAW:",
      text
    );


    throw new Error(
      "Dashboard API ตอบกลับไม่ถูกต้อง"
    );
  }


  if (
    !response.ok ||
    data.success === false
  ) {

    throw new Error(
      data.error ||
      "โหลดข้อมูล HOME ไม่สำเร็จ"
    );
  }


  return data;
}


/* =========================================================
   NORMALIZE DASHBOARD

   รองรับ response รุ่นปัจจุบัน:
   user
   rockCoin
   energy
   weight
   level
   exp
========================================================= */

function normalizeDashboard(
  raw
) {

  const user =
    raw?.user ||
    raw?.player ||
    {};


  const weight =
    raw?.weight ||
    {};


  const energy =
    raw?.energy &&
    typeof raw.energy ===
      "object"
      ? raw.energy
      : {};


  let totalExp =
    raw?.exp;


  if (
    totalExp &&
    typeof totalExp ===
      "object"
  ) {

    totalExp =
      totalExp.total ??
      totalExp.current ??
      0;
  }


  totalExp =
    numberValue(
      totalExp ??
      user.exp,
      0
    );


  /*
    กติกาหลักของระบบ:
    ทุก 500 EXP = +1 Level
  */

  const calculatedLevel =
    Math.floor(
      totalExp /
      EXP_PER_LEVEL
    ) + 1;


  const currentWeight =
    weight.current ??
    user.current_weight ??
    null;


  const targetWeight =
    weight.target ??
    user.target_weight ??
    null;


  const startWeight =
    weight.start ??
    user.start_weight ??
    null;


  const updatedAt =
    weight.updatedAt ??
    weight.lastRecordedAt ??
    user.weight_updated_at ??
    null;


  const startDate =
    weight.startDate ??
    user.start_date ??
    null;


  return {

    picture:
      user.pictureUrl ??
      user.picture_url ??
      "",

    coin:
      numberValue(
        raw?.rockCoin ??
        raw?.rock_coin ??
        user.rock_coin,
        0
      ),

    energy:
      numberValue(
        energy.current ??
        user.energy,
        0
      ),

    maxEnergy:
      numberValue(
        energy.max ??
        user.max_energy,
        MAX_ENERGY
      ),

    exp:
      totalExp,

    level:
      calculatedLevel,

    currentWeight,

    targetWeight,

    startWeight,

    updatedAt,

    startDate
  };
}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(
  raw
) {

  const p =
    normalizeDashboard(
      raw
    );


  /* ----------------------
     COIN
  ---------------------- */

  $("coin").textContent =
    formatInteger(
      p.coin
    );


  /* ----------------------
     ENERGY
  ---------------------- */

  $("energy").textContent =
    formatInteger(
      p.energy
    ) +
    " / " +
    formatInteger(
      p.maxEnergy
    );


  /* ----------------------
     PROFILE
  ---------------------- */

  const profile =
    $("profileImage");


  if (
    profile &&
    p.picture
  ) {

    profile.src =
      p.picture;

    profile.style.display =
      "block";
  }


  /* ----------------------
     LEVEL
  ---------------------- */

  $("level").textContent =
    "Lv." +
    formatInteger(
      p.level
    );


  /* ----------------------
     EXP
  ---------------------- */

  const expInLevel =
    p.exp %
    EXP_PER_LEVEL;


  $("expText").textContent =
    formatInteger(
      expInLevel
    ) +
    " / " +
    EXP_PER_LEVEL;


  $("expBar").style.width =
    Math.min(
      100,
      Math.max(
        0,
        (
          expInLevel /
          EXP_PER_LEVEL
        ) * 100
      )
    ) +
    "%";


  /* ----------------------
     CURRENT WEIGHT
  ---------------------- */

  $("currentWeight")
    .textContent =
      formatWeight(
        p.currentWeight
      );


  /* ----------------------
     TARGET
  ---------------------- */

  $("targetWeight")
    .textContent =
      formatWeight(
        p.targetWeight
      );


  /* ----------------------
     UPDATED
  ---------------------- */

  $("updatedAt")
    .textContent =
      formatDate(
        p.updatedAt
      );


  /* ----------------------
     START DATE
  ---------------------- */

  $("startDate")
    .textContent =
      formatDate(
        p.startDate
      );


  /* ----------------------
     REMAINING
  ---------------------- */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  if (
    Number.isFinite(
      current
    ) &&
    Number.isFinite(
      target
    )
  ) {

    $("remaining")
      .textContent =
        Math.abs(
          current -
          target
        )
        .toFixed(1) +
        " kg";

  } else {

    $("remaining")
      .textContent =
        "--.- kg";
  }


  /* ----------------------
     LOST
  ---------------------- */

  const start =
    Number(
      p.startWeight
    );


  if (
    Number.isFinite(
      start
    ) &&
    Number.isFinite(
      current
    )
  ) {

    $("lost")
      .textContent =
        Math.abs(
          start -
          current
        )
        .toFixed(1) +
        " kg";

  } else {

    $("lost")
      .textContent =
        "--.- kg";
  }
}


/* =========================================================
   LOAD HOME
========================================================= */

let loading =
  false;


async function loadHome() {

  if (loading) {

    return;
  }


  loading =
    true;


  try {

    const data =
      await fetchDashboard();


    console.log(
      "HOME DATA:",
      data
    );


    renderHome(
      data
    );


    hideStatus();


  } catch (error) {

    console.error(
      "HOME ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  } finally {

    loading =
      false;
  }
}


/* =========================================================
   START
========================================================= */

(async function start() {

  try {

    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ok =
      await initLiff();


    if (!ok) {

      return;
    }


    await loadHome();


    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadHome();
        }

      },
      REFRESH_MS
    );


  } catch (error) {

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();


/* =========================================================
   RETURN TO PAGE
========================================================= */

document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.visibilityState ===
        "visible" &&
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ) {

      loadHome();
    }
  }
);


window.addEventListener(
  "pageshow",
  function () {

    if (
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ) {

      loadHome();
    }
  }
);

</script>
