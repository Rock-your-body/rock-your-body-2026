<script>
"use strict";

const HOME_API =
  window.APP_CONFIG?.getApi?.("PLAYER") ||
  window.APP_CONFIG?.API?.PLAYER;

const LOADING_TIMEOUT_MS = 12000;

function $(id){
  return document.getElementById(id);
}

function showHomeError(message){
  console.error("HOME ERROR:", message);

  const loader = $("loadingText");
  if(loader){
    loader.textContent = "โหลดข้อมูลไม่สำเร็จ";
  }

  const status = $("status");
  if(status){
    status.textContent = message;
    status.classList.add("show","error");
  }
}

function hideHomeLoading(){
  const loader = $("loadingText");
  if(loader){
    loader.style.display = "none";
  }
}

async function withTimeout(promise, ms){
  const controller = new Promise((_, reject)=>{
    setTimeout(()=>{
      reject(new Error("โหลดข้อมูลเกินเวลาที่กำหนด"));
    }, ms);
  });

  return Promise.race([
    promise,
    controller
  ]);
}

async function initHomeLiff(){

  if(typeof liff === "undefined"){
    throw new Error("LINE LIFF SDK ไม่พร้อม");
  }

  await liff.init({
    liffId:
      window.APP_CONFIG?.LIFF_ID ||
      "2011201679-uNWz5yqF"
  });

  if(!liff.isLoggedIn()){
    liff.login({
      redirectUri: window.location.href
    });
    return false;
  }

  const idToken = liff.getIDToken();

  if(!idToken){
    throw new Error("ไม่พบ LINE ID Token");
  }

  return true;
}

async function fetchHomeDashboard(){

  if(!HOME_API){
    throw new Error("ไม่พบ PLAYER API");
  }

  const idToken = liff.getIDToken();

  const response = await fetch(HOME_API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    cache:"no-store",
    body:JSON.stringify({
      action:"dashboard",
      idToken
    })
  });

  const raw = await response.text();

  let result = {};

  try{
    result = raw ? JSON.parse(raw) : {};
  }catch{
    throw new Error(
      "player-dashboard ตอบกลับไม่ใช่ JSON"
    );
  }

  if(
    !response.ok ||
    result?.success === false
  ){
    throw new Error(
      result?.error ||
      result?.message ||
      `HTTP ${response.status}`
    );
  }

  return result?.data ??
         result?.dashboard ??
         result;
}

function renderHome(data){

  const player =
    data?.player ??
    data?.user ??
    {};

  const wallet =
    data?.wallet ??
    {};

  const weight =
    data?.weight ??
    {};

  const today =
    data?.today ??
    data?.dailyHealth ??
    {};

  const inbody =
    data?.inbody ??
    {};

  const project =
    data?.project ??
    {};

  const ranking =
    data?.ranking ??
    {};

  if($("coin")){
    $("coin").textContent =
      Number(
        wallet.rockCoin ??
        data.rockCoin ??
        data.rock_coin ??
        0
      ).toLocaleString();
  }

  const energy =
    Number(
      wallet.energy ??
      data.energy?.current ??
      data.energy ??
      0
    ) || 0;

  const maxEnergy =
    Number(
      wallet.maxEnergy ??
      data.energy?.max ??
      data.maxEnergy ??
      200
    ) || 200;

  if($("energy")){
    $("energy").textContent =
      `${energy} / ${maxEnergy}`;
  }

  if($("currentWeight")){
    const v =
      weight.current ??
      data.currentWeight;

    $("currentWeight").textContent =
      v != null
        ? `${Number(v).toFixed(1)} kg`
        : "-- kg";
  }

  if($("targetWeight")){
    const v =
      weight.target ??
      data.targetWeight;

    $("targetWeight").textContent =
      v != null
        ? `${Number(v).toFixed(1)} kg`
        : "-- kg";
  }

  if($("weightProgressPct")){
    $("weightProgressPct").textContent =
      `${Math.round(
        Number(
          weight.progressPercent ??
          data.weightProgressPct ??
          0
        )
      )}%`;
  }

  if($("steps")){
    $("steps").textContent =
      Number(
        today.steps ??
        data.steps ??
        0
      ).toLocaleString();
  }

  if($("calories")){
    $("calories").textContent =
      `${Math.round(
        Number(
          today.calories ??
          data.calories ??
          0
        )
      )} kcal`;
  }

  if($("sleep")){
    const minutes =
      Number(
        today.sleepMinutes ??
        data.sleepMinutes ??
        0
      ) || 0;

    const h =
      Math.floor(minutes / 60);

    const m =
      minutes % 60;

    $("sleep").textContent =
      `${h} ชม. ${m} นาที`;
  }

  if($("healthScore")){
    const score =
      today.healthScore ??
      data.healthScore;

    $("healthScore").textContent =
      score != null
        ? `${score} / 100`
        : "-- / 100";
  }

  if($("inbodyScore")){
    $("inbodyScore").textContent =
      inbody.score ??
      "--";
  }

  if($("myRank")){
    $("myRank").textContent =
      ranking.rank
        ? `#${ranking.rank}`
        : "# --";
  }

  const image =
    $("profileImage");

  if(image){
    const picture =
      player.pictureUrl ??
      player.picture_url ??
      "";

    if(picture){
      image.src = picture;
      image.style.display = "block";
    }
  }

  const team =
    $("teamName");

  if(team){
    team.textContent =
      player.teamName ??
      player.team_name ??
      "";
  }
}

async function startHome(){

  try{

    const ready =
      await withTimeout(
        initHomeLiff(),
        LOADING_TIMEOUT_MS
      );

    if(ready === false){
      return;
    }

    const data =
      await withTimeout(
        fetchHomeDashboard(),
        LOADING_TIMEOUT_MS
      );

    console.log(
      "HOME DASHBOARD DATA:",
      data
    );

    renderHome(data);

  }catch(error){

    showHomeError(
      error?.message ||
      "โหลดข้อมูล HOME ไม่สำเร็จ"
    );

  }finally{

    hideHomeLoading();

  }
}

document.addEventListener(
  "DOMContentLoaded",
  startHome
);
</script>
