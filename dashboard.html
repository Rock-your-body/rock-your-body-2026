====================================================== -->

<div
  id="status"
  class="status"

<!-- SHARED LOGIC -->
<script src="./common.js"></script>


<script>

/* =========================================================
   ELEMENT
========================================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    $("status");


  if (!status) {
    return;
  }


  status.textContent =
    message;


  status.className =
    error
      ? "status show error"
      : "status show";
}


function hideStatus() {

  const status =
    $("status");


  if (status) {
    status.className =
      "status";
  }
}


/* =========================================================
   PAGE
========================================================= */

function goPage(
  pageName
) {

  const url =
    ROCK.CFG.PAGE[
      pageName
    ];


  if (url) {
    ROCK.go(url);
  }
}


function reloadHome() {

  window.location.reload();
}


/* =========================================================
   FORMAT DATE ONLY
========================================================= */

function formatDateOnly(
  value
) {

  if (!value) {
    return "--/--/----";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "--/--/----";
  }


  return date
    .toLocaleDateString(
      "th-TH",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"
      }
    );
}


/* =========================================================
   NORMALIZE DASHBOARD
========================================================= */

function normalizeDashboard(
  raw
) {

  const user =
    raw?.user ||
    raw?.player ||
    {};


  const weight =
    raw?.weight ||
    {};


  const energy =
    raw?.energy &&
    typeof raw.energy ===
      "object"
      ? raw.energy
      : {};


  /* -----------------------------------------------------
     EXP
  ------------------------------------------------------ */

  let totalExp =
    raw?.exp;


  if (
    totalExp &&
    typeof totalExp ===
      "object"
  ) {

    totalExp =
      totalExp.total ??
      totalExp.current ??
      0;
  }


  totalExp =
    ROCK.num(
      totalExp ??
      user.exp,
      0
    );


  const expPerLevel =
    ROCK.num(
      ROCK.CFG.EXP_PER_LEVEL,
      500
    );


  const level =
    Math.floor(
      totalExp /
      expPerLevel
    ) + 1;


 /* -----------------------------------------------------
   WEIGHT
------------------------------------------------------ */

const currentWeight =
  weight.current ??
  weight.currentWeight ??
  weight.current_weight ??
  raw?.currentWeight ??
  raw?.current_weight ??
  user?.currentWeight ??
  user?.current_weight ??
  null;


const targetWeight =
  weight.target ??
  weight.targetWeight ??
  weight.target_weight ??
  raw?.targetWeight ??
  raw?.target_weight ??
  user?.targetWeight ??
  user?.target_weight ??
  null;


const startWeight =
  weight.start ??
  weight.startWeight ??
  weight.start_weight ??
  raw?.startWeight ??
  raw?.start_weight ??
  user?.startWeight ??
  user?.start_weight ??
  null;


const updatedAt =
  weight.updatedAt ??
  weight.updated_at ??
  weight.lastRecordedAt ??
  weight.last_recorded_at ??
  raw?.weightUpdatedAt ??
  raw?.weight_updated_at ??
  raw?.updatedAt ??
  raw?.updated_at ??
  user?.weightUpdatedAt ??
  user?.weight_updated_at ??
  user?.updatedAt ??
  user?.updated_at ??
  null;


const startDate =
  weight.startDate ??
  weight.start_date ??
  raw?.startDate ??
  raw?.start_date ??
  user?.startDate ??
  user?.start_date ??
  null;


  /* -----------------------------------------------------
     USER
  ------------------------------------------------------ */

  const picture =
  user?.pictureUrl ??
  user?.picture_url ??
  raw?.pictureUrl ??
  raw?.picture_url ??
  "";


  /* -----------------------------------------------------
     COIN
  ------------------------------------------------------ */

  const coin =
    ROCK.num(
      raw?.rockCoin ??
      raw?.rock_coin ??
      user.rock_coin,
      0
    );


  /* -----------------------------------------------------
     ENERGY
  ------------------------------------------------------ */

  const currentEnergy =
    ROCK.num(
      energy.current ??
      user.energy,
      0
    );


  const maxEnergy =
    ROCK.num(
      energy.max ??
      user.max_energy,
      ROCK.CFG.MAX_ENERGY
    );


  return {

    picture,

    coin,

    energy:
      currentEnergy,

    maxEnergy,

    exp:
      totalExp,

    expPerLevel,

    level,

    currentWeight,

    targetWeight,

    startWeight,

    updatedAt,

    startDate
  };
}


/* =========================================================
   RENDER
========================================================= */

function renderHome(
  raw
) {

  const p =
    normalizeDashboard(
      raw
    );


  /* =====================================================
     PROFILE
  ====================================================== */

  const profile =
    $("profileImage");


  if (
    profile &&
    p.picture
  ) {

    profile.src =
      p.picture;


    profile.style.display =
      "block";
  }


  /* =====================================================
     COIN
  ====================================================== */

  $("coin").textContent =
    ROCK.fmtInt(
      p.coin
    );


  /* =====================================================
     ENERGY
  ====================================================== */

  $("energy").textContent =
    ROCK.fmtInt(
      p.energy
    ) +
    " / " +
    ROCK.fmtInt(
      p.maxEnergy
    );


 /* =====================================================
   LEVEL + EXP
===================================================== */

const EXP_PER_LEVEL =
  Number(ROCK.CFG.EXP_PER_LEVEL || 500);

const totalExp =
  Math.max(
    0,
    Number(p.exp || 0)
  );

/*
  0 - 499   = Lv.1
  500 - 999 = Lv.2
  1000-1499 = Lv.3
*/
const level =
  Math.floor(
    totalExp / EXP_PER_LEVEL
  ) + 1;

/*
  EXP ภายใน Level ปัจจุบัน
*/
const expInLevel =
  totalExp % EXP_PER_LEVEL;

/*
  %
*/
const expPercent =
  EXP_PER_LEVEL > 0
    ? Math.max(
        0,
        Math.min(
          100,
          (
            expInLevel /
            EXP_PER_LEVEL
          ) * 100
        )
      )
    : 0;


/* LEVEL */

$("level").textContent =
  "Lv." + level;


/* EXP TEXT */

$("expText").textContent =
  ROCK.fmtInt(expInLevel) +
  " / " +
  ROCK.fmtInt(EXP_PER_LEVEL);


/* EXP BAR */

$("expBar").style.width =
  expPercent + "%";

  /* =====================================================
     CURRENT WEIGHT
  ====================================================== */

  $("currentWeight").textContent =
  ROCK.fmtWeight(
    p.currentWeight
  ) + " kg";

  /* =====================================================
     TARGET
  ====================================================== */

 $("targetWeight").textContent =
  ROCK.fmtWeight(
    p.targetWeight
  ) + " kg";

  /* =====================================================
     UPDATED DATE
  ====================================================== */

  $("updatedAt")
    .textContent =
      formatDateOnly(
        p.updatedAt
      );


  /* =====================================================
     START DATE
  ====================================================== */

  $("startDate")
    .textContent =
      formatDateOnly(
        p.startDate
      );


  /* =====================================================
     REMAINING
  ====================================================== */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  if (
    Number.isFinite(
      current
    ) &&
    Number.isFinite(
      target
    )
  ) {

    $("remaining")
      .textContent =
        Math.abs(
          current -
          target
        )
        .toFixed(1) +
        " kg";

  } else {

    $("remaining")
      .textContent =
        "--.- kg";
  }


  /* =====================================================
     LOST / CHANGE
  ====================================================== */

  const start =
    Number(
      p.startWeight
    );


  if (
    Number.isFinite(
      start
    ) &&
    Number.isFinite(
      current
    )
  ) {

    $("lost")
      .textContent =
        Math.abs(
          start -
          current
        )
        .toFixed(1) +
        " kg";

  } else {

    $("lost")
      .textContent =
        "--.- kg";
  }
}


/* =========================================================
   LOAD HOME
========================================================= */

let loading =
  false;


async function loadHome() {

  if (loading) {
    return;
  }


  loading =
    true;


  try {

    const raw =
      await ROCK.fetchDashboard();


    console.log(
      "HOME DATA:",
      raw
    );


    renderHome(
      raw
    );


    hideStatus();


  } catch (
    error
  ) {

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    const message =
      error?.message ||
      String(error);


    if (
      message
        .toLowerCase()
        .includes("token") ||
      message
        .toLowerCase()
        .includes(
          "authentication"
        )
    ) {

      showStatus(
        "LINE Session หมดอายุ กำลังเข้าสู่ระบบใหม่..."
      );


      setTimeout(
        ROCK.loginAgain,
        500
      );


      return;
    }


    showStatus(
      message,
      true
    );


  } finally {

    loading =
      false;
  }
}


/* =========================================================
   START
========================================================= */

(async () => {

  try {

    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ok =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if (!ok) {
      return;
    }


    await loadHome();


    /* ---------------------------------------------------
       REFRESH
    ---------------------------------------------------- */

    const refreshMs =
      ROCK.num(
        ROCK.CFG.REFRESH_MS,
        30000
      );


    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadHome();
        }

      },
      refreshMs
    );


  } catch (
    error
  ) {

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();


/* =========================================================
   RETURN FROM OTHER PAGE
========================================================= */

document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.visibilityState ===
      "visible" &&
      typeof liff !==
      "undefined" &&
      liff.isLoggedIn()
    ) {

      loadHome();
    }
  }
);


window.addEventListener(
  "pageshow",
  function () {

    if (
      typeof liff !==
      "undefined" &&
      liff.isLoggedIn()
    ) {

      loadHome();
    }
  }
);

</script>
