     COMMON
     โหลดครั้งเดียว
========================================================= -->

<script src="./common.js?v=20260823-09"></script>


<script>

/* =========================================================
   GLOBAL
========================================================= */

const ROCK =
  window.ROCK;


const $ =
  id =>
    document.getElementById(id);


let loading =
  false;


let refreshTimer =
  null;


/* =========================================================
   NAVIGATION
========================================================= */

function goPage(name) {

  const url =
    ROCK?.CFG?.PAGE?.[name];

  if (!url) {
    return;
  }

  ROCK.go(url);
}


function reloadHome() {

  loadHome();
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const el =
    $("status");

  if (!el) {
    return;
  }

  el.textContent =
    message;

  el.className =
    error
      ? "show error"
      : "show";
}


function hideStatus() {

  const el =
    $("status");

  if (!el) {
    return;
  }

  el.className =
    "";
}


/* =========================================================
   NUMBER
========================================================= */

function num(
  value,
  fallback = 0
) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


/* =========================================================
   DATE
========================================================= */

function formatDateOnly(value) {

  if (!value) {
    return "--/--/----";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "--/--/----";
  }

  return date.toLocaleDateString(
    "th-TH",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );
}


/* =========================================================
   NORMALIZE DASHBOARD
========================================================= */

function normalizeDashboard(raw) {

  raw =
    raw || {};


  const user =
    raw.user ||
    raw.player ||
    {};


  const weight =
    raw.weight &&
    typeof raw.weight === "object"
      ? raw.weight
      : {};


  const energy =
    raw.energy &&
    typeof raw.energy === "object"
      ? raw.energy
      : {};


  const expObject =
    raw.exp &&
    typeof raw.exp === "object"
      ? raw.exp
      : {};


  const totalExp =
    expObject.total ??
    raw.exp ??
    user.exp ??
    0;


  return {

    picture:

      user.pictureUrl ??
      user.picture_url ??
      raw.pictureUrl ??
      raw.picture_url ??
      "",


    coin:

      num(
        raw.rockCoin ??
        raw.rock_coin ??
        user.rockCoin ??
        user.rock_coin,
        0
      ),


    energy:

      num(
        energy.current ??
        raw.energyCurrent ??
        user.energy,
        0
      ),


    maxEnergy:

      num(
        energy.max ??
        raw.maxEnergy ??
        user.max_energy ??
        user.maxEnergy,
        ROCK.CFG.MAX_ENERGY ||
        200
      ),


    currentWeight:

      weight.current ??
      weight.currentWeight ??
      weight.current_weight ??
      raw.currentWeight ??
      raw.current_weight ??
      user.currentWeight ??
      user.current_weight ??
      null,


    targetWeight:

      weight.target ??
      weight.targetWeight ??
      weight.target_weight ??
      raw.targetWeight ??
      raw.target_weight ??
      user.targetWeight ??
      user.target_weight ??
      null,


    startWeight:

      weight.start ??
      weight.startWeight ??
      weight.start_weight ??
      raw.startWeight ??
      raw.start_weight ??
      user.startWeight ??
      user.start_weight ??
      null,


    updatedAt:

      weight.lastRecordedAt ??
      weight.updatedAt ??
      weight.updated_at ??
      raw.updatedAt ??
      raw.updated_at ??
      null,


    startDate:

      weight.startDate ??
      weight.start_date ??
      raw.startDate ??
      raw.start_date ??
      null,


    totalExp:

      num(
        totalExp,
        0
      ),


    level:

      num(
        raw.level ??
        user.level,
        1
      )

  };
}


/* =========================================================
   PROFILE
========================================================= */

function renderProfile(url) {

  const image =
    $("profileImage");


  if (!image) {
    return;
  }


  if (!url) {

    image.removeAttribute(
      "src"
    );

    image.style.display =
      "none";

    return;
  }


  image.onload =
    function() {

      image.style.display =
        "block";
    };


  image.onerror =
    function() {

      image.style.display =
        "none";
    };


  image.src =
    url;
}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(raw) {

  console.log(
    "RENDER HOME RAW:",
    raw
  );


  const p =
    normalizeDashboard(
      raw
    );


  console.log(
    "RENDER HOME NORMALIZED:",
    p
  );


  /* =====================================================
     PROFILE
  ====================================================== */

  renderProfile(
    p.picture
  );


  /* =====================================================
     COIN
  ====================================================== */

  $("coin").textContent =
    ROCK.fmtInt(
      p.coin
    );


  /* =====================================================
     ENERGY
  ====================================================== */

  $("energy").textContent =
    ROCK.fmtInt(
      p.energy
    ) +
    " / " +
    ROCK.fmtInt(
      p.maxEnergy
    );


  /* =====================================================
     LEVEL + EXP
  ====================================================== */

  const expPerLevel =
    num(
      ROCK.CFG.EXP_PER_LEVEL,
      500
    );


  const totalExp =
    Math.max(
      0,
      num(
        p.totalExp,
        0
      )
    );


  const calculatedLevel =
    Math.floor(
      totalExp /
      expPerLevel
    ) + 1;


  const level =
    Math.max(
      1,
      p.level,
      calculatedLevel
    );


  const expInLevel =
    totalExp %
    expPerLevel;


  const expPercent =
    expPerLevel > 0

      ? Math.max(
          0,
          Math.min(
            100,
            (
              expInLevel /
              expPerLevel
            ) * 100
          )
        )

      : 0;


  $("level").textContent =
    "Lv." +
    level;


  $("expText").textContent =
    ROCK.fmtInt(
      expInLevel
    ) +
    " / " +
    ROCK.fmtInt(
      expPerLevel
    );


  $("expBar").style.width =
    expPercent +
    "%";


  /* =====================================================
     CURRENT WEIGHT
  ====================================================== */

  $("currentWeight")
    .textContent =
      ROCK.fmtWeight(
        p.currentWeight
      ) +
      " kg";


  /* =====================================================
     TARGET
  ====================================================== */

  $("targetWeight")
    .textContent =
      ROCK.fmtWeight(
        p.targetWeight
      ) +
      " kg";


  /* =====================================================
     UPDATE DATE
  ====================================================== */

  $("updatedAt")
    .textContent =
      formatDateOnly(
        p.updatedAt
      );


  /* =====================================================
     START DATE
  ====================================================== */

  $("startDate")
    .textContent =
      formatDateOnly(
        p.startDate
      );


  /* =====================================================
     REMAINING
  ====================================================== */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  if (
    Number.isFinite(current) &&
    Number.isFinite(target)
  ) {

   $("remaining")
  .textContent =
    Math.max(
      0,
      current - target
    )
      .toFixed(1);
  } else {

  $("remaining")
  .textContent =
    "--.-";
  }


  /* =====================================================
     LOST
  ====================================================== */

  const start =
    Number(
      p.startWeight
    );


  if (
    Number.isFinite(start) &&
    Number.isFinite(current)
  ) {

    $("lost")
      .textContent =
        Math.max(
          0,
          start -
          current
        )
          .toFixed(1) +
        " kg";

  } else {

    $("lost")
      .textContent =
        "--.- kg";
  }
}


/* =========================================================
   LOAD HOME
========================================================= */

async function loadHome() {

  if (loading) {
    return;
  }


  loading =
    true;


  try {

    showStatus(
      "กำลังโหลดข้อมูล..."
    );


    const raw =
      await ROCK.fetchDashboard();


    console.log(
      "HOME DATA:",
      raw
    );


    renderHome(
      raw
    );


    hideStatus();


  } catch (error) {

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  } finally {

    loading =
      false;
  }
}


/* =========================================================
   START HOME
========================================================= */

async function startHome() {

  try {

    if (!ROCK) {

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );
    }


    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ready =
      await ROCK.initLiff();


    if (!ready) {
      return;
    }


    await loadHome();


    /* =====================================================
       AUTO REFRESH
    ====================================================== */

    if (refreshTimer) {

      clearInterval(
        refreshTimer
      );
    }


    refreshTimer =
      setInterval(
        async () => {

          if (
            document.visibilityState !==
            "visible"
          ) {
            return;
          }


          try {

            await loadHome();

          } catch (error) {

            console.error(
              "AUTO REFRESH ERROR:",
              error
            );
          }

        },
        num(
          ROCK.CFG.REFRESH_MS,
          30000
        )
      );


  } catch (error) {

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }
}


/* =========================================================
   RETURN TO PAGE
========================================================= */

document.addEventListener(
  "visibilitychange",
  async function() {

    if (
      document.visibilityState !==
      "visible"
    ) {
      return;
    }


    try {

      const ready =
        await ROCK.initLiff();


      if (!ready) {
        return;
      }


      await loadHome();


    } catch (error) {

      console.error(
        "VISIBILITY REFRESH ERROR:",
        error
      );
    }
  }
);


window.addEventListener(
  "pageshow",
  async function() {

    try {

      const ready =
        await ROCK.initLiff();


      if (!ready) {
        return;
      }


      await loadHome();


    } catch (error) {

      console.error(
        "PAGESHOW REFRESH ERROR:",
        error
      );
    }
  }
);


/* =========================================================
   START ONCE
========================================================= */

startHome();

</script>
