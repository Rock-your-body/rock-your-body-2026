========================================================= -->

<div id="status"></div>


<script>

/* =========================================================
   ELEMENT
========================================================= */

function $(id) {

  return document.getElementById(id);

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const el =
    $("status");


  if (!el) {
    return;
  }


  el.textContent =
    message;


  el.className =
    error
      ? "show error"
      : "show";

}


function hideStatus() {

  const el =
    $("status");


  if (!el) {
    return;
  }


  el.className =
    "";

}


/* =========================================================
   NAVIGATION
========================================================= */

function goPage(name) {

  const url =
    ROCK.CFG.PAGE[name];


  if (!url) {

    console.error(
      "PAGE NOT FOUND:",
      name
    );

    return;

  }


  ROCK.go(url);

}


function reloadHome() {

  loadHome();

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile() {

  try {

    const profile =
      await ROCK.getProfile();


    if (
      !profile ||
      !profile.pictureUrl
    ) {

      return;

    }


    const image =
      $("profileImage");


    image.src =
      profile.pictureUrl;


    image.style.display =
      "block";


  } catch (error) {

    console.warn(
      "PROFILE ERROR:",
      error
    );

  }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeDashboard(
  raw
) {

  raw =
    raw || {};


  const user =
    raw.user ||
    raw.player ||
    {};


  const weight =
    raw.weight || {};


  const energy =
    raw.energy || {};


  const exp =
    raw.exp || {};


  return {

    coin:

      Number(
        raw.rockCoin ??
        raw.rock_coin ??
        user.rockCoin ??
        user.rock_coin ??
        0
      ),


    energy:

      Number(
        energy.current ??
        raw.energyCurrent ??
        user.energy ??
        0
      ),


    maxEnergy:

      Number(
        energy.max ??
        raw.maxEnergy ??
        user.maxEnergy ??
        user.max_energy ??
        ROCK.CFG.MAX_ENERGY
      ),


    level:

      Number(
        raw.level ??
        user.level ??
        1
      ),


    totalExp:

      Number(
        exp.total ??
        raw.totalExp ??
        user.exp ??
        0
      ),


    currentWeight:

      weight.current ??
      weight.currentWeight ??
      weight.current_weight ??
      raw.currentWeight ??
      raw.current_weight ??
      user.currentWeight ??
      null,


    targetWeight:

      weight.target ??
      weight.targetWeight ??
      weight.target_weight ??
      raw.targetWeight ??
      raw.target_weight ??
      user.targetWeight ??
      null,


    startWeight:

      weight.start ??
      weight.startWeight ??
      weight.start_weight ??
      raw.startWeight ??
      raw.start_weight ??
      user.startWeight ??
      null,


    updatedAt:

      weight.lastRecordedAt ??
      weight.updatedAt ??
      weight.updated_at ??
      raw.updatedAt ??
      raw.updated_at ??
      null,


    startDate:

      weight.startDate ??
      weight.start_date ??
      raw.startDate ??
      raw.start_date ??
      null

  };

}


/* =========================================================
   RENDER
========================================================= */

function renderHome(
  raw
) {

  console.log(
    "DASHBOARD RAW:",
    raw
  );


  const p =
    normalizeDashboard(
      raw
    );


  /* COIN */

  $("coin").textContent =
    ROCK.fmtInt(
      p.coin
    );


  /* ENERGY */

  $("energy").textContent =

    ROCK.fmtInt(
      p.energy
    ) +

    " / " +

    ROCK.fmtInt(
      p.maxEnergy
    );


  /* LEVEL */

  const expPerLevel =
    Number(
      ROCK.CFG.EXP_PER_LEVEL ||
      500
    );


  const totalExp =
    Math.max(
      0,
      Number(
        p.totalExp
      ) || 0
    );


  const calculatedLevel =
    Math.floor(
      totalExp /
      expPerLevel
    ) + 1;


  const level =
    Math.max(
      1,
      Number(p.level) || 1,
      calculatedLevel
    );


  const expInLevel =
    totalExp %
    expPerLevel;


  const percent =
    expPerLevel > 0

      ? (
          expInLevel /
          expPerLevel
        ) * 100

      : 0;


  $("level").textContent =
    "Lv." +
    level;


  $("expText").textContent =

    ROCK.fmtInt(
      expInLevel
    ) +

    " / " +

    ROCK.fmtInt(
      expPerLevel
    );


  $("expBar").style.width =
    Math.min(
      100,
      percent
    ) +
    "%";


  /* CURRENT */

  $("currentWeight").textContent =

    ROCK.fmtWeight(
      p.currentWeight
    ) +
    " kg";


  /* TARGET */

  $("targetWeight").textContent =

    ROCK.fmtWeight(
      p.targetWeight
    ) +
    " kg";


  /* UPDATE */

  $("updatedAt").textContent =
    ROCK.formatDateOnly(
      p.updatedAt
    );


  /* START DATE */

  $("startDate").textContent =
    ROCK.formatDateOnly(
      p.startDate
    );


  /* REMAINING */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  if (
    Number.isFinite(current) &&
    Number.isFinite(target)
  ) {

    $("remaining").textContent =

      Math.max(
        0,
        current -
        target
      ).toFixed(1);

  } else {

    $("remaining").textContent =
      "--.-";

  }


  /* LOST */

  const start =
    Number(
      p.startWeight
    );


  if (
    Number.isFinite(start) &&
    Number.isFinite(current)
  ) {

    $("lost").textContent =

      Math.max(
        0,
        start -
        current
      ).toFixed(1) +

      " kg";

  } else {

    $("lost").textContent =
      "--.- kg";

  }

}


/* =========================================================
   LOAD HOME
========================================================= */

let loading =
  false;


async function loadHome() {

  if (loading) {

    return;

  }


  loading =
    true;


  try {

    showStatus(
      "กำลังโหลดข้อมูล..."
    );


    await loadProfile();


    let data;

    try {
      data = await ROCK.fetchDashboard();
    } catch (apiError) {
      console.error("DASHBOARD API ERROR:", apiError);

      // Keep the dashboard usable even when the API is temporarily unavailable.
      // The exact API error is shown briefly instead of breaking the layout.
      renderHome({});
      showStatus("ไม่สามารถโหลดข้อมูล Dashboard ได้ กรุณาลองใหม่", true);
      return;
    }

    renderHome(data);
    hideStatus();


  } catch (error) {

    console.error(
      "LOAD HOME ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  } finally {

    loading =
      false;

  }

}


/* =========================================================
   START
========================================================= */

(async function () {

  try {

    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ready =
      await ROCK.initLiff();


    if (!ready) {

      console.log(
        "LIFF authentication กำลังดำเนินการ"
      );


      return;

    }


    await loadHome();


  } catch (error) {

    console.error(
      "DASHBOARD START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );

  }

})();


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  async function () {

    if (
      document.visibilityState !==
      "visible"
    ) {

      return;

    }


    try {

      const ready =
        await ROCK.initLiff();


      if (ready) {

        await loadHome();

      }

    } catch (error) {

      console.warn(
        "VISIBILITY ERROR:",
        error
      );

    }

  }
);


</script>
