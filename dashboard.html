    /* =========================================================
       RESET
    ========================================================= */

    *{
      box-sizing:border-box;
    }

      margin:0;

       STAGE + POSITION CONFIG

      width:100%;

      --profile-top:18.2%;
      --profile-size:24.0%;

      --coin-top:4.2%;
      --coin-width:7.7%;
      --coin-height:5.0%;


      /* ================= ENERGY ================= */

      --energy-left:88.4%;
      --energy-top:4.2%;
      --energy-width:9.7%;
      --energy-height:5.0%;


      /* ================= LEVEL ================= */

      --level-left:23.2%;
      --level-top:54.8%;
      --level-width:6.7%;
      --level-height:4.5%;


      /* ================= EXP BAR ================= */

      --expbar-left:8.6%;
      --expbar-top:75.0%;
      --expbar-width:14.0%;
      --expbar-height:1.8%;


      /* ================= EXP TEXT ================= */

      --exptext-left:22.0%;
      --exptext-top:75.2%;
      --exptext-width:9.0%;
      --exptext-height:4.5%;


      /* ================= CURRENT WEIGHT ================= */

      --current-left:41.5%;
      --current-top:24.4%;
      --current-width:15.0%;
      --current-height:8.0%;


      /* ================= UPDATED DATE ================= */

      --updated-left:42.0%;
      --updated-top:35.8%;
      --updated-width:14.0%;
      --updated-height:4.0%;


      /* ================= TARGET WEIGHT ================= */

      --target-left:41.5%;
      --target-top:51.2%;
      --target-width:15.0%;
      --target-height:8.0%;


      /* ================= REMAINING ================= */

      --remaining-left:42.0%;
      --remaining-top:63.2%;
      --remaining-width:14.0%;
      --remaining-height:4.0%;


      /* ================= LOST ================= */

      --lost-left:35.5%;
      --lost-top:75.8%;
      --lost-width:10.0%;
      --lost-height:4.5%;


      /* ================= START DATE ================= */

      --startdate-left:47.8%;
      --startdate-top:75.8%;
      --startdate-width:9.5%;

    }


    /* =========================================================
       TEMPLATE
    ========================================================= */

    .template{
      position:relative;
      z-index:1;

      display:block;

      width:100%;
      height:auto;

      margin:0;
      padding:0;

      border:0;

      user-select:none;

      pointer-events:none;
    }


    /* =========================================================
       PROFILE FRAME
    ========================================================= */

    .profile-frame{
      position:absolute;
      z-index:10;

      left:var(--profile-left);
      top:var(--profile-top);

      width:var(--profile-size);
      aspect-ratio:1 / 1;

      margin:0;
      padding:0;

      border-radius:50%;

      overflow:hidden;

      background:#dcecff;

      pointer-events:none;
    }


    .profile-photo{
      position:absolute;

      inset:0;

      display:block;

      width:100%;
      height:100%;

      margin:0;
      padding:0;

      border:0;
      border-radius:50%;

      object-fit:cover;
      object-position:50% 50%;

      background:#dcecff;
    }


    /* =========================================================
       DATA BOX
       ทุกข้อมูลจะอยู่กึ่งกลางกรอบเสมอ
    ========================================================= */

    .data-box{
      position:absolute;
      z-index:15;

      display:flex;

      align-items:center;
      justify-content:center;

      margin:0;
      padding:0;

      overflow:hidden;

      background:transparent;

      pointer-events:none;

      container-type:inline-size;
    }


    .data-value{
      display:flex;

      align-items:center;
      justify-content:center;

      width:100%;
      height:100%;

      margin:0;
      padding:0 2%;

      color:#06276c;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      font-weight:900;

      line-height:1;

      text-align:center;

      white-space:nowrap;

      font-variant-numeric:

      font-size:
        clamp(
          6px,
          11cqw,
          28px
        );
    }


    /* =========================================================
       LARGE VALUE
    ========================================================= */

    .data-weight{
      font-size:

          16cqw,
          44px
        );

    }


    /* =========================================================
       SMALL VALUE
    ========================================================= */

          6px,
          10cqw,

        );
    }

    ========================================================= */

    .red{
      color:#d20d0d;
    }

    .white{
      color:#fff;

      text-shadow:
        0 2px 4px

    }


    /* =========================================================
       DATA POSITIONS
    ========================================================= */

    .coin-box{
      left:var(--coin-left);
      top:var(--coin-top);

      width:var(--coin-width);
      height:var(--coin-height);
    }


    .energy-box{
      left:var(--energy-left);

      height:var(--energy-height);
    }


    .level-box{

      top:var(--level-top);

      width:var(--level-width);
      height:var(--level-height);
    }


    .exptext-box{
      left:var(--exptext-left);
      top:var(--exptext-top);

      height:var(--exptext-height);
    }


    .current-box{
      left:var(--current-left);
      top:var(--current-top);

      width:var(--current-width);
      height:var(--current-height);
    }


    .updated-box{
      left:var(--updated-left);
      top:var(--updated-top);

      width:var(--updated-width);
      height:var(--updated-height);
    }


    .target-box{
      left:var(--target-left);
      top:var(--target-top);

      width:var(--target-width);
      height:var(--target-height);
    }


    .remaining-box{
      left:var(--remaining-left);
      top:var(--remaining-top);

      width:var(--remaining-width);
      height:var(--remaining-height);
    }


    .lost-box{
      left:var(--lost-left);
      top:var(--lost-top);

      width:var(--lost-width);
      height:var(--lost-height);
    }


    .startdate-box{
      left:var(--startdate-left);
      top:var(--startdate-top);

      width:var(--startdate-width);
      height:var(--startdate-height);
    }


    /* =========================================================
       EXP BAR
    ========================================================= */

    .exp-track{
      position:absolute;
      z-index:15;

      left:var(--expbar-left);
      top:var(--expbar-top);

      width:var(--expbar-width);
      height:var(--expbar-height);

      overflow:hidden;

      border-radius:999px;

      background:#d7e5f6;

      pointer-events:none;
    }


    #expBar{
      width:0%;
      height:100%;

      border-radius:inherit;

      background:
        linear-gradient(
          90deg,
          #15a2ff,
          #0b52d1
        );

      transition:
        width .6s ease;
    }


    /* =========================================================
       HOTSPOT
    ========================================================= */

    .hotspot{
      position:absolute;
      z-index:30;

      margin:0;
      padding:0;

      border:0;

      outline:0;

      background:transparent;

      cursor:pointer;

      touch-action:manipulation;

      -webkit-tap-highlight-color:
        transparent;
    }


    .hotspot:active{
      background:
        rgba(
          255,
          255,
          255,
          .08
        );
    }


    /* =========================================================
       STATUS
    ========================================================= */

    #status{
      display:none;
    }


    #status.show{
      position:fixed;
      z-index:99999;

      left:50%;
      bottom:18px;

      transform:

      display:block;

      text-align:center;

    }


    #status.error{
      background:#c62828;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media(max-width:600px){

      .data-value{
        text-shadow:none;
      }

    }

  </style>

<script>

const ROCK =
  window.ROCK;


const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function goPage(
  pageName
){

  const url =
    ROCK?.CFG?.PAGE?.[
      pageName
    ];


  if(!url){
    return;
  }


  ROCK.go(url);
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
){

  const status =
    $("status");


  if(!status){
    return;
  }


  status.textContent =
    message;


  status.className =
    error
      ? "show error"
      : "show";
}


function hideStatus(){

  const status =
    $("status");


  if(status){
    status.className =
      "";
  }
}


/* =========================================================
   NUMBER
========================================================= */

function num(
  value,
  fallback = 0
){

  const n =
    Number(value);


  return Number.isFinite(n)
    ? n
    : fallback;
}


/* =========================================================
   DATE
========================================================= */

function formatDateOnly(
  value
){

  if(!value){
    return "--/--/----";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "--/--/----";
  }


  return date
    .toLocaleDateString(
      "th-TH",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeDashboard(
  raw
){

  raw =
    raw || {};


  const user =
    raw.user ||
    raw.player ||
    {};


  const weight =
    raw.weight &&
    typeof raw.weight ===
      "object"
      ? raw.weight
      : {};


  const energy =
    raw.energy &&
    typeof raw.energy ===
      "object"
      ? raw.energy
      : {};


  /* =====================================================
     EXP
  ====================================================== */

  let totalExp =
    raw.exp;


  if(
    totalExp &&
    typeof totalExp ===
      "object"
  ){

    totalExp =
      totalExp.total ??
      totalExp.current ??
      0;
  }


  totalExp =
    num(
      totalExp ??
      user.exp,
      0
    );


  /* =====================================================
     RETURN
  ====================================================== */

  return {

    picture:
      user.pictureUrl ??
      user.picture_url ??
      raw.pictureUrl ??
      raw.picture_url ??
      "",


    exp:
      totalExp,


    coin:
      num(
        raw.rockCoin ??
        raw.rock_coin ??
        user.rockCoin ??
        user.rock_coin,
        0
      ),


    energy:
      num(
        energy.current ??
        raw.energyCurrent ??
        user.energy,
        0
      ),


    maxEnergy:
      num(
        energy.max ??
        raw.maxEnergy ??
        user.max_energy ??
        user.maxEnergy,
        ROCK.CFG.MAX_ENERGY ||
        200
      ),


    currentWeight:
      weight.current ??
      weight.currentWeight ??
      weight.current_weight ??
      raw.currentWeight ??
      raw.current_weight ??
      user.currentWeight ??
      user.current_weight ??
      null,


    targetWeight:
      weight.target ??
      weight.targetWeight ??
      weight.target_weight ??
      raw.targetWeight ??
      raw.target_weight ??
      user.targetWeight ??
      user.target_weight ??
      null,


    startWeight:
      weight.start ??
      weight.startWeight ??
      weight.start_weight ??
      raw.startWeight ??
      raw.start_weight ??
      user.startWeight ??
      user.start_weight ??
      null,


    updatedAt:
      weight.updatedAt ??
      weight.updated_at ??
      weight.lastRecordedAt ??
      weight.last_recorded_at ??
      raw.weightUpdatedAt ??
      raw.weight_updated_at ??
      raw.updatedAt ??
      raw.updated_at ??
      user.weightUpdatedAt ??
      user.weight_updated_at ??
      user.updatedAt ??
      user.updated_at ??
      null,


    startDate:
      weight.startDate ??
      weight.start_date ??
      raw.startDate ??
      raw.start_date ??
      user.startDate ??
      user.start_date ??
      null

  };
}


/* =========================================================
   PROFILE
========================================================= */

function renderProfile(
  url
){

  const image =
    $("profileImage");


  if(!image){
    return;
  }


  if(!url){

    image.style.display =
      "none";

    return;
  }


  image.onload =
    function(){

      image.style.display =
        "block";
    };


  image.onerror =
    function(){

      image.style.display =
        "none";
    };


  image.src =
    url;
}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(
  raw
){

  const p =
    normalizeDashboard(
      raw
    );


  /* =====================================================
     PROFILE
  ====================================================== */

  renderProfile(
    p.picture
  );


  /* =====================================================
     COIN
  ====================================================== */

  $("coin").textContent =
    ROCK.fmtInt(
      p.coin
    );


  /* =====================================================
     ENERGY
  ====================================================== */

  $("energy").textContent =
    ROCK.fmtInt(
      p.energy
    ) +
    " / " +
    ROCK.fmtInt(
      p.maxEnergy
    );


  /* =====================================================
     LEVEL + EXP

     0 - 499      = Lv.1
     500 - 999    = Lv.2
     1000 - 1499  = Lv.3
  ====================================================== */

  const expPerLevel =
    num(
      ROCK.CFG.EXP_PER_LEVEL,
      500
    );


  const totalExp =
    Math.max(
      0,
      num(
        p.exp,
        0
      )
    );


  const level =
    Math.floor(
      totalExp /
      expPerLevel
    ) + 1;


  const expInLevel =
    totalExp %
    expPerLevel;


  const expPercent =
    expPerLevel > 0
      ? Math.max(
          0,
          Math.min(
            100,
            (
              expInLevel /
              expPerLevel
            ) *
            100
          )
        )
      : 0;


  $("level").textContent =
    "Lv." +
    level;


  $("expText").textContent =
    ROCK.fmtInt(
      expInLevel
    ) +
    " / " +
    ROCK.fmtInt(
      expPerLevel
    );


  $("expBar").style.width =
    expPercent +
    "%";


  /* =====================================================
     CURRENT WEIGHT
  ====================================================== */

  $("currentWeight")
    .textContent =
      ROCK.fmtWeight(
        p.currentWeight
      ) +
      " kg";


  /* =====================================================
     TARGET WEIGHT
  ====================================================== */

  $("targetWeight")
    .textContent =
      ROCK.fmtWeight(
        p.targetWeight
      ) +
      " kg";


  /* =====================================================
     DATES
  ====================================================== */

  $("updatedAt")
    .textContent =
      formatDateOnly(
        p.updatedAt
      );


  $("startDate")
    .textContent =
      formatDateOnly(
        p.startDate
      );


  /* =====================================================
     REMAINING
  ====================================================== */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  if(
    Number.isFinite(
      current
    ) &&
    Number.isFinite(
      target
    )
  ){

    $("remaining")
      .textContent =
        Math.max(
          0,
          current -
          target
        )
        .toFixed(1) +
        " kg";

  }else{

    $("remaining")
      .textContent =
        "--.- kg";
  }


  /* =====================================================
     LOST
  ====================================================== */

  const start =
    Number(
      p.startWeight
    );


  if(
    Number.isFinite(
      start
    ) &&
    Number.isFinite(
      current
    )
  ){

    $("lost")
      .textContent =
        Math.max(
          0,
          start -
          current
        )
        .toFixed(1) +
        " kg";

  }else{

    $("lost")
      .textContent =
        "--.- kg";
  }
}


/* =========================================================
   LOAD HOME
========================================================= */

let loading =
  false;


async function loadHome(){

  if(loading){
    return;
  }


  loading =
    true;


  try{

    const raw =
      await ROCK.fetchDashboard();


    console.log(
      "HOME DATA:",
      raw
    );


    renderHome(
      raw
    );


    hideStatus();


  }catch(error){

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  }finally{

    loading =
      false;
  }
}

(async()=>{

  try{

    if(!ROCK){

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );
    }


    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ok =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if(!ok){
      return;
    }


    await loadHome();


    setInterval(
      function(){

        if(
          document.visibilityState ===
          "visible"
        ){

          loadHome();
        }

      },
      num(
        ROCK.CFG.REFRESH_MS,
        30000
      )
    );


  }catch(error){

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();


/* =========================================================
   RETURN FROM OTHER PAGE
========================================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
        "visible" &&
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ){

      loadHome();
    }
  }
);


window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ){

      loadHome();
    }
  }
);

</script>
