<script>

/* =====================================================
   CONFIG
===================================================== */

const LIFF_ID =
  "2011201679-uNWz5yqF";


const PLAYER_API =
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";


const WEIGHT_URL =
  "weight-check.html";


const MISSION_URL =
  "mission.html";


const BATTLE_URL =
  "battle.html";


const EXP_PER_LEVEL =
  500;


const AUTO_REFRESH_MS =
  10000;


/* =====================================================
   STATE
===================================================== */

let refreshTimer =
  null;


let loading =
  false;


/* =====================================================
   ELEMENTS
===================================================== */

const profileImage =
  document.getElementById(
    "profileImage"
  );


const coinValue =
  document.getElementById(
    "coinValue"
  );


const energyValue =
  document.getElementById(
    "energyValue"
  );


const weightValue =
  document.getElementById(
    "weightValue"
  );


const targetValue =
  document.getElementById(
    "targetValue"
  );


const levelValue =
  document.getElementById(
    "levelValue"
  );


const expBar =
  document.getElementById(
    "expBar"
  );


const expText =
  document.getElementById(
    "expText"
  );


const statusBox =
  document.getElementById(
    "status"
  );


/* =====================================================
   HELPERS
===================================================== */

function toNumber(
  value,
  fallback = 0
) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function formatInteger(
  value
) {

  return Math
    .round(
      toNumber(value)
    )
    .toLocaleString(
      "en-US"
    );
}


function formatWeight(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "--";
  }

  const n =
    Number(value);

  if (
    !Number.isFinite(n)
  ) {

    return "--";
  }

  return n
    .toFixed(1);
}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  text,
  type = ""
) {

  statusBox.textContent =
    text;

  statusBox.className =
    "status show" +
    (
      type
        ? " " + type
        : ""
    );
}


function hideStatus() {

  statusBox.className =
    "status";
}


/* =====================================================
   API
===================================================== */

async function callPlayerAPI() {

  const idToken =
    liff.getIDToken();

  if (!idToken) {

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      PLAYER_API,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action:
              "dashboard",

            idToken:
              idToken
          })
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(
        text
      );

  } catch {

    throw new Error(
      "player-dashboard ตอบกลับไม่ถูกต้อง"
    );
  }


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.error ||
      "ไม่สามารถโหลดข้อมูลผู้เล่นได้"
    );
  }


  return data;
}


/* =====================================================
   NORMALIZE API RESPONSE
===================================================== */

function normalize(
  raw
) {

  const player =
    raw.player ??
    raw.user ??
    {};


  const weight =
    raw.weight ??
    {};


  const energyObject =
    (
      raw.energy &&
      typeof raw.energy ===
        "object"
    )
      ? raw.energy
      : {};


  let totalExp = 0;


  if (
    raw.exp &&
    typeof raw.exp ===
      "object"
  ) {

    totalExp =
      toNumber(
        raw.exp.current,
        0
      );

  } else {

    totalExp =
      toNumber(
        raw.exp ??
        player.exp,
        0
      );
  }


  const calculatedLevel =
    Math.floor(
      totalExp /
      EXP_PER_LEVEL
    ) + 1;


  return {

    pictureUrl:
      player.pictureUrl ??
      player.picture_url ??
      raw.pictureUrl ??
      "",


    coin:
      toNumber(
        raw.rockCoin ??
        player.rockCoin ??
        player.rock_coin,
        0
      ),


    energy:
      toNumber(
        energyObject.current ??
        player.energy ??
        raw.energyCurrent,
        0
      ),


    maxEnergy:
      toNumber(
        energyObject.max ??
        player.max_energy ??
        player.maxEnergy ??
        raw.maxEnergy,
        200
      ),


    weight:
      weight.current ??
      player.current_weight ??
      raw.currentWeight ??
      null,


    target:
      weight.target ??
      player.target_weight ??
      raw.targetWeight ??
      null,


    totalExp:
      totalExp,


    level:
      Math.max(
        calculatedLevel,
        toNumber(
          raw.level ??
          player.level,
          calculatedLevel
        )
      )
  };
}


/* =====================================================
   RENDER
===================================================== */

function renderHome(
  raw
) {

  const data =
    normalize(raw);


  /* PROFILE */

  if (
    data.pictureUrl
  ) {

    profileImage.src =
      data.pictureUrl;

    profileImage.style.display =
      "block";

  } else {

    profileImage.style.display =
      "none";
  }


  /* COIN */

  coinValue.textContent =
    formatInteger(
      data.coin
    );


  /* ENERGY */

  const safeMaxEnergy =
    Math.max(
      1,
      data.maxEnergy
    );


  const safeEnergy =
    Math.min(
      safeMaxEnergy,
      Math.max(
        0,
        data.energy
      )
    );


  energyValue.textContent =
    formatInteger(
      safeEnergy
    ) +
    "/" +
    formatInteger(
      safeMaxEnergy
    );


  /* WEIGHT */

  weightValue.textContent =
    formatWeight(
      data.weight
    );


  /* TARGET */

  targetValue.textContent =
    formatWeight(
      data.target
    );


  /* LEVEL */

  levelValue.textContent =
    String(
      data.level
    );


  /* EXP */

  const expCurrentLevel =
    data.totalExp %
    EXP_PER_LEVEL;


  const expPercent =
    (
      expCurrentLevel /
      EXP_PER_LEVEL
    ) * 100;


  expBar.style.width =
    Math.max(
      0,
      Math.min(
        100,
        expPercent
      )
    ) +
    "%";


  expText.textContent =
    formatInteger(
      expCurrentLevel
    ) +
    " / " +
    formatInteger(
      EXP_PER_LEVEL
    );
}


/* =====================================================
   LOAD HOME
===================================================== */

async function loadHome(
  showLoading = false
) {

  if (loading) {
    return;
  }


  loading =
    true;


  if (
    showLoading
  ) {

    showStatus(
      "กำลังโหลดข้อมูล..."
    );
  }


  try {

    const data =
      await callPlayerAPI();


    renderHome(
      data
    );


    hideStatus();


  } catch (error) {

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    showStatus(
      error.message ||
      "ไม่สามารถโหลดข้อมูลได้",
      "error"
    );


  } finally {

    loading =
      false;
  }
}

   NAVIGATION
===================================================== */

  window.location.href =

}

/* HOME */

/* MISSION */

/* PROFILE */

document

/* =====================================================
   AUTO REFRESH
===================================================== */

function startRefresh() {

  if (
    refreshTimer
  ) {

    clearInterval(
      refreshTimer
    );
  }


  refreshTimer =
    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadHome(
            false
          );
        }

      },
      AUTO_REFRESH_MS
    );
}


/* =====================================================
   PAGE RETURN
===================================================== */

document
  .addEventListener(
    "visibilitychange",
    function () {

      if (
        document.visibilityState ===
          "visible" &&
        typeof liff !==
          "undefined" &&
        liff.isLoggedIn()
      ) {

        loadHome(
          false
        );
      }
    }
  );


window
  .addEventListener(
    "pageshow",
    function () {

      if (
        typeof liff !==
          "undefined" &&
        liff.isLoggedIn()
      ) {

        loadHome(
          false
        );
      }
    }
  );


/* =====================================================
   LIFF
===================================================== */

async function initLIFF() {

  showStatus(
    "กำลังเชื่อมต่อ LINE..."
  );


  try {

    await liff.init({
      liffId:
        LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    if (
      !liff.getIDToken()
    ) {

      throw new Error(
        "ไม่พบ LINE ID Token"
      );
    }


    await loadHome(
      true
    );


    startRefresh();


  } catch (error) {

    console.error(
      "LIFF INIT ERROR:",
      error
    );


    showStatus(
      "เชื่อมต่อ LINE ไม่สำเร็จ: " +
      (
        error.message ||
        error
      ),
      "error"
    );
  }
}


/* =====================================================
   START
===================================================== */

initLIFF();

</script>
