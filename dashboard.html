    let inbodyHistory = [];


    function fmtInbodyDate(value){

      if(!value){
        return "--/--/----";
      }

      const d =
        new Date(
          value
        );

      if(
        Number.isNaN(
          d.getTime()
        )
      ){
        return "--/--/----";
      }

      return d.toLocaleDateString(
        "th-TH",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function normalizeInbodyHistory(raw){

      const data =
        raw?.data ??
        raw ??
        {};


      const list =
        data?.inbodyHistory ??
        data?.inbody_history ??
        data?.inbody?.history ??
        [];


      if(
        !Array.isArray(
          list
        )
      ){
        return [];
      }


      return list
        .map(
          item => ({

            score:
              Number(
                item?.score ??
                item?.inbody_score ??
                item?.inbodyScore
              ),

            measuredAt:
              item?.measuredAt ??
              item?.measured_at ??
              item?.date ??
              null,

            fileUrl:
              item?.fileUrl ??
              item?.file_url ??
              ""

          })
        )
        .filter(
          item =>
            Number.isFinite(
              item.score
            ) &&
            item.measuredAt
        )
        .sort(
          (a,b) =>
            new Date(
              a.measuredAt
            ) -
            new Date(
              b.measuredAt
            )
        );

    }


    function drawInbodyChart(
      history
    ){

      const svg =
        $("inbodyChart");

      const empty =
        $("inbodyEmpty");


      if(
        !svg ||
        !empty
      ){
        return;
      }


      svg.innerHTML =
        "";


      if(
        !Array.isArray(
          history
        ) ||
        history.length === 0
      ){

        empty.style.display =
          "flex";

        return;
      }


      empty.style.display =
        "none";


      /*
       * แสดง 7 ครั้งล่าสุด
       */
      const points =
        history.slice(
          -7
        );


      const scores =
        points.map(
          item =>
            Number(
              item.score
            )
        );


      let min =
        Math.min(
          ...scores
        );

      let max =
        Math.max(
          ...scores
        );


      if(
        max === min
      ){

        max += 5;
        min -= 5;

      }else{

        const pad =
          Math.max(
            2,
            (
              max - min
            ) * .15
          );

        max += pad;
        min -= pad;

      }


      const W = 220;
      const H = 80;

      const left = 8;
      const right = 8;
      const top = 8;
      const bottom = 8;


      /*
       * GRID
       */
      for(
        let i = 1;
        i <= 2;
        i++
      ){

        const y =
          top +
          (
            (
              H -
              top -
              bottom
            ) /
            3
          ) *
          i;


        const line =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );


        line.setAttribute(
          "x1",
          left
        );

        line.setAttribute(
          "x2",
          W - right
        );

        line.setAttribute(
          "y1",
          y
        );

        line.setAttribute(
          "y2",
          y
        );

        line.setAttribute(
          "class",
          "inbody-chart-grid"
        );


        svg.appendChild(
          line
        );

      }


      const xy =
        points.map(
          (
            item,
            index
          ) => {

            const x =
              points.length === 1
                ? W / 2
                : left +
                  (
                    index /
                    (
                      points.length -
                      1
                    )
                  ) *
                  (
                    W -
                    left -
                    right
                  );


            const ratio =
              (
                Number(
                  item.score
                ) -
                min
              ) /
              (
                max -
                min
              );


            const y =
              H -
              bottom -
              ratio *
              (
                H -
                top -
                bottom
              );


            return {
              x,
              y,
              score:
                Number(
                  item.score
                )
            };

          }
        );


      const polyline =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polyline"
        );


      polyline.setAttribute(
        "points",
        xy
          .map(
            p =>
              `${p.x},${p.y}`
          )
          .join(" ")
      );


      polyline.setAttribute(
        "class",
        "inbody-chart-line"
      );


      svg.appendChild(
        polyline
      );


      xy.forEach(
        p => {

          const circle =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle"
            );


          circle.setAttribute(
            "cx",
            p.x
          );

          circle.setAttribute(
            "cy",
            p.y
          );

          circle.setAttribute(
            "r",
            4
          );

          circle.setAttribute(
            "class",
            "inbody-chart-dot"
          );


          const title =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "title"
            );


          title.textContent =
            `${p.score} คะแนน`;


          circle.appendChild(
            title
          );


          svg.appendChild(
            circle
          );

        }
      );

    }


    function renderInbody(
      raw
    ){

      const history =
        normalizeInbodyHistory(
          raw
        );


      inbodyHistory =
        history;


      const latest =
        history.length
          ? history[
              history.length - 1
            ]
          : null;


      $("inbodyScore")
        .textContent =
          latest
            ? fmtInt(
                latest.score
              )
            : "--";


      $("inbodyDate")
        .textContent =
          latest
            ? (
                "ล่าสุด " +
                fmtInbodyDate(
                  latest.measuredAt
                )
              )
            : "ยังไม่มีข้อมูล";


      drawInbodyChart(
        history
      );

    }


    function openInbodyModal(){

      const modal =
        $("inbodyModal");


      if(!modal){
        return;
      }


      const today =
        new Date();


      const y =
        today.getFullYear();

      const m =
        String(
          today.getMonth() + 1
        )
          .padStart(
            2,
            "0"
          );

      const d =
        String(
          today.getDate()

      $("inbodyScoreInput")

      $("inbodyFileInput")

      $("inbodyFileName")

    }


    function closeInbodyModal(){

        ?.classList

        );

    }



    async function fetchInbodyHistory(){

      const api =
        window.APP_CONFIG
          ?.API
          ?.INBODY;


      if(!api){

        console.warn(
          "ไม่พบ API.INBODY"
        );

        return {
          success: true,
          inbodyHistory: []
        };

      }


      const response =
        await fetch(
          api,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                action: "list",
                idToken:
                  getIdToken()
              })
          }
        );


      const rawText =
        await response.text();


      let result =
        {};


      try{

        result =
          rawText
            ? JSON.parse(
                rawText
              )
            : {};

      }catch{

        throw new Error(
          "InBody API ตอบกลับไม่ใช่ JSON"
        );

      }


      if(
        !response.ok ||
        result?.success === false
      ){

        throw new Error(
          result?.error ||
          result?.message ||
          `InBody HTTP ${response.status}`
        );

      }


      return result;

    }


    async function loadInbodyHistory(){

      try{

        const result =
          await fetchInbodyHistory();


        renderInbody(
          result
        );


      }catch(error){

        console.error(
          "INBODY HISTORY ERROR:",
          error
        );


        /*
         * InBody โหลดไม่ได้
         * ไม่ทำให้ HOME ทั้งหน้าล้ม
         */
        renderInbody({
          inbodyHistory: []
        });

      }

    }


    async function saveInbody(){

      const measuredDate =
        $("inbodyMeasuredDate")
          ?.value;


      const score =
        Number(
          $("inbodyScoreInput")
            ?.value
        );


      const file =
        $("inbodyFileInput")
          ?.files
          ?.[0];


      if(!measuredDate){

        showStatus(
          "กรุณาเลือกวันที่ตรวจ",
          true
        );

        return;

      }


      if(
        !Number.isFinite(
          score
        ) ||
        score < 0 ||
        score > 150
      ){

        showStatus(
          "กรุณากรอก InBody Score 0-150",
          true
        );

        return;

      }


      if(!file){

        showStatus(
          "กรุณาเลือกไฟล์ผล InBody",
          true
        );

        return;

      }


      const api =
        window.APP_CONFIG
          ?.API
          ?.INBODY;


      if(!api){

        showStatus(
          "ยังไม่ได้ตั้งค่า API.INBODY ใน app-config.js",
          true
        );

        return;

      }


      const saveButton =
        $("inbodySave");


      try{

        saveButton.disabled =
          true;


        showStatus(
          "กำลังอัปโหลดผล InBody..."
        );


        const idToken =
          getIdToken();


        const form =
          new FormData();


        form.append(
          "action",
          "upload"
        );


        form.append(
          "idToken",
          idToken
        );


        form.append(
          "score",
          String(
            score
          )
        );


        form.append(
          "measuredDate",
          measuredDate
        );


        form.append(
          "file",
          file
        );


        const response =
          await fetch(
            api,
            {
              method: "POST",
              body: form
            }
          );


        const rawText =
          await response.text();


        let result =
          {};


        try{

          result =
            rawText
              ? JSON.parse(
                  rawText
                )
              : {};

        }catch{

          throw new Error(
            "InBody API ตอบกลับไม่ใช่ JSON"
          );

        }


        if(
          !response.ok ||
          result?.success === false
        ){

          throw new Error(
            result?.error ||
            result?.message ||
            `InBody HTTP ${response.status}`
          );

        }


        closeInbodyModal();


        showStatus(
          "บันทึกผล InBody สำเร็จ"
        );


        /*
         * โหลดประวัติ InBody ใหม่
         * เพื่อให้คะแนนและกราฟเปลี่ยนทันที
         */
        await loadInbodyHistory();


        setTimeout(
          hideStatus,
          1800
        );


      }catch(error){

        console.error(
          "INBODY SAVE ERROR:",
          error
        );


        showStatus(
          error?.message ||
          "อัปโหลด InBody ไม่สำเร็จ",
          true
        );


      }finally{

        saveButton.disabled =
          false;

      }

    }

  <script>

    /* =====================================================
       BASIC HELPERS
    ====================================================== */

    const $ = (id) =>
      document.getElementById(id);


    let loading = false;

    let refreshTimer = null;


    /* =====================================================
       STATUS
    ====================================================== */

    function showStatus(
      message,
      error = false
    ){

      const el =
        $("status");

      if(!el){
        return;
      }

      el.textContent =
        message;

      el.className =
        error
          ? "show error"
          : "show";

    }


    function hideStatus(){

      const el =
        $("status");

      if(el){

        el.className = "";

      }

    }


    /* =====================================================
       NUMBER FORMAT
    ====================================================== */

    function fmtInt(value){

      const n =
        Number(value);

      return Number.isFinite(n)
        ? Math.round(n)
            .toLocaleString("en-US")
        : "0";

    }


    /* =====================================================
       WEIGHT FORMAT
    ====================================================== */

    function fmtWeight(value){

      if(
        value === null ||
        value === undefined ||
        value === ""
      ){

        return "--.-";

      }

      const n =
        Number(value);

      return Number.isFinite(n)
        ? n.toFixed(1)
        : "--.-";

    }


    /* =====================================================
       DATE FORMAT
    ====================================================== */

    function fmtDate(value){

      if(!value){

        return "--/--/----";

      }

      const date =
        new Date(value);

      if(
        Number.isNaN(
          date.getTime()
        )
      ){

        return "--/--/----";

      }

      return date.toLocaleDateString(
        "th-TH",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    /* =====================================================
       GET LIFF ID
    ====================================================== */

    function getLiffId(){

      const id =
        window.APP_CONFIG?.LIFF_ID;

      if(!id){

        throw new Error(
          "ไม่พบ LIFF_ID ใน app-config.js"
        );

      }

      return id;

    }


    /* =====================================================
       INIT LINE
    ====================================================== */

    async function initLINE(){

      if(
        typeof liff === "undefined"
      ){

        throw new Error(
          "LINE LIFF SDK ไม่พร้อม"
        );

      }


      const liffId =
        getLiffId();


      /*
       * สำคัญ:
       * ไม่ใช้ ROCK.initLINE
       * ไม่ใช้ ROCK.initLiff
       */

      await liff.init({
        liffId
      });


      if(
        !liff.isLoggedIn()
      ){

        liff.login({
          redirectUri:
            window.location.href
        });

        return false;

      }


      return true;

    }


    /* =====================================================
       GET LINE ID TOKEN
    ====================================================== */

    function getIdToken(){

      if(
        typeof liff === "undefined"
      ){

        throw new Error(
          "LINE LIFF SDK ไม่พร้อม"
        );

      }


      if(
        !liff.isLoggedIn()
      ){

        throw new Error(
          "LINE ยังไม่ได้ Login"
        );

      }


      const token =
        liff.getIDToken();


      if(!token){

        throw new Error(
          "ไม่พบ LINE ID Token"
        );

      }


      return token;

    }


    /* =====================================================
       FETCH DASHBOARD
    ====================================================== */

    async function fetchDashboard(){

      const api =
        window.APP_CONFIG
          ?.API
          ?.DASHBOARD;


      if(!api){

        throw new Error(
          "ไม่พบ Dashboard API ใน app-config.js"
        );

      }


      const idToken =
        getIdToken();


      /*
       * ส่งให้ player-dashboard
       *
       * action = dashboard
       * idToken = LINE ID Token
       */

      const response =
        await fetch(
          api,
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                action:
                  "dashboard",

                idToken

              })

          }
        );


      const rawText =
        await response.text();


      let data = {};


      try{

        data =
          rawText
            ? JSON.parse(rawText)
            : {};

      }catch(error){

        throw new Error(
          "Dashboard API ตอบกลับไม่ใช่ JSON"
        );

      }


      if(
        !response.ok
      ){

        throw new Error(
          data?.error ||
          data?.message ||
          `Dashboard HTTP ${response.status}`
        );

      }


      if(
        data?.success === false ||
        data?.ok === false
      ){

        throw new Error(
          data?.error ||
          data?.message ||
          "โหลดข้อมูล Dashboard ไม่สำเร็จ"
        );

      }


      console.log(
        "DASHBOARD API RESPONSE:",
        data
      );


      return data;

    }


    /* =====================================================
       NORMALIZE DASHBOARD
    ====================================================== */

    function normalizeDashboard(raw){

      const data =
        raw?.data ??
        raw?.dashboard ??
        raw ??
        {};


      const user =
        data?.user ??
        data?.player ??
        {};


      const weight =
        data?.weight &&
        typeof data.weight === "object"
          ? data.weight
          : {};


      const energy =
        data?.energy &&
        typeof data.energy === "object"
          ? data.energy
          : {};


      /* =================================================
         COIN
      ================================================= */

      const coin =
        Number(
          data?.rockCoin ??
          data?.rock_coin ??
          data?.coin ??
          user?.rockCoin ??
          user?.rock_coin ??
          user?.coin ??
          0
        );


      /* =================================================
         ENERGY
      ================================================= */

      const currentEnergy =
        Number(
          energy?.current ??
          data?.energyCurrent ??
          data?.currentEnergy ??
          data?.current_energy ??
          user?.energy ??
          (
            typeof data?.energy === "number"
              ? data.energy
              : 0
          )
        );


      const maxEnergy =
        Number(
          energy?.max ??
          data?.maxEnergy ??
          data?.max_energy ??
          user?.maxEnergy ??
          user?.max_energy ??
          window.APP_CONFIG?.MAX_ENERGY ??
          200
        );


      /* =================================================
         WEIGHT
      ================================================= */

      const currentWeight =
        weight?.current ??
        weight?.currentWeight ??
        weight?.current_weight ??
        data?.currentWeight ??
        data?.current_weight ??
        user?.currentWeight ??
        user?.current_weight ??
        null;


      const targetWeight =
        weight?.target ??
        weight?.targetWeight ??
        weight?.target_weight ??
        data?.targetWeight ??
        data?.target_weight ??
        user?.targetWeight ??
        user?.target_weight ??
        null;


      const startWeight =
        weight?.start ??
        weight?.startWeight ??
        weight?.start_weight ??
        data?.startWeight ??
        data?.start_weight ??
        user?.startWeight ??
        user?.start_weight ??
        null;


      const updatedAt =
        weight?.updatedAt ??
        weight?.updated_at ??
        weight?.lastRecordedAt ??
        weight?.last_recorded_at ??
        data?.weightUpdatedAt ??
        data?.weight_updated_at ??
        data?.updatedAt ??
        data?.updated_at ??
        null;


      const startDate =
        weight?.startDate ??
        weight?.start_date ??
        data?.startDate ??
        data?.start_date ??
        null;


      /* =================================================
         EXP
      ================================================= */

      const expObject =
        data?.exp &&
        typeof data.exp === "object"
          ? data.exp
          : {};


      const totalExp =
        Number(
          expObject?.total ??
          expObject?.current ??
          data?.exp ??
          user?.exp ??
          user?.experience ??
          0
        );


      /* =================================================
         LEVEL
      ================================================= */

      const expPerLevel =
        Number(
          window.APP_CONFIG
            ?.EXP_PER_LEVEL ??
          500
        ) || 500;


      const level =
        Number(
          data?.level ??
          user?.level ??
          (
            Math.floor(
              totalExp /
              expPerLevel
            ) + 1
          )
        ) || 1;


      /* =================================================
         PROFILE
      ================================================= */

      const picture =
        user?.pictureUrl ??
        user?.picture_url ??
        data?.pictureUrl ??
        data?.picture_url ??
        "";


      return {

        coin:
          Number.isFinite(coin)
            ? coin
            : 0,

        energy:
          Number.isFinite(currentEnergy)
            ? currentEnergy
            : 0,

        maxEnergy:
          Number.isFinite(maxEnergy)
            ? maxEnergy
            : 200,

        currentWeight,

        targetWeight,

        startWeight,

        updatedAt,

        startDate,

        totalExp:
          Number.isFinite(totalExp)
            ? totalExp
            : 0,

        expPerLevel,

        level,

        picture

      };

    }


    /* =====================================================
       PROFILE
    ====================================================== */

    function renderProfile(
      url
    ){

      const image =
        $("profileImage");


      if(!image){
        return;
      }


      if(!url){

        image.removeAttribute(
          "src"
        );

        image.style.display =
          "none";

        return;

      }


      image.onload =
        () => {

          image.style.display =
            "block";

        };


      image.onerror =
        () => {

          image.style.display =
            "none";

        };


      image.src =
        url;

    }


    /* =====================================================
       GET LINE PROFILE FALLBACK
    ====================================================== */

    async function getLineProfile(){

      try{

        if(
          typeof liff === "undefined"
        ){

          return null;

        }


        if(
          !liff.isLoggedIn()
        ){

          return null;

        }


        const profile =
          await liff.getProfile();


        return profile || null;

      }catch(error){

        console.warn(
          "LINE PROFILE ERROR:",
          error
        );

        return null;

      }

    }


    /* =====================================================
       RENDER HOME
    ====================================================== */

    async function renderHome(
      raw
    ){

      console.log(
        "HOME RAW:",
        raw
      );


      const p =
        normalizeDashboard(
          raw
        );


      console.log(
        "HOME NORMALIZED:",
        p
      );


      /* ================================================
         PROFILE
      ================================================= */

      let picture =
        p.picture;


      if(!picture){

        const profile =
          await getLineProfile();


        picture =
          profile?.pictureUrl ||
          "";

      }


      renderProfile(
        picture
      );


      /* ================================================
         COIN
      ================================================= */

      $("coin").textContent =
        fmtInt(
          p.coin
        );


      /* ================================================
         ENERGY
      ================================================= */

      $("energy").textContent =
        fmtInt(
          p.energy
        ) +
        " / " +
        fmtInt(
          p.maxEnergy
        );


      /* ================================================
         LEVEL
      ================================================= */

      $("level").textContent =
        "Lv." +
        fmtInt(
          p.level
        );


      /* ================================================
         EXP
      ================================================= */

      const exp =
        Math.max(
          0,
          p.totalExp
        );


      const expPerLevel =
        Math.max(
          1,
          p.expPerLevel
        );


      const expInLevel =
        exp %
        expPerLevel;


      const expPercent =
        Math.max(
          0,
          Math.min(
            100,
            (
              expInLevel /
              expPerLevel
            ) * 100
          )
        );


      $("expText").textContent =
        fmtInt(
          expInLevel
        ) +
        " / " +
        fmtInt(
          expPerLevel
        );


      $("expBar").style.width =
        expPercent +
        "%";


      /* ================================================
         CURRENT WEIGHT
      ================================================= */

      $("currentWeight").textContent =
        fmtWeight(
          p.currentWeight
        ) +
        " kg";


      /* ================================================
         TARGET WEIGHT
      ================================================= */

      $("targetWeight").textContent =
        fmtWeight(
          p.targetWeight
        ) +
        " kg";


      /* ================================================
         UPDATED
      ================================================= */

      $("updatedAt").textContent =
        fmtDate(
          p.updatedAt
        );


      /* ================================================
         REMAINING
      ================================================= */

      const current =
        Number(
          p.currentWeight
        );


      const target =
        Number(
          p.targetWeight
        );


      if(
        Number.isFinite(current) &&
        Number.isFinite(target)
      ){

        $("remaining").textContent =
          Math.max(
            0,
            current - target
          ).toFixed(1);

      }else{

        $("remaining").textContent =
          "--.-";

      }


      /* ================================================
         LOST
      ================================================= */

      const start =
        Number(
          p.startWeight
        );


      if(
        Number.isFinite(start) &&
        Number.isFinite(current)
      ){

        $("lost").textContent =
          Math.max(
            0,
            start - current
          ).toFixed(1) +
          " kg";

      }else{

        $("lost").textContent =
          "--.- kg";

      }


      /* ================================================
         START DATE
      ================================================= */

      $("startDate").textContent =
        fmtDate(
          p.startDate
        );

    }


    /* =====================================================
       LOAD HOME
    ====================================================== */

    async function loadHome(){

      if(loading){

        return;

      }


      loading = true;


      try{

        const raw =
          await fetchDashboard();


        await renderHome(
          raw
        );


        await loadInbodyHistory();


        hideStatus();


      }catch(error){

        console.error(
          "HOME LOAD ERROR:",
          error
        );


        showStatus(
          error?.message ||
          "โหลดข้อมูลไม่สำเร็จ",
          true
        );

      }finally{

        loading = false;

      }

    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    function goPage(
      name
    ){

      const page =
        window.APP_CONFIG
          ?.PAGE
          ?.[
            name
          ];


      if(!page){

        showStatus(
          "ไม่พบหน้า " + name,
          true
        );

        return;

      }


      window.location.href =
        page;

    }


    /* =====================================================
       BUTTON EVENTS
    ====================================================== */

    $("weightButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "WEIGHT"
          );

        }
      );


    $("progressButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "PROGRESS"
          );

        }
      );


    $("rankingButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "RANKING"
          );

        }
      );


    $("rewardsButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "REWARDS"
          );

        }
      );


    $("homeButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "HOME"
          );

        }
      );


    $("missionButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "MISSION"
          );

        }
      );


    $("battleButton")
      .addEventListener(
        "click",
        () => {

          goPage(
            "BATTLE"
          );

        }
      );


    /* =====================================================
       START APP
    ====================================================== */

    async function startApp(){

      try{

        showStatus(
          "กำลังเชื่อมต่อ LINE..."
        );


        /*
         * สำคัญมาก
         *
         * ไม่เรียก:
         * ROCK.initLINE()
         * ROCK.initLiff()
         * ROCK.fetchDashboard()
         *
         * ใช้ LIFF โดยตรง
         */

        const ready =
          await initLINE();


        if(
          ready === false
        ){

          return;

        }


        await loadHome();


        /* ===============================================
           AUTO REFRESH
        ============================================== */

        if(refreshTimer){

          clearInterval(
            refreshTimer
          );

        }


        const refreshMs =
          Number(
            window.APP_CONFIG
              ?.REFRESH_MS ??
            30000
          );


        refreshTimer =
          setInterval(
            async () => {

              if(
                document.visibilityState !==
                "visible"
              ){

                return;

              }


              await loadHome();

            },
            refreshMs
          );


      }catch(error){

        console.error(
          "START APP ERROR:",
          error
        );


        showStatus(
          error?.message ||
          "ไม่สามารถเข้าสู่ระบบได้",
          true
        );

      }

    }


    /* =====================================================
       REFRESH WHEN RETURN TO PAGE
    ====================================================== */

    document.addEventListener(
      "visibilitychange",
      async () => {

        if(
          document.visibilityState !==
          "visible"
        ){

          return;

        }


        try{

          /*
           * ถ้า LIFF ถูก initialize แล้ว
           * ไม่ต้อง init ซ้ำ
           */

          if(
            typeof liff !== "undefined" &&
            liff.isLoggedIn()
          ){

            await loadHome();

          }

        }catch(error){

          console.error(
            "VISIBILITY ERROR:",
            error
          );

        }

      }
    );


    /* =====================================================
       PAGESHOW
    ====================================================== */

    window.addEventListener(
      "pageshow",
      async () => {

        try{

          if(
            typeof liff !== "undefined" &&
            liff.isLoggedIn()
          ){

            await loadHome();

          }

        }catch(error){

          console.error(
            "PAGESHOW ERROR:",
            error
          );

        }

      }
    );


    /* =====================================================
       RUN
    ====================================================== */

    startApp();

  </script>
