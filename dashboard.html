<script>

/* =========================================================
   HELPERS
========================================================= */

function el(id) {
  return document.getElementById(id);
}


function setText(id, value) {

  const node = el(id);

  if (!node) return;

  node.textContent = value;
}


function numberValue(value, fallback = 0) {

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function formatInteger(value) {

  return Math.round(
    numberValue(value, 0)
  ).toLocaleString("en-US");
}


function formatWeight(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "--.-";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "--.-";
  }

  return n.toFixed(1);
}


function formatDate(value) {

  if (!value) {
    return "--/--/----";
  }

  const date = new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "--/--/----";
  }

  return date.toLocaleDateString(
    "th-TH",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );
}


function percent(value, max) {

  const v =
    numberValue(value, 0);

  const m =
    numberValue(max, 0);

  if (m <= 0) {
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      (v / m) * 100
    )
  );
}



/* =========================================================
   PAGE NAVIGATION
========================================================= */

function goPage(name) {

  const pages =
    window.ROCK?.CFG?.PAGE ||
    window.APP_CONFIG?.PAGE ||
    {};

  const fallback = {

    HOME:
      "./dashboard.html",

    WEIGHT:
      "./weight-check.html",

    PROGRESS:
      "./progress.html",

    RANKING:
      "./ranking.html",

    REWARDS:
      "./rewards.html",

    MISSION:
      "./mission.html",

    BATTLE:
      "./battle.html"

  };


  const url =
    pages[name] ||
    fallback[name];


  if (url) {
    window.location.href = url;
  }
}



/* =========================================================
   NORMALIZE DASHBOARD DATA
========================================================= */

function normalizeDashboard(raw) {

  raw = raw || {};


  const sourcePlayer =
    raw.player ||
    raw.user ||
    {};


  const sourceWeight =
    raw.weight ||
    {};


  const sourceEnergy =
    raw.energy &&
    typeof raw.energy === "object"
      ? raw.energy
      : {};


  /* -------------------------
     EXP
  ------------------------- */

  let exp =
    raw.exp ??
    sourcePlayer.exp ??
    0;


  if (
    exp &&
    typeof exp === "object"
  ) {

    exp =
      exp.current ??
      exp.total ??
      0;
  }


  exp =
    numberValue(
      exp,
      0
    );


  /* -------------------------
     EXP PER LEVEL
  ------------------------- */

  const expPerLevel =
    numberValue(
      sourcePlayer.expPerLevel ??
      sourcePlayer.exp_per_level ??
      raw.expPerLevel ??
      window.ROCK?.CFG?.EXP_PER_LEVEL ??
      window.APP_CONFIG?.EXP_PER_LEVEL ??
      500,
      500
    );


  /* -------------------------
     LEVEL
  ------------------------- */

  const calculatedLevel =
    Math.floor(
      exp /
      expPerLevel
    ) + 1;


  const level =
    Math.max(
      calculatedLevel,
      numberValue(
        raw.level ??
        sourcePlayer.level,
        calculatedLevel
      )
    );


  /* -------------------------
     CURRENT WEIGHT
  ------------------------- */

  const currentWeight =
    sourceWeight.current ??
    sourceWeight.currentWeight ??
    sourcePlayer.current_weight ??
    sourcePlayer.currentWeight ??
    raw.currentWeight ??
    null;


  /* -------------------------
     TARGET WEIGHT
  ------------------------- */

  const targetWeight =
    sourceWeight.target ??
    sourceWeight.targetWeight ??
    sourcePlayer.target_weight ??
    sourcePlayer.targetWeight ??
    raw.targetWeight ??
    null;


  /* -------------------------
     START WEIGHT
  ------------------------- */

  const startWeight =
    sourceWeight.start ??
    sourceWeight.startWeight ??
    sourcePlayer.start_weight ??
    sourcePlayer.startWeight ??
    raw.startWeight ??
    null;


  /* -------------------------
     DATES
  ------------------------- */

  const startDate =
    sourceWeight.startDate ??
    sourceWeight.start_date ??
    sourcePlayer.start_date ??
    sourcePlayer.startDate ??
    raw.startDate ??
    null;


  const updatedAt =
    sourceWeight.updatedAt ??
    sourceWeight.updated_at ??
    sourcePlayer.weight_updated_at ??
    sourcePlayer.weightUpdatedAt ??
    sourcePlayer.updated_at ??
    raw.weightUpdatedAt ??
    null;


  return {

    picture:
      sourcePlayer.pictureUrl ??
      sourcePlayer.picture_url ??
      raw.pictureUrl ??
      "",

    coin:
      numberValue(
        raw.rockCoin ??
        raw.rock_coin ??
        sourcePlayer.rockCoin ??
        sourcePlayer.rock_coin,
        0
      ),

    energy:
      numberValue(
        sourceEnergy.current ??
        raw.energyCurrent ??
        sourcePlayer.energy,
        0
      ),

    maxEnergy:
      numberValue(
        sourceEnergy.max ??
        raw.maxEnergy ??
        sourcePlayer.max_energy ??
        sourcePlayer.maxEnergy,
        200
      ),

    exp,

    expPerLevel,

    level,

    currentWeight,

    targetWeight,

    startWeight,

    startDate,

    updatedAt
  };
}



/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(raw) {

  const p =
    normalizeDashboard(raw);


  /* =====================================================
     COIN
  ====================================================== */

  setText(
    "coin",
    formatInteger(
      p.coin
    )
  );


  /* =====================================================
     ENERGY
  ====================================================== */

  setText(
    "energy",
    formatInteger(
      p.energy
    ) +
    " / " +
    formatInteger(
      p.maxEnergy
    )
  );


  /* =====================================================
     PROFILE IMAGE
  ====================================================== */

  const profile =
    el("profileImage");


  if (
    profile &&
    p.picture
  ) {

    profile.src =
      p.picture;

    profile.style.display =
      "block";
  }


  /* =====================================================
     LEVEL
  ====================================================== */

  setText(
    "level",
    "Lv." +
    formatInteger(
      p.level
    )
  );


  /* =====================================================
     EXP
  ====================================================== */

  const expInLevel =
    p.exp %
    p.expPerLevel;


  setText(
    "expText",

    formatInteger(
      expInLevel
    ) +
    " / " +
    formatInteger(
      p.expPerLevel
    )
  );


  const expBar =
    el("expBar");


  if (expBar) {

    expBar.style.width =
      percent(
        expInLevel,
        p.expPerLevel
      ) + "%";
  }


  /* =====================================================
     CURRENT WEIGHT
  ====================================================== */

  setText(
    "currentWeight",
    formatWeight(
      p.currentWeight
    )
  );


  /* =====================================================
     UPDATED DATE
  ====================================================== */

  setText(
    "updatedAt",
    formatDate(
      p.updatedAt
    )
  );


  /* =====================================================
     TARGET WEIGHT
  ====================================================== */

  setText(
    "targetWeight",
    formatWeight(
      p.targetWeight
    )
  );


  /* =====================================================
     REMAINING
  ====================================================== */

  const current =
    Number(
      p.currentWeight
    );


  const target =
    Number(
      p.targetWeight
    );


  let remainingText =
    "--.- kg";


  if (
    Number.isFinite(current) &&
    Number.isFinite(target)
  ) {

    /*
      รองรับทั้งเป้าหมายลดน้ำหนัก
      และเพิ่มน้ำหนัก
    */

    const remaining =
      Math.abs(
        current -
        target
      );


    remainingText =
      remaining.toFixed(1) +
      " kg";
  }


  setText(
    "remaining",
    remainingText
  );


  /* =====================================================
     LOST / CHANGE
  ====================================================== */

  const start =
    Number(
      p.startWeight
    );


  let lostText =
    "--.- kg";


  if (
    Number.isFinite(start) &&
    Number.isFinite(current)
  ) {

    const change =
      start -
      current;


    lostText =
      Math.abs(change)
        .toFixed(1) +
      " kg";
  }


  setText(
    "lost",
    lostText
  );


  /* =====================================================
     START DATE
  ====================================================== */

  setText(
    "startDate",
    formatDate(
      p.startDate
    )
  );
}



/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    el("status");


  if (!status) {
    return;
  }


  status.textContent =
    message;


  status.className =
    "status show" +
    (
      error
        ? " error"
        : ""
    );
}


function hideStatus() {

  const status =
    el("status");


  if (status) {
    status.className =
      "status";
  }
}



/* =========================================================
   INITIALIZE LIFF
========================================================= */

async function initializeLine() {

  /*
    ใช้ common.js รุ่นใหม่ก่อน
  */

  if (
    window.ROCK &&
    typeof ROCK.initLiff ===
      "function"
  ) {

    return await ROCK.initLiff();
  }


  /*
    fallback สำหรับ app-config.js
  */

  const cfg =
    window.APP_CONFIG ||
    window.ROCK?.CFG ||
    {};


  const liffId =
    cfg.LIFF_ID;


  if (!liffId) {

    throw new Error(
      "ไม่พบ LIFF_ID"
    );
  }


  if (
    typeof liff ===
      "undefined"
  ) {

    throw new Error(
      "ไม่สามารถโหลด LINE LIFF SDK"
    );
  }


  await liff.init({
    liffId
  });


  if (
    !liff.isLoggedIn()
  ) {

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  return true;
}



/* =========================================================
   FETCH DASHBOARD
========================================================= */

async function getDashboard() {

  /*
    ใช้ common.js ก่อน
  */

  if (
    window.ROCK &&
    typeof ROCK.fetchDashboard ===
      "function"
  ) {

    return await ROCK.fetchDashboard();
  }


  const cfg =
    window.APP_CONFIG ||
    window.ROCK?.CFG ||
    {};


  const api =
    cfg.PLAYER_API;


  if (!api) {

    throw new Error(
      "ไม่พบ PLAYER_API"
    );
  }


  const idToken =
    liff.getIDToken();


  if (!idToken) {

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      api,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            action:
              "dashboard",

            idToken:
              idToken
          })
      }
    );


  const text =
    await response.text();


  let data;


  try {

    data =
      JSON.parse(text);

  } catch {

    console.error(
      "Dashboard raw response:",
      text
    );

    throw new Error(
      "Dashboard API ตอบกลับไม่ถูกต้อง"
    );
  }


  if (
    !response.ok ||
    data.success === false
  ) {

    throw new Error(
      data.error ||
      "โหลดข้อมูล HOME ไม่สำเร็จ"
    );
  }


  return data;
}



/* =========================================================
   LOAD HOME
========================================================= */

let homeLoading =
  false;


async function loadHome() {

  if (homeLoading) {
    return;
  }


  homeLoading =
    true;


  try {

    const raw =
      await getDashboard();


    console.log(
      "HOME DASHBOARD:",
      raw
    );


    renderHome(
      raw
    );


    hideStatus();


  } catch (error) {

    console.error(
      "HOME ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  } finally {

    homeLoading =
      false;
  }
}



/* =========================================================
   APP START
========================================================= */

(async function startHome() {

  try {

    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const loggedIn =
      await initializeLine();


    if (!loggedIn) {
      return;
    }


    await loadHome();


    /* -----------------------------------------------
       REFRESH
    ------------------------------------------------ */

    const cfg =
      window.ROCK?.CFG ||
      window.APP_CONFIG ||
      {};


    const refreshMs =
      Number(
        cfg.REFRESH_MS
      ) || 30000;


    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadHome();
        }

      },
      refreshMs
    );


  } catch (error) {

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();



/* =========================================================
   REFRESH WHEN RETURNING TO HOME

   สำคัญ:
   หลังชั่งน้ำหนักแล้วกลับ HOME
   ให้โหลด current_weight / EXP / Coin / Energy ใหม่
========================================================= */

document.addEventListener(
  "visibilitychange",
  function () {

    if (
      document.visibilityState ===
      "visible"
    ) {

      if (
        typeof liff !==
          "undefined" &&
        liff.isLoggedIn()
      ) {

        loadHome();
      }
    }
  }
);


/* =========================================================
   REFRESH WHEN PAGE RESTORED FROM CACHE
========================================================= */

window.addEventListener(
  "pageshow",
  function (event) {

    if (
      event.persisted
    ) {

      loadHome();
    }
  }
);

</script>
