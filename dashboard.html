<script>

/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


let loading = false;

let refreshTimer = null;


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
){

  const el =
    $("status");

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.className =
    error
      ? "show error"
      : "show";

}


function hideStatus(){

  const el =
    $("status");

  if(el){
    el.className = "";
  }

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function fmtInt(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? Math.round(n)
        .toLocaleString("en-US")
    : "0";

}


/* =========================================================
   FORMAT WEIGHT
========================================================= */

function fmtWeight(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "--.-";

  }

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n.toFixed(1)
    : "--.-";

}


/* =========================================================
   FORMAT DATE
========================================================= */

function fmtDate(value){

  if(!value){
    return "--/--/----";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "--/--/----";

  }

  return date.toLocaleDateString(
    "th-TH",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}


/* =========================================================
   NORMALIZE DASHBOARD
   รองรับข้อมูลหลายรูปแบบจาก API
========================================================= */

function normalizeDashboard(raw){

  const data =
    raw?.data ??
    raw?.dashboard ??
    raw ??
    {};

  const user =
    data?.user ??
    data?.player ??
    {};

  const weight =
    data?.weight &&
    typeof data.weight === "object"
      ? data.weight
      : {};

  const energy =
    data?.energy &&
    typeof data.energy === "object"
      ? data.energy
      : {};


  /* =========================================
     COIN
  ========================================== */

  const coin =
    Number(
      data?.rockCoin ??
      data?.rock_coin ??
      data?.coin ??
      user?.rockCoin ??
      user?.rock_coin ??
      user?.coin ??
      0
    );


  /* =========================================
     ENERGY
  ========================================== */

  const currentEnergy =
    Number(
      energy?.current ??
      data?.energyCurrent ??
      data?.currentEnergy ??
      data?.current_energy ??
      user?.energy ??
      (
        typeof data?.energy === "number"
          ? data.energy
          : 0
      )
    );


  const maxEnergy =
    Number(
      energy?.max ??
      data?.maxEnergy ??
      data?.max_energy ??
      user?.max_energy ??
      user?.maxEnergy ??
      window.APP_CONFIG?.MAX_ENERGY ??
      200
    );


  /* =========================================
     WEIGHT
  ========================================== */

  const currentWeight =
    weight?.current ??
    weight?.currentWeight ??
    weight?.current_weight ??
    data?.currentWeight ??
    data?.current_weight ??
    user?.currentWeight ??
    user?.current_weight ??
    null;


  const targetWeight =
    weight?.target ??
    weight?.targetWeight ??
    weight?.target_weight ??
    data?.targetWeight ??
    data?.target_weight ??
    user?.targetWeight ??
    user?.target_weight ??
    null;


  const startWeight =
    weight?.start ??
    weight?.startWeight ??
    weight?.start_weight ??
    data?.startWeight ??
    data?.start_weight ??
    user?.startWeight ??
    user?.start_weight ??
    null;


  const updatedAt =
    weight?.updatedAt ??
    weight?.updated_at ??
    weight?.lastRecordedAt ??
    weight?.last_recorded_at ??
    data?.weightUpdatedAt ??
    data?.weight_updated_at ??
    data?.updatedAt ??
    data?.updated_at ??
    user?.weightUpdatedAt ??
    user?.weight_updated_at ??
    null;


  const startDate =
    weight?.startDate ??
    weight?.start_date ??
    data?.startDate ??
    data?.start_date ??
    user?.startDate ??
    user?.start_date ??
    null;


  /* =========================================
     EXP
  ========================================== */

  const expObject =
    data?.exp &&
    typeof data.exp === "object"
      ? data.exp
      : {};

  const totalExp =
    Number(
      expObject?.total ??
      expObject?.current ??
      data?.exp ??
      user?.exp ??
      user?.experience ??
      0
    );


  /* =========================================
     LEVEL
  ========================================== */

  const expPerLevel =
    Number(
      window.APP_CONFIG?.EXP_PER_LEVEL ??
      ROCK?.CFG?.EXP_PER_LEVEL ??
      500
    ) || 500;


  const level =
    Number(
      data?.level ??
      user?.level ??
      (
        Math.floor(
          totalExp /
          expPerLevel
        ) + 1
      )
    ) || 1;


  /* =========================================
     PROFILE
  ========================================== */

  const picture =
    user?.pictureUrl ??
    user?.picture_url ??
    data?.pictureUrl ??
    data?.picture_url ??
    "";


  return {

    coin:
      Number.isFinite(coin)
        ? coin
        : 0,

    energy:
      Number.isFinite(currentEnergy)
        ? currentEnergy
        : 0,

    maxEnergy:
      Number.isFinite(maxEnergy)
        ? maxEnergy
        : 200,

    currentWeight,

    targetWeight,

    startWeight,

    updatedAt,

    startDate,

    totalExp:
      Number.isFinite(totalExp)
        ? totalExp
        : 0,

    expPerLevel,

    level,

    picture

  };

}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(url){

  const image =
    $("profileImage");

  if(!image){
    return;
  }

  if(!url){

    image.removeAttribute("src");

    image.style.display =
      "none";

    return;

  }


  image.onload =
    () => {

      image.style.display =
        "block";

    };


  image.onerror =
    () => {

      image.style.display =
        "none";

    };


  image.src =
    url;

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(raw){

  console.log(
    "HOME API RAW:",
    raw
  );


  const p =
    normalizeDashboard(raw);


  console.log(
    "HOME NORMALIZED:",
    p
  );


  /* =========================================
     PROFILE
  ========================================== */

  renderProfile(
    p.picture
  );


  /* =========================================
     COIN
  ========================================== */

  $("coin").textContent =
    fmtInt(
      p.coin
    );


  /* =========================================
     ENERGY
  ========================================== */

  $("energy").textContent =
    fmtInt(
      p.energy
    ) +
    " / " +
    fmtInt(
      p.maxEnergy
    );


  /* =========================================
     LEVEL
  ========================================== */

  $("level").textContent =
    "Lv." +
    fmtInt(
      p.level
    );


  /* =========================================
     EXP
  ========================================== */

  const exp =
    Math.max(
      0,
      p.totalExp
    );


  const expPerLevel =
    Math.max(
      1,
      p.expPerLevel
    );


  const expInLevel =
    exp %
    expPerLevel;


  const expPercent =
    Math.max(
      0,
      Math.min(
        100,
        (
          expInLevel /
          expPerLevel
        ) * 100
      )
    );


  $("expText").textContent =
    fmtInt(
      expInLevel
    ) +
    " / " +
    fmtInt(
      expPerLevel
    );


  $("expBar").style.width =
    expPercent +
    "%";


  /* =========================================
     CURRENT WEIGHT
  ========================================== */

  $("currentWeight").textContent =
    fmtWeight(
      p.currentWeight
    ) +
    " kg";


  /* =========================================
     TARGET
  ========================================== */

  $("targetWeight").textContent =
    fmtWeight(
      p.targetWeight
    ) +
    " kg";


  /* =========================================
     UPDATE DATE
  ========================================== */

  $("updatedAt").textContent =
    fmtDate(
      p.updatedAt
    );


  /* =========================================
     REMAINING
  ========================================== */

  const current =
    Number(
      p.currentWeight
    );

  const target =
    Number(
      p.targetWeight
    );


  if(
    Number.isFinite(current) &&
    Number.isFinite(target)
  ){

    $("remaining").textContent =
      Math.max(
        0,
        current -
        target
      ).toFixed(1);

  }else{

    $("remaining").textContent =
      "--.-";

  }


  /* =========================================
     LOST
  ========================================== */

  const start =
    Number(
      p.startWeight
    );


  if(
    Number.isFinite(start) &&
    Number.isFinite(current)
  ){

    $("lost").textContent =
      Math.max(
        0,
        start -
        current
      ).toFixed(1) +
      " kg";

  }else{

    $("lost").textContent =
      "--.- kg";

  }


  /* =========================================
     START DATE
  ========================================== */

  $("startDate").textContent =
    fmtDate(
      p.startDate
    );

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadHome(){

  if(loading){
    return;
  }

  loading = true;


  try{

    showStatus(
      "กำลังโหลดข้อมูล..."
    );


    /*
      ใช้ common.js ตัวเดียวกับ
      MISSION / BATTLE
    */

    const raw =
      await ROCK.fetchDashboard();


    renderHome(
      raw
    );


    hideStatus();


  }catch(error){

    console.error(
      "HOME LOAD ERROR:",
      error
    );


    showStatus(
      error?.message ||
      "โหลดข้อมูลไม่สำเร็จ",
      true
    );


  }finally{

    loading = false;

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

function goPage(name){

  const url =
    window.APP_CONFIG?.PAGE?.[name] ??
    ROCK?.CFG?.PAGE?.[name];


  if(url){

    window.location.href =
      url;

  }

}

/* =========================================================
   START
========================================================= */

async function startHome(){

  try{

    if(!window.ROCK){

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );

    }


    showStatus(
      "กำลังเชื่อมต่อ LINE..."
    );


    const ready =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if(
      ready === false
    ){

      return;

    }


    await loadHome();


    /* =======================================
       REALTIME REFRESH
    ======================================== */

    if(refreshTimer){

      clearInterval(
        refreshTimer
      );

    }


    const refreshMs =
      Number(
        window.APP_CONFIG?.REFRESH_MS ??
        ROCK?.CFG?.REFRESH_MS ??
        30000
      );


    refreshTimer =
      setInterval(
        async () => {

          if(
            document.visibilityState !==
            "visible"
          ){

            return;

          }


          await loadHome();

        },
        refreshMs
      );


  }catch(error){

    console.error(
      "HOME START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );

  }

}


/* =========================================================
   REFRESH WHEN RETURN TO HOME
========================================================= */

document.addEventListener(
  "visibilitychange",
  async () => {

    if(
      document.visibilityState !==
      "visible"
    ){

      return;

    }


    try{

      const ready =
        await ROCK.initLiff(
          "DASHBOARD"
        );


      if(
        ready === false
      ){

        return;

      }


      await loadHome();


    }catch(error){

      console.error(
        "VISIBILITY REFRESH ERROR:",
        error
      );

    }

  }
);


window.addEventListener(
  "pageshow",
  async () => {

    try{

      await loadHome();

    }catch(error){

      console.error(
        "PAGESHOW ERROR:",
        error
      );

    }

  }
);


/* =========================================================
   START APP
========================================================= */

startHome();

</script>
