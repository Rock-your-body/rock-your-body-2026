<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK YOUR BODY 2026 - Ranking</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app-config.js"></script><script src="./common.js"></script><style>body{margin:0;background:#eef4ff;font-family:Arial,'Noto Sans Thai',sans-serif;color:#08245b}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #1233}.hero{background:linear-gradient(135deg,#ff9d00,#e85a00);color:#fff}.row{display:grid;grid-template-columns:55px 1fr 110px;gap:10px;align-items:center;padding:13px;border-bottom:1px solid #edf1f7}.me{background:#fff3cd;border-radius:12px}.rank{font-size:22px;font-weight:900}.points{text-align:right;font-weight:900}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#073b93;color:#fff;font-weight:900}</style></head><body><main class="wrap"><section class="card hero"><h1>🏆 RANKING</h1><p>อันดับการแข่งขัน ROCK YOUR BODY 2026</p><h2 id="my">กำลังโหลด...</h2></section><section class="card" id="list"></section><button class="btn" onclick="ROCK.goHome()">🏠 กลับ HOME</button></main><script>(async()=>{try{await ROCK.initLiff();const d=await ROCK.callPlayerApi({action:'ranking'});document.getElementById('my').textContent='อันดับของฉัน #'+(d.myRank||'-');document.getElementById('list').innerHTML=(d.ranking||[]).map(x=>`<div class="row ${x.rank===d.myRank?'me':''}"><div class="rank">#${x.rank}</div><div><b>${x.name||'สมาชิก'}</b><br><small>Lv.${x.level||1} • ${x.rockCoin||0} COIN</small></div><div class="points">${Number(x.points||0).toLocaleString()} PTS</div></div>`).join('')||'<p>ยังไม่มีข้อมูล</p>'}catch(e){document.getElementById('list').textContent='❌ '+e.message}})()</script></body></html>
