<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>
    กำหนดระยะเวลาโครงการ
  </title>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- APP CONFIG -->
  <script src="./app-config.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {

      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #edf5ff 0%,
          #dceaff 100%
        );

      color: #082e67;

      padding:
        28px
        16px
        60px;
    }

    .page {

      width: 100%;
      max-width: 680px;

      margin:
        0 auto;
    }

    .card {

      background: #ffffff;

      border-radius: 30px;

      padding:
        32px;

      box-shadow:
        0 18px 50px
        rgba(19, 67, 130, .12);
    }

    h1 {

      margin:
        0
        0
        8px;

      font-size:
        clamp(
          28px,
          6vw,
          42px
        );

      line-height: 1.15;

      color: #0b376f;
    }

    .subtitle {

      margin-bottom:
        30px;

      color: #62789b;

      font-size: 18px;

      line-height: 1.45;

      font-weight: 700;
    }

    .field {

      margin-top:
        24px;
    }

    .field label {

      display: block;

      margin-bottom:
        10px;

      font-size: 19px;

      font-weight: 900;

      color: #0c376e;
    }

    input[type="date"] {

      width: 100%;

      height: 58px;

      border:
        2px solid
        #d1def0;

      border-radius:
        18px;

      padding:
        0
        16px;

      background:
        #fbfdff;

      color:
        #103b70;

      font-size:
        18px;

      font-weight:
        800;

      outline:
        none;
    }

    input[type="date"]:focus {

      border-color:
        #1970dc;

      box-shadow:
        0 0 0 4px
        rgba(25, 112, 220, .10);
    }

    .stats {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        16px;

      margin-top:
        28px;
    }

    .stat {

      min-height:
        142px;

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      text-align:
        center;

      background:
        #eff5ff;

      border-radius:
        24px;

      padding:
        18px;
    }

    .stat-label {

      font-size:
        17px;

      font-weight:
        800;
    }

    .stat-value {

      margin-top:
        8px;

      font-size:
        38px;

      line-height:
        1;

      font-weight:
        950;

      color:
        #083b80;
    }

    .progress-wrap {

      margin-top:
        28px;
    }

    .progress {

      width:
        100%;

      height:
        22px;

      overflow:
        hidden;

      background:
        #dfe9f8;

      border-radius:
        999px;
    }

    .progress-bar {

      width:
        0%;

      height:
        100%;

      background:
        linear-gradient(
          90deg,
          #1262d2,
          #2791ef
        );

      border-radius:
        999px;

      transition:
        width .35s ease;
    }

    .progress-text {

      margin-top:
        10px;

      text-align:
        center;

      font-size:
        20px;

      font-weight:
        900;

      color:
        #62789b;
    }

    .actions {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        14px;

      margin-top:
        30px;
    }

    button {

      min-height:
        62px;

      border:
        0;

      border-radius:
        20px;

      padding:
        12px
        16px;

      font-size:
        19px;

      font-weight:
        900;

      cursor:
        pointer;
    }

    button:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;
    }

    .home-btn {

      background:
        #edf3fc;

      color:
        #123e77;
    }

    .save-btn {

      background:
        #1263d2;

      color:
        #ffffff;
    }

    .status {

      display:
        none;

      margin-top:
        22px;

      border-radius:
        18px;

      padding:
        17px;

      font-size:
        16px;

      line-height:
        1.45;

      font-weight:
        800;

      word-break:
        break-word;
    }

    .status.show {

      display:
        block;
    }

    .status.info {

      color:
        #124e93;

      background:
        #eaf4ff;
    }

    .status.success {

      color:
        #087237;

      background:
        #e8faef;
    }

    .status.error {

      color:
        #a52222;

      background:
        #ffe9e9;
    }

    .admin-note {

      margin-top:
        22px;

      padding:
        16px;

      border-radius:
        16px;

      background:
        #fff8e8;

      color:
        #775613;

      font-size:
        14px;

      line-height:
        1.5;
    }

    @media (
      max-width: 520px
    ) {

      body {

        padding:
          18px
          12px
          50px;
      }

      .card {

        padding:
          26px
          20px;
      }

      .stats {

        gap:
          10px;
      }

      .stat {

        min-height:
          125px;
      }

      .stat-value {

        font-size:
          34px;
      }

      .actions {

        gap:
          10px;
      }

      button {

        font-size:
          17px;
      }
    }

  </style>

</head>


<body>

  <main class="page">

    <section class="card">

      <h1>
        ระยะเวลาโครงการ
      </h1>

      <div class="subtitle">
        กำหนดวันเริ่มต้นและวันสิ้นสุดของ
        ROCK YOUR BODY 2026
      </div>


      <!-- START DATE -->

      <div class="field">

        <label for="startDate">
          วันเริ่มต้นโครงการ
        </label>

        <input
          id="startDate"
          type="date"
        >

      </div>


      <!-- END DATE -->

      <div class="field">

        <label for="endDate">
          วันสิ้นสุดโครงการ
        </label>

        <input
          id="endDate"
          type="date"
        >

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            ผ่านไปแล้ว
          </div>

          <div
            id="elapsedDays"
            class="stat-value"
          >
            0 วัน
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            เหลืออีก
          </div>

          <div
            id="remainingDays"
            class="stat-value"
          >
            0 วัน
          </div>

        </div>

      </div>


      <!-- PROGRESS -->

      <div class="progress-wrap">

        <div class="progress">

          <div
            id="progressBar"
            class="progress-bar"
          ></div>

        </div>

        <div
          id="progressText"
          class="progress-text"
        >
          0%
        </div>

      </div>


      <!-- ACTION -->

      <div class="actions">

        <button
          id="homeButton"
          class="home-btn"
          type="button"
        >
          กลับ HOME
        </button>

        <button
          id="saveButton"
          class="save-btn"
          type="button"
        >
          บันทึก
        </button>

      </div>


      <!-- STATUS -->

      <div
        id="statusBox"
        class="status"
      ></div>


      <div class="admin-note">
        การเปลี่ยนวันเริ่มต้นหรือวันสิ้นสุด
        จะมีผลต่อการคำนวณระยะเวลาโครงการ
        และ Progress ของโครงการ
      </div>

    </section>

  </main>


<script>

"use strict";


/*
  ROCK YOUR BODY 2026
  project-settings.html
  Version:
  2026-08-29-PROJECT-SETTINGS-V2.11.1

  Canonical API:
  APP_CONFIG.API.PROJECT_SETTINGS
*/


/* =========================================================
   DOM
========================================================= */

const $ =
  id =>
    document.getElementById(
      id
    );


const startDate =
  $("startDate");


const endDate =
  $("endDate");


const elapsedDays =
  $("elapsedDays");


const remainingDays =
  $("remainingDays");


const progressBar =
  $("progressBar");


const progressText =
  $("progressText");


const homeButton =
  $("homeButton");


const saveButton =
  $("saveButton");


const statusBox =
  $("statusBox");


/* =========================================================
   STATE
========================================================= */

let initialized =
  false;


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "info"
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status show " +
    type;
}


function hideStatus() {

  statusBox.textContent =
    "";

  statusBox.className =
    "status";
}


/* =========================================================
   API
========================================================= */

function getProjectApi() {

  /*
    ใช้ getApi() ก่อน
    เพื่อให้ตรงกับ app-config.js canonical
  */

  if (
    typeof window.APP_CONFIG
      ?.getApi ===
    "function"
  ) {

    return window.APP_CONFIG
      .getApi(
        "PROJECT_SETTINGS"
      );
  }


  /*
    fallback
  */

  const api =
    window.APP_CONFIG
      ?.API
      ?.PROJECT_SETTINGS;


  if (!api) {

    throw new Error(
      "ไม่พบ API.PROJECT_SETTINGS ใน app-config.js"
    );
  }


  return api;
}


/* =========================================================
   LIFF
========================================================= */

async function initLiff() {

  if (
    typeof liff ===
    "undefined"
  ) {

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  const liffId =
    window.APP_CONFIG
      ?.LIFF_ID;


  if (!liffId) {

    throw new Error(
      "ไม่พบ LIFF_ID ใน app-config.js"
    );
  }


  await liff.init({
    liffId
  });


  if (
    !liff.isLoggedIn()
  ) {

    liff.login();

    return false;
  }


  initialized =
    true;


  return true;
}


async function getIdToken() {

  if (!initialized) {

    const ready =
      await initLiff();


    if (
      ready === false
    ) {

      return null;
    }
  }


  const idToken =
    liff.getIDToken();


  if (!idToken) {

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  return idToken;
}


/* =========================================================
   API REQUEST
========================================================= */

async function callProjectApi(
  action,
  payload = {}
) {

  const api =
    getProjectApi();


  const idToken =
    await getIdToken();


  if (!idToken) {

    return null;
  }


  const response =
    await fetch(
      api,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action,
            idToken,
            ...payload
          })
      }
    );


  const raw =
    await response.text();


  let data = {};


  try {

    data =
      raw
        ? JSON.parse(raw)
        : {};


  } catch (error) {

    console.error(
      "PROJECT SETTINGS RAW:",
      raw
    );


    throw new Error(
      "Project Settings API ตอบกลับไม่ใช่ JSON"
    );
  }


  if (
    !response.ok ||
    data?.success === false
  ) {

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* =========================================================
   DATE HELPERS
========================================================= */

function parseDate(
  value
) {

  if (!value) {

    return null;
  }


  /*
    ใช้ local date
    ป้องกันวันที่เลื่อนจาก UTC
  */

  const parts =
    value
      .split("-")
      .map(Number);


  if (
    parts.length !== 3
  ) {

    return null;
  }


  const [
    year,
    month,
    day
  ] = parts;


  return new Date(
    year,
    month - 1,
    day,
    12,
    0,
    0
  );
}


function dateOnly(
  value
) {

  if (!value) {

    return "";
  }


  /*
    รองรับทั้ง
    YYYY-MM-DD
    และ ISO timestamp
  */

  return String(value)
    .slice(
      0,
      10
    );
}


function todayLocal() {

  const now =
    new Date();


  return new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate(),
    12,
    0,
    0
  );
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

  const start =
    parseDate(
      startDate.value
    );


  const end =
    parseDate(
      endDate.value
    );


  if (
    !start ||
    !end ||
    end < start
  ) {

    elapsedDays.textContent =
      "0 วัน";


    remainingDays.textContent =
      "0 วัน";


    progressBar.style.width =
      "0%";


    progressText.textContent =
      "0%";


    return;
  }


  const DAY =
    24 *
    60 *
    60 *
    1000;


  /*
    รวมวันเริ่มต้นและวันสิ้นสุด
  */

  const totalDays =
    Math.max(
      1,
      Math.floor(
        (
          end -
          start
        ) /
        DAY
      ) + 1
    );


  const today =
    todayLocal();


  let elapsed =
    0;


  let remaining =
    totalDays;


  if (
    today <
    start
  ) {

    elapsed =
      0;

    remaining =
      totalDays;


  } else if (
    today >
    end
  ) {

    elapsed =
      totalDays;

    remaining =
      0;


  } else {

    elapsed =
      Math.floor(
        (
          today -
          start
        ) /
        DAY
      ) + 1;


    remaining =
      Math.max(
        0,
        totalDays -
        elapsed
      );
  }


  const percent =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (
            elapsed /
            totalDays
          ) *
          100
        )
      )
    );


  elapsedDays.textContent =
    `${elapsed} วัน`;


  remainingDays.textContent =
    `${remaining} วัน`;


  progressBar.style.width =
    `${percent}%`;


  progressText.textContent =
    `${percent}%`;
}


/* =========================================================
   NORMALIZE RESPONSE
========================================================= */

function normalizeSettings(
  data
) {

  /*
    รองรับ response หลายรูปแบบ
    จาก Edge Function รุ่นก่อนหน้า
  */

  const source =
    data?.settings ||
    data?.data ||
    data?.project ||
    data ||
    {};


  return {

    startDate:
      source
        ?.start_date ??
      source
        ?.startDate ??
      source
        ?.project_start_date ??
      "",

    endDate:
      source
        ?.end_date ??
      source
        ?.endDate ??
      source
        ?.project_end_date ??
      ""
  };
}


/* =========================================================
   LOAD SETTINGS
========================================================= */

async function loadSettings() {

  showStatus(
    "กำลังโหลดข้อมูลโครงการ...",
    "info"
  );


  saveButton.disabled =
    true;


  try {

    const data =
      await callProjectApi(
        "get"
      );


    if (!data) {

      return;
    }


    const settings =
      normalizeSettings(
        data
      );


    startDate.value =
      dateOnly(
        settings.startDate
      );


    endDate.value =
      dateOnly(
        settings.endDate
      );


    updateProgress();


    hideStatus();


  } catch (error) {

    console.error(
      "LOAD PROJECT SETTINGS ERROR:",
      error
    );


    showStatus(
      "❌ " +
      (
        error?.message ||
        String(error)
      ),
      "error"
    );


  } finally {

    saveButton.disabled =
      false;
  }
}


/* =========================================================
   SAVE
========================================================= */

async function saveSettings() {

  const start =
    startDate.value;


  const end =
    endDate.value;


  if (
    !start ||
    !end
  ) {

    showStatus(
      "กรุณากำหนดวันเริ่มต้นและวันสิ้นสุดโครงการ",
      "error"
    );

    return;
  }


  const startObj =
    parseDate(
      start
    );


  const endObj =
    parseDate(
      end
    );


  if (
    endObj <
    startObj
  ) {

    showStatus(
      "วันสิ้นสุดโครงการต้องไม่อยู่ก่อนวันเริ่มต้น",
      "error"
    );

    return;
  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "กำลังบันทึก...";


  showStatus(
    "กำลังบันทึกระยะเวลาโครงการ...",
    "info"
  );


  try {

    /*
      ส่งทั้ง camelCase + snake_case
      เพื่อ compatibility กับ Edge Function
      รุ่นที่ใช้อยู่
    */

    const data =
      await callProjectApi(
        "save",
        {
          startDate:
            start,

          endDate:
            end,

          start_date:
            start,

          end_date:
            end
        }
      );


    if (!data) {

      return;
    }


    /*
      ถ้า backend ส่ง settings กลับมา
      ใช้ค่าจาก DB อีกครั้ง
    */

    const settings =
      normalizeSettings(
        data
      );


    if (
      settings.startDate
    ) {

      startDate.value =
        dateOnly(
          settings.startDate
        );
    }


    if (
      settings.endDate
    ) {

      endDate.value =
        dateOnly(
          settings.endDate
        );
    }


    updateProgress();


    showStatus(
      "✅ บันทึกระยะเวลาโครงการเรียบร้อยแล้ว",
      "success"
    );


  } catch (error) {

    console.error(
      "SAVE PROJECT SETTINGS ERROR:",
      error
    );


    showStatus(
      "❌ " +
      (
        error?.message ||
        String(error)
      ),
      "error"
    );


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      "บันทึก";
  }
}


/* =========================================================
   HOME
========================================================= */

function goHome() {

  const home =
    window.APP_CONFIG
      ?.PAGE
      ?.HOME ||
    "./dashboard.html";


  window.location.href =
    home;
}


/* =========================================================
   EVENTS
========================================================= */

startDate.addEventListener(
  "change",
  updateProgress
);


endDate.addEventListener(
  "change",
  updateProgress
);


saveButton.addEventListener(
  "click",
  saveSettings
);


homeButton.addEventListener(
  "click",
  goHome
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    try {

      await initLiff();

      await loadSettings();


    } catch (error) {

      console.error(
        "PROJECT SETTINGS START ERROR:",
        error
      );


      showStatus(
        "❌ " +
        (
          error?.message ||
          String(error)
        ),
        "error"
      );
    }
  }
);

</script>

</body>
</html>
