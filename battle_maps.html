<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>ROCK YOUR BODY 2026 - BATTLE MAP</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260831-battle-map-v72"></script>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#020817;
      font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    #mapScreen{
      position:relative;
      width:100%;
      max-width:1280px;
      margin:0 auto;
      aspect-ratio:1280/657;
      overflow:hidden;
      background:#020817;
    }

    #mapImage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      z-index:1;
      pointer-events:none;
      user-select:none;
    }

    /* =========================================================
       TOP INFO
    ========================================================= */

    #topBar{
      position:absolute;
      z-index:30;
      left:1.2%;
      right:1.2%;
      top:1.2%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      pointer-events:none;
    }

    .pill{
      min-width:130px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(5,35,89,.90);
      color:#fff;
      font-weight:1000;
      font-size:clamp(9px,1.1vw,15px);
      text-align:center;
      border:1px solid rgba(255,255,255,.28);
      box-shadow:0 7px 18px rgba(0,0,0,.28);
    }

    /* =========================================================
       BACK BUTTON
    ========================================================= */

    #backBtn{
      position:absolute;
      z-index:100;
      left:1.5%;
      top:7.5%;
      min-width:112px;
      height:44px;
      padding:0 16px;
      border:2px solid rgba(255,255,255,.82);
      border-radius:15px;
      background:linear-gradient(180deg,#176bdc,#073f98);
      color:#fff;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
      box-shadow:
        0 6px 15px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.28);
    }

    #backBtn:active{
      transform:scale(.97);
    }

    /* =========================================================
       STAGE HOTSPOTS
    ========================================================= */

    .stage{
      position:absolute;
      z-index:50;
      width:13%;
      height:29%;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      cursor:pointer;
      border-radius:18px;
    }

    .stage::after{
      content:"";
      position:absolute;
      inset:5%;
      border-radius:16px;
      opacity:0;
      transition:.18s;
      pointer-events:none;
    }

    .stage:active::after{
      opacity:1;
      background:rgba(255,255,255,.10);
    }

    .stage.locked{
      cursor:not-allowed;
    }

    .lockBadge{
      position:absolute;
      z-index:70;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      display:none;
      width:58px;
      height:58px;
      border-radius:50%;
      align-items:center;
      justify-content:center;
      background:rgba(7,24,56,.88);
      border:2px solid rgba(255,255,255,.75);
      color:#fff;
      font-size:30px;
      box-shadow:0 7px 18px rgba(0,0,0,.38);
      pointer-events:none;
    }

    .stage.locked .lockBadge{
      display:flex;
    }

    .stageStatus{
      position:absolute;
      z-index:72;
      left:-18%;
      right:-18%;
      bottom:2%;
      min-height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(5,35,84,.85);
      color:#fff;
      font-weight:1000;
      font-size:clamp(7px,.8vw,11px);
      text-align:center;
      text-shadow:0 2px 4px rgba(0,0,0,.6);
      pointer-events:none;
    }

    .stage.completed .stageStatus{
      background:rgba(14,116,64,.94);
    }

    .stage.unlocked .stageStatus{
      background:rgba(11,87,183,.94);
    }

    .stage.locked .stageStatus{
      background:rgba(72,80,96,.94);
    }

    /* top row */
    #s1{left:2.5%;top:23%}
    #s2{left:20.8%;top:23%}
    #s3{left:39.3%;top:23%}
    #s4{left:57.7%;top:23%}
    #s5{left:76.2%;top:23%}

    /* bottom row */
    #s6{left:2.0%;top:61%}
    #s7{left:20.5%;top:61%}
    #s8{left:39.0%;top:61%}
    #s9{left:57.6%;top:61%}
    #s10{left:76.6%;top:60.5%}

    /* =========================================================
       LOADING / TOAST
    ========================================================= */

    #loading{
      position:fixed;
      inset:0;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,10,35,.60);
      backdrop-filter:blur(3px);
    }

    #loadingBox{
      padding:16px 22px;
      border-radius:18px;
      background:#fff;
      color:#0c3e86;
      font-weight:1000;
      box-shadow:0 12px 36px rgba(0,0,0,.3);
    }

    #toast{
      position:fixed;
      z-index:11000;
      left:50%;
      bottom:max(18px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      display:none;
      max-width:calc(100vw - 28px);
      padding:12px 16px;
      border-radius:14px;
      background:#173c70;
      color:#fff;
      font-weight:900;
      text-align:center;
      box-shadow:0 8px 26px rgba(0,0,0,.3);
    }

    #toast.show{
      display:block;
    }

    #toast.error{
      background:#c62828;
    }
  </style>
</head>

<body>

<main id="mapScreen">

  <img
    id="mapImage"
    src="./battle%20map.jpeg?v=20260831-v72"
    alt="Battle Map"
    draggable="false"
  >

  <div id="topBar">
    <div id="expInfo" class="pill">EXP --</div>
    <div id="energyInfo" class="pill">⚡ -- / 200</div>
  </div>

  <button id="backBtn" type="button">
    ← ย้อนกลับ
  </button>

  <button id="s1" class="stage" data-stage="1" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 1</span>
  </button>

  <button id="s2" class="stage" data-stage="2" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 2</span>
  </button>

  <button id="s3" class="stage" data-stage="3" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 3</span>
  </button>

  <button id="s4" class="stage" data-stage="4" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 4</span>
  </button>

  <button id="s5" class="stage" data-stage="5" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 5</span>
  </button>

  <button id="s6" class="stage" data-stage="6" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 6</span>
  </button>

  <button id="s7" class="stage" data-stage="7" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 7</span>
  </button>

  <button id="s8" class="stage" data-stage="8" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 8</span>
  </button>

  <button id="s9" class="stage" data-stage="9" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 9</span>
  </button>

  <button id="s10" class="stage" data-stage="10" type="button">
    <span class="lockBadge">🔒</span>
    <span class="stageStatus">Stage 10</span>
  </button>

</main>


<div id="loading">
  <div id="loadingBox">
    🗺️ กำลังโหลด Battle Map...
  </div>
</div>

<div id="toast"></div>


<script>
"use strict";


/* ============================================================
   ROCK YOUR BODY 2026
   BATTLE MAP V7.2
============================================================ */

const $ =
  id =>
    document.getElementById(id);


const CFG =
  window.APP_CONFIG ||
  {};


const LIFF_ID =
  CFG.LIFF_ID ||
  "2011201679-uNWz5yqF";


let state =
  null;


/* ============================================================
   HELPERS
============================================================ */

function showLoading(
  show
){

  $("loading")
    .style
    .display =
      show
        ? "flex"
        : "none";
}


function toast(
  message,
  error = false
){

  const el =
    $("toast");


  el.textContent =
    message;


  el.classList
    .toggle(
      "error",
      error
    );


  el.classList
    .add(
      "show"
    );


  clearTimeout(
    window.__mapToast
  );


  window.__mapToast =
    setTimeout(
      ()=>{

        el.classList
          .remove(
            "show"
          );

      },
      error
        ? 4500
        : 2300
    );
}


/* ============================================================
   API
============================================================ */

function battleApi(){

  if(
    CFG?.getApi
  ){

    return CFG.getApi(
      "BATTLE"
    );
  }


  const url =
    CFG
      ?.API
      ?.BATTLE;


  if(!url){

    throw new Error(
      "ไม่พบ API.BATTLE"
    );
  }


  return url;
}


async function initLine(){

  await liff.init({

    liffId:
      LIFF_ID

  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({

      redirectUri:
        location.href

    });


    return false;
  }


  const token =
    liff.getIDToken();


  if(
    !token ||
    token
      .split(".")
      .length !==
      3
  ){

    liff.logout();


    liff.login({

      redirectUri:
        location.href

    });


    return false;
  }


  return true;
}


async function postBattle(
  action,
  payload = {}
){

  const idToken =
    liff.getIDToken();


  const response =
    await fetch(
      battleApi(),
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:
          "no-store",

        body:
          JSON.stringify({
            action,
            idToken,
            ...payload
          })
      }
    );


  const raw =
    await response.text();


  let data =
    {};


  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      "Battle API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    !response.ok ||
    data
      ?.success ===
      false
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* ============================================================
   RENDER
============================================================ */

function render(
  data
){

  state =
    data;


  const exp =
    Number(
      data
        ?.player
        ?.exp ||
      0
    );


  const energy =
    data
      ?.healthEnergy ||
    {};


  $("expInfo")
    .textContent =
      `EXP ${exp.toLocaleString()}`;


  $("energyInfo")
    .textContent =
      `⚡ ${Number(energy.available || 0).toLocaleString()} / ${Number(energy.max || 200).toLocaleString()}`;


  const stages =
    Array.isArray(
      data
        ?.stages
    )
      ? data.stages
      : [];


  for(
    let no = 1;
    no <= 10;
    no++
  ){

    const stage =
      stages.find(
        item =>
          Number(
            item.id
          ) ===
          no
      ) ||
      {
        id:no,
        unlocked:false,
        completed:false,
        expRequired:0
      };


    const button =
      $(
        `s${no}`
      );


    const status =
      button.querySelector(
        ".stageStatus"
      );


    button.classList.remove(
      "locked",
      "unlocked",
      "completed"
    );


    if(
      stage.completed
    ){

      button.classList.add(
        "completed"
      );


      status.textContent =
        `✅ ผ่าน Stage ${no}`;

    }else if(
      stage.unlocked
    ){

      button.classList.add(
        "unlocked"
      );


      status.textContent =
        `⚔️ Stage ${no}`;

    }else{

      button.classList.add(
        "locked"
      );


      status.textContent =
        `EXP ${Number(stage.expRequired || 0).toLocaleString()}`;
    }


    button.onclick =
      ()=>{

        if(
          !stage.unlocked &&
          !stage.completed
        ){

          toast(
            `🔒 Stage ${no} ต้องมี EXP ${Number(stage.expRequired || 0).toLocaleString()} และผ่าน Stage ก่อนหน้า`,
            true
          );


          return;
        }


        window.location
          .assign(
            `./battle_stage.html?stage=${encodeURIComponent(no)}`
          );
      };
  }
}


/* ============================================================
   NAVIGATION
============================================================ */

$("backBtn")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.BATTLE ||
          "./battle.html"
        );
    }
  );


/* ============================================================
   START
============================================================ */

(async()=>{

  showLoading(
    true
  );


  try{

    const ready =
      await initLine();


    if(
      ready ===
      false
    ){

      return;
    }


    const data =
      await postBattle(
        "mapV5"
      );


    render(
      data
    );


  }catch(error){

    console.error(
      error
    );


    toast(
      error
        ?.message ||
      String(error),
      true
    );

  }finally{

    showLoading(
      false
    );
  }

})();

</script>

</body>
</html>
