<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE MAP</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260830-battle-v40"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;background:#020817;font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif}
    body{display:flex;justify-content:center;overflow-x:hidden}

    #mapStage{
      position:relative;width:min(100vw,1280px);aspect-ratio:1280/657;
      overflow:hidden;background:#020817
    }

    #mapImage{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}

    .stage-hotspot,.nav-hotspot{
      position:absolute;z-index:20;border:0;background:transparent;padding:0;cursor:pointer
    }

    #backButton{left:1%;top:1.5%;width:5.5%;height:10%}

    #stage1{left:2.8%;top:20.5%;width:17.5%;height:34.5%}
    #stage2{left:21%;top:19.5%;width:18.2%;height:36%}
    #stage3{left:39.4%;top:19%;width:18%;height:36.5%}
    #stage4{left:57.7%;top:18.2%;width:18.2%;height:37%}
    #stage5{left:76.1%;top:18%;width:21%;height:38%}
    #stage6{left:1.2%;top:58%;width:18%;height:38%}
    #stage7{left:19.8%;top:58%;width:18%;height:38%}
    #stage8{left:38.4%;top:57%;width:18%;height:39%}
    #stage9{left:57%;top:57%;width:18.5%;height:39%}
    #stage10{left:76%;top:55.5%;width:23%;height:41%}

    .stage-hotspot.locked::after{
      content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      border-radius:16px;background:rgba(0,12,45,.56);color:#fff;font-size:clamp(20px,3vw,48px)
    }

    .stage-meta{
      position:absolute;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;
      pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #000;
      font-size:clamp(7px,1vw,14px)
    }
    .stage-meta b{padding:3px 7px;border-radius:999px;background:rgba(0,25,80,.82)}
    .stage-meta .exp{background:rgba(98,30,180,.88)}
    .m1{left:5%;top:47%;width:12%}.m2{left:24%;top:47%;width:12%}.m3{left:43%;top:47%;width:12%}.m4{left:61%;top:47%;width:12%}.m5{left:80%;top:47%;width:15%}
    .m6{left:4%;top:87%;width:13%}.m7{left:23%;top:87%;width:13%}.m8{left:42%;top:87%;width:13%}.m9{left:61%;top:87%;width:13%}.m10{left:81%;top:87%;width:15%}

    #playerInfo{
      position:absolute;z-index:30;left:14%;top:2.5%;padding:7px 12px;border-radius:13px;
      background:rgba(3,25,73,.88);color:#fff;font-weight:900;font-size:clamp(9px,1.3vw,17px)
    }

    #status{
      position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
      z-index:9999;display:none;padding:12px 16px;border-radius:14px;background:#173c70;color:#fff;
      max-width:calc(100vw - 28px);font-weight:900;text-align:center
    }
    #status.show{display:block}
    #status.error{background:#c62828}
  </style>
</head>
<body>

<main id="mapStage">
  <img id="mapImage" src="./battle%20map.jpeg?v=20260830-v40"
       onerror="this.onerror=null;this.src='./battle-map.jpg?v=20260830-v40'"
       alt="Battle Map">

  <div id="playerInfo">EXP -- • ⚡ --</div>
  <button id="backButton" class="nav-hotspot" type="button" aria-label="ย้อนกลับ"></button>

  <button id="stage1" class="stage-hotspot" data-stage="1"></button>
  <button id="stage2" class="stage-hotspot" data-stage="2"></button>
  <button id="stage3" class="stage-hotspot" data-stage="3"></button>
  <button id="stage4" class="stage-hotspot" data-stage="4"></button>
  <button id="stage5" class="stage-hotspot" data-stage="5"></button>
  <button id="stage6" class="stage-hotspot" data-stage="6"></button>
  <button id="stage7" class="stage-hotspot" data-stage="7"></button>
  <button id="stage8" class="stage-hotspot" data-stage="8"></button>
  <button id="stage9" class="stage-hotspot" data-stage="9"></button>
  <button id="stage10" class="stage-hotspot" data-stage="10"></button>

  <div id="meta1" class="stage-meta m1"></div>
  <div id="meta2" class="stage-meta m2"></div>
  <div id="meta3" class="stage-meta m3"></div>
  <div id="meta4" class="stage-meta m4"></div>
  <div id="meta5" class="stage-meta m5"></div>
  <div id="meta6" class="stage-meta m6"></div>
  <div id="meta7" class="stage-meta m7"></div>
  <div id="meta8" class="stage-meta m8"></div>
  <div id="meta9" class="stage-meta m9"></div>
  <div id="meta10" class="stage-meta m10"></div>
</main>

<div id="status"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let state=null;

function apiUrl(){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi("BATTLE");
  const url=window.APP_CONFIG?.API?.BATTLE;
  if(!url) throw new Error("ไม่พบ API.BATTLE");
  return url;
}

async function initLine(){
  await liff.init({liffId:window.APP_CONFIG?.LIFF_ID||"2011201679-uNWz5yqF"});
  if(!liff.isLoggedIn()){
    liff.login({redirectUri:location.href});
    return false;
  }
  if(!liff.getIDToken()){
    liff.logout();
    liff.login({redirectUri:location.href});
    return false;
  }
  return true;
}

async function post(action,payload={}){
  const res=await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({action,idToken:liff.getIDToken(),...payload})
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error("Battle API ตอบกลับไม่ใช่ JSON")}
  if(!res.ok||data?.success===false) throw new Error(data?.error||data?.message||`HTTP ${res.status}`);
  return data;
}

function showStatus(text,error=false){
  const el=$("status");el.textContent=text;el.classList.toggle("error",error);el.classList.add("show");
  clearTimeout(window.__s);window.__s=setTimeout(()=>el.classList.remove("show"),error?4500:2300);
}

function render(data){
  state=data;
  const p=data?.player||{};
  $("playerInfo").textContent=`EXP ${Number(p.exp||0).toLocaleString()} • ⚡ ${Number(p.energy||0).toLocaleString()}/${Number(p.maxEnergy||200).toLocaleString()}`;

  for(const stage of (data?.stages||[])){
    const button=$("stage"+stage.id);
    const meta=$("meta"+stage.id);
    const locked=!stage.unlocked;

    button.classList.toggle("locked",locked);
    button.setAttribute("aria-disabled",locked?"true":"false");

    meta.innerHTML=`
      <b>⚡ ${Number(stage.energyRequired||0).toLocaleString()}</b>
      <b class="exp">EXP ${Number(stage.expRequired||0).toLocaleString()}</b>
    `;
  }
}

async function openStage(id){
  const stage=state?.stages?.find(x=>Number(x.id)===Number(id));
  if(!stage) return;

  if(!stage.unlocked){
    showStatus(`🔒 Stage ${id} ต้องมี EXP ${Number(stage.expRequired).toLocaleString()} • ตอนนี้มี ${Number(state?.player?.exp||0).toLocaleString()}`,true);
    return;
  }

  location.href=(window.APP_CONFIG?.PAGE?.BATTLE_STAGE||"./battle_stage.html")+"?stage="+encodeURIComponent(id);
}

document.querySelectorAll(".stage-hotspot").forEach(btn=>{
  btn.onclick=()=>openStage(Number(btn.dataset.stage||1));
});

$("backButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE||"./battle.html";

(async()=>{
  try{
    const ok=await initLine();if(ok===false)return;
    render(await post("map"));
  }catch(error){
    console.error(error);showStatus(error?.message||String(error),true);
  }
})();
</script>
</body>
</html>
