<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROCK YOUR BODY 2026 - MISSION ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./app-config.js?v=20260824-admin-01"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;background:#eef5ff;color:#102d5e}.app{width:min(100%,1100px);margin:auto;padding:18px}.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#073b93,#0d6ae8);box-shadow:0 10px 28px rgba(16,55,120,.18)}.title{font-size:clamp(22px,4vw,34px);font-weight:900}.sub{opacity:.9;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:0;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;background:#fff;color:#16477f}.tab.active{background:#ffcf35;color:#532d00}#status{margin:10px 0;font-size:13px;font-weight:700}.list{display:grid;gap:14px}.card{overflow:hidden;border:1px solid #d7e4f5;border-radius:20px;background:#fff;box-shadow:0 7px 20px rgba(20,60,110,.08)}.card-main{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;padding:16px}.mission{font-size:19px;font-weight:900;color:#073b93}.meta{margin-top:5px;color:#71829c;font-size:12px}.player{margin-top:10px;padding:10px;border-radius:13px;background:#f4f8ff}.note{margin-top:10px;padding:10px;border-radius:12px;background:#fff8e7;font-size:13px}.reward{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:5px 8px;border-radius:999px;background:#edf4ff;font-size:12px;font-weight:800}.evidence{min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:15px;background:#091f45}.evidence img,.evidence video{width:100%;max-height:260px;object-fit:contain;display:block}.evidence a{color:#fff;font-weight:800;padding:20px;text-align:center}.actions{display:flex;gap:10px;padding:0 16px 16px}.btn{flex:1;min-height:48px;border:0;border-radius:13px;color:#fff;font-weight:900;cursor:pointer}.approve{background:#09a84b}.reject{background:#df3131}.btn:disabled{opacity:.5;cursor:default}.empty{padding:40px 20px;text-align:center;color:#74839d;background:#fff;border-radius:20px}@media(max-width:720px){.app{padding:10px}.card-main{grid-template-columns:1fr}.evidence{min-height:140px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="title">🛡️ MISSION ADMIN</div><div class="sub">ตรวจหลักฐาน • อนุมัติ/ไม่อนุมัติ • แจก Reward อัตโนมัติ</div></div><div id="adminName">กำลังตรวจสอบสิทธิ์...</div></header>
<nav class="tabs"><button class="tab active" data-status="pending">รอตรวจ</button><button class="tab" data-status="approved">อนุมัติแล้ว</button><button class="tab" data-status="rejected">ไม่ผ่าน</button><button class="tab" data-status="all">ทั้งหมด</button></nav>
<div id="status"></div><main id="list" class="list"></main>
</div>
<script>
const LIFF_ID=window.APP_CONFIG?.LIFF_ID||"2011201679-uNWz5yqF";
const ADMIN_API=window.APP_CONFIG?.API?.MISSION_ADMIN||"https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/mission-admin";
let currentStatus="pending",idToken="";
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function setStatus(m){document.getElementById("status").textContent=m||""}
async function api(payload){const r=await fetch(ADMIN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,idToken})});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{throw new Error(`Server response invalid HTTP ${r.status}`)}if(!r.ok||d?.success===false)throw new Error(d?.error||`HTTP ${r.status}`);return d}
function evidenceHtml(i){const u=i.evidenceSignedUrl,t=String(i.evidence_type||"");if(u&&t.startsWith("image/"))return `<img src="${esc(u)}" alt="หลักฐาน">`;if(u&&t.startsWith("video/"))return `<video src="${esc(u)}" controls playsinline></video>`;if(i.evidence_link)return `<a href="${esc(i.evidence_link)}" target="_blank" rel="noopener">เปิด Link หลักฐาน</a>`;return `<div style="color:#fff">ไม่มี Preview</div>`}
function cardHtml(i){const p=i.player||{},pending=i.status==="pending";return `<article class="card"><div class="card-main"><div><div class="mission">${esc(i.mission_id)}</div><div class="meta">${esc(i.category)} • ${esc(i.period_key)} • Attempt ${esc(i.attempt_no)}</div><div class="player">👤 <strong>${esc(p.display_name||"ไม่พบชื่อ")}</strong><br><small>${esc(i.line_user_id)}</small></div>${i.note?`<div class="note">📝 ${esc(i.note)}</div>`:""}<div class="reward"><span class="chip">⭐ +${esc(i.reward_coin)} COIN</span><span class="chip">⚡ +${esc(i.reward_energy)} ENERGY</span><span class="chip">🏆 +${esc(i.reward_exp)} EXP</span></div>${i.evidence_link?`<div style="margin-top:10px">🔗 <a href="${esc(i.evidence_link)}" target="_blank" rel="noopener">${esc(i.evidence_link)}</a></div>`:""}${i.reject_reason?`<div class="note">เหตุผลไม่ผ่าน: ${esc(i.reject_reason)}</div>`:""}</div><div class="evidence">${evidenceHtml(i)}</div></div>${pending?`<div class="actions"><button class="btn approve" onclick="review('${esc(i.id)}','approve',this)">✅ อนุมัติ + แจก Reward</button><button class="btn reject" onclick="review('${esc(i.id)}','reject',this)">❌ ไม่อนุมัติ</button></div>`:""}</article>`}
async function loadList(){setStatus("กำลังโหลด...");document.getElementById("list").innerHTML="";try{const r=await api({action:"adminListSubmissions",status:currentStatus,limit:100});const rows=Array.isArray(r.submissions)?r.submissions:[];document.getElementById("list").innerHTML=rows.length?rows.map(cardHtml).join(""):`<div class="empty">ไม่มีรายการในหมวดนี้</div>`;setStatus(`พบ ${rows.length} รายการ`)}catch(e){console.error(e);setStatus("ERROR: "+(e?.message||e))}}
async function review(id,decision,button){let reason="";if(decision==="reject"){reason=prompt("กรอกเหตุผลที่ไม่อนุมัติ")||"";if(!reason.trim())return}else if(!confirm("ยืนยันอนุมัติหลักฐานและแจก ROCK COIN + ENERGY + EXP ?"))return;const buttons=button.closest(".actions")?.querySelectorAll("button")||[];buttons.forEach(b=>b.disabled=true);try{const r=await api({action:"adminReviewSubmission",submissionId:id,decision,reason});if(decision==="approve"&&r?.alreadyProcessed)alert("รายการนี้เคยแจก Reward แล้ว ระบบไม่แจกซ้ำ");else if(decision==="approve")alert("✅ อนุมัติและแจก Reward สำเร็จ");else alert("❌ บันทึกไม่อนุมัติแล้ว");await loadList()}catch(e){console.error(e);alert("ERROR: "+(e?.message||e));buttons.forEach(b=>b.disabled=false)}}
async function start(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}idToken=liff.getIDToken();if(!idToken)throw new Error("ไม่พบ LINE ID Token");const who=await api({action:"adminWhoAmI"});document.getElementById("adminName").textContent="Admin: "+(who?.admin?.displayName||"Authorized");await loadList()}catch(e){console.error(e);document.getElementById("adminName").textContent="ไม่มีสิทธิ์";setStatus("ERROR: "+(e?.message||e))}}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",async()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");currentStatus=t.dataset.status||"pending";await loadList()}));start();
</script>
</body>
</html>
