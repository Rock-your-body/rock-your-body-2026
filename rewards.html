<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK YOUR BODY 2026 - Rewards</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app-config.js"></script><script src="./common.js"></script><style>body{margin:0;background:#eef4ff;font-family:Arial,'Noto Sans Thai',sans-serif;color:#08245b}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #1233}.hero{background:linear-gradient(135deg,#7b1fe4,#3b0a8f);color:#fff}.reward{padding:15px;border:1px solid #e3eaf5;border-radius:16px;margin:10px 0}.btn{padding:10px 14px;border:0;border-radius:12px;background:#f59e0b;color:#fff;font-weight:900}.home{width:100%;background:#073b93}</style></head><body><main class="wrap"><section class="card hero"><h1>🎁 REWARD</h1><p>รางวัลของฉัน</p></section><section class="card" id="list">กำลังโหลด...</section><button class="btn home" onclick="ROCK.goHome()">🏠 กลับ HOME</button></main><script>async function claim(id){try{const r=await ROCK.callPlayerApi({action:'claimReward',rewardId:id});alert(r.alreadyClaimed?'รับรางวัลไปแล้ว':'บันทึกการรับรางวัลแล้ว');location.reload()}catch(e){alert(e.message)}}(async()=>{try{await ROCK.initLiff();const d=await ROCK.callPlayerApi({action:'rewards'});const a=d.rewards||[];document.getElementById('list').innerHTML=a.length?a.map(r=>`<div class="reward"><b>🏅 ${r.title}</b><p>+${r.reward?.rockCoin||0} COIN • +${r.reward?.energy||0} ENERGY • +${r.reward?.exp||0} EXP</p><small>${new Date(r.createdAt).toLocaleString('th-TH')}</small><br><button class="btn" ${r.claimedAt?'disabled':''} onclick="claim('${r.id}')">${r.claimedAt?'รับแล้ว':'รับรางวัล'}</button></div>`).join(''):'<p>ยังไม่มีรางวัล</p>'}catch(e){document.getElementById('list').textContent='❌ '+e.message}})()</script></body></html>
