  <style>

<script>
/* =========================================================
   STAGES
========================================================= */
const STAGES = [
  {id:1,name:"เจ้าจอมเอื่อย",energy:300},
  {id:2,name:"จอมหวาน",energy:900},
  {id:3,name:"ปีศาจของทอด",energy:1500},
  {id:4,name:"จอมเค็ม",energy:2100},
  {id:5,name:"ราชาอาหารไร้ประโยชน์",energy:2700},
  {id:6,name:"ปีศาจพักผ่อนน้อย",energy:3300},
  {id:7,name:"จอมเนื่อยนิ่ง",energy:3900},
  {id:8,name:"ปีศาจพฤติกรรมเสี่ยง",energy:4500},
  {id:9,name:"ราชาความเสี่ยงสุขภาพ",energy:5100},
  {id:10,name:"จอมมารโรคร้าย",energy:5700,boss:true}
];


/* =========================================================
   URL / TEST STATE
========================================================= */

const BATTLE_PARAMS =
  new URLSearchParams(
    window.location.search
  );

const TEST_MODE =
  BATTLE_PARAMS.get("test") === "1";

const OPEN_FIGHT_ON_LOAD =
  BATTLE_PARAMS.get("fight") === "1";


/* =========================================================
   STATE
========================================================= */
let playerEnergy = 0;
let playerCoin = 0;
let unlockedStage = 1;


/* =========================================================
   NAVIGATION
========================================================= */
function goPage(key){

  const url =
    window.APP_CONFIG?.PAGE?.[key];

  if(url){
    window.location.href = url;
    return;
  }

  const fallback = {
    HOME:"./dashboard.html",
    MISSION:"./mission.html",
    WEIGHT:"./weight-check.html",
    REWARDS:"./rewards.html",
    PROGRESS:"./progress.html",
    RANKING:"./ranking.html"
  };

  if(fallback[key]){
    window.location.href =
      fallback[key];
  }
}


function goHome(){
  window.location.href =
    window.APP_CONFIG?.PAGE?.HOME ||
    "./dashboard.html";
}


function goMission(){
  window.location.href =
    window.APP_CONFIG?.PAGE?.MISSION ||
    "./mission.html";
}


/* =========================================================
   FIGHT MONSTER PAGE
========================================================= */
function showFightMonster(){

  if(TEST_MODE){

    document
      .getElementById(
        "fightTestBadge"
      )
      ?.classList
      .add("show");
  }

  document
    .getElementById("battleTemplateStage")
    ?.classList
    .add("hide");

  document
    .getElementById("fightMonsterPage")
    ?.classList
    .add("show");

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


function hideFightMonster(){

  document
    .getElementById("fightMonsterPage")
    ?.classList
    .remove("show");

  document
    .getElementById("battleTemplateStage")
    ?.classList
    .remove("hide");

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


/* =========================================================
   OPEN STAGE
========================================================= */
function openStage(stageNumber){

  const stage =
    STAGES.find(
      item =>
        item.id ===
        Number(stageNumber)
    );

  if(!stage){
    return;
  }

  if(stage.id > unlockedStage){

    showToast(
      `🔒 Stage ${stage.id} ยังไม่ปลดล็อก`
    );

    return;
  }

  const testQuery =
    TEST_MODE
      ? "&test=1"
      : "";

  window.location.href =
    `./battle_stage.html?stage=${stage.id}${testQuery}`;
}


/* =========================================================
   UI
========================================================= */
function updateUI(){

  const maxEnergy =
    Number(
      localStorage.getItem("rockMaxEnergy") ||
      window.APP_CONFIG?.MAX_ENERGY
    ) || 200;

  const energyText =
    `${Math.max(0,playerEnergy).toLocaleString("en-US")} / ${maxEnergy.toLocaleString("en-US")}`;

  const coin =
    document.getElementById("coinValue");

  const energy =
    document.getElementById("energyValue");

  const bossEnergy =
    document.getElementById("bossEnergyValue");

  const modalEnergy =
    document.getElementById("energyModalValue");

  if(coin){
    coin.textContent =
      Math.max(0,playerCoin)
        .toLocaleString("en-US");
  }

  if(energy){
    energy.textContent =
      energyText;
  }

  if(bossEnergy){
    bossEnergy.textContent =
      Math.max(0,playerEnergy)
        .toLocaleString("en-US");
  }

  if(modalEnergy){
    modalEnergy.textContent =
      energyText;
  }

  updateStageLocks();
}


function updateStageLocks(){

  document
    .querySelectorAll(".stage-hotspot")
    .forEach(
      button => {

        const stage =
          Number(
            button.dataset.stage
          );

        const locked =
          stage > unlockedStage;

        button.classList.toggle(
          "locked",
          locked
        );

        button.setAttribute(
          "aria-disabled",
          locked ? "true" : "false"
        );
      }
    );
}


/* =========================================================
   CACHE
========================================================= */
function loadCache(){

  const energyRaw =
    localStorage.getItem(
      "rockEnergy"
    );

  const coinRaw =
    localStorage.getItem(
      "rockCoin"
    );

  const stageRaw =
    localStorage.getItem(
      "rockUnlockedStage"
    );

  if(energyRaw !== null){

    const energy =
      Number(energyRaw);

    if(Number.isFinite(energy)){
      playerEnergy = energy;
    }
  }

  if(coinRaw !== null){

    const coin =
      Number(coinRaw);

    if(Number.isFinite(coin)){
      playerCoin = coin;
    }
  }

  if(stageRaw !== null){

    const stage =
      Number(stageRaw);

    if(Number.isFinite(coin)){
      playerCoin = coin;

      localStorage.setItem(
        "rockCoin",
        String(coin)
      );
    }

    if(Number.isFinite(stage)){
      unlockedStage =
        Math.max(
          1,
          Math.min(10,stage)
        );
    }
  }

  updateUI();
}


/* =========================================================
   DASHBOARD
========================================================= */
async function loadDashboard(){

  try{

    if(
      !window.ROCK ||
      typeof ROCK.fetchDashboard !== "function"
    ){
      throw new Error("common.js / ROCK.fetchDashboard ไม่พร้อม");
    }

    const raw =
      await ROCK.fetchDashboard();

    /*
      player-dashboard อาจตอบได้หลายรูปแบบ:
      {data:{...}}
      {dashboard:{...}}
      {...}
      จึง normalize ก่อนอ่านค่า
    */
    const result =
      raw?.data ??
      raw?.dashboard ??
      raw ??
      {};

    const user =
      result?.user ??
      result?.player ??
      {};

    const energyObject =
      result?.energy &&
      typeof result.energy === "object"
        ? result.energy
        : {};

    const energy =
      Number(
        energyObject?.current ??
        result?.currentEnergy ??
        result?.current_energy ??
        user?.energy ??
        (
          typeof result?.energy === "number"
            ? result.energy
            : undefined
        )
      );

    const coin =
      Number(
        result?.rockCoin ??
        result?.rock_coin ??
        result?.coin ??
        user?.rock_coin ??
        user?.rockCoin ??
        user?.coin
      );

    const maxEnergy =
      Number(
        energyObject?.max ??
        result?.maxEnergy ??
        result?.max_energy ??
        user?.max_energy ??
        window.APP_CONFIG?.MAX_ENERGY ??
        200
      );

    if(Number.isFinite(energy)){
      playerEnergy = energy;
      localStorage.setItem(
        "rockEnergy",
        String(energy)
      );
    }

    if(Number.isFinite(coin)){
      playerCoin = coin;
      localStorage.setItem(
        "rockCoin",
        String(coin)
      );
    }

    if(Number.isFinite(maxEnergy) && maxEnergy > 0){
      localStorage.setItem(
        "rockMaxEnergy",
        String(maxEnergy)
      );
    }

    console.log(
      "BATTLE DASHBOARD OK:",
      {
        coin:playerCoin,
        energy:playerEnergy,
        maxEnergy
      }
    );

    updateUI();

    return raw;

  }catch(error){

    console.error(
      "BATTLE DASHBOARD ERROR:",
      error
    );

    showToast(
      "โหลดข้อมูลผู้เล่นไม่สำเร็จ: " +
      (
        error?.message ||
        String(error)
      )
    );

    return null;
  }
}


/* =========================================================
   BATTLE STATUS
========================================================= */
async function loadBattleStatus(){

  const api =
    window.APP_CONFIG?.API?.BATTLE;

  if(
    !api ||
    !window.ROCK ||
    typeof ROCK.getIdToken !== "function"
  ){
    return;
  }

  try{

    const idToken =
      ROCK.getIdToken();

    if(!idToken){
      return;
    }

    const response =
      await fetch(
        api,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            action:"battleStatus",
            idToken
          })
        }
      );

    const result =
      await response.json();

    if(
      !response.ok ||
      result?.success === false
    ){
      throw new Error(
        result?.error ||
        "โหลด Battle Status ไม่สำเร็จ"
      );
    }

    const payload =
      result?.data ??
      result ??
      {};

    const player =
      payload?.player ??
      payload?.user ??
      {};

    const energy =
      Number(
        player?.energy ??
        payload?.energy?.current ??
        payload?.energy
      );

    const stage =
      Number(
        player?.unlockedStage ??
        player?.unlocked_stage ??
        payload?.unlockedStage ??
        payload?.unlocked_stage
      );

    const coin =
      Number(
        player?.rock_coin ??
        player?.rockCoin ??
        player?.coin ??
        payload?.rockCoin ??
        payload?.rock_coin ??
        payload?.coin
      );

    if(Number.isFinite(energy)){
      playerEnergy = energy;

      localStorage.setItem(
        "rockEnergy",
        String(energy)
      );
    }

    if(Number.isFinite(stage)){
      unlockedStage =
        Math.max(
          1,
          Math.min(10,stage)
        );

      localStorage.setItem(
        "rockUnlockedStage",
        String(unlockedStage)
      );
    }

    updateUI();

  }catch(error){

    console.warn(
      "BATTLE STATUS:",
      error
    );
  }
}

function closeEnergyInfo(){

/* =========================================================
   REGEN TIMER
========================================================= */
const REGEN_TOTAL =
  30 * 60;

let regenSeconds =
  Number(
    localStorage.getItem("rockRegenSeconds")
  );

if(
  !Number.isFinite(regenSeconds) ||
  regenSeconds <= 0 ||
  regenSeconds > REGEN_TOTAL
){
  regenSeconds =
    25 * 60 + 30;
}


function renderTimer(){

  const el =
    document.getElementById(
      "regenTimer"
    );

  if(!el){
    return;
  }

  const h =
    Math.floor(
      regenSeconds / 3600
    );

  const m =
    Math.floor(
      (regenSeconds % 3600) / 60
    );

  const s =
    regenSeconds % 60;

  el.textContent =
    `${String(h).padStart(2,"0")}:` +
    `${String(m).padStart(2,"0")}:` +
    `${String(s).padStart(2,"0")}`;
}


function startTimer(){

  renderTimer();

  setInterval(
    () => {

      regenSeconds--;

      if(regenSeconds < 0){
        regenSeconds =
          REGEN_TOTAL;
      }

      localStorage.setItem(
        "rockRegenSeconds",
        String(regenSeconds)
      );

      renderTimer();
    },
    1000
  );
}


/* =========================================================
   TOAST
========================================================= */
let toastTimer = null;

function showToast(message){

  const el =
    document.getElementById(
      "battleToast"
    );

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        el.classList.remove(
          "show"
        );
      },
      2400
    );
}


/* =========================================================
   START
========================================================= */
async function startBattle(){

  loadCache();

  startTimer();

  if(OPEN_FIGHT_ON_LOAD){
    showFightMonster();
  }

  if(TEST_MODE){

    unlockedStage =
      10;

    updateStageLocks();
  }

  try{

    if(
      window.ROCK &&
      typeof ROCK.initLiff === "function"
    ){

      const ready =
        await ROCK.initLiff();

      if(!ready){
        return;
      }

      await Promise.allSettled([
        loadDashboard(),
        loadBattleStatus()
      ]);
    }

  }catch(error){

    console.warn(
      "BATTLE INIT:",
      error
    );
  }
}


let battleRefreshTimer = null;

function startBattleRefresh(){

  if(battleRefreshTimer){
    clearInterval(
      battleRefreshTimer
    );
  }

  const ms =
    Number(
      window.APP_CONFIG?.REFRESH_MS
    ) || 30000;

  battleRefreshTimer =
    setInterval(
      async () => {

        if(
          document.visibilityState !==
          "visible"
        ){
          return;
        }

        await Promise.allSettled([
          loadDashboard(),
          loadBattleStatus()
        ]);

      },
      ms
    );
}

document.addEventListener(
  "visibilitychange",
  async () => {

    if(
      document.visibilityState ===
      "visible"
    ){
      await Promise.allSettled([
        loadDashboard(),
        loadBattleStatus()
      ]);
    }
  }
);

document.addEventListener(
  "DOMContentLoaded",
  async () => {
    await startBattle();
    startBattleRefresh();
  }
);
</script>
