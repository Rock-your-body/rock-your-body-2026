<script>
"use strict";

/* =========================================================
   ROCK YOUR BODY 2026
   BATTLE TEMPLATE V3.4

   DATA ARCHITECTURE:
   LINE ID Token
   -> PLAYER dashboard = wallet/player เหมือน HOME/MISSION
   -> BATTLE status = boss/hp/ranking

   Frontend ไม่ส่ง line_user_id หรือ player_id เอง
========================================================= */


const $ =
  id =>
    document.getElementById(id);


const state = {
  lineProfile:null,
  player:null,
  battle:null,
  countdownTimer:null
};


/* =========================================================
   HELPERS
========================================================= */

function num(
  value,
  fallback=0
){
  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function pick(
  ...values
){
  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      return value;
    }
  }

  return null;
}


function clamp(
  value,
  min,
  max
){
  return Math.max(
    min,
    Math.min(
      max,
      num(value,0)
    )
  );
}


function fmtInt(
  value
){
  return Math.round(
    num(value,0)
  ).toLocaleString(
    "en-US"
  );
}


function setBar(
  id,
  percent
){
  const el =
    $(id);

  if(!el){
    return;
  }

  el.style.width =
    `${clamp(
      percent,
      0,
      100
    )}%`;
}


function showStatus(
  message,
  isError=false
){
  const el =
    $("status");

  el.textContent =
    message;

  el.classList.toggle(
    "error",
    Boolean(isError)
  );

  el.classList.add(
    "show"
  );

  clearTimeout(
    window.__battleTemplateToast
  );

  window.__battleTemplateToast =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      isError
        ? 5000
        : 2600
    );
}


function getApi(
  name
){

  if(
    window.APP_CONFIG?.getApi
  ){
    return window.APP_CONFIG.getApi(
      name
    );
  }

  const url =
    window.APP_CONFIG?.API?.[name];

  if(!url){
    throw new Error(
      `ไม่พบ API.${name}`
    );
  }

  return url;
}


/* =========================================================
   LIFF AUTH
========================================================= */

async function initLINE(){

  if(
    typeof liff ===
    "undefined"
  ){
    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  const liffId =
    window.APP_CONFIG?.LIFF_ID ||
    "2011201679-uNWz5yqF";


  if(!liffId){
    throw new Error(
      "ไม่พบ LIFF ID"
    );
  }


  await liff.init({
    liffId
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  const token =
    liff.getIDToken();

  if(!token){

    try{
      liff.logout();
    }catch{}

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  try{

    state.lineProfile =
      await liff.getProfile();

  }catch(error){

    console.warn(
      "LINE PROFILE ERROR:",
      error
    );

    state.lineProfile =
      null;
  }


  return true;
}


function idToken(){

  const token =
    liff.getIDToken();

  if(!token){
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  return token;
}


/* =========================================================
   POST API
========================================================= */

async function postJson(
  url,
  payload={}
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:"no-store",

        body:
          JSON.stringify({
            ...payload,
            idToken:
              idToken()
          })
      }
    );


  const raw =
    await response.text();

  let data = {};

  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      `API ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
    );
  }


  if(
    !response.ok ||
    data?.success === false
  ){

    const message =
      String(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );


    if(
      response.status === 401 ||
      message
        .toLowerCase()
        .includes(
          "idtoken expired"
        )
    ){

      try{
        liff.logout();
      }catch{}

      liff.login({
        redirectUri:
          window.location.href
      });

      return await new Promise(()=>{});
    }


    throw new Error(
      message
    );
  }


  return data;
}


/* =========================================================
   PLAYER DASHBOARD
   ใช้ Wallet/User ชุดเดียวกับ HOME + MISSION
========================================================= */

async function loadPlayerDashboard(){

  const result =
    await postJson(
      getApi("PLAYER"),
      {
        action:"dashboard"
      }
    );


  const data =
    result?.data ??
    result?.dashboard ??
    result ??
    {};


  const user =
    data?.user ??
    data?.player ??
    {};


  const energyObj =
    (
      data?.energy &&
      typeof data.energy ===
        "object"
    )
      ? data.energy
      : {};


  const expObj =
    (
      data?.exp &&
      typeof data.exp ===
        "object"
    )
      ? data.exp
      : {};


  const totalExp =
    num(
      pick(
        expObj.total,
        expObj.current,
        typeof data.exp ===
          "number"
          ? data.exp
          : null,
        user.exp,
        user.experience
      ),
      0
    );


  const expPerLevel =
    num(
      window.APP_CONFIG?.EXP_PER_LEVEL,
      500
    ) ||
    500;


  const level =
    Math.max(
      1,
      num(
        pick(
          data.level,
          user.level
        ),
        Math.floor(
          totalExp /
          expPerLevel
        ) + 1
      )
    );


  const levelExp =
    totalExp %
    expPerLevel;


  return {
    coin:
      Math.max(
        0,
        num(
          pick(
            data.rockCoin,
            data.rock_coin,
            data.coin,
            user.rockCoin,
            user.rock_coin,
            user.coin
          ),
          0
        )
      ),

    energy:
      Math.max(
        0,
        num(
          pick(
            energyObj.current,
            data.energyCurrent,
            data.currentEnergy,
            data.current_energy,
            typeof data.energy ===
              "number"
              ? data.energy
              : null,
            user.energy
          ),
          0
        )
      ),

    maxEnergy:
      Math.max(
        1,
        num(
          pick(
            energyObj.max,
            data.maxEnergy,
            data.max_energy,
            user.maxEnergy,
            user.max_energy,
            window.APP_CONFIG?.MAX_ENERGY,
            200
          ),
          200
        )
      ),

    level,

    totalExp,

    levelExp,

    expPerLevel,

    displayName:
      pick(
        user.display_name,
        user.displayName,
        user.name,
        data.display_name,
        data.displayName,
        state.lineProfile?.displayName,
        "ROCK HERO"
      ),

    pictureUrl:
      pick(
        user.picture_url,
        user.pictureUrl,
        data.picture_url,
        data.pictureUrl,
        state.lineProfile?.pictureUrl
      ),

    nextEnergyAt:
      pick(
        energyObj.nextEnergyAt,
        energyObj.next_energy_at,
        data.nextEnergyAt,
        data.next_energy_at,
        user.nextEnergyAt,
        user.next_energy_at
      )
  };
}


/* =========================================================
   BATTLE STATUS
========================================================= */

async function loadBattleStatus(){

  const api =
    getApi(
      "BATTLE"
    );


  /*
    V3.2 รองรับ stageStatus/battleStatus/status
  */
  for(
    const action of
    [
      "battleStatus",
      "status",
      "stageStatus"
    ]
  ){

    try{

      return await postJson(
        api,
        {
          action
        }
      );

    }catch(error){

      const message =
        String(
          error?.message ||
          ""
        ).toLowerCase();


      if(
        !message.includes(
          "unknown action"
        )
      ){
        throw error;
      }
    }
  }


  throw new Error(
    "Battle API ไม่รองรับ status"
  );
}


function normalizeBattle(
  raw
){

  const data =
    raw?.data ??
    raw ??
    {};


  const player =
    data?.player ??
    data?.user ??
    {};


  const stage =
    data?.stage ??
    data?.boss ??
    data?.monster ??
    {};


  const activeRun =
    data?.activeRun ??
    data?.active_run ??
    (
      Array.isArray(
        data?.runs
      )
        ? data.runs.find(
            row =>
              String(
                row?.status ||
                ""
              ).toLowerCase() ===
              "active"
          )
        : null
    );


  const maxHp =
    Math.max(
      0,
      num(
        pick(
          activeRun?.monster_max_hp,
          activeRun?.monsterMaxHp,
          stage.max_hp,
          stage.maxHp,
          stage.hp,
          stage.monster_max_hp
        ),
        0
      )
    );


  const currentHp =
    Math.max(
      0,
      num(
        pick(
          activeRun?.monster_hp,
          activeRun?.monsterHp,
          stage.current_hp,
          stage.currentHp,
          maxHp
        ),
        maxHp
      )
    );


  const ranking =
    Array.isArray(
      data?.ranking
    )
      ? data.ranking
      : (
          Array.isArray(
            data?.top3
          )
            ? data.top3
            : []
        );


  return {
    stage:{
      id:
        Math.max(
          1,
          num(
            pick(
              stage.id,
              stage.stage_id,
              player.unlockedStage,
              player.unlocked_stage,
              1
            ),
            1
          )
        ),

      name:
        pick(
          stage.name,
          stage.monster_name,
          stage.monsterName,
          "SUGAR MONSTER"
        ),

      maxHp,

      currentHp,

      energyCost:
        Math.max(
          0,
          num(
            pick(
              stage.energy_cost,
              stage.energyCost,
              stage.required_energy,
              stage.requiredEnergy,
              stage.energy
            ),
            0
          )
        )
    },

    ranking,

    stats:{
      wins:
        Math.max(
          0,
          num(
            pick(
              player.totalWins,
              player.total_wins,
              data.stats?.totalWins,
              data.stats?.total_wins
            ),
            0
          )
        ),

      attacks:
        Math.max(
          0,
          num(
            pick(
              player.totalAttacks,
              player.total_attacks,
              data.stats?.totalAttacks,
              data.stats?.total_attacks
            ),
            0
          )
        )
    }
  };
}


/* =========================================================
   STAGE IMAGE V3.4
   ตั้งชื่อไฟล์:
   battle-stage-1.png
   battle-stage-2.png
   battle-stage-3.png
   ...
========================================================= */

function getStageImageUrl(stageId){

  const id =
    Math.max(
      1,
      Number(stageId) || 1
    );

  return `./battle-stage-${id}.png?v=20260830-v34`;
}


function renderStageImage(){

  const img =
    $("stageImage");

  const stageId =
    state.battle?.stage?.id ||
    1;

  img.onload =
    ()=>{
      img.style.display =
        "block";
    };

  img.onerror =
    ()=>{
      /*
        ถ้าไม่มีไฟล์ของ Stage นั้น
        ซ่อน layer และให้ battle-template เดิมเป็น fallback
      */
      img.style.display =
        "none";
    };

  img.src =
    getStageImageUrl(
      stageId
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderPlayer(){

  const p =
    state.player;


  $("coinValue")
    .textContent =
      fmtInt(
        p.coin
      );


  $("energyValue")
    .textContent =
      `${fmtInt(
        p.energy
      )}/${fmtInt(
        p.maxEnergy
      )}`;


  $("battleEnergy")
    .textContent =
      `${fmtInt(
        p.energy
      )}/${fmtInt(
        p.maxEnergy
      )}`;


  setBar(
    "battleEnergyBar",
    (
      p.energy /
      p.maxEnergy
    ) * 100
  );


  $("playerName")
    .textContent =
      p.displayName ||
      "ROCK HERO";


  $("playerLevel")
    .textContent =
      `Lv. ${
        fmtInt(
          p.level
        )
      }`;


  $("playerExp")
    .textContent =
      `EXP ${
        fmtInt(
          p.levelExp
        )
      } / ${
        fmtInt(
          p.expPerLevel
        )
      }`;


  setBar(
    "playerExpBar",
    (
      p.levelExp /
      p.expPerLevel
    ) * 100
  );


  if(
    p.pictureUrl
  ){

    $("playerPhoto")
      .src =
        p.pictureUrl;

    $("playerPhoto")
      .style.display =
        "block";

  }else{

    $("playerPhoto")
      .style.display =
        "none";
  }


  startRecoveryCountdown(
    p.nextEnergyAt
  );
}


function renderBattle(){

  const b =
    state.battle;


  renderStageImage();


  $("bossName")
    .textContent =
      b.stage.name ||
      "SUGAR MONSTER";


  $("bossHpText")
    .textContent =
      b.stage.maxHp > 0
        ? `${fmtInt(
            b.stage.currentHp
          )} / ${fmtInt(
            b.stage.maxHp
          )}`
        : "-- / --";


  const hpPct =
    b.stage.maxHp > 0
      ? (
          b.stage.currentHp /
          b.stage.maxHp
        ) * 100
      : 0;


  $("bossHpPercent")
    .textContent =
      b.stage.maxHp > 0
        ? `${Math.round(
            hpPct
          )}%`
        : "--%";


  setBar(
    "bossHpBar",
    hpPct
  );


  const ranking =
    b.ranking;


  const scoreOf =
    row =>
      pick(
        row?.score,
        row?.points,
        row?.damage,
        row?.total_damage,
        row?.totalDamage,
        row?.exp,
        null
      );


  if(
    Array.isArray(
      ranking
    ) &&
    ranking.length
  ){

    $("rank1Score")
      .textContent =
        ranking[0]
          ? fmtInt(
              scoreOf(
                ranking[0]
              )
            )
          : "--";

    $("rank2Score")
      .textContent =
        ranking[1]
          ? fmtInt(
              scoreOf(
                ranking[1]
              )
            )
          : "--";

    $("rank3Score")
      .textContent =
        ranking[2]
          ? fmtInt(
              scoreOf(
                ranking[2]
              )
            )
          : "--";

  }else{

    /*
      fallback ถ้า backend ยังไม่มี ranking array
    */
    $("rank1Score")
      .textContent =
        fmtInt(
          b.stats.wins
        );

    $("rank2Score")
      .textContent =
        fmtInt(
          b.stats.attacks
        );

    $("rank3Score")
      .textContent =
        fmtInt(
          b.stage.id
        );
  }
}


/* =========================================================
   ENERGY RECOVERY
========================================================= */

function startRecoveryCountdown(
  nextEnergyAt
){

  clearInterval(
    state.countdownTimer
  );


  if(!nextEnergyAt){

    $("recoveryTime")
      .textContent =
        "พร้อมใช้งาน";

    return;
  }


  const target =
    new Date(
      nextEnergyAt
    );


  if(
    Number.isNaN(
      target.getTime()
    )
  ){

    $("recoveryTime")
      .textContent =
        "--:--:--";

    return;
  }


  const tick =
    ()=>{

      const diff =
        Math.max(
          0,
          target.getTime() -
          Date.now()
        );


      const seconds =
        Math.floor(
          diff /
          1000
        );


      const h =
        String(
          Math.floor(
            seconds /
            3600
          )
        ).padStart(
          2,
          "0"
        );


      const m =
        String(
          Math.floor(
            (
              seconds %
              3600
            ) /
            60
          )
        ).padStart(
          2,
          "0"
        );


      const s =
        String(
          seconds %
          60
        ).padStart(
          2,
          "0"
        );


      $("recoveryTime")
        .textContent =
          `${h}:${m}:${s}`;
    };


  tick();


  state.countdownTimer =
    setInterval(
      tick,
      1000
    );
}


/* =========================================================
   LOAD
========================================================= */

async function load(){

  try{

    const ready =
      await initLINE();

    if(
      ready === false
    ){
      return;
    }


    const [
      playerResult,
      battleResult
    ] =
      await Promise.all([
        loadPlayerDashboard(),
        loadBattleStatus()
      ]);


    state.player =
      playerResult;

    state.battle =
      normalizeBattle(
        battleResult
      );


    renderPlayer();
    renderBattle();


  }catch(error){

    console.error(
      "BATTLE PAGE ERROR:",
      error
    );


    showStatus(
      error?.message ||
      "โหลดข้อมูล Battle ไม่สำเร็จ",
      true
    );
  }
}

   NAVIGATION
========================================================= */

  fallback
){

  window.location.href =
    window.APP_CONFIG?.PAGE?.[key] ||
    fallback;
}

            state.player?.energy
          )
        } / ${
          fmtInt(
            state.player?.maxEnergy
          )
        }`
      );
    }

$("rankingButton")

$("rewardButton")

    }
  );


$("homeButton")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "HOME",
        "./dashboard.html"
      );
    }
  );


$("missionButton")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "MISSION",
        "./mission.html"
      );
    }
  );


$("battleButton")
  .addEventListener(
    "click",
    load
  );


/* =========================================================
   START
========================================================= */

(async()=>{

  await load();


  setInterval(
    load,
    Number(
      window.APP_CONFIG?.REFRESH_MS ||
      30000
    )
  );

})();
