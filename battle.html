<div
  id="status"
  class="status"
></div>


<script src="./common.js"></script>


<script>

const ROCK =
  window.ROCK;


const $ =
  id =>
    document.getElementById(id);


function goPage(name){

  const url =
    ROCK.CFG.PAGE[name];

  if(url){
    ROCK.go(url);
  }
}


function showStatus(
  message,
  error = false
){

  const el =
    $("status");

  el.textContent =
    message;

  el.className =
    error
      ? "status show error"
      : "status show";
}


function hideStatus(){

  $("status").className =
    "status";
}


function percent(
  current,
  max
){

  const c =
    Number(current) ||
    0;

  const m =
    Number(max) ||
    0;

  if(m <= 0){
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      c / m * 100
    )
  );
}


/* ==============================================
   NORMALIZE
=============================================== */

function normalizeBattle(raw){

  const user =
    raw?.user ||
    raw?.player ||
    {};


  const energyData =
    raw?.energy &&
    typeof raw.energy ===
      "object"
      ? raw.energy
      : {};


  const battle =
    raw?.battle ||
    {};


  const monster =
    battle?.monster ||
    {};


  const currentEnergy =
    ROCK.num(
      energyData.current ??
      user.energy,
      0
    );


  const maxEnergy =
    ROCK.num(
      energyData.max ??
      user.max_energy,
      ROCK.CFG.MAX_ENERGY
    );


  const hp =
    ROCK.num(
      monster.hp ??
      battle.hp,
      0
    );


  const maxHp =
    ROCK.num(
      monster.maxHp ??
      monster.max_hp ??
      battle.maxHp ??
      battle.max_hp,
      0
    );


  return {

    coin:
      ROCK.num(
        raw?.rockCoin ??
        raw?.rock_coin ??
        user.rock_coin,
        0
      ),

    energy:
      currentEnergy,

    maxEnergy,

    monsterName:
      monster.name ??
      battle.monsterName ??
      battle.monster_name ??
      "MONSTER",

    stage:
      monster.stage ??
      battle.stage ??
      "--",

    hp,

    maxHp,

    nextEnergy:
      energyData.nextRecharge ??
      energyData.next_recharge ??
      battle.nextEnergy ??
      "--:--",

    ranking:
      battle.ranking ||
      battle.rankings ||
      []
  };
}


/* ==============================================
   RENDER
=============================================== */

function renderBattle(raw){

  const data =
    normalizeBattle(raw);


  $("coin").textContent =
    ROCK.fmtInt(
      data.coin
    );


  $("energy").textContent =
    ROCK.fmtInt(
      data.energy
    ) +
    " / " +
    ROCK.fmtInt(
      data.maxEnergy
    );


  $("battleEnergy").textContent =
    ROCK.fmtInt(
      data.energy
    ) +
    " / " +
    ROCK.fmtInt(
      data.maxEnergy
    );


  $("energyBar").style.width =
    percent(
      data.energy,
      data.maxEnergy
    ) +
    "%";


  $("monsterName").textContent =
    data.monsterName;


  $("monsterStage").textContent =
    "STAGE " +
    data.stage;


  $("hpText").textContent =
    ROCK.fmtInt(
      data.hp
    ) +
    " / " +
    ROCK.fmtInt(
      data.maxHp
    );


  const hpPct =
    percent(
      data.hp,
      data.maxHp
    );


  $("hpBar").style.width =
    hpPct +
    "%";


  $("hpPercent").textContent =
    Math.round(
      hpPct
    ) +
    "%";


  $("nextEnergy").textContent =
    data.nextEnergy ||
    "--:--";


  renderRanking(
    data.ranking
  );
}


/* ==============================================
   RANKING
=============================================== */

function renderRanking(list){

  const ranks =
    Array.isArray(list)
      ? list
      : [];


  for(
    let i = 0;
    i < 3;
    i++
  ){

    const item =
      ranks[i];


    const element =
      $(
        "rank" +
        (i + 1)
      );


    if(!item){

      element.textContent =
        "-";

      continue;
    }


    const name =
      item.name ??
      item.displayName ??
      item.display_name ??
      "PLAYER";


    const score =
      item.score ??
      item.damage ??
      item.points ??
      0;


    element.textContent =
      name +
      "  " +
      ROCK.fmtInt(score);
  }
}


/* ==============================================
   LOAD
=============================================== */

let loading =
  false;


async function loadBattle(){

  if(loading){
    return;
  }


  loading =
    true;


  try{

    const raw =
      await ROCK.fetchDashboard();


    console.log(
      "BATTLE DATA:",
      raw
    );


    renderBattle(raw);


    hideStatus();


  }catch(error){

    console.error(
      "BATTLE LOAD ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error),
      true
    );


  }finally{

    loading =
      false;
  }
}


/* ==============================================
   START
=============================================== */

(async()=>{

  try{

    if(!ROCK){
      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );
    }


    showStatus(
      "กำลังโหลด Battle..."
    );


    /*
      Battle ใช้ LIFF Dashboard
    */

    const ok =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if(!ok){
      return;
    }


    await loadBattle();


    setInterval(
      ()=>{

        if(
          document.visibilityState ===
          "visible"
        ){
          loadBattle();
        }

      },
      ROCK.CFG.REFRESH_MS ||
      30000
    );


  }catch(error){

    console.error(error);


    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();

</script>
