<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061d68" />
  <title>ROCK YOUR BODY 2026 - BATTLE</title>
  <!-- BATTLE LIVE v2026-08-28-06 : external battle-template.png + unified rock_users + current stage -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260828-04"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#eef4ff;font-family:Arial,"Noto Sans Thai",sans-serif;color:#fff}
    body{min-height:100vh;overflow-x:hidden}

    .page{
      width:100%;
      display:flex;
      justify-content:center;
      padding:0;
      background:
        radial-gradient(circle at 50% 0%,#ffffff 0%,#eef5ff 40%,#d8e8ff 100%);
    }

    .stage{
      position:relative;
      width:min(100vw,1536px);
      aspect-ratio:1536/1024;
      background-image:url("./battle-template.png?v=20260828-06");
      background-size:100% 100%;
      background-repeat:no-repeat;
      overflow:hidden;
      box-shadow:0 10px 40px rgba(0,25,80,.18);
      user-select:none;
    }

    .overlay{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .live{
      position:absolute;
      pointer-events:none;
      text-shadow:0 2px 2px rgba(0,0,0,.18);
      font-weight:900;
      line-height:1;
    }

    /* top player HUD */
    .hud-coin{
      left:78.4%;
      top:3.1%;
      width:9.2%;
      height:6.3%;
      color:#071b5e;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(12px,2.1vw,34px);
      text-shadow:none;
      border-radius:10px;
    }

    .hud-energy{
      left:90.0%;
      top:3.1%;
      width:7.5%;
      height:6.3%;
      color:#071b5e;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(11px,1.7vw,28px);
      text-shadow:none;
      border-radius:10px;
      white-space:nowrap;
    }

    /* boss data patch */
    .boss-name-box{
      position:absolute;
      left:2.3%;
      top:27.2%;
      width:19%;
      height:15%;
      padding:1.2% 1.1%;
      background:linear-gradient(90deg,rgba(26,125,255,.98),rgba(30,130,255,.86),rgba(30,130,255,0));
      pointer-events:none;
    }

    .boss-name{
      color:#fff;
      font-size:clamp(16px,3.3vw,54px);
      line-height:.98;
      font-style:italic;
      letter-spacing:-1px;
    }

    .boss-stage{
      margin-top:.5em;
      color:#d8ebff;
      font-size:clamp(9px,1.1vw,18px);
      font-weight:800;
    }

    .hp-box{
      position:absolute;
      left:2.9%;
      top:43.6%;
      width:19.2%;
      height:14%;
      background:linear-gradient(90deg,rgba(27,124,252,.98),rgba(27,124,252,.88),rgba(27,124,252,0));
      padding:.5% .1%;
      pointer-events:none;
    }

    .hp-title{
      font-size:clamp(10px,1.6vw,26px);
      font-weight:900;
      margin-bottom:.6em;
    }

    .hp-track{
      width:80%;
      height:18%;
      min-height:8px;
      border-radius:999px;
      overflow:hidden;
      background:#0b3c8a;
      border:1px solid rgba(255,255,255,.45);
      box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
    }

    .hp-fill{
      height:100%;
      width:100%;
      background:linear-gradient(90deg,#ff1e13,#ff5b00);
      transition:width .35s ease;
    }

    .hp-text{
      margin-top:.45em;
      font-size:clamp(11px,1.55vw,25px);
      font-weight:900;
    }

    .hp-percent{
      margin-top:.2em;
      font-size:clamp(20px,3.3vw,52px);
      font-weight:1000;
    }

    /* energy card patch */
    .energy-card{
      position:absolute;
      left:56.4%;
      top:27.3%;
      width:13.4%;
      height:16%;
      background:#fff;
      color:#071b5e;
      border-radius:14px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-shadow:none;
      pointer-events:none;
    }

    .energy-card .title{
      font-size:clamp(10px,1.35vw,22px);
      font-weight:900;
      margin-bottom:.45em;
    }

    .energy-card .value{
      font-size:clamp(15px,2vw,32px);
      font-weight:1000;
      white-space:nowrap;
    }

    .energy-meter{
      position:absolute;
      left:54.6%;
      top:37.9%;
      width:15.2%;
      height:2.2%;
      border-radius:999px;
      background:#dbe4ef;
      overflow:hidden;
      border:1px solid rgba(10,45,100,.15);
      pointer-events:none;
    }

    .energy-fill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#ff8500,#ffc20a);
      transition:width .35s ease;
    }

    .energy-next{
      position:absolute;
      left:54.4%;
      top:48.2%;
      width:16%;
      text-align:center;
      color:#071b5e;
      font-size:clamp(9px,1.4vw,22px);
      font-weight:900;
      background:#fff;
      border-radius:10px;
      padding:.5% 0;
      text-shadow:none;
      pointer-events:none;
    }

    /* live battle stats over the ranking list */
    .record-card{
      position:absolute;
      left:33.3%;
      top:63.5%;
      width:22.2%;
      height:13%;
      border-radius:14px;
      padding:1.1% 1.4%;
      background:linear-gradient(180deg,#082e83,#031f61);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
      pointer-events:none;
      text-shadow:none;
    }

    .record-row{
      height:33.333%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:clamp(9px,1.18vw,19px);
    }
    .record-row:last-child{border-bottom:none}
    .record-row span:last-child{font-size:1.1em}

    /* click zones */
    .tap{
      position:absolute;
      z-index:20;
      pointer-events:auto;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      border:0;
      background:transparent;
    }
    .tap:active{background:rgba(255,255,255,.08)}

    .fight{left:71.1%;top:23.1%;width:27%;height:16.6%;border-radius:22px}
    .my-energy{left:71.1%;top:41.1%;width:27%;height:16.8%;border-radius:22px}
    .boss-reward{left:58.4%;top:60.0%;width:39.6%;height:18.6%;border-radius:22px}
    .ranking{left:1.6%;top:60.0%;width:55%;height:18.6%;border-radius:22px}
    .home{left:.9%;top:81%;width:31.3%;height:16.8%;border-radius:22px}
    .mission{left:33.1%;top:81%;width:32.4%;height:16.8%;border-radius:22px}
    .battle{left:66.2%;top:81%;width:32.5%;height:16.8%;border-radius:22px}

    .loading{
      position:absolute;
      inset:0;
      z-index:100;
      background:rgba(1,22,76,.72);
      display:flex;
      align-items:center;
      justify-content:center;
      backdrop-filter:blur(3px);
    }
    .loading.hidden{display:none}

    .loading-card{
      background:#fff;
      color:#081d62;
      padding:18px 24px;
      border-radius:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.25);
      font-weight:900;
      text-align:center;
      font-size:16px;
    }

    .spinner{
      width:32px;
      height:32px;
      border:4px solid #d7e2f5;
      border-top-color:#0b5ce8;
      border-radius:50%;
      margin:0 auto 10px;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .toast{
      position:fixed;
      left:50%;
      bottom:max(18px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:999;
      max-width:min(92vw,600px);
      padding:12px 16px;
      border-radius:12px;
      color:#fff;
      background:rgba(0,20,65,.94);
      box-shadow:0 8px 24px rgba(0,0,0,.3);
      font-size:14px;
      font-weight:800;
      opacity:0;
      pointer-events:none;
      transition:.22s;
      text-align:center;
    }
    .toast.show{opacity:1}

    @media (max-width:700px){
      .stage{width:100vw}
      .boss-name-box{top:26.6%}
      .hp-box{top:43.1%}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="stage" id="battleStage" aria-label="Battle dashboard">
      <div class="overlay">

        <div class="live hud-coin" id="hudCoin">--</div>
        <div class="live hud-energy" id="hudEnergy">--/--</div>

        <div class="boss-name-box">
          <div class="boss-name" id="bossName">กำลังโหลด...</div>
          <div class="boss-stage" id="bossStage">STAGE --</div>
        </div>

        <div class="hp-box">
          <div class="hp-title">HP</div>
          <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
          <div class="hp-text" id="hpText">-- / --</div>
          <div class="hp-percent" id="hpPercent">--%</div>
        </div>

        <div class="energy-card">
          <div class="title">MY ENERGY</div>
          <div class="value" id="energyBig">-- / --</div>
        </div>

        <div class="energy-meter">
          <div class="energy-fill" id="energyFill"></div>
        </div>

        <div class="energy-next" id="energyNext">พลังงานปัจจุบันของคุณ</div>

        <div class="record-card">
          <div class="record-row"><span>🏆 ชนะทั้งหมด</span><span id="totalWins">--</span></div>
          <div class="record-row"><span>⚔️ โจมตีทั้งหมด</span><span id="totalAttacks">--</span></div>
          <div class="record-row"><span>⭐ Stage ปัจจุบัน</span><span id="currentStage">--</span></div>
        </div>

        <button class="tap fight" id="fightBtn" aria-label="Fight Monster"></button>
        <button class="tap my-energy" id="energyBtn" aria-label="My Energy"></button>
        <button class="tap boss-reward" id="rewardBtn" aria-label="Boss Reward"></button>
        <button class="tap ranking" id="rankingBtn" aria-label="Battle Ranking"></button>
        <button class="tap home" id="homeBtn" aria-label="Home"></button>
        <button class="tap mission" id="missionBtn" aria-label="Mission"></button>
        <button class="tap battle" id="battleBtn" aria-label="Battle"></button>


        <div id="stageBadge" style="
          position:absolute;
          left:2.4%;
          top:23.2%;
          z-index:9;
          min-width:120px;
          padding:8px 16px;
          border-radius:999px;
          background:linear-gradient(180deg,#0a43a4,#06266f);
          border:2px solid rgba(255,255,255,.75);
          box-shadow:0 4px 12px rgba(0,0,0,.25);
          font-weight:1000;
          font-size:clamp(10px,1.25vw,20px);
          text-align:center;
          pointer-events:none;
        ">STAGE --</div>

        <div class="loading" id="loading">
          <div class="loading-card">
            <div class="spinner"></div>
            กำลังโหลดข้อมูลผู้เล่น...
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      player: null,
      stage: null,
      runs: [],
      activeRun: null,
      currentStageId: 1
    };

    const $ = id => document.getElementById(id);

    function toast(message){
      const el = $("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function setLoading(show){
      $("loading").classList.toggle("hidden", !show);
    }

    function isJwtLike(token){
      if(typeof token !== "string") return false;
      const parts = token.trim().split(".");
      return parts.length === 3 && parts.every(Boolean);
    }

    function decodeJwtPayloadSafe(token){
      try{
        if(!isJwtLike(token)) return null;
        let b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
        while(b64.length % 4) b64 += "=";
        const binary = atob(b64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }catch{
        return null;
      }
    }

    function tokenExpired(token, bufferSeconds=45){
      const payload = decodeJwtPayloadSafe(token);
      const exp = Number(payload?.exp);
      if(!Number.isFinite(exp)) return false;
      return exp <= Math.floor(Date.now()/1000) + bufferSeconds;
    }

    async function ensureLiff(){
      if(typeof liff === "undefined"){
        throw new Error("LINE LIFF SDK ไม่พร้อม");
      }

      const liffId =
        window.APP_CONFIG?.LIFF_ID ||
        window.ROCK?.CFG?.LIFF_ID ||
        window.ROCK?.CFG?.LIFF?.HOME;

      if(!liffId){
        throw new Error("ไม่พบ LIFF_ID ใน app-config.js");
      }

      await liff.init({liffId});

      if(!liff.isLoggedIn()){
        liff.login({redirectUri: window.location.href});
        return false;
      }

      const token = liff.getIDToken();

      if(!token || !isJwtLike(token) || tokenExpired(token)){
        try{ liff.logout(); }catch{}
        liff.login({redirectUri: window.location.href});
        return false;
      }

      return true;
    }

    function getIdToken(){
      const token = liff.getIDToken();
      if(!token || !isJwtLike(token)){
        throw new Error("LINE ID Token format ไม่ถูกต้อง");
      }
      if(tokenExpired(token,30)){
        throw new Error("LINE ID Token หมดอายุ");
      }
      return token;
    }

    async function battleApi(payload){
      const api = window.APP_CONFIG?.API?.BATTLE;
      if(!api) throw new Error("ไม่พบ BATTLE API ใน app-config.js");

      const response = await fetch(api,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          ...payload,
          idToken:getIdToken()
        })
      });

      const text = await response.text();
      let data = {};
      try{ data = text ? JSON.parse(text) : {}; }
      catch{ throw new Error("Battle API ตอบกลับไม่ใช่ JSON"); }

      if(!response.ok || data?.success === false){
        const msg = String(data?.error || data?.message || `HTTP ${response.status}`);
        const low = msg.toLowerCase();
        if(
          response.status === 401 ||
          low.includes("jws format") ||
          low.includes("authentication failed") ||
          low.includes("idtoken expired")
        ){
          try{ liff.logout(); }catch{}
          liff.login({redirectUri:window.location.href});
          return await new Promise(()=>{});
        }
        throw new Error(msg);
      }

      return data;
    }

    function getActiveRun(){
      const stageId = Number(state.currentStageId || 1);

      return (state.runs || []).find(run =>
        Number(run.stage_id) === stageId &&
        run.status === "active"
      ) || null;
    }

    function formatNumber(n){
      const x = Number(n);
      return Number.isFinite(x) ? x.toLocaleString("en-US") : "--";
    }

    function render(){
      const p = state.player || {};
      const s = state.stage || {};
      const active = state.activeRun;

      /*
        Coin / Energy / EXP / Level
        ต้องมาจาก battleStatus -> rock_users ชุดเดียวกับ HOME / MISSION
      */
      const coin = Number(
        p.rockCoin ??
        p.rock_coin ??
        0
      );

      const energy = Number(
        p.energy ??
        0
      );

      const maxEnergy = Number(
        p.maxEnergy ??
        p.max_energy ??
        200
      );

      /*
        Stage ปัจจุบัน = unlockedStage จาก battle_player_state
        Backend battleStatus จะคืน stage object ของ Stage นี้
      */
      const currentStageId = Number(
        p.unlockedStage ??
        p.unlocked_stage ??
        s.id ??
        1
      );

      state.currentStageId =
        Math.max(
          1,
          Math.min(
            10,
            currentStageId
          )
        );

      const hpMax = Number(
        active?.monster_max_hp ??
        s.hp ??
        0
      );

      const hp = Number(
        active?.monster_hp ??
        hpMax
      );

      const hpPct =
        hpMax > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (hp / hpMax) * 100
              )
            )
          : 0;

      const energyPct =
        maxEnergy > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (energy / maxEnergy) * 100
              )
            )
          : 0;


      $("hudCoin").textContent =
        formatNumber(coin);

      $("hudEnergy").textContent =
        `${formatNumber(energy)}/${formatNumber(maxEnergy)}`;


      $("bossName").textContent =
        s.name ||
        `STAGE ${state.currentStageId}`;

      $("bossStage").textContent =
        `STAGE ${state.currentStageId}`;

      $("stageBadge").textContent =
        `STAGE ${state.currentStageId}`;


      $("hpText").textContent =
        `${formatNumber(hp)} / ${formatNumber(hpMax)}`;

      $("hpPercent").textContent =
        `${Math.round(hpPct)}%`;

      $("hpFill").style.width =
        `${hpPct}%`;


      $("energyBig").textContent =
        `${formatNumber(energy)} / ${formatNumber(maxEnergy)}`;

      $("energyFill").style.width =
        `${energyPct}%`;


      const required =
        Number(
          s.energy ??
          0
        );

      if(required > 0){

        if(energy >= required){

          $("energyNext").textContent =
            `พร้อมต่อสู้ Stage ${state.currentStageId} • ใช้ ${formatNumber(required)} Energy`;

        }else{

          $("energyNext").textContent =
            `Stage ${state.currentStageId} ต้องการอีก ${formatNumber(required - energy)} Energy`;

        }

      }else{

        $("energyNext").textContent =
          `Stage ปัจจุบัน ${state.currentStageId}`;

      }


      $("totalWins").textContent =
        formatNumber(
          p.totalWins ??
          p.total_wins ??
          0
        );

      $("totalAttacks").textContent =
        formatNumber(
          p.totalAttacks ??
          p.total_attacks ??
          0
        );

      $("currentStage").textContent =
        String(
          state.currentStageId
        );
    }

    async function loadBattle(){
      setLoading(true);

      try{

        const ready =
          await ensureLiff();

        if(ready === false){
          return;
        }


        const data =
          await battleApi({
            action:"battleStatus"
          });


        /*
          Backend unified-energy:
          player.rockCoin / player.energy / player.maxEnergy
          มาจาก rock_users โดยตรง
          จึงเป็นข้อมูลเดียวกับ HOME และ MISSION
        */
        state.player =
          data?.player ||
          {};


        const unlockedStage =
          Number(
            state.player?.unlockedStage ??
            state.player?.unlocked_stage ??
            data?.stage?.id ??
            1
          );


        state.currentStageId =
          Math.max(
            1,
            Math.min(
              10,
              unlockedStage
            )
          );


        /*
          stage ที่ backend คืนมา คือ Stage ปัจจุบัน
        */
        state.stage =
          data?.stage ||
          {
            id:
              state.currentStageId,

            name:
              `STAGE ${state.currentStageId}`,

            energy:
              0,

            hp:
              0,

            damage:
              0
          };


        state.runs =
          Array.isArray(
            data?.runs
          )
            ? data.runs
            : [];


        state.activeRun =
          getActiveRun();


        console.log(
          "BATTLE LIVE DATA:",
          {
            rockCoin:
              state.player?.rockCoin,

            energy:
              state.player?.energy,

            maxEnergy:
              state.player?.maxEnergy,

            currentStage:
              state.currentStageId,

            stage:
              state.stage,

            activeRun:
              state.activeRun
          }
        );


        render();


      }catch(error){

        console.error(
          "BATTLE LOAD ERROR",
          error
        );

        toast(
          error?.message ||
          "โหลดข้อมูล Battle ไม่สำเร็จ"
        );

      }finally{

        setLoading(false);

      }
    }

    function go(url){
      window.location.href = url;
    }

    $("fightBtn").addEventListener("click",()=>{
      const p =
        state.player ||
        {};

      const s =
        state.stage ||
        {};

      const stageId =
        Number(
          state.currentStageId ||
          p.unlockedStage ||
          s.id ||
          1
        );

      const energy =
        Number(
          p.energy ??
          0
        );

      const required =
        Number(
          s.energy ??
          0
        );


      if(
        required > 0 &&
        energy < required
      ){

        toast(
          `Energy ไม่พอสำหรับ Stage ${stageId} • ต้องใช้ ${formatNumber(required)} แต่มี ${formatNumber(energy)}`
        );

        return;
      }


      go(
        `./battle_stage.html?stage=${stageId}`
      );
    });

    $("energyBtn").addEventListener("click",()=>{
      const p = state.player || {};
      toast(`Energy ของคุณ ${formatNumber(p.energy)} / ${formatNumber(p.maxEnergy ?? 200)}`);
    });

    $("rewardBtn").addEventListener("click",()=>go("./rewards.html"));
    $("rankingBtn").addEventListener("click",()=>go("./ranking.html"));
    $("homeBtn").addEventListener("click",()=>go(window.APP_CONFIG?.PAGES?.HOME || "./HOME.html"));
    $("missionBtn").addEventListener("click",()=>go(window.APP_CONFIG?.PAGES?.MISSION || "./mission.html"));
    $("battleBtn").addEventListener("click",()=>loadBattle());

    window.addEventListener("pageshow",()=>loadBattle());
  </script>
</body>
</html>
