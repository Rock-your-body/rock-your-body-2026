<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260829-clean-v2"></script>

  <style>
    :root{
      --navy:#062a73;
      --navy-2:#00184f;
      --blue:#005be7;
      --blue-2:#02329f;
      --light:#f4f8ff;
      --line:#c9d9f1;
      --text:#0b2f70;
      --orange:#ff9d00;
      --green:#17a84b;
      --purple:#6023cc;
      --red:#e72323;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#eef4ff;
      font-family:"Prompt",Arial,sans-serif;
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
    }

    button{
      font:inherit;
    }

    #app{
      width:min(100%,1280px);
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 20%,#ffffff 0,#f7faff 35%,#eef4ff 100%);
      overflow:hidden;
    }

    /* =====================================================
       HEADER
    ====================================================== */
    .header{
      min-height:105px;
      padding:14px 22px 12px;
      display:grid;
      grid-template-columns:220px 1fr 310px;
      align-items:center;
      gap:18px;
      background:#fff;
    }

    .hospital{
      display:flex;
      align-items:center;
      gap:10px;
      color:#0a2767;
      font-weight:900;
      line-height:.92;
    }

    .hospital-mark{
      width:58px;
      height:58px;
      border-radius:15px;
      background:
        linear-gradient(180deg,#e60012 0 50%,#073a9b 50% 100%);
      position:relative;
      box-shadow:0 3px 10px rgba(0,0,0,.12);
    }

    .hospital-mark::before,
    .hospital-mark::after{
      content:"";
      position:absolute;
      background:#fff;
      border-radius:3px;
    }

    .hospital-mark::before{
      width:15px;
      height:42px;
      left:21px;
      top:8px;
    }

    .hospital-mark::after{
      width:42px;
      height:15px;
      left:8px;
      top:21px;
    }

    .hospital-name{
      font-size:24px;
      letter-spacing:-1px;
    }

    .hospital-name small{
      display:block;
      margin-top:6px;
      color:#707070;
      font-size:17px;
      text-align:center;
    }

    .brand{
      text-align:center;
      min-width:0;
    }

    .brand-title{
      margin:0;
      color:#0a256d;
      font-size:clamp(32px,5.6vw,72px);
      font-weight:900;
      font-style:italic;
      letter-spacing:-3px;
      line-height:.95;
      white-space:nowrap;
    }

    .brand-title .red{
      color:#bc0d17;
    }

    .brand-title .year{
      font-size:.48em;
      font-style:normal;
      letter-spacing:-1px;
    }

    .brand-sub{
      margin-top:8px;
      font-size:clamp(13px,2vw,25px);
      font-weight:900;
      letter-spacing:2px;
      white-space:nowrap;
    }

    .brand-sub .move{color:#1342b7}
    .brand-sub .eat{color:#f06b13}
    .brand-sub .sleep{color:#4c26ad}
    .brand-sub .health{color:#18873a}

    .wallet{
      min-height:76px;
      border:1px solid #dbe4f0;
      border-radius:17px;
      background:#fff;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 5px 14px rgba(19,50,99,.16);
      overflow:hidden;
    }

    .wallet-item{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:9px 10px;
      min-width:0;
    }

    .wallet-item + .wallet-item{
      border-left:1px solid #c9d2df;
    }

    .wallet-icon{
      font-size:42px;
      line-height:1;
      filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
    }

    .wallet-value{
      color:#09215f;
      font-size:22px;
      font-weight:600;
      line-height:1.05;
      white-space:nowrap;
    }

    .wallet-label{
      margin-top:5px;
      font-size:12px;
      font-weight:800;
      color:#0a2867;
      white-space:nowrap;
    }

    /* =====================================================
       BATTLE TITLE
    ====================================================== */
    .battle-title{
      margin:0 12px;
      height:66px;
      border-radius:18px 18px 0 0;
      background:linear-gradient(180deg,#083c9a,#001c5f);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      font-size:clamp(26px,4vw,48px);
      font-weight:900;
      box-shadow:0 5px 12px rgba(0,35,100,.25);
    }

    .battle-title .icon{
      font-size:46px;
    }

    /* =====================================================
       MAIN ARENA
    ====================================================== */
    .arena{
      margin:0 12px;
      padding:16px;
      border-radius:0 0 24px 24px;
      background:
        radial-gradient(circle at 35% 15%,#2a8bff 0,#0a62dc 27%,#0148bd 56%,#063b96 100%);
      box-shadow:0 8px 20px rgba(0,47,128,.26);
    }

    .arena-top{
      display:grid;
      grid-template-columns:minmax(0,1.35fr) 250px 330px;
      gap:14px;
      min-height:350px;
    }

    .boss-panel{
      min-width:0;
      position:relative;
      border-radius:20px;
      overflow:hidden;
      padding:16px 18px;
      background:
        radial-gradient(circle at 50% 42%,rgba(255,255,255,.18),transparent 30%),
        linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,10,80,.08));
    }

    .boss-month{
      display:inline-block;
      padding:7px 17px;
      border-radius:8px;
      background:linear-gradient(180deg,#123f9c,#062d76);
      color:#fff;
      font-weight:900;
      font-style:italic;
      font-size:18px;
      box-shadow:0 3px 7px rgba(0,0,0,.2);
    }

    .boss-name{
      margin-top:10px;
      max-width:42%;
      color:#fff;
      font-size:clamp(34px,4.3vw,66px);
      font-weight:900;
      font-style:italic;
      line-height:.95;
      text-shadow:0 4px 8px rgba(0,20,80,.4);
      word-break:break-word;
    }

    .boss-visual{
      position:absolute;
      left:39%;
      right:2%;
      top:8%;
      bottom:5%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:none;
    }

    .monster{
      width:min(92%,410px);
      aspect-ratio:1.15/1;
      position:relative;
      border-radius:48% 52% 45% 45%;
      background:
        radial-gradient(circle at 33% 28%,#ff6672 0 2%,transparent 2.5%),
        radial-gradient(circle at 57% 20%,#ffd84f 0 1.7%,transparent 2.2%),
        radial-gradient(circle at 70% 35%,#67ddff 0 1.7%,transparent 2.2%),
        radial-gradient(circle at 28% 55%,#79e565 0 1.7%,transparent 2.2%),
        radial-gradient(circle at 77% 64%,#ffed6d 0 1.7%,transparent 2.2%),
        radial-gradient(circle at 48% 72%,#67ddff 0 1.7%,transparent 2.2%),
        linear-gradient(145deg,#ff4b62,#db1f3d 72%);
      border:5px solid rgba(130,0,25,.72);
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,.25),
        inset 0 -12px 18px rgba(125,0,20,.22),
        0 22px 30px rgba(0,18,70,.45);
    }

    .monster::before,
    .monster::after{
      content:"";
      position:absolute;
      width:70px;
      height:95px;
      top:-52px;
      background:linear-gradient(135deg,#6e2a12,#1e0a08);
      clip-path:polygon(50% 0,100% 100%,0 100%);
      z-index:-1;
    }

    .monster::before{
      left:60px;
      transform:rotate(-18deg);
    }

    .monster::after{
      right:60px;
      transform:rotate(18deg);
    }

    .eye{
      position:absolute;
      top:33%;
      width:38px;
      height:45px;
      border-radius:50%;
      background:#170a0b;
      box-shadow:inset 0 6px 0 rgba(255,255,255,.2);
    }

    .eye.left{left:30%}
    .eye.right{right:30%}

    .brow{
      position:absolute;
      top:29%;
      width:60px;
      height:10px;
      border-radius:10px;
      background:#21090c;
    }

    .brow.left{
      left:23%;
      transform:rotate(17deg);
    }

    .brow.right{
      right:23%;
      transform:rotate(-17deg);
    }

    .mouth{
      position:absolute;
      left:29%;
      right:29%;
      top:53%;
      height:28%;
      border-radius:22px 22px 45% 45%;
      background:#3f0810;
      border:5px solid #8e0c1e;
      overflow:hidden;
    }

    .tongue{
      position:absolute;
      left:24%;
      right:24%;
      bottom:-15%;
      height:45%;
      border-radius:50% 50% 0 0;
      background:#ff6d72;
    }

    .tooth{
      position:absolute;
      top:-2px;
      width:18px;
      height:28px;
      background:#fff;
      clip-path:polygon(0 0,100% 0,50% 100%);
    }

    .tooth.t1{left:18%}
    .tooth.t2{right:18%}

    .platform{
      position:absolute;
      left:8%;
      right:8%;
      bottom:-5px;
      height:54px;
      border-radius:50%;
      background:
        radial-gradient(ellipse at center,#5f7493 0,#3c536f 42%,#172d4d 70%);
      border:5px solid #a9b7c9;
      box-shadow:0 10px 12px rgba(0,0,0,.28);
      z-index:-2;
    }

    .hp-area{
      position:absolute;
      left:18px;
      bottom:22px;
      width:min(43%,340px);
      color:#fff;
    }

    .hp-label{
      font-size:20px;
      font-weight:900;
    }

    .hp-row{
      margin-top:6px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .hp-track{
      flex:1;
      height:20px;
      border-radius:999px;
      overflow:hidden;
      background:#07358b;
      border:1px solid rgba(255,255,255,.35);
    }

    .hp-fill{
      width:0;
      height:100%;
      background:linear-gradient(180deg,#ff3f1f,#e00000);
      border-radius:inherit;
      transition:width .35s ease;
    }

    .hp-text{
      margin-top:8px;
      font-size:21px;
      font-weight:700;
    }

    .hp-percent{
      margin-top:4px;
      font-size:38px;
      font-weight:900;
    }

    /* =====================================================
       ENERGY CARD
    ====================================================== */
    .energy-panel{
      padding:18px 15px;
      border-radius:20px;
      background:#fff;
      box-shadow:0 5px 15px rgba(0,28,85,.2);
      color:#0a2868;
      min-width:0;
    }

    .energy-title{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:19px;
      font-weight:900;
    }

    .energy-title .bolt{
      font-size:55px;
      color:#ff9d00;
      filter:drop-shadow(0 2px 1px #9c4500);
    }

    .energy-big{
      margin:8px 0 10px;
      text-align:center;
      font-size:31px;
      font-weight:700;
      white-space:nowrap;
    }

    .energy-track{
      height:25px;
      border-radius:999px;
      overflow:hidden;
      background:#dfe8f2;
      border:1px solid #b8c7d9;
    }

    .energy-fill{
      width:0;
      height:100%;
      background:linear-gradient(180deg,#ffb800,#ff8200);
      transition:width .35s ease;
    }

    .energy-divider{
      height:1px;
      margin:22px 0;
      background:#ccd6e3;
    }

    .recovery-label{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:800;
    }

    .recovery-time{
      margin-top:8px;
      text-align:center;
      font-size:28px;
      font-weight:800;
      letter-spacing:.5px;
    }

    /* =====================================================
       SIDE ACTIONS
    ====================================================== */
    .actions{
      display:grid;
      grid-template-rows:1fr 1fr;
      gap:14px;
    }

    .action-card{
      width:100%;
      border:2px solid #418dff;
      border-radius:22px;
      background:linear-gradient(160deg,#0d5bd7,#02359b);
      color:#fff;
      display:grid;
      grid-template-columns:78px 1fr 28px;
      align-items:center;
      gap:10px;
      padding:18px 15px;
      text-align:left;
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.08),
        0 5px 12px rgba(0,29,100,.23);
      cursor:pointer;
    }

    .action-icon{
      font-size:56px;
      line-height:1;
      text-align:center;
    }

    .action-title{
      font-size:22px;
      font-weight:900;
    }

    .action-sub{
      margin-top:4px;
      font-size:15px;
      font-weight:500;
    }

    .arrow{
      font-size:34px;
      font-weight:800;
      text-align:right;
    }

    /* =====================================================
       BOTTOM CARDS
    ====================================================== */
    .arena-bottom{
      display:grid;
      grid-template-columns:1.18fr .82fr;
      gap:14px;
      margin-top:14px;
    }

    .ranking-card,
    .reward-card{
      min-height:150px;
      border-radius:20px;
      color:#fff;
      overflow:hidden;
    }

    .ranking-card{
      display:grid;
      grid-template-columns:170px 1fr;
      padding:16px;
      background:linear-gradient(150deg,#0754c4,#032c82);
      border:2px solid #4fa3ff;
      cursor:pointer;
    }

    .ranking-title{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .ranking-trophy{
      font-size:78px;
    }

    .ranking-title strong{
      display:block;
      font-size:25px;
      line-height:1.15;
    }

    .ranking-title span{
      display:block;
      margin-top:6px;
      font-size:16px;
    }

    .ranking-list{
      align-self:center;
      display:grid;
      gap:9px;
      padding-left:12px;
    }

    .rank-row{
      min-height:34px;
      display:grid;
      grid-template-columns:40px 1fr auto;
      align-items:center;
      gap:9px;
      font-size:16px;
      font-weight:700;
      border-bottom:1px solid rgba(255,255,255,.18);
    }

    .rank-row:last-child{
      border-bottom:0;
    }

    .rank-score{
      font-weight:600;
    }

    .reward-card{
      position:relative;
      padding:24px 170px 20px 30px;
      background:linear-gradient(150deg,#6822ca,#3d118e);
      border:2px solid #8f51e8;
      cursor:pointer;
    }

    .reward-title{
      font-size:25px;
      font-weight:900;
    }

    .reward-sub{
      margin-top:8px;
      font-size:17px;
    }

    .chest{
      position:absolute;
      right:24px;
      bottom:18px;
      width:120px;
      height:78px;
      border-radius:16px 16px 24px 24px;
      background:linear-gradient(180deg,#ffc34f,#d47200);
      border:5px solid #7a3a05;
      box-shadow:0 8px 12px rgba(0,0,0,.25);
    }

    .chest::before{
      content:"";
      position:absolute;
      left:-5px;
      right:-5px;
      top:-38px;
      height:45px;
      border-radius:50px 50px 5px 5px;
      background:linear-gradient(180deg,#7e2b64,#4b1548);
      border:5px solid #7a3a05;
    }

    .chest-lock{
      position:absolute;
      left:50%;
      top:8px;
      transform:translateX(-50%);
      width:30px;
      height:33px;
      border-radius:6px;
      background:#ffd43b;
      border:4px solid #7a3a05;
      z-index:2;
    }

    /* =====================================================
       NAV
    ====================================================== */
    .nav{
      margin:14px 12px 12px;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:12px;
    }

    .nav-btn{
      min-height:110px;
      border:2px solid #0746ad;
      border-radius:20px;
      background:linear-gradient(150deg,#063da7,#001f68);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      cursor:pointer;
      box-shadow:inset 0 0 18px rgba(255,255,255,.05);
    }

    .nav-btn.active{
      background:linear-gradient(150deg,#e11414,#9f0000);
      border-color:#ef4040;
    }

    .nav-icon{
      font-size:55px;
    }

    .nav-main{
      font-size:clamp(22px,3vw,42px);
      font-weight:900;
      font-style:italic;
      line-height:1;
    }

    .nav-sub{
      margin-top:7px;
      font-size:14px;
      font-style:normal;
      font-weight:500;
      text-align:center;
    }

    /* =====================================================
       STATUS
    ====================================================== */
    #status{
      position:fixed;
      left:50%;
      bottom:max(18px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:99999;
      max-width:calc(100vw - 28px);
      padding:11px 17px;
      border-radius:14px;
      background:#153b70;
      color:#fff;
      text-align:center;
      font-size:13px;
      font-weight:700;
      box-shadow:0 8px 25px rgba(0,0,0,.28);
      display:none;
    }

    #status.show{display:block}
    #status.error{background:#c62828}

    /* =====================================================
       MOBILE
    ====================================================== */
    @media(max-width:900px){
      .header{
        grid-template-columns:145px 1fr 230px;
        gap:8px;
        padding:9px 10px;
      }

      .hospital-mark{
        width:44px;
        height:44px;
      }

      .hospital-mark::before{
        width:12px;
        height:32px;
        left:16px;
        top:6px;
      }

      .hospital-mark::after{
        width:32px;
        height:12px;
        left:6px;
        top:16px;
      }

      .hospital-name{font-size:16px}
      .hospital-name small{font-size:12px}

      .wallet{
        min-height:58px;
      }

      .wallet-icon{font-size:28px}
      .wallet-value{font-size:14px}
      .wallet-label{font-size:8px}

      .arena-top{
        grid-template-columns:minmax(0,1fr) 190px 245px;
        min-height:300px;
      }

      .action-card{
        grid-template-columns:55px 1fr 22px;
        padding:12px 10px;
      }

      .action-icon{font-size:42px}
      .action-title{font-size:17px}
      .action-sub{font-size:12px}

      .ranking-card{
        grid-template-columns:120px 1fr;
      }

      .ranking-trophy{font-size:60px}
      .ranking-title strong{font-size:18px}
      .rank-row{font-size:13px}

      .nav-btn{min-height:82px}
      .nav-icon{font-size:40px}
    }

    @media(max-width:680px){
      .header{
        grid-template-columns:95px 1fr 148px;
        padding:7px 6px;
      }

      .hospital{
        gap:4px;
      }

      .hospital-mark{
        width:34px;
        height:34px;
        border-radius:9px;
      }

      .hospital-mark::before{
        width:8px;
        height:24px;
        left:13px;
        top:5px;
      }

      .hospital-mark::after{
        width:24px;
        height:8px;
        left:5px;
        top:13px;
      }

      .hospital-name{
        font-size:10px;
        letter-spacing:-.4px;
      }

      .hospital-name small{
        margin-top:3px;
        font-size:8px;
      }

      .brand-title{
        font-size:clamp(22px,7vw,34px);
        letter-spacing:-1.5px;
      }

      .brand-sub{
        margin-top:4px;
        font-size:8px;
        letter-spacing:.7px;
      }

      .wallet{
        min-height:44px;
        border-radius:10px;
      }

      .wallet-item{
        gap:3px;
        padding:4px 3px;
      }

      .wallet-icon{font-size:18px}
      .wallet-value{font-size:10px}
      .wallet-label{font-size:6px;margin-top:2px}

      .battle-title{
        margin:0 5px;
        height:42px;
        border-radius:10px 10px 0 0;
        gap:8px;
        font-size:22px;
      }

      .battle-title .icon{font-size:26px}

      .arena{
        margin:0 5px;
        padding:7px;
        border-radius:0 0 13px 13px;
      }

      .arena-top{
        grid-template-columns:1fr 30% 36%;
        gap:5px;
        min-height:235px;
      }

      .boss-panel{
        border-radius:10px;
        padding:8px;
      }

      .boss-month{
        padding:3px 7px;
        font-size:8px;
        border-radius:4px;
      }

      .boss-name{
        margin-top:4px;
        font-size:clamp(19px,6vw,28px);
      }

      .boss-visual{
        left:35%;
        right:-4%;
        top:10%;
      }

      .monster{
        border-width:3px;
      }

      .monster::before,
      .monster::after{
        width:35px;
        height:48px;
        top:-26px;
      }

      .monster::before{left:30px}
      .monster::after{right:30px}

      .eye{
        width:20px;
        height:23px;
      }

      .brow{
        width:30px;
        height:5px;
      }

<div id="status"></div>


<script>
"use strict";

/* =========================================================
   ROCK YOUR BODY 2026
   BATTLE APP V3.0 — NO TEMPLATE IMAGE
   Identity:
   LINE ID Token -> Edge Function -> players -> player_id
========================================================= */

const $ =
  id =>
    document.getElementById(id);

const state = {
  player:null,
  stage:null,
  runs:[],
  activeRun:null,
  ranking:[]
};


function num(
  value,
  fallback=0
){
  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function pick(
  ...values
){
  for(const value of values){
    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){
      return value;
    }
  }

  return null;
}


function formatNumber(
  value
){
  const n =
    Number(value);

  return Number.isFinite(n)
    ? Math.round(n).toLocaleString("en-US")
    : "--";
}


function clamp(
  value,
  min,
  max
){
  return Math.max(
    min,
    Math.min(
      max,
      num(value,0)
    )
  );
}


function showStatus(
  message,
  isError=false
){
  const el =
    $("status");

  el.textContent =
    message;

  el.classList.toggle(
    "error",
    Boolean(isError)
  );

  el.classList.add(
    "show"
  );

  clearTimeout(
    window.__battleStatusTimer
  );

  window.__battleStatusTimer =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      isError
        ? 5500
        : 2600
    );
}


function getApi(
  name
){
  if(
    window.APP_CONFIG?.getApi
  ){
    return window.APP_CONFIG.getApi(
      name
    );
  }

  const url =
    window.APP_CONFIG?.API?.[name];

  if(!url){
    throw new Error(
      `ไม่พบ API.${name}`
    );
  }

  return url;
}


/* =========================================================
   LIFF
========================================================= */

async function ensureLiff(){

  if(
    typeof liff ===
    "undefined"
  ){
    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }

  await liff.init({
    liffId:
      window.APP_CONFIG?.LIFF_ID ||
      "2011201679-uNWz5yqF"
  });


  if(
    !liff.isLoggedIn()
  ){
    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  const token =
    liff.getIDToken();

  if(!token){
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  return true;
}


function currentIdToken(){

  const token =
    liff.getIDToken();

  if(!token){
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  return token;
}


async function postApi(
  url,
  payload={}
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:"no-store",

        body:
          JSON.stringify({
            ...payload,

            /*
              สำคัญ:
              Frontend ไม่ส่ง line_user_id / player_id
              Backend ต้อง verify LINE ID Token เอง
            */
            idToken:
              currentIdToken()
          })
      }
    );


  const raw =
    await response.text();

  let data = {};

  try{
    data =
      raw
        ? JSON.parse(raw)
        : {};
  }catch{
    throw new Error(
      `API ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
    );
  }


  if(
    !response.ok ||
    data?.success === false
  ){

    const message =
      String(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );

    const low =
      message.toLowerCase();

    if(
      response.status === 401 ||
      low.includes("idtoken expired") ||
      low.includes("token expired")
    ){

      try{
        liff.logout();
      }catch{}

      liff.login({
        redirectUri:
          window.location.href
      });

      return await new Promise(()=>{});
    }

    throw new Error(
      message
    );
  }

  return data;
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadPlayerDashboard(){

  const result =
    await postApi(
      getApi("PLAYER"),
      {
        action:"dashboard"
      }
    );

  const data =
    result?.data ??
    result?.dashboard ??
    result ??
    {};

  const user =
    data?.user ??
    data?.player ??
    {};

  const energy =
    (
      data?.energy &&
      typeof data.energy ===
        "object"
    )
      ? data.energy
      : {};

  return {
    rockCoin:
      num(
        pick(
          data.rockCoin,
          data.rock_coin,
          data.coin,
          user.rockCoin,
          user.rock_coin,
          user.coin
        ),
        0
      ),

    energy:
      num(
        pick(
          energy.current,
          data.energyCurrent,
          data.current_energy,
          typeof data.energy ===
            "number"
            ? data.energy
            : null,
          user.energy
        ),
        0
      ),

    maxEnergy:
      num(
        pick(
          energy.max,
          data.maxEnergy,
          data.max_energy,
          user.maxEnergy,
          user.max_energy,
          window.APP_CONFIG?.MAX_ENERGY,
          200
        ),
        200
      )
  };
}


async function loadBattleStatus(){

  try{

    return await postApi(
      getApi("BATTLE"),
      {
        action:
          "battleStatus"
      }
    );

  }catch(firstError){

    const message =
      String(
        firstError?.message ||
        ""
      ).toLowerCase();

    if(
      message.includes(
        "unknown action"
      ) ||
      message.includes(
        "unsupported action"
      )
    ){

      return await postApi(
        getApi("BATTLE"),
        {
          action:"status"
        }
      );
    }

    throw firstError;
  }
}


function normalizeBattle(
  raw
){

  const data =
    raw?.data ??
    raw ??
    {};

  const player =
    data?.player ??
    data?.user ??
    {};

  const stage =
    data?.stage ??
    data?.boss ??
    data?.monster ??
    {};

  const runs =
    Array.isArray(
      data?.runs
    )
      ? data.runs
      : [];

  const stageId =
    num(
      pick(
        player.unlockedStage,
        player.unlocked_stage,
        data.currentStage,
        data.current_stage,
        stage.id,
        1
      ),
      1
    );


  return {
    player:{
      rockCoin:
        num(
          pick(
            player.rockCoin,
            player.rock_coin,
            player.coin
          ),
          0
        ),

      energy:
        num(
          player.energy,
          0
        ),

      maxEnergy:
        num(
          pick(
            player.maxEnergy,
            player.max_energy,
            200
          ),
          200
        ),

      unlockedStage:
        stageId,

      totalWins:
        num(
          pick(
            player.totalWins,
            player.total_wins,
            data.stats?.totalWins,
            data.stats?.total_wins
          ),
          0
        ),

      totalAttacks:
        num(
          pick(
            player.totalAttacks,
            player.total_attacks,
            data.stats?.totalAttacks,
            data.stats?.total_attacks
          ),
          0
        )
    },

    stage:{
      id:
        num(
          pick(
            stage.id,
            stage.stage_id,
            stageId
          ),
          stageId
        ),

      name:
        pick(
          stage.name,
          stage.monster_name,
          stage.monsterName,
          `STAGE ${stageId}`
        ),

      hp:
        num(
          pick(
            stage.hp,
            stage.max_hp,
            stage.maxHp,
            stage.monster_max_hp
          ),
          0
        ),

      energy:
        num(
          pick(
            stage.energy,
            stage.energy_cost,
            stage.energyCost,
            stage.required_energy
          ),
          0
        )
    },

    runs,

    activeRun:
      data?.activeRun ??
      data?.active_run ??
      null,

    ranking:
      Array.isArray(
        data?.ranking
      )
        ? data.ranking
        : (
            Array.isArray(
              data?.top3
            )
              ? data.top3
              : []
          )
  };
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const player =
    state.player ??
    {};

  const stage =
    state.stage ??
    {};

  const run =
    state.activeRun;


  const coin =
    num(
      player.rockCoin,
      0
    );

  const energy =
    num(
      player.energy,
      0
    );

  const maxEnergy =
    Math.max(
      1,
      num(
        player.maxEnergy,
        200
      )
    );


  const maxHp =
    Math.max(
      0,
      num(
        pick(
          run?.monster_max_hp,
          run?.monsterMaxHp,
          stage.hp
        ),
        0
      )
    );

  const currentHp =
    Math.max(
      0,
      num(
        pick(
          run?.monster_hp,
          run?.monsterHp,
          maxHp
        ),
        maxHp
      )
    );


  const hpPct =
    maxHp > 0
      ? clamp(
          (
            currentHp /
            maxHp
          ) * 100,
          0,
          100
        )
      : 0;


  const energyPct =
    clamp(
      (
        energy /
        maxEnergy
      ) * 100,
      0,
      100
    );


  $("coinValue")
    .textContent =
      formatNumber(
        coin
      );

  $("energyTop")
    .textContent =
      `${formatNumber(
        energy
      )}/${formatNumber(
        maxEnergy
      )}`;

  $("energyBig")
    .textContent =
      `${formatNumber(
        energy
      )} / ${formatNumber(
        maxEnergy
      )}`;

  $("energyFill")
    .style.width =
      `${energyPct}%`;


  $("bossName")
    .textContent =
      stage.name ||
      `STAGE ${
        player.unlockedStage ||
        1
      }`;

  $("hpText")
    .textContent =
      maxHp > 0
        ? `${formatNumber(
            currentHp
          )} / ${formatNumber(
            maxHp
          )}`
        : "ยังไม่มีข้อมูล HP";

  $("hpPercent")
    .textContent =
      maxHp > 0
        ? `${Math.round(
            hpPct
          )}%`
        : "--%";

  $("hpFill")
    .style.width =
      `${hpPct}%`;


  /*
    ถ้า Battle backend ยังไม่มี Ranking
    แสดงสถิติผู้เล่นเป็น fallback
  */
  const ranking =
    state.ranking;

  if(
    Array.isArray(ranking) &&
    ranking.length
  ){

    const scoreOf =
      item =>
        pick(
          item.score,
          item.points,
          item.damage,
          item.total_damage,
          item.totalDamage,
          item.exp,
          "--"
        );

    $("rank1").textContent =
      formatNumber(
        scoreOf(
          ranking[0]
        )
      );

    $("rank2").textContent =
      ranking[1]
        ? formatNumber(
            scoreOf(
              ranking[1]
            )
          )
        : "--";

    $("rank3").textContent =
      ranking[2]
        ? formatNumber(
            scoreOf(
              ranking[2]
            )
          )
        : "--";

  }else{

    $("rank1").textContent =
      formatNumber(
        player.totalWins
      );

    $("rank2").textContent =
      formatNumber(
        player.totalAttacks
      );

    $("rank3").textContent =
      formatNumber(
        player.unlockedStage
      );
  }


  renderRecoveryCountdown(
    player
  );
}


/* =========================================================
   ENERGY COUNTDOWN
========================================================= */

let countdownTimer =
  null;


function renderRecoveryCountdown(
  player
){

  clearInterval(
    countdownTimer
  );


  /*
    รองรับ backend ที่มี next_energy_at ในอนาคต
    ถ้ายังไม่มี field ใช้ข้อความพร้อมใช้งาน
  */
  const raw =
    pick(
      player?.nextEnergyAt,
      player?.next_energy_at
    );


  if(!raw){

    $("recoveryTime")
      .textContent =
        "พร้อมใช้งาน";

    return;
  }


  const target =
    new Date(raw);


  if(
    Number.isNaN(
      target.getTime()
    )
  ){

    $("recoveryTime")
      .textContent =
        "--:--:--";

    return;
  }


  const tick =
    ()=>{

      const diff =
        Math.max(
          0,
          target.getTime() -
          Date.now()
        );

      const totalSeconds =
        Math.floor(
          diff / 1000
        );

      const h =
        String(
          Math.floor(
            totalSeconds / 3600
          )
        ).padStart(
          2,
          "0"
        );

      const m =
        String(
          Math.floor(
            (
              totalSeconds %
              3600
            ) /
            60
          )
        ).padStart(
          2,
          "0"
        );

      const s =
        String(
          totalSeconds %
          60
        ).padStart(
          2,
          "0"
        );

      $("recoveryTime")
        .textContent =
          `${h}:${m}:${s}`;
    };


  tick();

  countdownTimer =
    setInterval(
      tick,
      1000
    );
}


/* =========================================================
   MAIN LOAD
========================================================= */

async function load(){

  try{

    const ready =
      await ensureLiff();

    if(
      ready === false
    ){
      return;
    }


    const results =
      await Promise.allSettled([
        loadPlayerDashboard(),
        loadBattleStatus()
      ]);


    let homePlayer =
      null;


    if(
      results[0].status ===
      "fulfilled"
    ){
      homePlayer =
        results[0].value;
    }


    if(
      results[1].status ===
      "fulfilled"
    ){

      const battle =
        normalizeBattle(
          results[1].value
        );

      state.player = {
        ...battle.player,

        /*
          Wallet จาก HOME มี priority
          เพื่อให้ Coin / Energy เหมือนหน้า HOME / MISSION
        */
        rockCoin:
          homePlayer?.rockCoin ??
          battle.player.rockCoin,

        energy:
          homePlayer?.energy ??
          battle.player.energy,

        maxEnergy:
          homePlayer?.maxEnergy ??
          battle.player.maxEnergy
      };

      state.stage =
        battle.stage;

      state.runs =
        battle.runs;

      state.activeRun =
        battle.activeRun ||
        battle.runs.find(
          row =>
            String(
              row?.status ||
              ""
            ).toLowerCase() ===
            "active"
        ) ||
        null;

      state.ranking =
        battle.ranking;

      render();

      return;
    }


    /*
      Battle API fail แต่ HOME ยังโหลด Wallet ได้
    */
    if(homePlayer){

      state.player =
        homePlayer;

      state.stage = {
        id:1,
        name:"ยังไม่มีข้อมูล Battle",
        hp:0,
        energy:0
      };

      render();

      throw results[1].reason;
    }


    throw new Error(
      "โหลดข้อมูล HOME และ BATTLE ไม่สำเร็จ"
    );


  }catch(error){

    console.error(
      "BATTLE APP ERROR:",
      error
    );

    showStatus(
      error?.message ||
      "โหลดข้อมูล Battle ไม่สำเร็จ",
      true
    );
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

function goPage(
  key,
  fallback
){

  window.location.href =
    window.APP_CONFIG?.PAGE?.[key] ||
    fallback;
}


$("homeButton")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "HOME",
        "./dashboard.html"
      );
    }
  );


$("missionButton")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "MISSION",
        "./mission.html"
      );
    }
  );


$("battleButton")
  .addEventListener(
    "click",
    ()=>{
      load();
    }
  );


$("fightButton")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "BATTLE_STAGE",
        "./battle_stage.html"
      );
    }
  );


$("myEnergyButton")
  .addEventListener(
    "click",
    ()=>{
      showStatus(
        `พลังงานปัจจุบัน ${
          formatNumber(
            state.player?.energy
          )
        } / ${
          formatNumber(
            state.player?.maxEnergy
          )
        }`
      );
    }
  );


$("rankingCard")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "RANKING",
        "./ranking.html"
      );
    }
  );


$("rewardCard")
  .addEventListener(
    "click",
    ()=>{
      goPage(
        "REWARDS",
        "./rewards.html"
      );
    }
  );


/* =========================================================
   START / AUTO REFRESH
========================================================= */

(async()=>{

  await load();

  setInterval(
    ()=>{
      load();
    },
    Number(
      window.APP_CONFIG?.REFRESH_MS ||
      30000
    )
  );

})();
</script>
