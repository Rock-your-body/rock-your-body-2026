    /* =========================================================
       BATTLE TEMPLATE
    ========================================================= */

    .battle-stage{
      position:relative;

      margin:0 auto;

<script>
"use strict";

const BATTLE_BUILD = "V5.7-GITHUB-MONSTERS-EXACT";


/* =========================================================
   BASIC
========================================================= */

const $ =
  id =>
    document.getElementById(
      id
    );


let battleState =
  null;


let selectedStageId =
  1;


/* =========================================================
   URL / API
========================================================= */

function battleApi(){

  if(
    window.APP_CONFIG
      ?.getApi
  ){

    return window.APP_CONFIG
      .getApi(
        "BATTLE"
      );
  }


  const url =
    window.APP_CONFIG
      ?.API
      ?.BATTLE;


  if(!url){

    throw new Error(
      "ไม่พบ API.BATTLE ใน app-config.js"
    );
  }


  return url;
}


/* =========================================================
   GITHUB BATTLE ASSETS
========================================================= */

const GITHUB_ASSET_BASE =
  "./";


function githubAssetUrl(
  fileName
){

  return (
    GITHUB_ASSET_BASE +
    String(
      fileName ||
      ""
    )
      .replace(
        /^\/+/,
        ""
      )
  );
}


const BATTLE_MONSTERS = {

  1:{
    name:"เจ้าจอมเอื่อย",
    image:"battle-monster-stage-001-germ.png"
  },

  2:{
    name:"จอมหวาน",
    image:"battle-monster-stage-002-donut.png"
  },

  3:{
    name:"ปีศาจของทอด",
    image:"battle-monster-stage-003-fries.png"
  },

  4:{
    name:"จอมเค็ม",
    image:"battle-monster-stage-004-salt.png"
  },

  5:{
    name:"ราชาอาหารไร้ประโยชน์",
    image:"battle-monster-stage-005-burger-king.png"
  },

  6:{
    name:"ปีศาจพักผ่อนน้อย",
    image:"battle-monster-stage-006-rest.png"
  },

  7:{
    name:"จอมเนือยนิ่ง",
    image:"battle-monster-stage-007-sedentary.png"
  },

  8:{
    name:"ปีศาจพฤติกรรมเสี่ยง",
    image:"battle-monster-stage-008-risk.png"
  },

  9:{
    name:"ราชาความเสี่ยงสุขภาพ",
    image:"battle-monster-stage-009-risk-king.png"
  },

  10:{
    name:"จอมมาร Final Boss",
    image:"battle-monster-stage-010-boss.png"
  }

};


function githubMonsterUrl(
  stageNo
){

  const monster =
    BATTLE_MONSTERS[
      Number(
        stageNo
      )
    ];


  if(
    !monster
  ){

    return "";
  }


  return (
    githubAssetUrl(
      monster.image
    ) +
    "?v=20260831-battle-v57"
  );
}


/* =========================================================
   LIFF
========================================================= */

async function initLine(){

  if(
    !window.liff
  ){

    throw new Error(
      "ไม่พบ LINE LIFF SDK"
    );
  }


  await liff.init({

    liffId:
      window.APP_CONFIG
        ?.LIFF_ID ||
      "2011201679-uNWz5yqF"

  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  const idToken =
    liff.getIDToken();


  if(
    !idToken ||
    idToken
      .split(".")
      .length !==
      3
  ){

    liff.logout();


    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  return true;
}


/* =========================================================
   POST
========================================================= */

async function postBattle(
  action,
  payload = {}
){

  const idToken =
    liff.getIDToken();


  const response =
    await fetch(
      battleApi(),
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:"no-store",

        body:
          JSON.stringify({
            action,
            idToken,
            ...payload
          })
      }
    );


  const raw =
    await response.text();


  let data =
    {};


  try{

    data =
      raw
        ? JSON.parse(
            raw
          )
        : {};

  }catch{

    throw new Error(
      "Battle API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    !response.ok ||
    data
      ?.success ===
      false
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  text,
  error = false
){

  const element =
    $("status");


  element.textContent =
    text;


  element.classList
    .toggle(
      "error",
      error
    );


  element.classList
    .add(
      "show"
    );


  clearTimeout(
    window.__battleStatusTimer
  );


  window.__battleStatusTimer =
    setTimeout(
      ()=>{

        element.classList
          .remove(
            "show"
          );

      },
      error
        ? 4500
        : 2200
    );
}


/* =========================================================
   PLAYER
========================================================= */

function renderPlayer(){

  const player =
    battleState
      ?.player ||
    {};


  const coin =
    Number(
      player
        ?.rockCoin ||
      0
    );


  const exp =
    Number(
      player
        ?.exp ||
      0
    );


  const level =
    Number(
      player
        ?.level ||
      1
    );


  const name =
    String(
      player
        ?.displayName ||
      player
        ?.name ||
      "PLAYER"
    );


  $("coinValue")
    .textContent =
      coin
        .toLocaleString();


  $("playerMini")
    .textContent =
      `${name} • Lv.${level} • EXP ${exp.toLocaleString()}`;
}


/* =========================================================
   MY ENERGY
========================================================= */

function renderEnergy(){

  const energy =
    battleState
      ?.healthEnergy ||
    {};


  const available =
    Number(
      energy
        ?.available ||
      0
    );


  const max =
    Number(
      energy
        ?.max ||
      200
    );


  $("energyValue")
    .textContent =
      `${available.toLocaleString()} / ${max.toLocaleString()}`;


  $("healthEnergyValue")
    .textContent =
      `${available.toLocaleString()} / ${max.toLocaleString()}`;


  $("energyModalValue")
    .textContent =
      `${available.toLocaleString()} / ${max.toLocaleString()}`;


  const components =
    energy
      ?.components ||
    {};


  $("energySteps")
    .textContent =
      `${Number(components?.steps?.energy || 0)} / ${Number(components?.steps?.max || 60)}`;


  $("energyBurn")
    .textContent =
      `${Number(components?.caloriesBurned?.energy || 0)} / ${Number(components?.caloriesBurned?.max || 60)}`;


  $("energySleep")
    .textContent =
      `${Number(components?.sleepMinutes?.energy || 0)} / ${Number(components?.sleepMinutes?.max || 50)}`;


  $("energyBody")
    .textContent =
      `${Number(components?.body?.energy || 0)} / ${Number(components?.body?.max || 30)}`;
}


/* =========================================================
   STAGE
========================================================= */

function stages(){

  return Array.isArray(
    battleState
      ?.stages
  )
    ? battleState.stages
    : [];
}


function selectedStage(){

  return stages()
    .find(
      stage =>
        Number(
          stage.id
        ) ===
        Number(
          selectedStageId
        )
    ) ||
    null;
}


function firstAvailableStage(){

  const list =
    stages();


  const current =
    Number(
      battleState
        ?.currentStage ||
      1
    );


  const matched =
    list.find(
      stage =>
        Number(
          stage.id
        ) ===
        current
    );


  return matched
    ? current
    : Number(
        list[0]
          ?.id ||
        1
      );
}


/* =========================================================
   MONSTER IMAGE FALLBACKS
========================================================= */

function setMonsterImage(
  stage
){

  const image =
    $("monsterImage");


  const stageNo =
    Number(
      stage?.id ||
      stage?.stage_no ||
      selectedStageId ||
      1
    );


  const monster =
    BATTLE_MONSTERS[
      stageNo
    ];


  if(
    !monster
  ){

    image.style.display =
      "none";


    $("monsterHint")
      .textContent =
        `❌ ไม่พบข้อมูล Monster Stage ${stageNo}`;


    return;
  }


  const url =
    githubMonsterUrl(
      stageNo
    );


  image.alt =
    monster.name;


  image.onload =
    ()=>{

      image.style.display =
        "block";


      console.log(
        "✅ MONSTER LOADED:",
        stageNo,
        monster.image
      );
    };


  image.onerror =
    ()=>{

      image.style.display =
        "none";


      $("monsterHint")
        .textContent =
          `❌ โหลดรูป ${monster.image} ไม่สำเร็จ`;


      console.error(
        "❌ MONSTER IMAGE ERROR:",
        url
      );
    };


  image.src =
    url;
}


/* =========================================================
   RENDER SELECTED STAGE
========================================================= */

function renderStage(){

  const stage =
    selectedStage();


  if(!stage){

    return;
  }


  const maxHp =
    Math.max(
      1,
      Number(
        stage
          ?.maxHp ||
        1
      )
    );


  const currentHp =
    Math.max(
      0,
      Number(
        stage
          ?.currentHp ??
        maxHp
      )
    );


  const hpPercent =
    Math.max(
      0,
      Math.min(
        100,
        (
          currentHp /
          maxHp
        ) *
        100
      )
    );


  const expRequired =
    Number(
      stage
        ?.expRequired ||
      0
    );


  const unlocked =
    Boolean(
      stage
        ?.unlocked
    );


  const completed =
    Boolean(
      stage
        ?.completed
    );


  $("stageValue")
    .textContent =
      `STAGE ${stage.id}`;


  $("stageSelectLabel")
    .textContent =
      `STAGE ${stage.id}`;


  const mappedMonster =
    BATTLE_MONSTERS[
      Number(
        stage.id
      )
    ];


  $("monsterName")
    .textContent =
      mappedMonster?.name ||
      stage?.name ||
      `MONSTER STAGE ${stage.id}`;


  $("hpValue")
    .textContent =
      `HP ${currentHp.toLocaleString()} / ${maxHp.toLocaleString()}`;


  $("hpFill")
    .style
    .width =
      `${hpPercent}%`;


  $("expRequirement")
    .textContent =
      `ต้องการ EXP ${expRequired.toLocaleString()}`;


  $("monsterButton")
    .classList
    .toggle(
      "locked",
      !unlocked
    );


  if(
    completed
  ){

    $("monsterHint")
      .textContent =
        "✅ ผ่าน Stage นี้แล้ว • แตะเพื่อดูผลการต่อสู้";

  }else if(
    unlocked
  ){

    $("monsterHint")
      .textContent =
        `⚔️ แตะมอนสเตอร์เพื่อเข้าสู่ Stage ${stage.id}`;

  }else{

    $("monsterHint")
      .textContent =
        `🔒 ${stage.lockReason || `ต้องมี EXP ${expRequired.toLocaleString()}`}`;
  }


  const rewardStatus =
    String(
      stage
        ?.rewardStatus ||
      "none"
    );


  if(
    rewardStatus ===
    "pending"
  ){

    $("giftStatus")
      .textContent =
        "🎁 ผ่านด่านแล้ว • รอ Admin ส่งของรางวัล";

  }else if(
    rewardStatus ===
    "sent"
  ){

    $("giftStatus")
      .textContent =
        "✅ Admin ส่งของรางวัลแล้ว";

  }else if(
    rewardStatus ===
    "cancelled"
  ){

    $("giftStatus")
      .textContent =
        "ของรางวัลถูกยกเลิก";

  }else{

    $("giftStatus")
      .textContent =
        "ยังไม่มีของขวัญรอรับ";
  }


  setMonsterImage(
    stage
  );
}


/* =========================================================
   STAGE SELECT
========================================================= */

function selectStage(
  id
){

  const list =
    stages();


  if(
    !list.length
  ){

    return;
  }


  const min =
    Math.min(
      ...list.map(
        s =>
          Number(
            s.id
          )
      )
    );


  const max =
    Math.max(
      ...list.map(
        s =>
          Number(
            s.id
          )
      )
    );


  selectedStageId =
    Math.max(
      min,
      Math.min(
        max,
        Number(
          id
        )
      )
    );


  renderStage();
}


function previousStage(){

  selectStage(
    selectedStageId -
    1
  );
}


function nextStage(){

  selectStage(
    selectedStageId +
    1
  );
}


/* =========================================================
   OPEN STAGE
========================================================= */

function openSelectedStage(){

  const stage =
    selectedStage();


  if(!stage){

    return;
  }


  if(
    !stage.unlocked
  ){

    showStatus(
      `🔒 ${stage.lockReason || `Stage ${stage.id} ยังไม่ปลดล็อก`}`,
      true
    );


    return;
  }


  const page =
    window.APP_CONFIG
      ?.PAGE
      ?.BATTLE_STAGE ||
    "./battle_stage.html";


  window.location
    .assign(
      `${page}?stage=${encodeURIComponent(stage.id)}`
    );
}


/* =========================================================
   LOAD
========================================================= */

async function loadBattle(){

  showStatus(
    "กำลังโหลดข้อมูล Battle..."
  );


  let data;


  try{

    data =
      await postBattle(
        "mapV5"
      );

  }catch(error){

    /*
      Compatibility กับ Battle Function รุ่นก่อน
    */
    if(
      String(
        error?.message ||
        ""
      ).includes(
        "UNKNOWN_ACTION"
      )
    ){

      data =
        await postBattle(
          "map"
        );

    }else{

      throw error;
    }
  }


  battleState =
    data;


  selectedStageId =
    firstAvailableStage();


  renderPlayer();

  renderEnergy();

  renderStage();
}


/* =========================================================
   BUTTONS
========================================================= */

$("monsterButton")
  .addEventListener(
    "click",
    openSelectedStage
  );


$("fightButton")
  .addEventListener(
    "click",
    openSelectedStage
  );


$("prevStage")
  .addEventListener(
    "click",
    previousStage
  );


$("nextStage")
  .addEventListener(
    "click",
    nextStage
  );


$("energyButton")
  .addEventListener(
    "click",
    ()=>{

      $("energyModal")
        .classList
        .add(
          "show"
        );
    }
  );


$("closeEnergyModal")
  .addEventListener(
    "click",
    ()=>{

      $("energyModal")
        .classList
        .remove(
          "show"
        );
    }
  );


$("homeButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          window.APP_CONFIG
            ?.PAGE
            ?.HOME ||
          "./dashboard.html"
        );
    }
  );


$("missionButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          window.APP_CONFIG
            ?.PAGE
            ?.MISSION ||
          "./mission.html"
        );
    }
  );


$("battleButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          window.APP_CONFIG
            ?.PAGE
            ?.BATTLE ||
          "./battle.html"
        );
    }
  );


/* =========================================================
   REFRESH WHEN LIFF RETURNS TO FOREGROUND
========================================================= */

document
  .addEventListener(
    "visibilitychange",
    ()=>{

      if(
        document.visibilityState ===
        "visible" &&
        liff
          ?.isLoggedIn
          ?.()
      ){

        loadBattle()
          .catch(
            error =>
              console.error(
                error
              )
          );
      }
    }
  );


/* =========================================================
   START
========================================================= */

(async()=>{

  try{

    const ready =
      await initLine();


    if(
      ready ===
      false
    ){

      return;
    }


    await loadBattle();


  }catch(error){

    console.error(
      error
    );


    showStatus(
      error
        ?.message ||
      String(
        error
      ),
      true
    );
  }

})();

</script>
