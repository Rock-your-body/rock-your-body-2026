<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260831-battle-v60"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:#eef4ff;font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif}
    body{display:flex;justify-content:center;overflow-x:hidden}
    #app{position:relative;width:min(100vw,1536px);aspect-ratio:1536/1024;background:#eef4ff;overflow:hidden}
    #template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;pointer-events:none}

    .live{position:absolute;z-index:20;font-weight:1000;color:#0a2a62;text-align:center}
    #coin{right:9.0%;top:3.0%;width:8%;font-size:clamp(9px,1.2vw,18px)}
    #energyTop{right:1.4%;top:3.0%;width:8%;font-size:clamp(9px,1.2vw,18px)}

    #bossName{left:2.9%;top:24.5%;width:21%;font-size:clamp(18px,3vw,52px);color:#fff;text-align:left;text-shadow:0 3px 8px #000}
    #hpText{left:3.0%;top:43.2%;width:22%;font-size:clamp(10px,1.4vw,22px);color:#fff;text-align:left}
    #hpPct{left:3.0%;top:48.0%;width:8%;font-size:clamp(18px,2.5vw,42px);color:#fff;text-align:left}

    #hpTrack{position:absolute;z-index:18;left:6.1%;top:45.1%;width:16.4%;height:2.4%;border-radius:999px;background:rgba(31,59,109,.7);overflow:hidden}
    #hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#ff7b00);transition:.35s}

    #monsterBox{position:absolute;z-index:17;left:21%;top:20%;width:31%;height:38%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
    #monster{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}

    #energyMain{left:57.6%;top:29.5%;width:10%;font-size:clamp(16px,2vw,32px)}
    #energyTrack{position:absolute;z-index:18;left:53.0%;top:37.4%;width:16.8%;height:3.0%;border-radius:999px;background:#d8e2f0;overflow:hidden}
    #energyFill{height:100%;width:0%;background:linear-gradient(90deg,#ff9f0a,#ffc529);transition:.35s}
    #energyTimer{left:54.6%;top:47.0%;width:13.5%;font-size:clamp(12px,1.6vw,26px)}

    .hot{position:absolute;z-index:30;border:0;background:transparent;cursor:pointer}
    #fightBtn{left:72.2%;top:22.2%;width:25.2%;height:17.7%}
    #energyBtn{left:72.2%;top:41.5%;width:25.2%;height:17.2%}
    #homeBtn{left:1.0%;top:82.4%;width:31.2%;height:14.2%}
    #missionBtn{left:33.2%;top:82.4%;width:31.2%;height:14.2%}
    #battleBtn{left:65.4%;top:82.4%;width:33.2%;height:14.2%}
    #rewardStatus{position:absolute;z-index:20;left:64.0%;top:68.0%;width:27%;color:#fff;font-weight:900;font-size:clamp(8px,1vw,14px);text-align:center;text-shadow:0 2px 4px #000}

    #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;display:none;padding:12px 16px;border-radius:14px;background:#173c70;color:#fff;font-weight:900;max-width:calc(100vw - 28px);text-align:center}
    #toast.show{display:block}
    #toast.error{background:#c62828}
  </style>
</head>
<body>

<main id="app">
  <img id="template" src="./rock-battle(5).jpg?v=20260831-v60" alt="Battle">

  <div id="coin" class="live">0</div>
  <div id="energyTop" class="live">0</div>

  <div id="bossName" class="live">BOSS OF THE MONTH</div>
  <div id="hpText" class="live">HP -- / --</div>
  <div id="hpPct" class="live">--%</div>
  <div id="hpTrack"><div id="hpFill"></div></div>

  <div id="monsterBox"><img id="monster" src="./battle-monster-stage-001-germ.png" alt="Monster"></div>

  <div id="energyMain" class="live">0</div>
  <div id="energyTrack"><div id="energyFill"></div></div>
  <div id="energyTimer" class="live">--:--:--</div>

  <div id="rewardStatus">ยังไม่มีของรางวัลรอรับ</div>

  <button id="fightBtn" class="hot" type="button" aria-label="Fight Monster"></button>
  <button id="energyBtn" class="hot" type="button" aria-label="My Energy"></button>
  <button id="homeBtn" class="hot" type="button" aria-label="Home"></button>
  <button id="missionBtn" class="hot" type="button" aria-label="Mission"></button>
  <button id="battleBtn" class="hot" type="button" aria-label="Battle"></button>
</main>

<div id="toast"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);

function apiUrl(){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi("BATTLE");
  const url=window.APP_CONFIG?.API?.BATTLE;
  if(!url) throw new Error("ไม่พบ API.BATTLE");
  return url;
}

async function initLine(){
  await liff.init({liffId:window.APP_CONFIG?.LIFF_ID||"2011201679-uNWz5yqF"});
  if(!liff.isLoggedIn()){
    liff.login({redirectUri:location.href});
    return false;
  }
  const token=liff.getIDToken();
  if(!token||token.split(".").length!==3){
    liff.logout();
    liff.login({redirectUri:location.href});
    return false;
  }
  return true;
}

async function post(action,payload={}){
  const res=await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({action,idToken:liff.getIDToken(),...payload})
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error("Battle API ตอบกลับไม่ใช่ JSON")}
  if(!res.ok||data?.success===false) throw new Error(data?.error||data?.message||`HTTP ${res.status}`);
  return data;
}

function toast(text,error=false){
  const el=$("toast");
  el.textContent=text;
  el.classList.toggle("error",error);
  el.classList.add("show");
  clearTimeout(window.__t);
  window.__t=setTimeout(()=>el.classList.remove("show"),error?4500:2200);
}

function monsterFile(stageNo){
  const map={
    1:"battle-monster-stage-001-germ.png",
    2:"battle-monster-stage-002-donut.png",
    3:"battle-monster-stage-003-fries.png",
    4:"battle-monster-stage-004-salt.png",
    5:"battle-monster-stage-005-burger-king.png",
    6:"battle-monster-stage-006-rest.png",
    7:"battle-monster-stage-007-sedentary.png",
    8:"battle-monster-stage-008-risk.png",
    9:"battle-monster-stage-009-risk-king.png",
    10:"battle-monster-stage-010-boss.png"
  };
  return map[Number(stageNo)]||map[1];
}

function nextBangkokMidnightMs(){
  const now=new Date();
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Bangkok",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
  }).formatToParts(now).reduce((a,p)=>(a[p.type]=p.value,a),{});
  const bkk = new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+07:00`);
  const next = new Date(bkk.getTime()+24*60*60*1000);
  next.setHours(0,0,0,0);
  return next.getTime() - bkk.getTime();
}

function startTimer(){
  const render=()=>{
    let ms=nextBangkokMidnightMs();
    const h=Math.floor(ms/3600000); ms%=3600000;
    const m=Math.floor(ms/60000); ms%=60000;
    const s=Math.floor(ms/1000);
    $("energyTimer").textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  };
  render();
  setInterval(render,1000);
}

function render(data){
  const player=data?.player||{};
  const e=data?.healthEnergy||{};
  const stages=Array.isArray(data?.stages)?data.stages:[];
  const boss=stages.find(s=>Number(s.id)===Number(data?.currentStage||1))||stages[0]||{};

  $("coin").textContent=Number(player.rockCoin||0).toLocaleString();
  $("energyTop").textContent=Number(e.available||0).toLocaleString();
  $("energyMain").textContent=Number(e.available||0).toLocaleString();

  const ep=Math.max(0,Math.min(100,Number(e.max||50000)>0?Number(e.available||0)/Number(e.max||50000)*100:0));
  $("energyFill").style.width=`${ep}%`;

  const maxHp=Math.max(1,Number(boss.maxHp||1));
  const curHp=Math.max(0,Number(boss.currentHp??maxHp));
  const hpPct=Math.round(curHp/maxHp*100);

  $("bossName").textContent=(boss.name||"BOSS OF THE MONTH").toUpperCase();
  $("hpText").textContent=`${curHp.toLocaleString()} / ${maxHp.toLocaleString()}`;
  $("hpPct").textContent=`${hpPct}%`;
  $("hpFill").style.width=`${hpPct}%`;

  $("monster").src="./"+monsterFile(boss.id)+"?v=20260831-v60";
  $("monster").alt=boss.name||"Monster";

  if(boss.rewardStatus==="pending"){
    $("rewardStatus").textContent="🎁 ผ่านด่านแล้ว • รอ Admin ส่งของรางวัล";
  }else if(boss.rewardStatus==="sent"){
    $("rewardStatus").textContent="✅ Admin ส่งของรางวัลแล้ว";
  }else{
    $("rewardStatus").textContent="ยังไม่มีของรางวัลรอรับ";
  }
}

async function load(){
  const data=await post("mapV5");
  render(data);
}

$("fightBtn").onclick=()=>{
  location.href=window.APP_CONFIG?.PAGE?.BATTLE_MAP||"./battle_map.html";
};

$("energyBtn").onclick=()=>{
  toast("Energy สะสมใช้ค่าเดียวกับหน้า HOME");
};

$("homeBtn").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.HOME||"./dashboard.html";
$("missionBtn").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.MISSION||"./mission.html";
$("battleBtn").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE||"./battle.html";

(async()=>{
  try{
    const ok=await initLine();
    if(ok===false)return;
    startTimer();
    await load();
  }catch(error){
    console.error(error);
    toast(error?.message||String(error),true);
  }
})();
</script>
</body>
</html>
