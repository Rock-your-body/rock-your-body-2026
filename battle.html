function openStage(stageNumber){

  const stage =
    STAGES.find(
      item =>
        item.id ===
        Number(stageNumber)
    );

  if(!stage){
    return;
  }

  if(stage.id > unlockedStage){

    showToast(
      `🔒 Stage ${stage.id} ยังไม่ปลดล็อก`
    );

    return;
  }

  const testQuery =
    TEST_MODE
      ? "&test=1"
      : "";

  window.location.href =
    `./battle_stage.html?stage=${stage.id}${testQuery}`;
}


/* =========================================================
   LIFF / TOKEN
   ใช้ ID Token จริงจาก LINE LIFF เท่านั้น
========================================================= */

const BATTLE_RELOGIN_KEY =
  "rock_battle_relogin_at";


function isJwtLike(
  token
){

  if(
    typeof token !==
      "string"
  ){
    return false;
  }

  const value =
    token.trim();

  if(!value){
    return false;
  }

  const parts =
    value.split(".");

  return (
    parts.length === 3 &&
    parts.every(
      part =>
        part.length > 0
    )
  );
}


function decodeJwtPayloadSafe(
  token
){

  try{

    if(
      !isJwtLike(
        token
      )
    ){
      return null;
    }

    let base64 =
      token
        .split(".")[1]
        .replace(/-/g,"+")
        .replace(/_/g,"/");

    while(
      base64.length % 4 !== 0
    ){
      base64 += "=";
    }

    const binary =
      atob(base64);

    const bytes =
      Uint8Array.from(
        binary,
        char =>
          char.charCodeAt(0)
      );

    const json =
      new TextDecoder(
        "utf-8"
      ).decode(
        bytes
      );

    return JSON.parse(
      json
    );

  }catch(error){

    console.warn(
      "JWT DECODE ERROR:",
      error
    );

    return null;
  }
}


function battleTokenExpired(
  token,
  bufferSeconds = 45
){

  const payload =
    decodeJwtPayloadSafe(
      token
    );

  const exp =
    Number(
      payload?.exp
    );

  if(
    !Number.isFinite(
      exp
    )
  ){
    return false;
  }

  const now =
    Math.floor(
      Date.now() / 1000
    );

  return (
    exp <=
    now +
    bufferSeconds
  );
}


function battleRelogin(
  reason =
    "TOKEN_INVALID"
){

  const now =
    Date.now();

  const last =
    Number(
      sessionStorage.getItem(
        BATTLE_RELOGIN_KEY
      ) ||
      "0"
    );


  console.warn(
    "BATTLE RELOGIN:",
    reason
  );


  /*
    กัน redirect loop สั้น ๆ
  */
  if(
    last > 0 &&
    now - last <
    10000
  ){

    throw new Error(
      "LINE session ยังไม่พร้อม กรุณาปิดหน้านี้แล้วเปิดใหม่จาก LINE"
    );
  }


  sessionStorage.setItem(
    BATTLE_RELOGIN_KEY,
    String(now)
  );


  try{

    if(
      typeof liff !==
        "undefined" &&
      liff.isLoggedIn()
    ){

      liff.logout();
    }

  }catch(error){

    console.warn(
      "LIFF LOGOUT ERROR:",
      error
    );
  }


  if(
    typeof liff ===
      "undefined"
  ){

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  liff.login({
    redirectUri:
      window.location.href
  });
}


async function prepareBattleApp(){

  if(
    typeof liff ===
      "undefined"
  ){

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  const liffId =
    window.APP_CONFIG?.LIFF_ID ||
    window.ROCK?.CFG?.LIFF_ID ||
    window.ROCK?.CFG?.LIFF?.HOME ||
    undefined;


  if(!liffId){

    throw new Error(
      "ไม่พบ LIFF_ID"
    );
  }


  console.log(
    "BATTLE LIFF INIT:",
    {
      liffId,
      url:
        window.location.href
    }
  );


  await liff.init({
    liffId
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        window.location.href
    });

    return false;
  }


  const token =
    liff.getIDToken();


  console.log(
    "BATTLE TOKEN CHECK:",
    {
      hasToken:
        Boolean(token),

      jwtFormat:
        isJwtLike(token),

      tokenLength:
        token
          ? token.length
          : 0,

      inClient:
        liff.isInClient(),

      loggedIn:
        liff.isLoggedIn()
    }
  );


  /*
    ป้องกันการส่ง LINE User ID / access token /
    Channel token แทน ID Token
  */
  if(
    !token ||
    !isJwtLike(
      token
    )
  ){

    battleRelogin(
      "ID_TOKEN_JWS_FORMAT_INVALID"
    );

    return false;
  }


  if(
    battleTokenExpired(
      token,
      45
    )
  ){

    battleRelogin(
      "ID_TOKEN_EXPIRED"
    );

    return false;
  }


  sessionStorage.removeItem(
    BATTLE_RELOGIN_KEY
  );


  return true;
}


function getBattleIdToken(){

  if(
    typeof liff ===
      "undefined"
  ){

    throw new Error(
      "LINE LIFF SDK ไม่พร้อม"
    );
  }


  if(
    !liff.isLoggedIn()
  ){

    throw new Error(
      "LINE ยังไม่ได้ Login"
    );
  }


  const token =
    liff.getIDToken();


  if(
    !token
  ){

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  if(
    !isJwtLike(
      token
    )
  ){

    const error =
      new Error(
        "LINE ID Token format ไม่ถูกต้อง"
      );

    error.code =
      "JWS_FORMAT_ERROR";

    throw error;
  }


  if(
    battleTokenExpired(
      token,
      30
    )
  ){

    const error =
      new Error(
        "LINE ID Token หมดอายุ"
      );

    error.code =
      "TOKEN_EXPIRED";

    throw error;
  }


  return token;
}


/* =========================================================
   AUTH API
   ส่ง ID Token จริงไป Supabase และจัดการ Token เสีย
========================================================= */

async function battleApiPost(
  url,
  payload
){

  const idToken =
    getBattleIdToken();


  const response =
    await fetch(
      url,
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            ...payload,
            idToken
          })
      }
    );


  const rawText =
    await response.text();


  let data =
    {};


  try{

    data =
      rawText
        ? JSON.parse(
            rawText
          )
        : {};

  }catch{

    throw new Error(
      `API ตอบกลับไม่ถูกต้อง (${response.status})`
    );
  }


  if(
    !response.ok ||
    data?.success === false
  ){

    const message =
      String(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );


    const lower =
      message.toLowerCase();


    if(
      response.status === 401 ||
      lower.includes(
        "jws format"
      ) ||
      lower.includes(
        "idtoken expired"
      ) ||
      lower.includes(
        "authentication failed"
      ) ||
      lower.includes(
        "invalid id token"
      )
    ){

      battleRelogin(
        message
      );

      return await new Promise(
        () => {}
      );
    }


    throw new Error(
      message
    );
  }


  return data;
}

   DIRECT DASHBOARD FALLBACK

    }
  );
}


/* =========================================================
   DASHBOARD NORMALIZER
   ใช้โครงสร้างเดียวกับหน้า HOME / MISSION
========================================================= */

function normalizeBattleDashboard(raw){

  const d =
    raw?.data ??
    raw?.dashboard ??
    raw ??
    {};

  const user =
    d?.user ??
    d?.player ??
    {};

  const energyObject =
    d?.energy &&
    typeof d.energy === "object"
      ? d.energy
      : {};

  const coin =
    Number(
      d?.rockCoin ??
      d?.rock_coin ??
      d?.coin ??
      user?.rock_coin ??
      user?.rockCoin ??
      user?.coin
    );

  const energy =
    Number(
      energyObject?.current ??
      d?.currentEnergy ??
      d?.current_energy ??
      user?.energy ??
      (
        typeof d?.energy === "number"
          ? d.energy
          : undefined
      )
    );

  const maxEnergy =
    Number(
      energyObject?.max ??
      d?.maxEnergy ??
      d?.max_energy ??
      user?.max_energy ??
      window.APP_CONFIG?.MAX_ENERGY ??
      200
    );

  return {
    coin,
    energy,
    maxEnergy
  };
}


/* =========================================================
   CURRENT MONSTER
========================================================= */

function renderCurrentMonster(){

  const stageNumber =
    Math.max(
      1,
      Math.min(
        10,
        Number(unlockedStage) || 1
      )
    );

  const stage =
    STAGES.find(
      item =>
        item.id === stageNumber
    ) || STAGES[0];

  const image =
    document.getElementById(
      "bossMonsterLive"
    );

  const label =
    document.getElementById(
      "bossStageLive"
    );

  if(label){
    label.textContent =
      `STAGE ${stage.id}`;
  }

  if(!image){
    return;
  }

  image.classList.remove(
    "show"
  );

  image.onload =
    () => {
      image.classList.add(
        "show"
      );
    };

  image.onerror =
    () => {
      console.error(
        "MONSTER IMAGE LOAD ERROR:",
        stage.monster
      );

      image.classList.remove(
        "show"
      );
    };

  image.src =
    `${stage.monster}?v=20260828-02`;
}


/* =========================================================
   UI
========================================================= */
function updateUI(){

  const maxEnergy =
    Number.isFinite(
      playerMaxEnergy
    ) &&
    playerMaxEnergy > 0
      ? playerMaxEnergy
      : (
          Number(
            window.APP_CONFIG?.MAX_ENERGY
          ) || 200
        );

  const energyText =
    `${Math.max(0,playerEnergy).toLocaleString("en-US")} / ${maxEnergy.toLocaleString("en-US")}`;

  const coin =
    document.getElementById("coinValue");

  const energy =
    document.getElementById("energyValue");

  const bossEnergy =
    document.getElementById("bossEnergyValue");

  const modalEnergy =
    document.getElementById("energyModalValue");

  if(coin){
    coin.textContent =
      Math.max(0,playerCoin)
        .toLocaleString("en-US");
  }

  if(energy){
    energy.textContent =
      energyText;
  }

  if(bossEnergy){
    bossEnergy.textContent =
      Math.max(0,playerEnergy)
        .toLocaleString("en-US");
  }

  if(modalEnergy){
    modalEnergy.textContent =
      energyText;
  }

  updateStageLocks();
  renderCurrentMonster();
}


function updateStageLocks(){

  document
    .querySelectorAll(".stage-hotspot")
    .forEach(
      button => {

        const stage =
          Number(
            button.dataset.stage
          );

        const locked =
          stage > unlockedStage;

        button.classList.toggle(
          "locked",
          locked
        );

        button.setAttribute(
          "aria-disabled",
          locked ? "true" : "false"
        );
      }
    );
}


/* =========================================================
   CACHE
========================================================= */
function loadCache(){

  const energyRaw =
    localStorage.getItem(
      "rockEnergy"
    );

  const coinRaw =
    localStorage.getItem(
      "rockCoin"
    );

  const maxRaw =
    localStorage.getItem(
      "rockMaxEnergy"
    );

  const stageRaw =
    localStorage.getItem(
      "rockUnlockedStage"
    );

  if(energyRaw !== null){

    const energy =
      Number(energyRaw);

    if(Number.isFinite(energy)){
      playerEnergy = energy;
    }
  }

  if(coinRaw !== null){

    const coin =
      Number(coinRaw);

    if(Number.isFinite(coin)){
      playerCoin = coin;
    }
  }

  if(maxRaw !== null){

    const max =
      Number(maxRaw);

    if(
      Number.isFinite(max) &&
      max > 0
    ){
      playerMaxEnergy = max;
    }
  }

  if(stageRaw !== null){

    const stage =
      Number(stageRaw);

    if(Number.isFinite(stage)){
      unlockedStage =
        Math.max(
          1,
          Math.min(10,stage)
        );
    }
  }

  updateUI();
}


/* =========================================================
   DASHBOARD
========================================================= */
async function loadDashboard(){

  let firstError =
    null;

  try{

    let raw =
      null;


    /*
      วิธีที่ 1:
      ใช้ helper เหมือนหน้า HOME / MISSION
    */
    try{

      if(
        typeof ROCK?.dashboard ===
        "function"
      ){

        raw =
          await ROCK.dashboard();

      }else if(
        typeof ROCK?.fetchDashboard ===
        "function"
      ){

        raw =
          await ROCK.fetchDashboard();

      }else if(
        typeof ROCK?.getDashboard ===
        "function"
      ){

        raw =
          await ROCK.getDashboard();

      }

    }catch(error){

      firstError =
        error;

      console.warn(
        "BATTLE DASHBOARD HELPER ERROR:",
        error
      );
    }


    /*
      วิธีที่ 2:
      ถ้า common.js มีปัญหา
      ให้ยิง player-dashboard โดยตรง
    */
    if(!raw){

      raw =
        await fetchBattleDashboardDirect();
    }


    const data =
      normalizeBattleDashboard(
        raw
      );


    if(
      Number.isFinite(
        data.energy
      )
    ){

      playerEnergy =
        Math.max(
          0,
          data.energy
        );

      localStorage.setItem(
        "rockEnergy",
        String(playerEnergy)
      );
    }


    if(
      Number.isFinite(
        data.coin
      )
    ){

      playerCoin =
        Math.max(
          0,
          data.coin
        );

      localStorage.setItem(
        "rockCoin",
        String(playerCoin)
      );
    }


    if(
      Number.isFinite(
        data.maxEnergy
      ) &&
      data.maxEnergy > 0
    ){

      playerMaxEnergy =
        data.maxEnergy;

      localStorage.setItem(
        "rockMaxEnergy",
        String(playerMaxEnergy)
      );
    }


    console.log(
      "BATTLE DASHBOARD OK:",
      {
        coin:
          playerCoin,

        energy:
          playerEnergy,

        maxEnergy:
          playerMaxEnergy,

        raw
      }
    );


    updateUI();

    return raw;


  }catch(error){

    console.error(
      "BATTLE DASHBOARD ERROR:",
      error,
      firstError
    );


    /*
      อย่าล้างค่าที่มีอยู่ใน cache
      แค่แจ้งเตือนเท่านั้น
    */
    updateUI();


    showToast(
      "โหลดเหรียญ/พลังไม่สำเร็จ: " +
      (
        error?.message ||
        String(error)
      )
    );


    return null;
  }
}


/* =========================================================
   BATTLE STATUS
========================================================= */
async function loadBattleStatus(){

  const api =
    window.APP_CONFIG?.API?.BATTLE;


  if(!api){
    return null;
  }


  try{

    const result =
      await battleApiPost(
        api,
        {
          action:
            "battleStatus"
        }
      );


    const payload =
      result?.data ??
      result ??
      {};


    const player =
      payload?.player ??
      {};


    const energy =
      Number(
        player?.energy
      );


    const coin =
      Number(
        player?.rockCoin ??
        player?.rock_coin ??
        player?.coin
      );


    const maxEnergy =
      Number(
        player?.maxEnergy ??
        player?.max_energy ??
        window.APP_CONFIG?.MAX_ENERGY ??
        200
      );


    const stage =
      Number(
        player?.unlockedStage ??
        player?.unlocked_stage ??
        payload?.stage?.id
      );


    if(
      Number.isFinite(
        energy
      )
    ){

      playerEnergy =
        Math.max(
          0,
          energy
        );

      localStorage.setItem(
        "rockEnergy",
        String(playerEnergy)
      );
    }


    if(
      Number.isFinite(
        coin
      )
    ){

      playerCoin =
        Math.max(
          0,
          coin
        );

      localStorage.setItem(
        "rockCoin",
        String(playerCoin)
      );
    }


    if(
      Number.isFinite(
        maxEnergy
      ) &&
      maxEnergy > 0
    ){

      playerMaxEnergy =
        maxEnergy;

      localStorage.setItem(
        "rockMaxEnergy",
        String(playerMaxEnergy)
      );
    }


    if(
      Number.isFinite(
        stage
      ) &&
      stage >= 1
    ){

      unlockedStage =
        Math.max(
          1,
          Math.min(
            10,
            stage
          )
        );

      localStorage.setItem(
        "rockUnlockedStage",
        String(unlockedStage)
      );
    }


    console.log(
      "BATTLE STATUS OK:",
      {
        coin:
          playerCoin,

        energy:
          playerEnergy,

        maxEnergy:
          playerMaxEnergy,

        unlockedStage,

        player,

        stage:
          payload?.stage
      }
    );


    updateUI();

    return result;


  }catch(error){

    console.error(
      "BATTLE STATUS ERROR:",
      error
    );


    if(
      error?.code ===
        "JWS_FORMAT_ERROR" ||
      error?.code ===
        "TOKEN_EXPIRED"
    ){

      battleRelogin(
        error.code
      );

      return null;
    }


    updateUI();

    showToast(
      "โหลด Battle Status ไม่สำเร็จ: " +
      (
        error?.message ||
        String(error)
      )
    );

    return null;
  }
}

/* =========================================================
   REGEN TIMER
========================================================= */
const REGEN_TOTAL =
  30 * 60;

let regenSeconds =
  Number(
    localStorage.getItem("rockRegenSeconds")
  );

if(
  !Number.isFinite(regenSeconds) ||
  regenSeconds <= 0 ||
  regenSeconds > REGEN_TOTAL
){
  regenSeconds =
    25 * 60 + 30;
}


function renderTimer(){

  const el =
    document.getElementById(
      "regenTimer"
    );

  if(!el){
    return;
  }

  const h =
    Math.floor(
      regenSeconds / 3600
    );

  const m =
    Math.floor(
      (regenSeconds % 3600) / 60
    );

  const s =
    regenSeconds % 60;

  el.textContent =
    `${String(h).padStart(2,"0")}:` +
    `${String(m).padStart(2,"0")}:` +
    `${String(s).padStart(2,"0")}`;
}


function startTimer(){

  renderTimer();

  setInterval(
    () => {

      regenSeconds--;

      if(regenSeconds < 0){
        regenSeconds =
          REGEN_TOTAL;
      }

      localStorage.setItem(
        "rockRegenSeconds",
        String(regenSeconds)
      );

      renderTimer();
    },
    1000
  );
}


/* =========================================================
   TOAST
========================================================= */
let toastTimer = null;

function showToast(message){

  const el =
    document.getElementById(
      "battleToast"
    );

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        el.classList.remove(
          "show"
        );
      },
      4200
    );
}


/* =========================================================
   START
========================================================= */

let battleRefreshTimer =
  null;


async function refreshBattleData(){

  const results =
    await Promise.allSettled([
      loadDashboard(),
      loadBattleStatus()
    ]);

  console.log(
    "BATTLE REFRESH:",
    results
  );

  updateUI();
}


function startBattleRefresh(){

  if(battleRefreshTimer){
    clearInterval(
      battleRefreshTimer
    );
  }

  const ms =
    Number(
      window.APP_CONFIG
        ?.REFRESH_MS
    ) || 30000;

  battleRefreshTimer =
    setInterval(
      () => {

        if(
          document.visibilityState ===
          "visible"
        ){
          refreshBattleData();
        }
      },
      ms
    );
}


async function startBattle(){

  loadCache();
  startTimer();
  renderCurrentMonster();

  if(
    OPEN_FIGHT_ON_LOAD
  ){
    showFightMonster();
  }

  if(TEST_MODE){

    unlockedStage =
      10;

    updateUI();
  }

  try{

    const ready =
      await prepareBattleApp();

    if(
      ready === false
    ){
      return;
    }

    await refreshBattleData();

    startBattleRefresh();

  }catch(error){

    console.error(
      "BATTLE INIT ERROR:",
      error
    );

    showToast(
      "เปิด Battle ไม่สำเร็จ: " +
      (
        error?.message ||
        String(error)
      )
    );
  }
}

document.addEventListener(
