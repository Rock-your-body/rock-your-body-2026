<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app-config.js?v=20260830-battle-v40"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#edf4ff;font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif}
    body{overflow-x:hidden}
    button{font:inherit}

    .stage{
      position:relative;
      width:100%;
      max-width:1536px;
      margin:0 auto;
      aspect-ratio:1536/768;
      overflow:hidden;
      background:#071a3b;
    }

    .template{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:fill;pointer-events:none;user-select:none
    }

    .live{
      position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;
      font-weight:900;text-align:center;pointer-events:none
    }

    #coinValue{left:79.1%;top:4.2%;width:7.0%;height:7.2%;color:#082c6d;font-size:clamp(8px,1.15vw,18px)}
    #energyValue{left:88.5%;top:4.2%;width:8.5%;height:7.2%;color:#082c6d;font-size:clamp(8px,1.15vw,18px)}
    #stageValue{
      left:3.4%;top:31.5%;width:17%;height:17%;justify-content:flex-start;
      color:#fff;font-size:clamp(16px,3.5vw,54px);line-height:.9;
      text-shadow:0 3px 8px rgba(0,0,0,.7)
    }
    #bossEnergyValue{left:42.6%;top:32.0%;width:14%;height:8%;color:#092d6d;font-size:clamp(10px,1.7vw,28px)}
    #giftStatus{
      left:65.2%;top:65.2%;width:27%;height:8%;color:#fff;font-size:clamp(8px,1.1vw,17px);
      text-shadow:0 2px 5px rgba(0,0,0,.8)
    }

    .hot{
      position:absolute;z-index:40;border:0;background:transparent;cursor:pointer;padding:0
    }
    .fight{left:60.0%;top:28.8%;width:38%;height:16%}
    .energy{left:60.0%;top:45.0%;width:38%;height:16%}
    .home{left:1.0%;top:83.1%;width:31.5%;height:14%}
    .mission{left:33.5%;top:83.1%;width:31.5%;height:14%}
    .battle{left:66.0%;top:83.1%;width:33%;height:14%}

    #status{
      position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
      z-index:9999;display:none;padding:12px 16px;border-radius:14px;background:#173c70;color:#fff;
      max-width:calc(100vw - 28px);font-weight:900;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.28)
    }
    #status.show{display:block}
    #status.error{background:#c62828}

    .modal{
      position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
      padding:20px;background:rgba(5,20,55,.68)
    }
    .modal.show{display:flex}
    .card{
      width:min(420px,100%);background:#fff;border-radius:22px;padding:22px;text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.32)
    }
    .card h2{margin:0 0 10px;color:#123e7a}
    .card .big{font-size:38px;font-weight:1000;color:#0c3774}
    .card p{color:#5b7089;line-height:1.6}
    .card button{width:100%;border:0;border-radius:13px;padding:13px;background:#164fa8;color:#fff;font-weight:900}
  </style>
</head>
<body>

<main id="battleStage" class="stage">
  <img class="template" src="./battle-template.png?v=20260830-v40" alt="Battle Template">

  <div id="coinValue" class="live">0</div>
  <div id="energyValue" class="live">0 / 200</div>
  <div id="stageValue" class="live">STAGE 1</div>
  <div id="bossEnergyValue" class="live">0 / 200</div>
  <div id="giftStatus" class="live">ยังไม่มีของขวัญรอรับ</div>

  <button class="hot fight" type="button" id="fightButton" aria-label="ต่อสู้กับมอนสเตอร์"></button>
  <button class="hot energy" type="button" id="energyButton" aria-label="พลังงานของฉัน"></button>
  <button class="hot home" type="button" id="homeButton" aria-label="Home"></button>
  <button class="hot mission" type="button" id="missionButton" aria-label="Mission"></button>
  <button class="hot battle" type="button" id="battleButton" aria-label="Battle"></button>
</main>

<div id="status"></div>

<div id="energyModal" class="modal">
  <section class="card">
    <div style="font-size:56px">⚡</div>
    <h2>MY ENERGY</h2>
    <div id="energyModalValue" class="big">0 / 200</div>
    <p>ใช้ Energy ในการผ่าน Stage เมื่อ Energy เพียงพอ ระบบจะหักตามค่าของด่าน</p>
    <button type="button" onclick="document.getElementById('energyModal').classList.remove('show')">ตกลง</button>
  </section>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

function apiUrl(){
  if(window.APP_CONFIG?.getApi) return window.APP_CONFIG.getApi("BATTLE");
  const url = window.APP_CONFIG?.API?.BATTLE;
  if(!url) throw new Error("ไม่พบ API.BATTLE");
  return url;
}

async function initLine(){
  await liff.init({
    liffId:window.APP_CONFIG?.LIFF_ID || "2011201679-uNWz5yqF"
  });

  if(!liff.isLoggedIn()){
    liff.login({redirectUri:location.href});
    return false;
  }

  if(!liff.getIDToken()){
    liff.logout();
    liff.login({redirectUri:location.href});
    return false;
  }

  return true;
}

async function post(action,payload={}){
  const idToken = liff.getIDToken();
  if(!idToken) throw new Error("ไม่พบ LINE ID Token");

  const res = await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    cache:"no-store",
    body:JSON.stringify({action,idToken,...payload})
  });

  const text = await res.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{throw new Error("Battle API ตอบกลับไม่ใช่ JSON")}

  if(res.status===401 || String(data?.error||"").toLowerCase().includes("expired")){
    liff.logout();
    liff.login({redirectUri:location.href});
    return new Promise(()=>{});
  }

  if(!res.ok || data?.success===false){
    throw new Error(data?.error || data?.message || `HTTP ${res.status}`);
  }

  return data;
}

function showStatus(text,error=false){
  const el=$("status");
  el.textContent=text;
  el.classList.toggle("error",error);
  el.classList.add("show");
  clearTimeout(window.__battleStatus);
  window.__battleStatus=setTimeout(()=>el.classList.remove("show"),error?5000:2600);
}

function render(data){
  const p=data?.player||{};
  $("coinValue").textContent=Number(p.rockCoin||0).toLocaleString();
  $("energyValue").textContent=`${Number(p.energy||0).toLocaleString()} / ${Number(p.maxEnergy||200).toLocaleString()}`;
  $("bossEnergyValue").textContent=`${Number(p.energy||0).toLocaleString()} / ${Number(p.maxEnergy||200).toLocaleString()}`;
  $("energyModalValue").textContent=`${Number(p.energy||0).toLocaleString()} / ${Number(p.maxEnergy||200).toLocaleString()}`;

  const current=data?.currentStage||{};
  $("stageValue").textContent=`STAGE ${current.id||1}`;

  const pending=Number(data?.pendingRewards||0);
  $("giftStatus").textContent = pending>0
    ? `🎁 รอ Admin อนุมัติ ${pending} รางวัล`
    : "ยังไม่มีของขวัญรอรับ";
}

$("fightButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE_MAP || "./battle_maps.html";
$("battleButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.BATTLE_MAP || "./battle_maps.html";
$("homeButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.HOME || "./dashboard.html";
$("missionButton").onclick=()=>location.href=window.APP_CONFIG?.PAGE?.MISSION || "./mission.html";
$("energyButton").onclick=()=>$("energyModal").classList.add("show");

(async()=>{
  try{
    const ok=await initLine();
    if(ok===false) return;
    render(await post("home"));
  }catch(error){
    console.error(error);
    showStatus(error?.message||String(error),true);
  }
})();
</script>
</body>
</html>
