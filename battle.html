<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROCK YOUR BODY 2026 - BATTLE</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><link rel="stylesheet" href="base.css"><script src="app-config.js"></script></head><body>
<div class="stage">
  <img class="template" src="./battle-template.png" alt="BATTLE template">
  <div id="coin" class="overlay cover" style="left:76.6%;top:4.2%;width:7.4%;height:5%;font-size:clamp(11px,1.5vw,26px)">--</div>
  <div id="energy" class="overlay cover" style="left:88.8%;top:4.2%;width:9.4%;height:5%;font-size:clamp(10px,1.35vw,24px)">-- / --</div>
  <div id="monsterName" class="overlay" style="left:3%;top:27.5%;width:18.5%;height:9%;justify-content:flex-start;color:#fff;font-size:clamp(13px,2.4vw,38px);white-space:normal">MONSTER</div>
  <div id="stageNo" class="overlay" style="left:3.2%;top:35.5%;width:10%;height:4.6%;justify-content:flex-start;color:#fff;font-size:clamp(9px,1.3vw,22px)">STAGE --</div>
  <img id="monsterImage" style="position:absolute;z-index:6;left:21%;top:20%;width:31%;height:39%;object-fit:contain;display:none" alt="monster">
  <div id="hpText" class="overlay" style="left:3.1%;top:47%;width:16%;height:4.5%;justify-content:flex-start;color:#fff;font-size:clamp(10px,1.4vw,24px)">-- / --</div>
  <div style="position:absolute;z-index:5;left:5.7%;top:44.1%;width:14.9%;height:2.1%;border-radius:999px;overflow:hidden"><div id="hpBar" style="height:100%;width:0;background:linear-gradient(90deg,#ff3f3f,#c51022)"></div></div>
  <div id="hpPercent" class="overlay" style="left:3%;top:52.8%;width:8%;height:4.8%;justify-content:flex-start;color:#fff;font-size:clamp(14px,2vw,34px)">--%</div>
  <div id="battleEnergy" class="overlay cover" style="left:58.6%;top:29.5%;width:10%;height:6%;font-size:clamp(15px,2.4vw,38px)">-- / --</div>
  <div style="position:absolute;z-index:5;left:53.7%;top:37.5%;width:15.9%;height:2.6%;border-radius:999px;overflow:hidden"><div id="energyBar" style="height:100%;width:0;background:linear-gradient(90deg,#ffd524,#ff8c00)"></div></div>
  <div id="timer" class="overlay cover" style="left:57.4%;top:48.6%;width:11.8%;height:5.5%;font-size:clamp(12px,1.8vw,30px)">--:--:--</div>
  <div id="rank1" class="overlay" style="left:34.6%;top:64.7%;width:18%;height:4%;justify-content:space-between;color:#fff;font-size:clamp(9px,1.2vw,19px)"><span>--</span><span>--</span></div>
  <div id="rank2" class="overlay" style="left:34.6%;top:69.7%;width:18%;height:4%;justify-content:space-between;color:#fff;font-size:clamp(9px,1.2vw,19px)"><span>--</span><span>--</span></div>
  <div id="rank3" class="overlay" style="left:34.6%;top:74.7%;width:18%;height:4%;justify-content:space-between;color:#fff;font-size:clamp(9px,1.2vw,19px)"><span>--</span><span>--</span></div>
  <button class="hotspot" style="left:71.4%;top:22.4%;width:26.1%;height:17.6%" onclick="alert('ระบบโจมตีจะเชื่อม Edge Function ถัดไป')"></button>
  <button class="hotspot" style="left:71.4%;top:41.2%;width:26.1%;height:17.6%" onclick="alert('Energy ปัจจุบัน: '+$('battleEnergy').textContent)"></button>
  <button class="hotspot" style="left:58.2%;top:59.5%;width:39.3%;height:20%" onclick="go(CFG.PAGE.REWARDS)"></button>
  <button class="hotspot" style="left:1.4%;top:83.2%;width:31.5%;height:14.5%" onclick="go(CFG.PAGE.HOME)"></button>
  <button class="hotspot" style="left:33.7%;top:83.2%;width:32.2%;height:14.5%" onclick="go(CFG.PAGE.MISSION)"></button>
  <button class="hotspot" style="left:66.5%;top:83.2%;width:32.1%;height:14.5%" onclick="go(CFG.PAGE.BATTLE)"></button>
</div><div id="status" class="status"></div><script src="common.js"></script><script>
function rankHtml(x){x=x||{};return `<span>${x.name??'--'}</span><span>${x.score!=null?fmtInt(x.score):'--'}</span>`}
function render(raw){const d=normalize(raw),p=d.player,b=d.battle||{};$('coin').textContent=fmtInt(p.coin);$('energy').textContent=`${fmtInt(p.energy)} / ${fmtInt(p.maxEnergy)}`;$('battleEnergy').textContent=`${fmtInt(p.energy)} / ${fmtInt(p.maxEnergy)}`;$('energyBar').style.width=pct(p.energy,p.maxEnergy)+'%';$('monsterName').textContent=b.monsterName??b.monster_name??'MONSTER';$('stageNo').textContent='STAGE '+(b.stage??'--');const hp=num(b.bossHp??b.hp,0),mh=num(b.bossMaxHp??b.maxHp,0);$('hpText').textContent=mh>0?`${fmtInt(hp)} / ${fmtInt(mh)}`:'-- / --';$('hpBar').style.width=mh>0?pct(hp,mh)+'%':'0%';$('hpPercent').textContent=mh>0?Math.round(pct(hp,mh))+'%':'--%';const img=b.monsterImage??b.monster_image;if(img){$('monsterImage').src=img;$('monsterImage').style.display='block'}$('timer').textContent=b.energyTimer??b.energy_timer??'--:--:--';const r=Array.isArray(b.ranking)?b.ranking:[];$('rank1').innerHTML=rankHtml(r[0]);$('rank2').innerHTML=rankHtml(r[1]);$('rank3').innerHTML=rankHtml(r[2])}
(async()=>{try{showStatus('กำลังเชื่อมต่อ LINE...');if(!await initLiff())return;render(await fetchDashboard());hideStatus()}catch(e){console.error(e);showStatus(e.message||String(e),true)}})();
</script></body></html>
