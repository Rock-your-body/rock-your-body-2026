<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#eef5ff">

<title>ROCK YOUR BODY 2026 - Battle</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #eef5ff;
  color: #08245b;
}

.page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 10px;
}

.battle {
  position: relative;
  width: 100%;
  max-width: 1250px;
  aspect-ratio: 2500 / 1686;
  overflow: hidden;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,.12);
}

.battle-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  user-select: none;
}

.live-value {
  position: absolute;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  white-space: nowrap;
  line-height: 1;
  text-align: center;
  pointer-events: none;
}

/* ROCK COIN */

#rockCoinValue {
  left: 80.8%;
  top: 6.1%;
  transform: translate(-50%, -50%);
  width: 8%;
  color: #08245b;
  font-size: clamp(12px, 1.5vw, 25px);
}

/* ENERGY TOP */

#energyTopValue {
  left: 92.8%;
  top: 6.1%;
  transform: translate(-50%, -50%);
  width: 10%;
  color: #08245b;
  font-size: clamp(11px, 1.35vw, 23px);
}

/* MY ENERGY CARD */

#myEnergyValue {
  left: 61.5%;
  top: 39.7%;
  transform: translate(-50%, -50%);
  width: 13%;
  color: #08245b;
  font-size: clamp(13px, 1.7vw, 29px);
}

/* ENERGY BAR */

.energy-track {
  position: absolute;
  z-index: 18;
  left: 53.5%;
  top: 38.0%;
  width: 16.2%;
  height: 3.1%;
  border-radius: 999px;
  overflow: hidden;
  background: transparent;
  pointer-events: none;
}

.energy-fill {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    #ffd42a 0%,
    #ff9d00 45%,
    #ff6b00 100%
  );
  transition: width .4s ease;
}

/* BATTLE RANKING */

#battleRank1,
#battleRank2,
#battleRank3 {
  position: absolute;
  z-index: 20;
  color: #fff;
  font-weight: 900;
  font-size: clamp(10px, 1.2vw, 20px);
  pointer-events: none;
}

#battleRank1 {
  left: 42.5%;
  top: 69.8%;
}

#battleRank2 {
  left: 42.5%;
  top: 73.5%;
}

#battleRank3 {
  left: 42.5%;
  top: 77.2%;
}

/* CLICK AREAS */

.click-area {
  position: absolute;
  z-index: 30;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

#fightButton {
  left: 72%;
  top: 23%;
  width: 25%;
  height: 18%;
}

#energyButton {
  left: 72%;
  top: 42%;
  width: 25%;
  height: 18%;
}

#rankingButton {
  left: 1.5%;
  top: 61%;
  width: 56%;
  height: 18%;
}

#rewardButton {
  left: 58%;
  top: 61%;
  width: 39%;
  height: 18%;
}

#homeButton {
  left: 1%;
  top: 82%;
  width: 32%;
  height: 17%;
}

#missionButton {
  left: 34%;
  top: 82%;
  width: 32%;
  height: 17%;
}

#battleButton {
  left: 67%;
  top: 82%;
  width: 32%;
  height: 17%;
}

/* STATUS */

.status {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  max-width: 90vw;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(7,59,147,.94);
  color: #fff;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 8px 25px rgba(0,0,0,.22);
  display: none;
}

.status.show {
  display: block;
}

.status.error {
  background: rgba(190,27,27,.96);
}

@media (max-width: 650px) {
  .page {
    padding: 0;
  }

  .battle {
    width: 100vw;
    border-radius: 0;
    box-shadow: none;
  }

  #rockCoinValue,
  #energyTopValue,
  #myEnergyValue {
    font-size: clamp(8px, 2.3vw, 14px);
  }
}
</style>
</head>

<body>

<div class="page">

  <div
    id="battle"
    class="battle"
  >

    <img
      class="battle-bg"
      src="./rock-battle-2500x1686-668KB.jpg"
      alt="ROCK YOUR BODY BATTLE"
    >

    <div
      id="rockCoinValue"
      class="live-value"
    ></div>

    <div
      id="energyTopValue"
      class="live-value"
    ></div>

    <div
      id="myEnergyValue"
      class="live-value"
    ></div>

    <div class="energy-track">
      <div
        id="energyBar"
        class="energy-fill"
      ></div>
    </div>

    <div id="battleRank1"></div>
    <div id="battleRank2"></div>
    <div id="battleRank3"></div>

    <button
      id="fightButton"
      class="click-area"
      type="button"
      aria-label="Fight Monster"
    ></button>

    <button
      id="energyButton"
      class="click-area"
      type="button"
      aria-label="My Energy"
    ></button>

    <button
      id="rankingButton"
      class="click-area"
      type="button"
      aria-label="Battle Ranking"
    ></button>

    <button
      id="rewardButton"
      class="click-area"
      type="button"
      aria-label="Boss Reward"
    ></button>

    <button
      id="homeButton"
      class="click-area"
      type="button"
      aria-label="Home"
    ></button>

    <button
      id="missionButton"
      class="click-area"
      type="button"
      aria-label="Mission"
    ></button>

    <button
      id="battleButton"
      class="click-area"
      type="button"
      aria-label="Battle"
    ></button>

  </div>

</div>

<div
  id="status"
  class="status"
></div>

<script>

/* =========================================
   CONFIG
========================================= */

const LIFF_ID =
  "2011201679-uNWz5yqF";

const API_URL =
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";

const HOME_URL =
  "dashboard.html";

const MISSION_URL =
  "mission.html";

const AUTO_REFRESH_MS =
  10000;

/* =========================================
   STATE
========================================= */

let refreshTimer = null;
let requestRunning = false;

/* =========================================
   ELEMENTS
========================================= */

const statusEl =
  document.getElementById("status");

const rockCoinValue =
  document.getElementById("rockCoinValue");

const energyTopValue =
  document.getElementById("energyTopValue");

const myEnergyValue =
  document.getElementById("myEnergyValue");

const energyBar =
  document.getElementById("energyBar");

const battleRank1 =
  document.getElementById("battleRank1");

const battleRank2 =
  document.getElementById("battleRank2");

const battleRank3 =
  document.getElementById("battleRank3");

/* =========================================
   STATUS
========================================= */

function showStatus(
  message,
  type = ""
) {

  statusEl.textContent =
    message;

  statusEl.className =
    "status show" +
    (
      type
        ? " " + type
        : ""
    );
}

function hideStatus() {
  statusEl.className = "status";
}

/* =========================================
   FORMAT
========================================= */

function formatInteger(value) {

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return "0";
  }

  return Math
    .round(number)
    .toLocaleString("en-US");
}

/* =========================================
   API
========================================= */

async function callAPI(
  action,
  extra = {}
) {

  const idToken =
    liff.getIDToken();

  if (!idToken) {
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action,
            idToken,
            ...extra
          })
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "API ตอบกลับไม่ถูกต้อง"
    );
  }

  if (
    !response.ok ||
    !data.success
  ) {
    throw new Error(
      data.error ||
      "โหลดข้อมูลไม่สำเร็จ"
    );
  }

  return data;
}

/* =========================================
   RENDER
========================================= */

function renderBattle(data) {

  rockCoinValue.textContent =
    formatInteger(
      data.rockCoin
    );

  if (
    data.energy &&
    data.energy.current !== undefined
  ) {

    const current =
      Number(data.energy.current || 0);

    const max =
      Number(data.energy.max || 200);

    energyTopValue.textContent =
      formatInteger(current) +
      "/" +
      formatInteger(max);

    myEnergyValue.textContent =
      formatInteger(current) +
      "/" +
      formatInteger(max);

    const percent =
      max > 0
        ? Math.max(
            0,
            Math.min(
              100,
              (current / max) * 100
            )
          )
        : 0;

    energyBar.style.width =
      percent + "%";

  } else {

    energyTopValue.textContent = "";
    myEnergyValue.textContent = "";
    energyBar.style.width = "0%";
  }

  battleRank1.textContent =
    data.battle?.ranking?.[0]?.name || "";

  battleRank2.textContent =
    data.battle?.ranking?.[1]?.name || "";

  battleRank3.textContent =
    data.battle?.ranking?.[2]?.name || "";
}

/* =========================================
   LOAD
========================================= */

async function loadBattle(
  showLoading = true
) {

  if (requestRunning) {
    return;
  }

  requestRunning = true;

  if (showLoading) {
    showStatus(
      "กำลังโหลดข้อมูล Battle..."
    );
  }

  try {

    const data =
      await callAPI(
        "dashboard"
      );

    renderBattle(data);

    hideStatus();

  } catch (error) {

    console.error(
      "BATTLE LOAD ERROR:",
      error
    );

    showStatus(
      error.message ||
      "โหลดข้อมูล Battle ไม่สำเร็จ",
      "error"
    );

  } finally {

    requestRunning = false;
  }
}

/* =========================================
   AUTO REFRESH
========================================= */

function startAutoRefresh() {

  if (refreshTimer) {
    clearInterval(
      refreshTimer
    );
  }

  refreshTimer =
    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadBattle(false);
        }

      },
      AUTO_REFRESH_MS
    );
}

/* =========================================
   NAVIGATION
========================================= */

function go(url) {
  window.location.href = url;
}

/* =========================================
   BUTTONS
========================================= */

document
  .getElementById("fightButton")
  .addEventListener(
    "click",
    function () {

      alert(
        "⚔️ ระบบต่อสู้กับมอนสเตอร์จะเชื่อมในขั้นถัดไป"
      );
    }
  );

document
  .getElementById("energyButton")
  .addEventListener(
    "click",
    function () {

      alert(
        "⚡ Energy ปัจจุบัน: " +
        (
          myEnergyValue.textContent ||
          "0/200"
        )
      );
    }
  );

document
  .getElementById("rankingButton")
  .addEventListener(
    "click",
    function () {

      alert(
        "🏆 Battle Ranking จะเชื่อมในขั้นถัดไป"
      );
    }
  );

document
  .getElementById("rewardButton")
  .addEventListener(
    "click",
    function () {

      alert(
        "🎁 Boss Reward จะเชื่อมในขั้นถัดไป"
      );
    }
  );

document
  .getElementById("homeButton")
  .addEventListener(
    "click",
    function () {
      go(HOME_URL);
    }
  );

document
  .getElementById("missionButton")
  .addEventListener(
    "click",
    function () {
      go(MISSION_URL);
    }
  );

document
  .getElementById("battleButton")
  .addEventListener(
    "click",
    function () {
      loadBattle(true);
    }
  );

/* =========================================
   VISIBILITY
========================================= */

document
  .addEventListener(
    "visibilitychange",
    function () {

      if (
        document.visibilityState ===
          "visible" &&
        liff.isLoggedIn()
      ) {

        loadBattle(false);
      }
    }
  );

/* =========================================
   LIFF
========================================= */

async function initLIFF() {

  showStatus(
    "กำลังเชื่อมต่อ LINE..."
  );

  try {

    await liff.init({
      liffId:
        LIFF_ID
    });

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();
      return;
    }

    await loadBattle(true);

    startAutoRefresh();

  } catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );

    showStatus(
      "เปิด Battle ไม่สำเร็จ: " +
      (
        error.message ||
        error
      ),
      "error"
    );
  }
}

/* =========================================
   START
========================================= */

initLIFF();

</script>

</body>
</html>
