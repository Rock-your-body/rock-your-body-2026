  <div class="toast" id="toast"></div>

  <script>
    const state = {
      player: null,
      stage: null,
      runs: [],
      activeRun: null,
      currentStageId: 1
    };

    const $ = id => document.getElementById(id);

    function toast(message){
      const el = $("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 5200);
    }

    function setLoading(show){
      $("loading").classList.toggle("hidden", !show);
    }

    function isJwtLike(token){
      if(typeof token !== "string") return false;
      const parts = token.trim().split(".");
      return parts.length === 3 && parts.every(Boolean);
    }

    function decodeJwtPayloadSafe(token){
      try{
        if(!isJwtLike(token)) return null;
        let b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
        while(b64.length % 4) b64 += "=";
        const binary = atob(b64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      }catch{
        return null;
      }
    }

    function tokenExpired(token, bufferSeconds=45){
      const payload = decodeJwtPayloadSafe(token);
      const exp = Number(payload?.exp);
      if(!Number.isFinite(exp)) return false;
      return exp <= Math.floor(Date.now()/1000) + bufferSeconds;
    }

    async function ensureLiff(){
      if(typeof liff === "undefined"){
        throw new Error("LINE LIFF SDK ไม่พร้อม");
      }

      const liffId =
        window.APP_CONFIG?.LIFF_ID ||
        window.ROCK?.CFG?.LIFF_ID ||
        window.ROCK?.CFG?.LIFF?.HOME;

      if(!liffId){
        throw new Error("ไม่พบ LIFF_ID ใน app-config.js");
      }

      await liff.init({liffId});

      if(!liff.isLoggedIn()){
        liff.login({redirectUri: window.location.href});
        return false;
      }

      const token = liff.getIDToken();

      if(!token || !isJwtLike(token) || tokenExpired(token)){
        try{ liff.logout(); }catch{}
        liff.login({redirectUri: window.location.href});
        return false;
      }

      return true;
    }

    function getIdToken(){
      const token = liff.getIDToken();
      if(!token || !isJwtLike(token)){
        throw new Error("LINE ID Token format ไม่ถูกต้อง");
      }
      if(tokenExpired(token,30)){
        throw new Error("LINE ID Token หมดอายุ");
      }
      return token;
    }

    function getBattleApi(){
      const api =
        window.APP_CONFIG?.getApi
          ? window.APP_CONFIG.getApi("BATTLE")
          : window.APP_CONFIG?.API?.BATTLE;

      if(!api){
        throw new Error("ไม่พบ API.BATTLE ใน app-config.js");
      }

      return api;
    }

    async function battleApi(payload){

      const api =
        getBattleApi();

      let response;

      try{

        response =
          await fetch(
            api,
            {
              method:"POST",

              mode:"cors",

              headers:{
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              cache:"no-store",

              body:
                JSON.stringify({
                  ...payload,
                  idToken:
                    getIdToken()
                })
            }
          );

      }catch(error){

        console.error(
          "BATTLE FETCH NETWORK ERROR:",
          {
            api,
            error
          }
        );

        throw new Error(
          "เชื่อม BATTLE API ไม่สำเร็จ (CORS/Edge Function/Verify JWT)"
        );
      }


      const text =
        await response.text();

      let data = {};

      try{
        data =
          text
            ? JSON.parse(text)
            : {};
      }catch{
        throw new Error(
          `Battle API ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`
        );
      }


      if(
        !response.ok ||
        data?.success === false
      ){

        const msg =
          String(
            data?.error ||
            data?.message ||
            `HTTP ${response.status}`
          );

        const low =
          msg.toLowerCase();

        if(
          response.status === 401 ||
          low.includes("jws format") ||
          low.includes("authentication failed") ||
          low.includes("idtoken expired")
        ){

          /*
            LINE token issue -> login ใหม่
            ถ้าเป็น Supabase Verify JWT จะไม่ logout วน
          */
          if(
            low.includes("jws format") ||
            low.includes("invalid jwt") ||
            low.includes("missing authorization")
          ){
            throw new Error(
              "BATTLE Edge Function ยังเปิด Verify JWT อยู่ กรุณาปิด Verify JWT"
            );
          }

          try{
            liff.logout();
          }catch{}

          liff.login({
            redirectUri:
              window.location.href
          });

          return await new Promise(()=>{});
        }

        throw new Error(msg);
      }

      return data;
    }


    function pickNumber(...values){
      for(const value of values){
        const n = Number(value);
        if(Number.isFinite(n)) return n;
      }
      return 0;
    }

    function normalizeBattlePlayer(raw={}){
      return {
        ...raw,
        rockCoin: pickNumber(raw.rockCoin, raw.rock_coin, raw.coin, 0),
        energy: pickNumber(raw.energy, 0),
        maxEnergy: pickNumber(raw.maxEnergy, raw.max_energy, window.APP_CONFIG?.MAX_ENERGY, 200),
        unlockedStage: pickNumber(raw.unlockedStage, raw.unlocked_stage, raw.currentStage, raw.current_stage, 1),
        totalWins: pickNumber(raw.totalWins, raw.total_wins, raw.wins, 0),
        totalAttacks: pickNumber(raw.totalAttacks, raw.total_attacks, raw.attacks, 0)
      };
    }

    function normalizeBattleStage(raw={}, fallbackId=1){
      return {
        ...raw,
        id: pickNumber(raw.id, raw.stageId, raw.stage_id, fallbackId),
        name: raw.name || raw.monsterName || raw.monster_name || `STAGE ${fallbackId}`,
        hp: pickNumber(raw.hp, raw.maxHp, raw.max_hp, raw.monster_max_hp, 0),
        energy: pickNumber(raw.energy, raw.energyCost, raw.energy_cost, 0),
        damage: pickNumber(raw.damage, raw.attackDamage, raw.attack_damage, 0)
      };
    }

    function normalizeBattleRuns(raw){
      if(!Array.isArray(raw)) return [];
      return raw.map(run => ({
        ...run,
        stage_id: pickNumber(run.stage_id, run.stageId, 0),
        monster_hp: pickNumber(run.monster_hp, run.monsterHp, 0),
        monster_max_hp: pickNumber(run.monster_max_hp, run.monsterMaxHp, 0),
        status: String(run.status || "").toLowerCase()
      }));
    }


    async function playerApi(payload){
      const api =
        window.APP_CONFIG?.getApi
          ? window.APP_CONFIG.getApi("PLAYER")
          : window.APP_CONFIG?.API?.PLAYER;

      if(!api) return null;

      try{
        const response = await fetch(api,{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Cache-Control":"no-cache"
          },
          cache:"no-store",
          body:JSON.stringify({
            ...payload,
            idToken:getIdToken()
          })
        });

        const raw = await response.text();
        const data = raw ? JSON.parse(raw) : {};
        if(!response.ok || data?.success === false) return null;
        return data;
      }catch(error){
        console.warn("PLAYER API fallback skipped:", error);
        return null;
      }
    }


    function unwrapPayload(raw){
      if(!raw || typeof raw !== "object") return {};
      if(raw.data && typeof raw.data === "object"){
        return {
          ...raw.data,
          success:
            raw.success ??
            raw.data.success ??
            true
        };
      }
      return raw;
    }

    function normalizeHomeDashboard(raw={}){
      const data = unwrapPayload(raw);

      /*
        player-dashboard V2.12 response จริง:
        {
          success:true,
          user:{...},
          rockCoin:123,
          energy:{current:80,max:200,...}
        }
      */
      return {
        rockCoin: pickNumber(
          data.rockCoin,
          data.rock_coin,
          data.wallet?.rockCoin,
          data.wallet?.rock_coin,
          0
        ),

        energy: pickNumber(
          data.energy?.current,
          data.energy_current,
          typeof data.energy === "number"
            ? data.energy
            : undefined,
          0
        ),

        maxEnergy: pickNumber(
          data.energy?.max,
          data.maxEnergy,
          data.max_energy,
          window.APP_CONFIG?.MAX_ENERGY,
          200
        ),

        user:
          data.user ||
          data.player ||
          data.profile ||
          {}
      };
    }

    async function loadBattleStatusSafe(){
      try{
        return await battleApi({
          action:"battleStatus"
        });
      }catch(firstError){
        const msg =
          String(
            firstError?.message ||
            ""
          ).toLowerCase();

        /*
          Compatibility fallback only when backend explicitly
          says the action is unknown/not supported.
        */
        if(
          msg.includes("unknown action") ||
          msg.includes("invalid action") ||
          msg.includes("unsupported action")
        ){
          return await battleApi({
            action:"status"
          });
        }

        throw firstError;
      }
    }

    function getActiveRun(){
      const stageId = Number(state.currentStageId || 1);

      return (state.runs || []).find(run =>
        Number(run.stage_id) === stageId &&
        run.status === "active"
      ) || null;
    }

    function formatNumber(n){
      const x = Number(n);
      return Number.isFinite(x) ? x.toLocaleString("en-US") : "--";
    }

    function render(){
      const p = state.player || {};
      const s = state.stage || {};
      const active = state.activeRun;

      /*
        Coin / Energy / EXP / Level
        ต้องมาจาก battleStatus -> rock_users ชุดเดียวกับ HOME / MISSION
      */
      const coin = Number(
        p.rockCoin ??
        p.rock_coin ??
        0
      );

      const energy = Number(
        p.energy ??
        0
      );

      const maxEnergy = Number(
        p.maxEnergy ??
        p.max_energy ??
        200
      );

      /*
        Stage ปัจจุบัน = unlockedStage จาก battle_player_state
        Backend battleStatus จะคืน stage object ของ Stage นี้
      */
      const currentStageId = Number(
        p.unlockedStage ??
        p.unlocked_stage ??
        s.id ??
        1
      );

      state.currentStageId =
        Math.max(
          1,
          Math.min(
            10,
            currentStageId
          )
        );

      const hpMax = Number(
        active?.monster_max_hp ??
        s.hp ??
        0
      );

      const hp = Number(
        active?.monster_hp ??
        hpMax
      );

      const hpPct =
        hpMax > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (hp / hpMax) * 100
              )
            )
          : 0;

      const energyPct =
        maxEnergy > 0
          ? Math.max(
              0,
              Math.min(
                100,
                (energy / maxEnergy) * 100
              )
            )
          : 0;


      $("hudCoin").textContent =
        formatNumber(coin);

      $("hudEnergy").textContent =
        `${formatNumber(energy)}/${formatNumber(maxEnergy)}`;


      $("bossName").textContent =
        s.name ||
        `STAGE ${state.currentStageId}`;

      $("bossStage").textContent =
        `STAGE ${state.currentStageId}`;

      $("stageBadge").textContent =
        `STAGE ${state.currentStageId}`;


      $("hpText").textContent =
        `${formatNumber(hp)} / ${formatNumber(hpMax)}`;

      $("hpPercent").textContent =
        `${Math.round(hpPct)}%`;

      $("hpFill").style.width =
        `${hpPct}%`;


      $("energyBig").textContent =
        `${formatNumber(energy)} / ${formatNumber(maxEnergy)}`;

      $("energyFill").style.width =
        `${energyPct}%`;


      const required =
        Number(
          s.energy ??
          0
        );

      if(required > 0){

        if(energy >= required){

          $("energyNext").textContent =
            `พร้อมต่อสู้ Stage ${state.currentStageId} • ใช้ ${formatNumber(required)} Energy`;

        }else{

          $("energyNext").textContent =
            `Stage ${state.currentStageId} ต้องการอีก ${formatNumber(required - energy)} Energy`;

        }

      }else{

        $("energyNext").textContent =
          `Stage ปัจจุบัน ${state.currentStageId}`;

      }


      $("totalWins").textContent =
        formatNumber(
          p.totalWins ??
          p.total_wins ??
          0
        );

      $("totalAttacks").textContent =
        formatNumber(
          p.totalAttacks ??
          p.total_attacks ??
          0
        );

      $("currentStage").textContent =
        String(
          state.currentStageId
        );
    }

    async function loadBattle(){

      setLoading(true);

      let homeError = null;
      let battleError = null;

      try{

        const ready =
          await ensureLiff();

        if(ready === false){
          return;
        }

        /*
          โหลด HOME และ BATTLE แยกกัน
          ถ้า Battle ล้ม HOME Coin/Energy ยังต้องขึ้น
          ถ้า HOME ล้ม Battle ยังต้องขึ้น
        */
        const results =
          await Promise.allSettled([
            playerApi({
              action:"dashboard"
            }),
            loadBattleStatusSafe()
          ]);

        /* -----------------------------------------------
           HOME / SHARED PLAYER STATE
        ----------------------------------------------- */
        if(
          results[0].status ===
          "fulfilled"
        ){

          const home =
            normalizeHomeDashboard(
              results[0].value ||
              {}
            );

          state.player =
            normalizeBattlePlayer({
              ...(state.player || {}),
              rockCoin:
                home.rockCoin,
              energy:
                home.energy,
              maxEnergy:
                home.maxEnergy
            });

          /*
            Render ทันที ไม่รอ Battle
          */
          render();

        }else{

          homeError =
            results[0].reason;

          console.warn(
            "HOME PLAYER DATA ERROR:",
            homeError
          );
        }


        /* -----------------------------------------------
           BATTLE STATE
        ----------------------------------------------- */
        if(
          results[1].status ===
          "fulfilled"
        ){

          const rawBattle =
            unwrapPayload(
              results[1].value ||
              {}
            );

          const battlePlayer =
            rawBattle.player ||
            rawBattle.user ||
            rawBattle.battlePlayer ||
            rawBattle.battle_player ||
            {};

          /*
            ค่า Coin / Energy จาก HOME มี priority
            แต่ถ้า HOME ไม่ได้ ให้ fallback จาก Battle
          */
          const existing =
            state.player ||
            {};

          state.player =
            normalizeBattlePlayer({
              ...battlePlayer,

              rockCoin:
                Number.isFinite(
                  Number(
                    existing.rockCoin
                  )
                )
                  ? existing.rockCoin
                  : (
                      battlePlayer.rockCoin ??
                      battlePlayer.rock_coin
                    ),

              energy:
                Number.isFinite(
                  Number(
                    existing.energy
                  )
                )
                  ? existing.energy
                  : battlePlayer.energy,

              maxEnergy:
                Number.isFinite(
                  Number(
                    existing.maxEnergy
                  )
                ) &&
                Number(
                  existing.maxEnergy
                ) > 0
                  ? existing.maxEnergy
                  : (
                      battlePlayer.maxEnergy ??
                      battlePlayer.max_energy
                    ),

              totalWins:
                battlePlayer.totalWins ??
                battlePlayer.total_wins ??
                rawBattle.stats?.totalWins ??
                rawBattle.stats?.total_wins ??
                rawBattle.totalWins ??
                rawBattle.total_wins,

              totalAttacks:
                battlePlayer.totalAttacks ??
                battlePlayer.total_attacks ??
                rawBattle.stats?.totalAttacks ??
                rawBattle.stats?.total_attacks ??
                rawBattle.totalAttacks ??
                rawBattle.total_attacks,

              unlockedStage:
                battlePlayer.unlockedStage ??
                battlePlayer.unlocked_stage ??
                rawBattle.currentStage ??
                rawBattle.current_stage ??
                rawBattle.stage?.id
            });

          state.currentStageId =
            Math.max(
              1,
              pickNumber(
                state.player.unlockedStage,
                rawBattle.currentStage,
                rawBattle.current_stage,
                rawBattle.stage?.id,
                1
              )
            );

          state.stage =
            normalizeBattleStage(
              rawBattle.stage ||
              rawBattle.boss ||
              rawBattle.monster ||
              {},
              state.currentStageId
            );

          state.runs =
            normalizeBattleRuns(
              rawBattle.runs ||
              rawBattle.battleRuns ||
              rawBattle.battle_runs ||
              []
            );

          state.activeRun =
            getActiveRun();

          render();

          const liveStatus =
            $("battleLiveStatus");

          if(liveStatus){
            liveStatus.textContent =
              "LIVE • HOME + BATTLE";
            liveStatus.style.display =
              "";
          }

          console.log(
            "BATTLE V2.16 DATA:",
            {
              homePlayer:
                state.player,
              stage:
                state.stage,
              runs:
                state.runs,
              activeRun:
                state.activeRun,
              rawBattle
            }
          );

        }else{

          battleError =
            results[1].reason;

          console.error(
            "BATTLE STATUS ERROR:",
            battleError
          );

          /*
            HOME ขึ้นแล้ว แม้ Battle backend มีปัญหา
          */
          if(state.player){
            render();
          }
        }


        if(
          homeError &&
          battleError
        ){
          throw new Error(
            `โหลดข้อมูลไม่สำเร็จ • HOME: ${
              homeError?.message ||
              homeError
            } • BATTLE: ${
              battleError?.message ||
              battleError
            }`
          );
        }


        if(battleError){

          $("bossName").textContent =
            "ยังไม่มีข้อมูล Battle";

          $("bossStage").textContent =
            "ตรวจสอบ BATTLE API";

          $("stageBadge").textContent =
            "STAGE --";

          const liveStatus =
            $("battleLiveStatus");

          if(liveStatus){
            liveStatus.textContent =
              "HOME LIVE • BATTLE CONNECTION ERROR";
            liveStatus.style.display =
              "";
          }

          toast(
            `ข้อมูล HOME โหลดแล้ว • Battle: ${
              battleError?.message ||
              "โหลดไม่สำเร็จ"
            }`
          );
        }


      }catch(error){

        console.error(
          "BATTLE LOAD ERROR",
          error
        );

        toast(
          error?.message ||
          "โหลดข้อมูล Battle ไม่สำเร็จ"
        );

      }finally{

        setLoading(false);

      }
    }

    function go(url){
      window.location.href = url;
    }

    $("fightBtn").addEventListener("click",()=>{
      const p =
        state.player ||
        {};

      const s =
        state.stage ||
        {};

      const stageId =
        Number(
          state.currentStageId ||
          p.unlockedStage ||
          s.id ||
          1
        );

      const energy =
        Number(
          p.energy ??
          0
        );

      const required =
        Number(
          s.energy ??
          0
        );


      if(
        required > 0 &&
        energy < required
      ){

        toast(
          `Energy ไม่พอสำหรับ Stage ${stageId} • ต้องใช้ ${formatNumber(required)} แต่มี ${formatNumber(energy)}`
        );

        return;
      }


      go(
        `./battle_stage.html?stage=${stageId}`
      );
    });

    $("energyBtn").addEventListener("click",()=>{
      const p = state.player || {};
      toast(`Energy ของคุณ ${formatNumber(p.energy)} / ${formatNumber(p.maxEnergy ?? 200)}`);
    });

    $("rewardBtn").addEventListener("click",()=>go("./rewards.html"));
    $("rankingBtn").addEventListener("click",()=>go("./ranking.html"));
    $("homeBtn").addEventListener("click",()=>go(window.APP_CONFIG?.PAGE?.HOME || "./dashboard.html"));
    $("missionBtn").addEventListener("click",()=>go(window.APP_CONFIG?.PAGE?.MISSION || "./mission.html"));
    $("battleBtn").addEventListener("click",()=>loadBattle());

    let battleRefreshTimer = null;

    function startBattleAutoRefresh(){
      if(battleRefreshTimer){
        clearInterval(battleRefreshTimer);
      }

      const refreshMs = Math.max(
        15000,
        Number(window.APP_CONFIG?.REFRESH_MS || 30000)
      );

      battleRefreshTimer = setInterval(()=>{
        if(document.visibilityState === "visible"){
          loadBattle();
        }
      }, refreshMs);
    }

    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState === "visible"){
        loadBattle();
      }
    });

    window.addEventListener("pageshow", async ()=>{
      await loadBattle();
      startBattleAutoRefresh();
    });
  </script>
</body>
</html>
