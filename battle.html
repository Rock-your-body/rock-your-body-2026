<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - BATTLE MONSTER</title>

  <script src="./app-config.js?v=20260823-40"></script>
  <script src="./common.js?v=20260823-40"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#06163a;font-family:Arial,"Prompt",sans-serif;overflow-x:hidden}
    button{font:inherit}
    .battle-page{width:100%;min-height:100svh;background:radial-gradient(circle at 50% 0%,rgba(0,114,255,.20),transparent 40%),#06163a}
    .battle-stage{position:relative;width:100%;max-width:1672px;margin:0 auto;aspect-ratio:1672/941;overflow:hidden;background:#071a3b;user-select:none;-webkit-user-select:none}
    .battle-template{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;z-index:1}
    .overlay{position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.75);pointer-events:none}
    .energy-live{left:20.7%;top:8.0%;width:8.5%;height:6.5%;color:#ffd73e;font-size:clamp(9px,1.55vw,28px)}
    .regen-live{left:20.0%;top:14.0%;width:10.5%;height:4.2%;font-size:clamp(7px,.9vw,16px);color:#eef6ff}
    .stage-hotspot{position:absolute;z-index:15;border:0;padding:0;background:transparent;cursor:pointer;border-radius:4%;-webkit-tap-highlight-color:transparent}
    .stage-hotspot:focus-visible{outline:3px solid #fff;outline-offset:-3px}
    .stage-hotspot.locked{cursor:not-allowed}
    .stage-hotspot.locked::after{content:"🔒";position:absolute;right:6%;top:4%;width:13%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(1,12,38,.83);color:white;font-size:clamp(9px,1.7vw,30px);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
    .s1{left:1.4%;top:20.0%;width:18.0%;height:32.5%}.s2{left:19.0%;top:20.0%;width:18.8%;height:32.5%}.s3{left:38.0%;top:20.0%;width:18.4%;height:32.5%}.s4{left:56.8%;top:20.0%;width:18.0%;height:32.5%}.s5{left:75.0%;top:20.0%;width:22.5%;height:32.5%}
    .s6{left:1.0%;top:54.0%;width:18.4%;height:34.5%}.s7{left:19.0%;top:54.0%;width:19.3%;height:34.5%}.s8{left:38.0%;top:54.0%;width:18.6%;height:34.5%}.s9{left:56.7%;top:54.0%;width:19.4%;height:34.5%}.s10{left:76.0%;top:52.0%;width:22.0%;height:36.5%}
    .nav-hotspot{position:absolute;z-index:18;border:0;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
    .nav-hotspot:focus-visible{outline:3px solid #fff}.back{left:1.0%;top:1.7%;width:5.2%;height:8.0%}.reward{left:73.1%;top:3.4%;width:6.5%;height:12.5%}.mission-top{left:80.1%;top:3.4%;width:6.5%;height:12.5%}.stats{left:87.1%;top:3.4%;width:6.4%;height:12.5%}
    .home-bottom{left:5.7%;top:89.1%;width:17.2%;height:9.3%}.mission-bottom{left:23.0%;top:89.1%;width:18.7%;height:9.3%}.weight-bottom{left:41.5%;top:89.1%;width:17.4%;height:9.3%}.shop-bottom{left:59.0%;top:89.1%;width:17.5%;height:9.3%}.message-bottom{left:76.6%;top:89.1%;width:17.6%;height:9.3%}
    .toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:999999;transform:translateX(-50%) translateY(20px);max-width:90vw;padding:10px 16px;border-radius:999px;background:#0756bc;color:#fff;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s ease;box-shadow:0 8px 24px rgba(0,0,0,.26);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:700px){.battle-page{display:flex;align-items:flex-start}.battle-stage{width:100vw;max-width:none}.stage-hotspot.locked::after{box-shadow:0 0 0 1px rgba(255,255,255,.55)}}
  </style>
</head>
<body>
<main class="battle-page">
  <section id="battleStage" class="battle-stage" aria-label="Battle Monster Map">
    <img id="battleTemplate" class="battle-template" src="https://nztvqdzatdpauufpvdaa.supabase.co/storage/v1/object/public/rock-assets/%20battle/battle-map.png" alt="Battle Map" draggable="false">
    <div id="energyValue" class="overlay energy-live">0</div>
    <div id="regenTimer" class="overlay regen-live">00:25:30</div>

    <button class="nav-hotspot back" type="button" onclick="goBack()" aria-label="ย้อนกลับ"></button>
    <button class="nav-hotspot reward" type="button" onclick="goPage('REWARDS')" aria-label="รางวัล"></button>
    <button class="nav-hotspot mission-top" type="button" onclick="goPage('MISSION')" aria-label="ภารกิจ"></button>
    <button class="nav-hotspot stats" type="button" onclick="goPage('PROGRESS')" aria-label="สถิติ"></button>

    <button class="stage-hotspot s1" type="button" data-stage="1" onclick="openStage(1)" aria-label="Stage 1 เจ้าจอมเอื่อย"></button>
    <button class="stage-hotspot s2" type="button" data-stage="2" onclick="openStage(2)" aria-label="Stage 2 จอมหวาน"></button>
    <button class="stage-hotspot s3" type="button" data-stage="3" onclick="openStage(3)" aria-label="Stage 3 ปีศาจของทอด"></button>
    <button class="stage-hotspot s4" type="button" data-stage="4" onclick="openStage(4)" aria-label="Stage 4 จอมเค็ม"></button>
    <button class="stage-hotspot s5" type="button" data-stage="5" onclick="openStage(5)" aria-label="Stage 5 ราชาอาหารไร้ประโยชน์"></button>
    <button class="stage-hotspot s6" type="button" data-stage="6" onclick="openStage(6)" aria-label="Stage 6 ปีศาจพักผ่อนน้อย"></button>
    <button class="stage-hotspot s7" type="button" data-stage="7" onclick="openStage(7)" aria-label="Stage 7 จอมเนื่อยนิ่ง"></button>
    <button class="stage-hotspot s8" type="button" data-stage="8" onclick="openStage(8)" aria-label="Stage 8 ปีศาจพฤติกรรมเสี่ยง"></button>
    <button class="stage-hotspot s9" type="button" data-stage="9" onclick="openStage(9)" aria-label="Stage 9 ราชาความเสี่ยงสุขภาพ"></button>
    <button class="stage-hotspot s10" type="button" data-stage="10" onclick="openStage(10)" aria-label="Stage 10 จอมมารโรคร้าย"></button>

    <button class="nav-hotspot home-bottom" type="button" onclick="goPage('HOME')" aria-label="หน้าหลัก"></button>
    <button class="nav-hotspot mission-bottom" type="button" onclick="goPage('MISSION')" aria-label="ภารกิจของฉัน"></button>
    <button class="nav-hotspot weight-bottom" type="button" onclick="goPage('WEIGHT')" aria-label="ชั่งน้ำหนัก"></button>
    <button class="nav-hotspot shop-bottom" type="button" onclick="showToast('ร้านค้า: เตรียมเปิดใช้งาน')" aria-label="ร้านค้า"></button>
    <button class="nav-hotspot message-bottom" type="button" onclick="showToast('ข้อความ: เตรียมเปิดใช้งาน')" aria-label="ข้อความ"></button>
  </section>
</main>
<div id="battleToast" class="toast"></div>

<script>
const SUPABASE_BASE = "https://nztvqdzatdpauufpvdaa.supabase.co/storage/v1/object/public/rock-assets/%20battle";

const STAGES = [
  {id:1,name:"เจ้าจอมเอื่อย",energy:300,monster:`${SUPABASE_BASE}/monster/stage-001-germ.png`},
  {id:2,name:"จอมหวาน",energy:900,monster:`${SUPABASE_BASE}/monster/stage-002-donut.png`},
  {id:3,name:"ปีศาจของทอด",energy:1500,monster:`${SUPABASE_BASE}/monster/stage-003-fries.png`},
  {id:4,name:"จอมเค็ม",energy:2100,monster:`${SUPABASE_BASE}/monster/stage-004-salt.png`},
  {id:5,name:"ราชาอาหารไร้ประโยชน์",energy:2700,monster:`${SUPABASE_BASE}/monster/stage-005-burger-king.png`},
  {id:6,name:"ปีศาจพักผ่อนน้อย",energy:3300,monster:`${SUPABASE_BASE}/monster/stage-006-rest.png`},
  {id:7,name:"จอมเนื่อยนิ่ง",energy:3900,monster:`${SUPABASE_BASE}/monster/stage-007-sedentary.png`},
  {id:8,name:"ปีศาจพฤติกรรมเสี่ยง",energy:4500,monster:`${SUPABASE_BASE}/monster/stage-008-risk.png`},
  {id:9,name:"ราชาความเสี่ยงสุขภาพ",energy:5100,monster:`${SUPABASE_BASE}/monster/stage-009-risk-king.png`},
  {id:10,name:"จอมมารโรคร้าย",energy:5700,monster:`${SUPABASE_BASE}/monster/stage-010-boss.png`,boss:true}
];

let playerEnergy = 0;
let unlockedStage = 1;

function goPage(key){
  const url = window.APP_CONFIG?.PAGE?.[key];
  if(url){ window.location.href = url; return; }
  const fallback = {HOME:"./dashboard.html",MISSION:"./mission.html",WEIGHT:"./weight-check.html",REWARDS:"./rewards.html",PROGRESS:"./progress.html"};
  if(fallback[key]) window.location.href = fallback[key];
}

function goBack(){
  if(window.history.length > 1) window.history.back();
  else goPage("HOME");
}

function openStage(stageNumber){
  const stage = STAGES.find(item => item.id === Number(stageNumber));
  if(!stage) return;
  if(stage.id > unlockedStage){ showToast(`🔒 Stage ${stage.id} ยังไม่ปลดล็อก`); return; }
  window.location.href = `./battle_stage.html?stage=${stage.id}`;
}

function updateEnergyUI(){
  const el = document.getElementById("energyValue");
  if(el) el.textContent = Math.max(0,playerEnergy).toLocaleString("en-US");
}

function updateStageLocks(){
  document.querySelectorAll(".stage-hotspot").forEach(button => {
    const stage = Number(button.dataset.stage);
    button.classList.toggle("locked", stage > unlockedStage);
    button.setAttribute("aria-disabled", stage > unlockedStage ? "true" : "false");
  });
}

function loadCache(){
  const e = Number(localStorage.getItem("rockEnergy"));
  if(Number.isFinite(e)) playerEnergy = e;
  const s = Number(localStorage.getItem("rockUnlockedStage"));
  if(Number.isFinite(s)) unlockedStage = Math.max(1,Math.min(10,s));
  updateEnergyUI();
  updateStageLocks();
}

async function loadDashboard(){
  try{
    if(!window.ROCK || typeof ROCK.fetchDashboard !== "function") return;
    const result = await ROCK.fetchDashboard();
    const energy = Number(result?.energy?.current ?? result?.energy ?? result?.player?.energy ?? result?.user?.energy);
    if(Number.isFinite(energy)){
      playerEnergy = energy;
      localStorage.setItem("rockEnergy",String(energy));
      updateEnergyUI();
    }
  }catch(error){ console.warn("BATTLE DASHBOARD:",error); }
}

async function loadBattleStatus(){
  const api = window.APP_CONFIG?.API?.BATTLE;
  if(!api || !window.ROCK || typeof ROCK.getIdToken !== "function") return;
  try{
    const response = await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"battleStatus",idToken:ROCK.getIdToken()})});
    const result = await response.json();
    if(!response.ok || result?.success === false) throw new Error(result?.error || "โหลด Battle Status ไม่สำเร็จ");
    const energy = Number(result?.player?.energy);
    const stage = Number(result?.player?.unlockedStage);
    if(Number.isFinite(energy)){ playerEnergy = energy; localStorage.setItem("rockEnergy",String(energy)); }
    if(Number.isFinite(stage)){ unlockedStage = Math.max(1,Math.min(10,stage)); localStorage.setItem("rockUnlockedStage",String(unlockedStage)); }
    updateEnergyUI();
    updateStageLocks();
  }catch(error){ console.warn("BATTLE STATUS:",error); }
}

const REGEN_TOTAL = 30*60;
let regenSeconds = Number(localStorage.getItem("rockRegenSeconds"));
if(!Number.isFinite(regenSeconds) || regenSeconds <= 0 || regenSeconds > REGEN_TOTAL) regenSeconds = 25*60+30;

function renderTimer(){
  const el = document.getElementById("regenTimer");
  if(!el) return;
  const h = Math.floor(regenSeconds/3600);
  const m = Math.floor((regenSeconds%3600)/60);
  const s = regenSeconds%60;
  el.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function startTimer(){
  renderTimer();
  setInterval(()=>{
    regenSeconds--;
    if(regenSeconds < 0) regenSeconds = REGEN_TOTAL;
    localStorage.setItem("rockRegenSeconds",String(regenSeconds));
    renderTimer();
  },1000);
}

let toastTimer = null;
function showToast(message){
  const el = document.getElementById("battleToast");
  if(!el) return;
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"),2400);
}

function setupTemplateFallback(){
  const image = document.getElementById("battleTemplate");
  if(!image) return;
  image.addEventListener("error",()=>{
    if(image.dataset.fallback !== "1"){
      image.dataset.fallback="1";
      image.src="https://nztvqdzatdpauufpvdaa.supabase.co/storage/v1/object/public/rock-assets/battle/battle-map.png";
    }else{
      showToast("ไม่พบไฟล์ battle-map.png");
    }
  });
}

async function startBattle(){
  setupTemplateFallback();
  loadCache();
  startTimer();
  try{
    if(window.ROCK && typeof ROCK.initLiff === "function"){
      const ready = await ROCK.initLiff();
      if(!ready) return;
      await Promise.allSettled([loadDashboard(),loadBattleStatus()]);
    }
  }catch(error){ console.warn("BATTLE INIT:",error); }
}

document.addEventListener("DOMContentLoaded",startBattle);
</script>
</body>
</html>
