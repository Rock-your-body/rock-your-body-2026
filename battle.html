<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>ROCK YOUR BODY 2026 - BATTLE</title>


  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script src="./app-config.js?v=20260827-01"></script>

  <script src="./common.js?v=20260827-01"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #eef4ff;

      font-family:
        "Noto Sans Thai",
        Tahoma,
        Arial,
        sans-serif;

      color: #082b68;

    }


    #loading {

      position: fixed;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eef4ff;

      font-size: 20px;
      font-weight: 800;

    }


    #app {

      display: none;

      max-width: 850px;

      width: 100%;

      margin: auto;

      padding: 20px;

    }


    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

    }


    h1 {

      margin: 0;

      font-size: 35px;

    }


    button {

      border: 0;

      border-radius: 14px;

      padding: 13px 20px;

      font-weight: 900;

      cursor: pointer;

    }


    .back {

      background: #102f78;

      color: white;

    }


    .battle-card {

      background: white;

      border-radius: 28px;

      padding: 30px;

      text-align: center;

      box-shadow:
        0 5px 20px rgba(0,0,0,.10);

    }


    .monster {

      font-size: 38px;

      font-weight: 1000;

      margin-bottom: 15px;

    }


    .hp-track {

      height: 28px;

      background: #e0e5ed;

      border-radius: 99px;

      overflow: hidden;

      margin: 20px 0 8px;

    }


    #hpBar {

      height: 100%;

      width: 0%;

      background: #c91717;

      transition: width .4s ease;

    }


    #hpText {

      font-weight: 900;

    }


    .energy {

      margin-top: 25px;

      font-size: 22px;

      font-weight: 900;

    }


    #fightButton {

      margin-top: 25px;

      width: 100%;

      font-size: 20px;

      background: #102f78;

      color: white;

    }


    #fightButton:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    #result {

      margin-top: 20px;

      min-height: 30px;

      font-weight: 800;

    }

  </style>

</head>


<body>


<div id="loading">
  กำลังโหลด BATTLE...
</div>


<main id="app">


  <header class="header">

    <h1>
      BATTLE
    </h1>

    <button
      class="back"
      onclick="window.ROCK.goHome()"
    >
      HOME
    </button>

  </header>


  <section class="battle-card">


    <div
      id="monsterName"
      class="monster"
    >
      SUGAR MONSTER
    </div>


    <div class="hp-track">

      <div id="hpBar"></div>

    </div>


    <div id="hpText">
      0 / 0 HP
    </div>


    <div class="energy">

      ENERGY:
      <span id="energy">
        0 / 200
      </span>

    </div>


    <button
      id="fightButton"
    >
      ⚔️ FIGHT
    </button>


    <div id="result"></div>


  </section>


</main>


<script>

(function(){

  "use strict";


  let currentEnergy = 0;

  let maxEnergy = 200;


  function setText(
    id,
    value
  ){

    const el =
      document.getElementById(
        id
      );

    if(el){

      el.textContent =
        value;

    }

  }


  function render(
    battle
  ){

    const monster =
      battle?.monster ||
      {};


    const user =
      battle?.user ||
      {};


    const hp =
      Number(
        monster.hp || 0
      );


    const maxHp =
      Number(
        monster.maxHp || 0
      );


    const percent =
      maxHp > 0
        ? (
            hp /
            maxHp
          ) * 100
        : 0;


    currentEnergy =
      Number(
        user.energy || 0
      );


    maxEnergy =
      Number(
        user.maxEnergy || 200
      );


    setText(
      "monsterName",
      monster.name ||
      "MONSTER"
    );


    setText(
      "hpText",
      `${hp.toLocaleString()} / ${maxHp.toLocaleString()} HP`
    );


    document
      .getElementById(
        "hpBar"
      )
      .style.width =
      `${Math.max(
        0,
        Math.min(
          100,
          percent
        )
      )}%`;


    setText(
      "energy",
      `${currentEnergy.toLocaleString()} / ${maxEnergy.toLocaleString()}`
    );


    updateFightButton();

  }


  function updateFightButton(){

    const button =
      document.getElementById(
        "fightButton"
      );


    if(!button){

      return;

    }


    button.disabled =
      currentEnergy < 10;

  }


  async function loadBattle(){

    try{

      const ready =
        await window.ROCK
          .initLiff();


      if(
        ready === false
      ){

        return;

      }


      const result =
        await window.ROCK
          .getBattle();


      console.log(
        "BATTLE:",
        result
      );


      render(
        result?.battle ||
        result?.data?.battle ||
        result
      );


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "app"
        )
        .style.display =
        "block";


    }catch(error){

      console.error(
        "BATTLE ERROR:",
        error
      );


      document
        .getElementById(
          "loading"
        )
        .innerHTML =
        `
        ไม่สามารถโหลด Battle ได้
        <br><br>
        <small>
          ${error.message}
        </small>
        `;

    }

  }


  document
    .getElementById(
      "fightButton"
    )
    .addEventListener(
      "click",
      async function(){

        const button =
          this;


        const resultEl =
          document.getElementById(
            "result"
          );


        try{

          button.disabled =
            true;


          button.textContent =
            "กำลังโจมตี...";


          const result =
            await window.ROCK
              .fightMonster();


          console.log(
            "FIGHT RESULT:",
            result
          );


          const data =
            result?.result ||
            result?.data?.result ||
            result;


          const damage =
            Number(
              data?.damage || 0
            );


          const reward =
            data?.reward ||
            {};


          currentEnergy =
            Number(
              data?.remainingEnergy ??
              currentEnergy - 10
            );


          setText(
            "energy",
            `${currentEnergy.toLocaleString()} / ${maxEnergy.toLocaleString()}`
          );


          resultEl.innerHTML =
            `
            ⚔️ Damage:
            ${damage.toLocaleString()}
            <br>
            🪙 ROCK COIN:
            ${Number(
              reward.rockCoin || 0
            ).toLocaleString()}
            <br>
            ⭐ Points:
            ${Number(
              reward.points || 0
            ).toLocaleString()}
            `;


        }catch(error){

          console.error(
            "FIGHT ERROR:",
            error
          );


          resultEl.textContent =
            error.message ||
            "โจมตีไม่สำเร็จ";


        }finally{

          button.textContent =
            "⚔️ FIGHT";


          updateFightButton();

        }

      }
    );


  loadBattle();

})();

</script>


</body>
</html>
