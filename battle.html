<script>
"use strict";


/* ============================================================
   ROCK YOUR BODY 2026
   BATTLE V7.1
   ------------------------------------------------------------
   หน้า Battle = Dashboard เท่านั้น

   ไม่มีการโจมตีในหน้านี้

   FLOW:
   battle.html
      ↓ FIGHT MONSTER
   battle_map.html
      ↓ เลือก Stage
   battle_stage.html?stage=N
      ↓ Attack
============================================================ */


/* ============================================================
   BASIC
============================================================ */

const $ =
  id =>
    document.getElementById(id);


const CFG =
  window.APP_CONFIG ||
  {};


const LIFF_ID =
  CFG.LIFF_ID ||
  "2011201679-uNWz5yqF";


const MAX_ENERGY =
  Number(
    CFG.MAX_ENERGY ||
    200
  );


let state =
  null;


let countdownTimer =
  null;


/* ============================================================
   MONSTER FILES
============================================================ */

const MONSTER_FILES = {

  1:{
    name:"เจ้าจอมเอื่อย",
    image:"battle-monster-stage-001-germ.png"
  },

  2:{
    name:"จอมหวาน",
    image:"battle-monster-stage-002-donut.png"
  },

  3:{
    name:"ปีศาจของทอด",
    image:"battle-monster-stage-003-fries.png"
  },

  4:{
    name:"จอมเค็ม",
    image:"battle-monster-stage-004-salt.png"
  },

  5:{
    name:"ราชาอาหารไร้ประโยชน์",
    image:"battle-monster-stage-005-burger-king.png"
  },

  6:{
    name:"ปีศาจพักผ่อนน้อย",
    image:"battle-monster-stage-006-rest.png"
  },

  7:{
    name:"จอมเนือยนิ่ง",
    image:"battle-monster-stage-007-sedentary.png"
  },

  8:{
    name:"ปีศาจพฤติกรรมเสี่ยง",
    image:"battle-monster-stage-008-risk.png"
  },

  9:{
    name:"ราชาความเสี่ยงสุขภาพ",
    image:"battle-monster-stage-009-risk-king.png"
  },

  10:{
    name:"จอมมาร Final Boss",
    image:"battle-monster-stage-010-boss.png"
  }

};


/* ============================================================
   API URL
============================================================ */

function battleApi(){

  if(
    CFG
      ?.getApi
  ){

    return CFG.getApi(
      "BATTLE"
    );
  }


  const url =
    CFG
      ?.API
      ?.BATTLE;


  if(!url){

    throw new Error(
      "ไม่พบ API.BATTLE ใน app-config.js"
    );
  }


  return url;
}


/* ============================================================
   STATUS
============================================================ */

function showLoading(
  show
){

  $("loading")
    .style
    .display =
      show
        ? "flex"
        : "none";
}


function toast(
  message,
  error = false
){

  const el =
    $("toast");


  el.textContent =
    message;


  el.classList
    .toggle(
      "error",
      error
    );


  el.classList
    .add(
      "show"
    );


  clearTimeout(
    window.__battleToastTimer
  );


  window.__battleToastTimer =
    setTimeout(
      ()=>{

        el.classList
          .remove(
            "show"
          );

      },
      error
        ? 4500
        : 2300
    );
}


/* ============================================================
   LIFF
============================================================ */

async function initLine(){

  if(
    !window.liff
  ){

    throw new Error(
      "ไม่พบ LINE LIFF SDK"
    );
  }


  await liff.init({

    liffId:
      LIFF_ID

  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  const token =
    liff.getIDToken();


  if(
    !token ||
    token
      .split(".")
      .length !==
      3
  ){

    /*
      Token ไม่ถูกต้อง:
      logout แล้วให้ LINE สร้าง Token ใหม่
    */

    liff.logout();


    liff.login({

      redirectUri:
        window.location.href

    });


    return false;
  }


  return true;
}


/* ============================================================
   BATTLE API
   IMPORTANT:
   ส่ง idToken ใน JSON body
   ให้ตรงกับ Battle Edge Function V6.x
============================================================ */

async function postBattle(
  action,
  payload = {}
){

  const idToken =
    liff.getIDToken();


  if(
    !idToken ||
    idToken
      .split(".")
      .length !==
      3
  ){

    throw new Error(
      "INVALID_LINE_ID_TOKEN"
    );
  }


  const response =
    await fetch(
      battleApi(),
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:
          "no-store",

        body:
          JSON.stringify({
            action,
            idToken,
            ...payload
          })
      }
    );


  const raw =
    await response.text();


  let data =
    {};


  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      "Battle API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    !response.ok ||
    data
      ?.success ===
      false
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* ============================================================
   MONSTER IMAGE
============================================================ */

function monsterFile(
  stageNo
){

  return (
    MONSTER_FILES[
      Number(stageNo)
    ] ||
    MONSTER_FILES[1]
  );
}


/* ============================================================
   COUNTDOWN
============================================================ */

function millisecondsUntilBangkokMidnight(){

  const now =
    new Date();


  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Bangkok",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false
      }
    );


  const parts =
    formatter
      .formatToParts(now)
      .reduce(
        (obj,item)=>{

          obj[
            item.type
          ] =
            item.value;

          return obj;

        },
        {}
      );


  const bangkokNow =
    new Date(
      `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+07:00`
    );


  const tomorrow =
    new Date(
      bangkokNow
        .getTime() +
      24 *
      60 *
      60 *
      1000
    );


  tomorrow.setUTCHours(
    17,
    0,
    0,
    0
  );


  return Math.max(
    0,
    tomorrow.getTime() -
    bangkokNow.getTime()
  );
}


function startCountdown(){

  clearInterval(
    countdownTimer
  );


  function render(){

    const available =
      Number(
        state
          ?.healthEnergy
          ?.available ||
        0
      );


    const max =
      Number(
        state
          ?.healthEnergy
          ?.max ||
        MAX_ENERGY
      );


    if(
      available >=
      max
    ){

      $("energyCountdown")
        .textContent =
          "เต็มแล้ว";


      return;
    }


    let ms =
      millisecondsUntilBangkokMidnight();


    const hours =
      Math.floor(
        ms /
        3600000
      );


    ms %=
      3600000;


    const minutes =
      Math.floor(
        ms /
        60000
      );


    ms %=
      60000;


    const seconds =
      Math.floor(
        ms /
        1000
      );


    $("energyCountdown")
      .textContent =
        `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
  }


  render();


  countdownTimer =
    setInterval(
      render,
      1000
    );
}


/* ============================================================
   RENDER
============================================================ */

function renderBattle(
  data
){

  state =
    data;


  const player =
    data
      ?.player ||
    {};


  const energy =
    data
      ?.healthEnergy ||
    {};


  const stages =
    Array.isArray(
      data
        ?.stages
    )
      ? data.stages
      : [];


  const currentStageNo =
    Number(
      data
        ?.currentStage ||
      1
    );


  const stage =
    stages.find(
      s =>
        Number(
          s.id
        ) ===
        currentStageNo
    ) ||
    stages[0] ||
    {
      id:1,
      maxHp:1200,
      currentHp:1200,
      name:"เจ้าจอมเอื่อย"
    };


  /* WALLET */

  const rockCoin =
    Number(
      player
        ?.rockCoin ||
      0
    );


  const availableEnergy =
    Math.max(
      0,
      Number(
        energy
          ?.available ||
        0
      )
    );


  const maxEnergy =
    Math.max(
      1,
      Number(
        energy
          ?.max ||
        MAX_ENERGY
      )
    );


  $("coinValue")
    .textContent =
      rockCoin
        .toLocaleString();


  $("energyTopValue")
    .textContent =
      `${availableEnergy.toLocaleString()} / ${maxEnergy.toLocaleString()}`;


  $("energyMainValue")
    .textContent =
      `${availableEnergy.toLocaleString()} / ${maxEnergy.toLocaleString()}`;


  const energyPercent =
    Math.max(
      0,
      Math.min(
        100,
        (
          availableEnergy /
          maxEnergy
        ) *
        100
      )
    );


  $("energyFill")
    .style
    .width =
      `${energyPercent}%`;


  /* MONSTER */

  const mapped =
    monsterFile(
      stage.id
    );


  $("monsterName")
    .textContent =
      stage
        ?.name ||
      mapped.name;


  $("monsterImage")
    .src =
      `./${mapped.image}?v=20260831-v71`;


  $("monsterImage")
    .alt =
      stage
        ?.name ||
      mapped.name;


  /* HP */

  const maxHp =
    Math.max(
      1,
      Number(
        stage
          ?.maxHp ||
        1
      )
    );


  const currentHp =
    Math.max(
      0,
      Number(
        stage
          ?.currentHp ??
        maxHp
      )
    );


  const hpPercent =
    Math.max(
      0,
      Math.min(
        100,
        (
          currentHp /
          maxHp
        ) *
        100
      )
    );


  $("hpNumbers")
    .textContent =
      `${currentHp.toLocaleString()} / ${maxHp.toLocaleString()}`;


  $("hpPercent")
    .textContent =
      `${Math.round(hpPercent)}%`;


  $("hpFill")
    .style
    .width =
      `${hpPercent}%`;


  /* REWARD */

  const rewardStatus =
    String(
      stage
        ?.rewardStatus ||
      "none"
    );


  if(
    rewardStatus ===
    "pending"
  ){

    $("rewardStatus")
      .textContent =
        "🎁 ผ่านด่านแล้ว • รอ Admin ส่งของรางวัล";

  }else if(
    rewardStatus ===
    "sent"
  ){

    $("rewardStatus")
      .textContent =
        "✅ Admin ส่งของรางวัลแล้ว";

  }else if(
    rewardStatus ===
    "cancelled"
  ){

    $("rewardStatus")
      .textContent =
        "ของรางวัลถูกยกเลิก";

  }else{

    $("rewardStatus")
      .textContent =
        "ยังไม่มีของรางวัลรอรับ";
  }


  startCountdown();
}


/* ============================================================
   LOAD
============================================================ */

async function loadBattle(){

  showLoading(
    true
  );


  try{

    /*
      Backend V6.x canonical action
    */

    const data =
      await postBattle(
        "mapV5"
      );


    renderBattle(
      data
    );


  }catch(error){

    console.error(
      error
    );


    /*
      ถ้า Token หมดอายุ
      ให้ LIFF login ใหม่ ไม่ใช้ line_user_id แทน
    */

    if(
      String(
        error
          ?.message ||
        ""
      )
        .includes(
          "INVALID_LINE_ID_TOKEN"
        )
    ){

      try{

        liff.logout();


        liff.login({

          redirectUri:
            window.location.href

        });


        return;

      }catch(_){}
    }


    toast(
      `โหลดข้อมูล Battle ไม่สำเร็จ: ${error?.message || error}`,
      true
    );

  }finally{

    showLoading(
      false
    );
  }
}


/* ============================================================
   NAVIGATION
============================================================ */

/*
  FIGHT MONSTER

  สำคัญ:
  ชื่อไฟล์ HTML คือ battle_map.html
  ส่วน "battle map.jpeg" เป็นเพียงรูปพื้นหลัง
*/

$("fightMonsterButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.BATTLE_MAP ||
          "./battle_map.html"
        );
    }
  );


$("myEnergyButton")
  .addEventListener(
    "click",
    ()=>{

      const energy =
        state
          ?.healthEnergy ||
        {};


      toast(
        `⚡ MY ENERGY ${Number(energy.available || 0)} / ${Number(energy.max || MAX_ENERGY)}`
      );
    }
  );


$("rankingButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.RANKING ||
          "./ranking.html"
        );
    }
  );


$("rewardButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.REWARDS ||
          "./rewards.html"
        );
    }
  );


$("homeButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.HOME ||
          "./dashboard.html"
        );
    }
  );


$("missionButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.MISSION ||
          "./mission.html"
        );
    }
  );


$("battleButton")
  .addEventListener(
    "click",
    ()=>{

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    }
  );


/* ============================================================
   START
============================================================ */

(async()=>{

  try{

    const ready =
      await initLine();


    if(
      ready ===
      false
    ){

      return;
    }


    await loadBattle();


    /*
      Refresh wallet / Battle state
      ทุก 30 วินาที
    */

    setInterval(
      ()=>{

        if(
          document.visibilityState ===
          "visible"
        ){

          loadBattle()
            .catch(
              error =>
                console.error(
                  error
                )
            );
        }

      },
      Number(
        CFG
          ?.REFRESH_MS ||
        30000
      )
    );


  }catch(error){

    console.error(
      error
    );


    showLoading(
      false
    );


    toast(
      error
        ?.message ||
      String(error),
      true
    );
  }

})();

</script>
