<script>
"use strict";

/* ============================================================
   ROCK YOUR BODY 2026
   BATTLE HOME V7.0
   ------------------------------------------------------------
   หน้านี้:
   - ไม่มีการโจมตี
   - แสดงข้อมูล Battle
   - FIGHT MONSTER -> battle_map.html
============================================================ */


/* ============================================================
   CONFIG
============================================================ */

const CFG = window.APP_CONFIG || {};

const LIFF_ID =
  CFG.LIFF_ID ||
  "2011201679-uNWz5yqF";

const BATTLE_API =
  CFG.API?.BATTLE ||
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/battle";

const MAX_ENERGY =
  Number(CFG.MAX_ENERGY || 200);


/* ============================================================
   MONSTER CONFIG
============================================================ */

const MONSTERS = {

  1:{
    name:"เจ้าจอมเอื่อย",
    image:"battle-monster-stage-001-germ.png",
    maxHp:1200
  },

  2:{
    name:"จอมหวาน",
    image:"battle-monster-stage-002-donut.png",
    maxHp:3600
  },

  3:{
    name:"ปีศาจของทอด",
    image:"battle-monster-stage-003-fries.png",
    maxHp:6000
  },

  4:{
    name:"จอมเค็ม",
    image:"battle-monster-stage-004-salt.png",
    maxHp:8400
  },

  5:{
    name:"ราชาอาหารไร้ประโยชน์",
    image:"battle-monster-stage-005-burger-king.png",
    maxHp:10800
  },

  6:{
    name:"ปีศาจพักผ่อนน้อย",
    image:"battle-monster-stage-006-rest.png",
    maxHp:13200
  },

  7:{
    name:"จอมเนือยนิ่ง",
    image:"battle-monster-stage-007-sedentary.png",
    maxHp:15600
  },

  8:{
    name:"ปีศาจพฤติกรรมเสี่ยง",
    image:"battle-monster-stage-008-risk.png",
    maxHp:18000
  },

  9:{
    name:"ราชาความเสี่ยงสุขภาพ",
    image:"battle-monster-stage-009-risk-king.png",
    maxHp:20400
  },

  10:{
    name:"จอมมาร Final Boss",
    image:"battle-monster-stage-010-boss.png",
    maxHp:22800
  }

};


/* ============================================================
   STATE
============================================================ */

let STATE = {

  coin:0,
  energy:0,
  exp:0,

  stageNo:1,

  monsterName:"",
  monsterImage:"",

  currentHp:1200,
  maxHp:1200,

  nextEnergyAt:null

};


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}


function num(value, fallback = 0){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;

}


function clamp(value,min,max){

  return Math.min(
    max,
    Math.max(min,value)
  );

}


function fmt(value){

  return Math.round(
    num(value)
  ).toLocaleString("en-US");

}


function showLoading(show){

  $("loading").style.display =
    show ? "flex" : "none";

}


function toast(message){

  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast._timer);

  toast._timer = setTimeout(()=>{
    el.classList.remove("show");
  },2500);

}


/* ============================================================
   TOKEN
============================================================ */

async function getIdToken(){

  if(typeof liff === "undefined"){
    throw new Error("ไม่พบ LINE LIFF SDK");
  }

  if(!liff.id){

    await liff.init({
      liffId:LIFF_ID
    });

  }

  if(!liff.isLoggedIn()){

    liff.login({
      redirectUri:location.href
    });

    throw new Error("LINE_LOGIN");

  }

  const token = liff.getIDToken();

  if(!token){
    throw new Error("ไม่พบ LINE ID Token");
  }

  return token;

}


/* ============================================================
   API
============================================================ */

async function callBattle(action,payload = {}){

  const token = await getIdToken();

  const response = await fetch(BATTLE_API,{

    method:"POST",

    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + token
    },

    body:JSON.stringify({
      action,
      ...payload
    })

  });


  let data = {};

  try{
    data = await response.json();
  }
  catch(_){}


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      "Battle API Error " + response.status
    );

  }


  if(data?.success === false){

    throw new Error(
      data?.error ||
      data?.message ||
      "โหลดข้อมูล Battle ไม่สำเร็จ"
    );

  }

  return data;

}


/* ============================================================
   FIND VALUE
============================================================ */

function pick(obj, keys, fallback = null){

  if(!obj || typeof obj !== "object"){
    return fallback;
  }

  for(const key of keys){

    if(
      Object.prototype.hasOwnProperty.call(obj,key) &&
      obj[key] !== null &&
      obj[key] !== undefined
    ){
      return obj[key];
    }

  }

  return fallback;

}


/* ============================================================
   NORMALIZE DATA
============================================================ */

function applyApiData(data){

  /*
    รองรับ response ได้หลายโครงสร้าง เช่น

    {
      player:{...},
      wallet:{...},
      stage:{...}
    }

    หรือ

    {
      data:{
        player:{...},
        stage:{...}
      }
    }
  */

  const root =
    data?.data &&
    typeof data.data === "object"
      ? data.data
      : data;


  const player =
    root?.player ||
    root?.user ||
    {};


  const wallet =
    root?.wallet ||
    player?.wallet ||
    {};


  const battle =
    root?.battle ||
    {};


  const stage =
    root?.stage ||
    battle?.stage ||
    root?.current_stage ||
    {};


  /* -------------------------
     WALLET
  ------------------------- */

  STATE.coin = num(

    pick(
      wallet,
      [
        "coin",
        "coins",
        "rock_coin",
        "rock_coins"
      ],
      pick(
        player,
        [
          "coin",
          "coins",
          "rock_coin",
          "rock_coins"
        ],
        STATE.coin
      )
    )

  );


  STATE.energy = clamp(

    num(

      pick(
        wallet,
        [
          "energy",
          "current_energy",
          "health_energy"
        ],
        pick(
          player,
          [
            "energy",
            "current_energy",
            "health_energy"
          ],
          STATE.energy
        )
      )

    ),

    0,
    MAX_ENERGY

  );


  STATE.exp = num(

    pick(
      player,
      [
        "exp",
        "experience",
        "total_exp"
      ],
      STATE.exp
    )

  );


  /* -------------------------
     STAGE
  ------------------------- */

  const stageNo = num(

    pick(
      stage,
      [
        "stage_no",
        "stageNo",
        "current_stage",
        "stage"
      ],
      pick(
        battle,
        [
          "stage_no",
          "stageNo",
          "current_stage"
        ],
        STATE.stageNo
      )
    ),

    STATE.stageNo

  );


  STATE.stageNo =
    clamp(
      Math.round(stageNo),
      1,
      10
    );


  const config =
    MONSTERS[STATE.stageNo] ||
    MONSTERS[1];


  STATE.monsterName =
    pick(
      stage,
      [
        "monster_name",
        "monsterName"
      ],
      config.name
    );


  STATE.monsterImage =
    pick(
      stage,
      [
        "monster_image",
        "monster_image_path",
        "monsterImage"
      ],
      config.image
    );


  STATE.maxHp = num(

    pick(
      stage,
      [
        "max_hp",
        "maxHp",
        "monster_max_hp"
      ],
      config.maxHp
    ),

    config.maxHp

  );


  STATE.currentHp = num(

    pick(
      stage,
      [
        "current_hp",
        "currentHp",
        "hp",
        "monster_hp"
      ],
      STATE.maxHp
    ),

    STATE.maxHp

  );


  STATE.currentHp =
    clamp(
      STATE.currentHp,
      0,
      STATE.maxHp
    );


  STATE.nextEnergyAt =

    pick(
      root,
      [
        "next_energy_at",
        "nextEnergyAt",
        "energy_refill_at"
      ],
      pick(
        player,
        [
          "next_energy_at",
          "nextEnergyAt",
          "energy_refill_at"
        ],
        null
      )
    );

}


/* ============================================================
   IMAGE PATH
============================================================ */

function resolveMonsterImage(path){

  if(!path){
    return "./" + MONSTERS[STATE.stageNo].image;
  }


  const value =
    String(path).trim();


  /* absolute URL */

  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){
    return value;
  }


  /* remove leading slash */

  let clean =
    value.replace(/^\/+/,"");


  /*
    DB เก่าอาจเก็บ:
    battle/monster-01.png

    แต่ไฟล์จริง GitHub:
    battle-monster-stage-001-germ.png

    ดังนั้นถ้าเป็น path เก่า
    ให้ใช้ config ใหม่
  */

  if(
    clean.startsWith("battle/") ||
    clean.startsWith("monster-")
  ){

    return "./" +
      MONSTERS[STATE.stageNo].image;

  }


  return "./" + clean;

}


/* ============================================================
   RENDER
============================================================ */

function render(){

  /* -------------------------
     TOP
  ------------------------- */

  $("topCoin").textContent =
    fmt(STATE.coin);


  $("topEnergy").textContent =
    `${fmt(STATE.energy)} / ${MAX_ENERGY}`;


  /* -------------------------
     MONSTER
  ------------------------- */

  $("monsterName").textContent =
    STATE.monsterName ||
    MONSTERS[STATE.stageNo].name;


  const img = $("monsterImg");

  img.src =
    resolveMonsterImage(
      STATE.monsterImage
    );


  img.onerror = function(){

    const fallback =
      "./" +
      MONSTERS[STATE.stageNo].image;

    if(
      !this.src.endsWith(
        MONSTERS[STATE.stageNo].image
      )
    ){
      this.src = fallback;
    }

  };


  /* -------------------------
     HP
  ------------------------- */

  const hpPercent =

    STATE.maxHp > 0
      ? clamp(
          Math.round(
            STATE.currentHp /
            STATE.maxHp *
            100
          ),
          0,
          100
        )
      : 0;


  $("hpNumbers").textContent =
    `${fmt(STATE.currentHp)} / ${fmt(STATE.maxHp)}`;


  $("hpPercent").textContent =
    `${hpPercent}%`;


  $("hpFill").style.width =
    hpPercent + "%";


  /* -------------------------
     ENERGY
  ------------------------- */

  const energyPercent =
    clamp(
      STATE.energy /
      MAX_ENERGY *
      100,
      0,
      100
    );


  $("energyValue").textContent =
    `${fmt(STATE.energy)} / ${MAX_ENERGY}`;


  $("energyFill").style.width =
    energyPercent + "%";

}


/* ============================================================
   ENERGY COUNTDOWN
============================================================ */

function renderCountdown(){

  const el =
    $("energyCountdown");


  /*
    ถ้า Backend ส่ง next_energy_at
    จะนับถอยหลังจริง
  */

  if(STATE.nextEnergyAt){

    const target =
      new Date(
        STATE.nextEnergyAt
      ).getTime();


    if(Number.isFinite(target)){

      const diff =
        Math.max(
          0,
          target - Date.now()
        );


      if(diff > 0){

        const totalSeconds =
          Math.floor(
            diff / 1000
          );


        const hours =
          Math.floor(
            totalSeconds / 3600
          );


        const minutes =
          Math.floor(
            (
              totalSeconds % 3600
            ) / 60
          );


        const seconds =
          totalSeconds % 60;


        el.textContent =
          String(hours).padStart(2,"0") +
          ":" +
          String(minutes).padStart(2,"0") +
          ":" +
          String(seconds).padStart(2,"0");


        return;

      }

    }

  }


  /*
    Energy เต็มแล้ว
  */

  if(STATE.energy >= MAX_ENERGY){

    el.textContent =
      "ENERGY เต็มแล้ว";

    return;

  }


  /*
    ถ้า Backend ยังไม่มีเวลา refill
  */

  el.textContent =
    "--:--:--";

}


/* ============================================================
   LOAD BATTLE
============================================================ */

async function loadBattle(){

  showLoading(true);

  try{

    /*
      ลอง action ใหม่ก่อน
    */

    let data;

    try{

      data =
        await callBattle(
          "battleHome"
        );

    }
    catch(error){

      /*
        รองรับ battle/index.ts
        รุ่นที่ใช้ action = home
      */

      const msg =
        String(
          error?.message || ""
        ).toUpperCase();


      if(
        msg.includes("UNKNOWN_ACTION") ||
        msg.includes("UNKNOWN ACTION")
      ){

        data =
          await callBattle(
            "home"
          );

      }
      else{
        throw error;
      }

    }


    applyApiData(data);

    render();
    renderCountdown();

  }
  catch(error){

    console.error(
      "LOAD BATTLE:",
      error
    );


    /*
      ยัง Render config ได้
      แม้ Backend มีปัญหา
    */

    const config =
      MONSTERS[STATE.stageNo];


    STATE.monsterName =
      config.name;

    STATE.monsterImage =
      config.image;

    STATE.maxHp =
      config.maxHp;

    STATE.currentHp =
      config.maxHp;


    render();
    renderCountdown();


    if(
      error?.message !==
      "LINE_LOGIN"
    ){

      toast(
        "โหลดข้อมูล Battle ไม่สำเร็จ: " +
        error.message
      );

    }

  }
  finally{

    showLoading(false);

  }

}


/* ============================================================
   NAVIGATION
============================================================ */

function go(page){

  location.href = page;

}


/*
  FIGHT MONSTER

  สำคัญ:
  หน้า Battle ไม่มีการโจมตี

  Battle
       ↓
  Battle Map
       ↓
  เลือก Stage
       ↓
  Battle Stage
       ↓
  Attack
*/

$("fightMonsterBtn")
  .addEventListener(
    "click",
    ()=>{
      go("./battle_map.html");
    }
  );


$("myEnergyBtn")
  .addEventListener(
    "click",
    ()=>{

      /*
        ตอนนี้แสดงข้อมูล Energy
        ยังไม่เปิดหน้าใหม่
      */

      toast(
        `⚡ MY ENERGY ${fmt(STATE.energy)} / ${MAX_ENERGY}`
      );

    }
  );


$("rankingBtn")
  .addEventListener(
    "click",
    ()=>{
      go("./ranking.html");
    }
  );


$("rewardBtn")
  .addEventListener(
    "click",
    ()=>{
      go("./rewards.html");
    }
  );


$("homeBtn")
  .addEventListener(
    "click",
    ()=>{
      go(
        CFG.PAGE?.HOME ||
        "./dashboard.html"
      );
    }
  );


$("missionBtn")
  .addEventListener(
    "click",
    ()=>{
      go(
        CFG.PAGE?.MISSION ||
        "./mission.html"
      );
    }
  );


$("battleBtn")
  .addEventListener(
    "click",
    ()=>{
      location.reload();
    }
  );


/* ============================================================
   START
============================================================ */

async function start(){

  try{

    await liff.init({
      liffId:LIFF_ID
    });


    if(!liff.isLoggedIn()){

      liff.login({
        redirectUri:location.href
      });

      return;

    }


    await loadBattle();


    setInterval(
      renderCountdown,
      1000
    );


    /*
      refresh wallet / battle data
      ทุก 30 วินาที
    */

    setInterval(
      async ()=>{

        try{

          let data;

          try{

            data =
              await callBattle(
                "battleHome"
              );

          }
          catch(error){

            const msg =
              String(
                error?.message || ""
              ).toUpperCase();


            if(
              msg.includes(
                "UNKNOWN_ACTION"
              )
            ){

              data =
                await callBattle(
                  "home"
                );

            }
            else{
              throw error;
            }

          }


          applyApiData(data);

          render();

        }
        catch(error){

          console.warn(
            "AUTO REFRESH:",
            error
          );

        }

      },

      Number(
        CFG.REFRESH_MS ||
        30000
      )

    );

  }
  catch(error){

    console.error(
      "START:",
      error
    );

    showLoading(false);

    toast(
      error.message ||
      "เปิด Battle ไม่สำเร็จ"
    );

  }

}


start();

</script>
