<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Log</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app-config.js"></script><script src="./common.js"></script><style>body{font-family:Arial,'Noto Sans Thai';background:#eef4ff;color:#08245b}.wrap{max-width:600px;margin:auto;padding:20px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 25px #1233}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#0b8b68;color:#fff;font-weight:900;margin-top:10px}.input{width:100%;padding:12px;box-sizing:border-box;margin:6px 0;border:1px solid #ccd8ea;border-radius:12px}</style></head><body><main class="wrap"><section class="card"><h1>🥗 FOOD LOG</h1><p>บันทึกข้อมูลโภชนาการของวันนี้</p><label>แคลอรี่ (kcal)<input id="cal" class="input" type="number" min="0"></label><label>โปรตีน (g)<input id="protein" class="input" type="number" min="0"></label><label>น้ำ (L)<input id="water" class="input" type="number" min="0" step="0.1"></label><button class="btn" onclick="save()">บันทึกข้อมูล</button><button class="btn" onclick="ROCK.goHome()">กลับ HOME</button><p id="s"></p></section></main><script>async function save(){try{const r=await ROCK.callPlayerApi({action:'saveHealthScore',score:Math.min(100,Number(document.getElementById('protein').value||0)/2)});document.getElementById('s').textContent='✅ บันทึกแล้ว • Health Score '+r.healthScore}catch(e){document.getElementById('s').textContent='❌ '+e.message}}ROCK.initLiff().catch(e=>document.getElementById('s').textContent=e.message)</script></body></html>
