<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ROCK YOUR BODY 2026 - FIGHT MONSTER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="./app-config.js?v=20260824-05"></script>
  <script src="./common.js?v=20260824-05"></script>

  <style>
    :root{
      --stage-main:#1275ef;
      --stage-dark:#052b72;
      --stage-glow:#69d8ff;
      --stage-accent:#ffdf36;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family:"Prompt",sans-serif;
      background:#020c22;
      color:#fff;
      overflow-x:hidden;
    }
    button{font:inherit}

    .page{
      min-height:100svh;
      padding:max(8px,env(safe-area-inset-top)) 8px max(18px,env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--stage-main) 45%,transparent),transparent 35%),
        linear-gradient(180deg,var(--stage-dark),#020a1d 82%);
    }

    .wrap{
      width:min(100%,980px);
      margin:0 auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */
    .top{
      display:grid;
      grid-template-columns:48px minmax(0,1fr) auto;
      align-items:center;
      gap:9px;
      min-height:62px;
      padding:8px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:rgba(3,22,62,.82);
      box-shadow:0 8px 25px rgba(0,0,0,.25);
      backdrop-filter:blur(8px);
    }

    .back{
      width:44px;height:44px;
      border:0;
      border-radius:13px;
      background:rgba(255,255,255,.13);
      color:#fff;
      font-size:26px;
      font-weight:900;
      cursor:pointer;
    }

    .stage-label{
      font-size:10px;
      font-weight:800;
      color:#9bcaff;
      letter-spacing:1.4px;
    }

    .stage-name{
      margin-top:1px;
      font-size:clamp(18px,4.3vw,28px);
      line-height:1;
      font-weight:900;
    }

    .energy-box{
      display:flex;
      align-items:center;
      gap:5px;
      padding:8px 10px;
      border-radius:13px;
      background:linear-gradient(180deg,#fff0a0,#ffc62e);
      color:#6e4200;
      font-size:clamp(12px,3vw,17px);
      font-weight:900;
      white-space:nowrap;
    }

    /* =========================================================
       ARENA
    ========================================================= */
    .arena{
      position:relative;
      min-height:clamp(500px,92vw,690px);
      margin-top:9px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      border-radius:26px;
      background:
        radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--stage-glow) 30%,transparent),transparent 33%),
        linear-gradient(180deg,var(--stage-main) 0%,var(--stage-dark) 70%,#020b20 100%);
      box-shadow:0 16px 42px rgba(0,0,0,.32);
    }

    .arena::before{
      content:"";
      position:absolute;
      inset:0;
      opacity:.25;
      background:
        radial-gradient(circle at 20% 22%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 74% 13%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 85% 38%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 31% 52%,#fff 0 1px,transparent 2px);
      background-size:90px 90px,130px 130px,160px 160px,115px 115px;
      pointer-events:none;
    }

    .boss-badge{
      position:absolute;
      z-index:15;
      right:14px;
      top:14px;
      display:none;
      padding:6px 11px;
      border-radius:999px;
      background:linear-gradient(180deg,#ffdf4e,#ff7b00);
      color:#5f1900;
      font-size:11px;
      font-weight:900;
      box-shadow:0 5px 14px rgba(0,0,0,.23);
    }

    .boss-badge.show{display:block}

    .monster-head{
      position:absolute;
      z-index:10;
      top:3.5%;
      left:7%;
      right:7%;
      text-align:center;
    }

    .monster-name{
      font-size:clamp(22px,5vw,38px);
      line-height:1;
      font-weight:900;
      text-shadow:0 3px 7px rgba(0,0,0,.42);
    }

    .monster-sub{
      margin-top:5px;
      color:#dceeff;
      font-size:clamp(10px,2.5vw,13px);
      font-weight:600;
    }

    .hp-box{
      width:min(100%,540px);
      margin:11px auto 0;
    }

    .hp-info{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:5px;
      font-size:11px;
      font-weight:800;
    }

    .hp-track{
      height:19px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.78);
      border-radius:999px;
      background:rgba(0,0,0,.42);
    }

    .hp-fill{
      height:100%;
      width:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#26d65d,#80f38a);
      transition:width .25s ease;
    }

    .monster{
      position:absolute;
      z-index:6;
      top:19%;
      left:50%;
      transform:translateX(-50%);
      width:min(62%,410px);
      height:44%;
      object-fit:contain;
      filter:drop-shadow(0 16px 16px rgba(0,0,0,.45));
      pointer-events:none;
      transition:.15s ease;
    }

    .monster.hit{
      transform:translateX(-48%) rotate(2deg) scale(.98);
      filter:brightness(1.65) drop-shadow(0 16px 16px rgba(0,0,0,.45));
    }

    .platform{
      position:absolute;
      z-index:4;
      left:50%;
      top:56%;
      transform:translateX(-50%);
      width:45%;
      height:8%;
      border-radius:50%;
      background:
        radial-gradient(ellipse,var(--stage-glow),rgba(255,255,255,.15) 42%,rgba(0,0,0,.28) 70%);
      filter:blur(1px);
      opacity:.7;
    }

    /* =========================================================
       PLAYER
    ========================================================= */
    .player-zone{
      position:absolute;
      z-index:8;
      left:2%;
      bottom:2%;
      width:42%;
      height:40%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    .player-glow{
      position:absolute;
      bottom:5%;
      width:80%;
      height:65%;
      border-radius:50%;
      background:radial-gradient(circle,color-mix(in srgb,var(--stage-glow) 45%,transparent),transparent 70%);
      filter:blur(5px);
    }

    .player{
      position:relative;
      z-index:2;
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center bottom;
      filter:drop-shadow(0 12px 12px rgba(0,0,0,.4));
      pointer-events:none;
    }

    /* =========================================================
       STAGE INFO
    ========================================================= */
    .info-card{
      position:absolute;
      z-index:9;
      right:3%;
      bottom:4%;
      width:47%;
      padding:12px;
      border-radius:18px;
      background:rgba(3,19,54,.76);
      border:1px solid rgba(255,255,255,.15);
      backdrop-filter:blur(5px);
    }

    .cost-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      color:#d8e7ff;
      font-size:11px;
      font-weight:700;
    }

    .cost-row strong{
      color:#ffe74c;
      font-size:14px;
      font-weight:900;
    }

    .attack{
      width:100%;
      min-height:54px;
      margin-top:11px;
      border:0;
      border-radius:14px;
      background:linear-gradient(180deg,var(--stage-accent),#ff8f00);
      color:#572300;
      font-size:clamp(16px,3.7vw,21px);
      font-weight:900;
      cursor:pointer;
      box-shadow:0 6px 0 rgba(103,46,0,.6),0 9px 16px rgba(0,0,0,.25);
    }

    .attack:active{
      transform:translateY(3px);
      box-shadow:0 3px 0 rgba(103,46,0,.6),0 6px 11px rgba(0,0,0,.22);
    }

    .attack:disabled{
      opacity:.6;
      filter:grayscale(.6);
      box-shadow:none;
      transform:none;
      cursor:default;
    }

    .status{
      min-height:19px;
      margin-top:9px;
      color:#cfe2ff;
      text-align:center;
      font-size:10px;
      font-weight:700;
    }

    .damage{
      position:absolute;
      z-index:30;
      top:37%;
      left:50%;
      transform:translate(-50%,-50%);
      color:#fff138;
      font-size:clamp(35px,9vw,70px);
      font-weight:900;
      opacity:0;
      text-shadow:0 4px 0 #a83200,0 8px 15px rgba(0,0,0,.45);
      pointer-events:none;
    }

    .damage.show{
      animation:damagePop .55s ease;
    }

    @keyframes damagePop{
      0%{opacity:0;transform:translate(-50%,0) scale(.4)}
      35%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
      100%{opacity:0;transform:translate(-50%,-100%) scale(1)}
    }


    .test-badge{
      position:absolute;
      z-index:50;
      left:12px;
      top:12px;
      display:none;
      padding:6px 10px;
      border-radius:999px;
      background:#ffea00;
      color:#5c4300;
      font-size:10px;
      font-weight:900;
      box-shadow:0 5px 14px rgba(0,0,0,.25);
    }

    .test-badge.show{
      display:block;
    }

    /* =========================================================
       RESULT
    ========================================================= */
    .result{
      position:fixed;
      inset:0;
      z-index:100000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,10,31,.79);
      backdrop-filter:blur(5px);
    }

    .result.show{display:flex}

    .result-card{
      width:min(100%,430px);
      padding:24px 18px;
      border-radius:24px;
      background:#fff;
      color:#133a76;
      text-align:center;
      box-shadow:0 18px 48px rgba(0,0,0,.36);
    }

    .result-icon{font-size:58px}
    .result-title{
      margin-top:7px;
      font-size:28px;
      font-weight:900;
    }
    .result-title.win{color:#069748}
    .result-title.lose{color:#d42e32}

    .result-text{
      margin-top:8px;
      color:#697b96;
      font-size:13px;
      line-height:1.55;
      font-weight:600;
    }

    .result-button{
      width:100%;
      min-height:48px;
      margin-top:14px;
      border:0;
      border-radius:13px;
      background:#0877e7;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .result-button.secondary{
      margin-top:8px;
      background:#e7effa;
      color:#224d85;
    }

    @media(max-width:420px){
      .arena{min-height:490px}
      .player-zone{width:45%}
      .info-card{width:50%}
    }
  </style>
</head>

<body>

<main class="page">
  <div class="wrap">

    <header class="top">
      <button class="back" type="button" onclick="goBattleMap()" aria-label="ย้อนกลับ">‹</button>

      <div>
        <div id="stageLabel" class="stage-label">STAGE 1</div>
        <div id="stageName" class="stage-name">เจ้าจอมเอื่อย</div>
      </div>

      <div class="energy-box">
        ⚡ <span id="playerEnergyText">0</span>
      </div>
    </header>


    <section id="arena" class="arena">

      <div id="testBadge" class="test-badge">TEST MODE • ไม่หัก Energy จริง</div>
      <div id="bossBadge" class="boss-badge">BOSS</div>

      <div class="monster-head">
        <div id="monsterName" class="monster-name">MONSTER</div>
        <div id="monsterSub" class="monster-sub">กำจัดพฤติกรรมเสี่ยงเพื่อสุขภาพที่ดี</div>

        <div class="hp-box">
          <div class="hp-info">
            <span>MONSTER HP</span>
            <span id="hpText">100 / 100</span>
          </div>
          <div class="hp-track">
            <div id="hpFill" class="hp-fill"></div>
          </div>
        </div>
      </div>

      <img id="monsterImage" class="monster" src="" alt="Monster" draggable="false">
      <div class="platform"></div>

      <div class="player-zone">
        <div class="player-glow"></div>
        <img id="playerImage" class="player" src="" alt="Player" draggable="false">
      </div>

      <div class="info-card">
        <div class="cost-row">
          <span>พลังที่ใช้เปิดด่าน</span>
          <strong id="requiredEnergy">⚡ 300</strong>
        </div>

        <button id="attackButton" class="attack" type="button" onclick="attackMonster()">
          ⚔️ โจมตี
        </button>

        <div id="battleStatus" class="status">
          กดโจมตีเพื่อเริ่มต่อสู้
        </div>
      </div>

      <div id="damageText" class="damage">-25</div>

    </section>

  </div>
</main>


<div id="resultModal" class="result">
  <section class="result-card">

    <div id="resultIcon" class="result-icon">🏆</div>
    <div id="resultTitle" class="result-title win">YOU WIN!</div>
    <div id="resultText" class="result-text"></div>

    <button id="primaryResultButton" class="result-button" type="button" onclick="resultPrimary()">
      ด่านถัดไป
    </button>

    <button class="result-button secondary" type="button" onclick="goBattleMap()">
      กลับหน้า Fight Monster
    </button>

  </section>
</div>


<script>
/* =========================================================
   ASSETS
========================================================= */

const ASSET_BASE =
  "https://nztvqdzatdpauufpvdaa.supabase.co/storage/v1/object/public/rock-assets/%20battle";


/* =========================================================
   STAGE CONFIG
   หน้าเดียวทำงานอัตโนมัติทั้ง 10 Stage
========================================================= */

const STAGES = [

  {
    id:1,
    name:"เจ้าจอมเอื่อย",
    sub:"ลุกขึ้นขยับร่างกาย เอาชนะความเฉื่อยชา",
    energy:300,
    hp:100,
    damage:25,
    monster:`${ASSET_BASE}/monster/stage-001-germ.png`,
    main:"#207fe7",
    dark:"#063675",
    glow:"#70e2ff",
    accent:"#ffd532"
  },

  {
    id:2,
    name:"จอมหวาน",
    sub:"ลดหวาน ลดน้ำตาล พิชิตปีศาจโดนัท",
    energy:900,
    hp:120,
    damage:30,
    monster:`${ASSET_BASE}/monster/stage-002-donut.png`,
    main:"#e84e9d",
    dark:"#6c155f",
    glow:"#ff98dd",
    accent:"#ffce45"
  },

  {
    id:3,
    name:"ปีศาจของทอด",
    sub:"ลดอาหารทอดและไขมัน เพิ่มทางเลือกสุขภาพดี",
    energy:1500,
    hp:140,
    damage:35,
    monster:`${ASSET_BASE}/monster/stage-003-fries.png`,
    main:"#e94b16",
    dark:"#7a1f0a",
    glow:"#ffb247",
    accent:"#ffd326"
  },

  {
    id:4,
    name:"จอมเค็ม",
    sub:"ลดเค็ม ลดโซเดียม เพื่อสุขภาพหัวใจและไต",
    energy:2100,
    hp:160,
    damage:40,
    monster:`${ASSET_BASE}/monster/stage-004-salt.png`,
    main:"#4a9ce9",
    dark:"#163b78",
    glow:"#bceeff",
    accent:"#ffdc3e"
  },

  {
    id:5,
    name:"ราชาอาหารไร้ประโยชน์",
    sub:"เลือกอาหารให้ดี ลดอาหารพลังงานสูงเกินจำเป็น",
    energy:2700,
    hp:180,
    damage:45,
    monster:`${ASSET_BASE}/monster/stage-005-burger-king.png`,
    main:"#d26013",
    dark:"#612406",
    glow:"#ffb63b",
    accent:"#ffd426"
  },

  {
    id:6,
    name:"ปีศาจพักผ่อนน้อย",
    sub:"พักผ่อนให้เพียงพอ ฟื้นฟูร่างกายและสมอง",
    energy:3300,
    hp:200,
    damage:50,
    monster:`${ASSET_BASE}/monster/stage-006-rest.png`,
    main:"#433d9f",
    dark:"#171b55",
    glow:"#799bff",
    accent:"#ffd941"
  },

  {
    id:7,
    name:"จอมเนือยนิ่ง",
    sub:"ลดเวลานั่งนิ่ง เพิ่มกิจกรรมระหว่างวัน",
    energy:3900,
    hp:220,
    damage:55,
    monster:`${ASSET_BASE}/monster/stage-007-sedentary.png`,
    main:"#4d7131",
    dark:"#1c351a",
    glow:"#9de56d",
    accent:"#ffd235"
  },

  {
    id:8,
    name:"ปีศาจพฤติกรรมเสี่ยง",
    sub:"ลดพฤติกรรมเสี่ยง สร้างสุขภาพดีระยะยาว",
    energy:4500,
    hp:240,
    damage:60,
    monster:`${ASSET_BASE}/monster/stage-008-risk.png`,
    main:"#777018",
    dark:"#343205",
    glow:"#e8e55c",
    accent:"#ffda2b"
  },

  {
    id:9,
    name:"ราชาความเสี่ยงสุขภาพ",
    sub:"รวมพลังพิชิตความเสี่ยงต่อโรคเรื้อรัง",
    energy:5100,
    hp:270,
    damage:70,
    monster:`${ASSET_BASE}/monster/stage-009-risk-king.png`,
    main:"#542275",
    dark:"#241039",
    glow:"#c778ff",
    accent:"#ffcf31"
  },

  {
    id:10,
    name:"จอมมารโรคร้าย",
    sub:"FINAL BOSS — พิชิตพฤติกรรมเสี่ยงทั้งหมด",
    energy:5700,
    hp:320,
    damage:80,
    monster:`${ASSET_BASE}/monster/stage-010-boss.png`,
    main:"#4a1134",
    dark:"#180719",
    glow:"#e63275",
    accent:"#ffbd25",
    boss:true
  }

];


/* =========================================================
   GET STAGE
========================================================= */

const PARAMS =
  new URLSearchParams(
    window.location.search
  );

const STAGE_ID =
  Math.max(
    1,
    Math.min(
      10,
      Number(
        PARAMS.get("stage")
      ) || 1
    )
  );

const CURRENT_STAGE =
  STAGES.find(
    item =>
      item.id === STAGE_ID
  ) || STAGES[0];


/* =========================================================
   TEST MODE
   เปิดด้วย:
   battle_stage.html?stage=1&test=1

   โหมดนี้ไม่เรียก Supabase และไม่หัก Energy จริง
   ใช้สำหรับทดสอบฆ่า Monster / HP / Win / Next Stage
========================================================= */

const TEST_MODE =
  PARAMS.get("test") === "1";



/* =========================================================
   CHARACTER
========================================================= */

const CHARACTER_ASSETS = {

  male:{
    battle:
      `${ASSET_BASE}/characters/male/player-male-battle.png`,
    win:
      `${ASSET_BASE}/characters/male/player-male-win.png`,
    lose:
      `${ASSET_BASE}/characters/male/player-male-lose.png`
  },

  female:{
    battle:
      `${ASSET_BASE}/characters/female/player-female-battle.png`,
    win:
      `${ASSET_BASE}/characters/female/player-female-win.png`,
    lose:
      `${ASSET_BASE}/characters/female/player-female-lose1.png`
  }

};

let playerGender =
  localStorage.getItem(
    "rockPlayerGender"
  ) ||
  localStorage.getItem(
    "selectedCharacter"
  ) ||
  "male";

if(
  playerGender !== "male" &&
  playerGender !== "female"
){
  playerGender = "male";
}


/* =========================================================
   STATE
========================================================= */

let playerEnergy =
  Number(
    localStorage.getItem(
      "rockEnergy"
    )
  ) || 0;

let monsterHp =
  CURRENT_STAGE.hp;

let runId =
  null;

let battleStarted =
  false;

let battleFinished =
  false;


/* =========================================================
   RENDER
========================================================= */

function renderStage(){

  if(TEST_MODE){

    document
      .getElementById(
        "testBadge"
      )
      ?.classList
      .add("show");

    /*
      ให้ Energy เยอะพอสำหรับการทดสอบ UI
      แต่ไม่เขียนทับค่าจริงใน localStorage
    */
    playerEnergy =
      Math.max(
        playerEnergy,
        CURRENT_STAGE.energy
      );
  }

  document.documentElement
    .style
    .setProperty(
      "--stage-main",
      CURRENT_STAGE.main
    );

  document.documentElement
    .style
    .setProperty(
      "--stage-dark",
      CURRENT_STAGE.dark
    );

  document.documentElement
    .style
    .setProperty(
      "--stage-glow",
      CURRENT_STAGE.glow
    );

  document.documentElement
    .style
    .setProperty(
      "--stage-accent",
      CURRENT_STAGE.accent
    );


  document
    .getElementById(
      "stageLabel"
    )
    .textContent =
      `STAGE ${CURRENT_STAGE.id}`;


  document
    .getElementById(
      "stageName"
    )
    .textContent =
      CURRENT_STAGE.name;


  document
    .getElementById(
      "monsterName"
    )
    .textContent =
      CURRENT_STAGE.name;


  document
    .getElementById(
      "monsterSub"
    )
    .textContent =
      CURRENT_STAGE.sub;


  document
    .getElementById(
      "monsterImage"
    )
    .src =
      CURRENT_STAGE.monster;


  document
    .getElementById(
      "playerImage"
    )
    .src =
      CHARACTER_ASSETS[
        playerGender
      ].battle;


  document
    .getElementById(
      "requiredEnergy"
    )
    .textContent =
      `⚡ ${CURRENT_STAGE.energy.toLocaleString("en-US")}`;


  if(CURRENT_STAGE.boss){

    document
      .getElementById(
        "bossBadge"
      )
      .classList
      .add("show");
  }


  updateEnergyUI();
  updateHpUI();
}


/* =========================================================
   ENERGY
========================================================= */

function updateEnergyUI(){

  document
    .getElementById(
      "playerEnergyText"
    )
    .textContent =
      Math.max(
        0,
        playerEnergy
      )
      .toLocaleString(
        "en-US"
      );
}


/* =========================================================
   HP
========================================================= */

function updateHpUI(){

  monsterHp =
    Math.max(
      0,
      monsterHp
    );


  document
    .getElementById(
      "hpText"
    )
    .textContent =
      `${monsterHp} / ${CURRENT_STAGE.hp}`;


  const percent =
    CURRENT_STAGE.hp > 0
      ? monsterHp /
        CURRENT_STAGE.hp *
        100
      : 0;


  const fill =
    document.getElementById(
      "hpFill"
    );


  fill.style.width =
    `${percent}%`;


  if(percent <= 25){

    fill.style.background =
      "linear-gradient(90deg,#df3030,#ff7645)";

  }else if(percent <= 55){

    fill.style.background =
      "linear-gradient(90deg,#ff941d,#ffe044)";

  }else{

    fill.style.background =
      "linear-gradient(90deg,#26d65d,#80f38a)";
  }
}


/* =========================================================
   DAMAGE EFFECT
========================================================= */

function showDamage(value){

  const text =
    document.getElementById(
      "damageText"
    );

  const monster =
    document.getElementById(
      "monsterImage"
    );


  text.textContent =
    `-${value}`;


  text.classList.remove(
    "show"
  );

  void text.offsetWidth;

  text.classList.add(
    "show"
  );


  monster.classList.add(
    "hit"
  );

  setTimeout(
    () => {
      monster.classList.remove(
        "hit"
      );
    },
    180
  );
}


/* =========================================================
   API HELPER
========================================================= */

async function callBattleApi(payload){

  const api =
    window.APP_CONFIG
      ?.API
      ?.BATTLE;


  if(!api){

    throw new Error(
      "ไม่พบ BATTLE API"
    );
  }


  const idToken =
    window.ROCK
      ?.getIdToken
      ?.();


  if(!idToken){

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      api,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            ...payload,
            idToken
          })
      }
    );


  const raw =
    await response.text();


  let result = {};


  try{

    result =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      `Battle API ตอบกลับไม่ถูกต้อง HTTP ${response.status}`
    );
  }


  if(
    !response.ok ||
    result?.success === false
  ){

    const error =
      new Error(
        result?.error ||
        result?.message ||
        `HTTP ${response.status}`
      );

    error.data =
      result;

    throw error;
  }


  return result;
}


/* =========================================================
   START RUN
========================================================= */

async function ensureBattleStarted(){

  if(battleStarted){
    return true;
  }


  if(TEST_MODE){

    battleStarted =
      true;

    runId =
      `test-stage-${CURRENT_STAGE.id}`;

    monsterHp =
      CURRENT_STAGE.hp;

    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        "TEST MODE: เริ่ม Battle แล้ว";

    updateHpUI();

    return true;
  }


  const status =
    document.getElementById(
      "battleStatus"
    );


  status.textContent =
    "กำลังตรวจสอบ Energy...";


  try{

    const result =
      await callBattleApi({
        action:
          "startBattle",

        stageId:
          CURRENT_STAGE.id
      });


    runId =
      result?.run?.id ||
      result?.runId ||
      null;


    monsterHp =
      Number(
        result?.run?.monster_hp ??
        result?.run?.monsterHp ??
        CURRENT_STAGE.hp
      );


    const energy =
      Number(
        result?.player?.energy
      );


    if(
      Number.isFinite(
        energy
      )
    ){

      playerEnergy =
        energy;

      localStorage.setItem(
        "rockEnergy",
        String(energy)
      );
    }


    battleStarted =
      true;


    updateEnergyUI();
    updateHpUI();


    status.textContent =
      result?.resumed
        ? "กลับเข้าสู่การต่อสู้เดิม"
        : "เริ่ม Battle แล้ว!";


    return true;


  }catch(error){

    console.error(
      "START BATTLE:",
      error
    );


    const data =
      error?.data;


    if(
      data?.error ===
        "ENERGY_NOT_ENOUGH" ||
      error?.message ===
        "ENERGY_NOT_ENOUGH"
    ){

      const required =
        data?.requiredEnergy ??
        CURRENT_STAGE.energy;


      const current =
        data?.currentEnergy ??
        playerEnergy;


      showResult(
        false,
        `Energy ไม่เพียงพอ ต้องใช้ ⚡ ${required.toLocaleString("en-US")} แต่คุณมี ⚡ ${Number(current).toLocaleString("en-US")}`
      );


      return false;
    }


    /*
      ถ้า Backend ยังไม่พร้อม
      ไม่หัก Energy แบบ local โดยอัตโนมัติ
      เพื่อป้องกันข้อมูลเกมผิด
    */

    status.textContent =
      error?.message ||
      "เริ่ม Battle ไม่สำเร็จ";


    return false;
  }
}


/* =========================================================
   ATTACK
========================================================= */

async function attackMonster(){

  if(battleFinished){
    return;
  }


  const button =
    document.getElementById(
      "attackButton"
    );


  button.disabled =
    true;


  try{

    const ready =
      await ensureBattleStarted();


    if(!ready){
      return;
    }


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        "กำลังโจมตี...";


    let result = {};
    let damage = 0;


    if(TEST_MODE){

      damage =
        CURRENT_STAGE.damage;

      monsterHp =
        Math.max(
          0,
          monsterHp -
          damage
        );

      result = {
        success:true,
        damage,
        monsterHp,
        win:monsterHp <= 0
      };

    }else{

      result =
        await callBattleApi({
          action:
            "attack",

          runId
        });


      damage =
        Number(
          result?.damage
        ) ||
        CURRENT_STAGE.damage;


      monsterHp =
        Number(
          result?.monsterHp ??
          result?.monster_hp
        );


      if(
        !Number.isFinite(
          monsterHp
        )
      ){

        monsterHp =
          Math.max(
            0,
            monsterHp -
            damage
          );
      }
    }


    showDamage(
      damage
    );


    updateHpUI();


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        `⚔️ สร้างความเสียหาย ${damage}`;


    if(
      result?.win === true ||
      monsterHp <= 0
    ){

      setTimeout(
        winBattle,
        320
      );
    }


  }catch(error){

    console.error(
      "ATTACK:",
      error
    );


    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        error?.message ||
        "โจมตีไม่สำเร็จ";


  }finally{

    if(!battleFinished){

      button.disabled =
        false;
    }
  }
}


/* =========================================================
   WIN
========================================================= */

function winBattle(){

  if(battleFinished){
    return;
  }


  battleFinished =
    true;


  document
    .getElementById(
      "attackButton"
    )
    .disabled =
      true;


  document
    .getElementById(
      "playerImage"
    )
    .src =
      CHARACTER_ASSETS[
        playerGender
      ].win;


  const next =
    Math.min(
      10,
      CURRENT_STAGE.id + 1
    );


  localStorage.setItem(
    "rockUnlockedStage",
    String(next)
  );


  if(
    CURRENT_STAGE.id <
    10
  ){

    showResult(
      true,
      `คุณพิชิต ${CURRENT_STAGE.name} สำเร็จ และปลดล็อก Stage ${CURRENT_STAGE.id + 1} แล้ว`
    );

  }else{

    showResult(
      true,
      "สุดยอด! คุณพิชิต FINAL BOSS ได้สำเร็จ"
    );
  }
}


/* =========================================================
   RESULT
========================================================= */

function showResult(win,text){

  const modal =
    document.getElementById(
      "resultModal"
    );


  const icon =
    document.getElementById(
      "resultIcon"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  const body =
    document.getElementById(
      "resultText"
    );


  const primary =
    document.getElementById(
      "primaryResultButton"
    );


  if(win){

    icon.textContent =
      CURRENT_STAGE.id === 10
        ? "👑"
        : "🏆";


    title.textContent =
      "YOU WIN!";


    title.className =
      "result-title win";


    primary.textContent =
      CURRENT_STAGE.id < 10
        ? "ไป Stage ถัดไป"
        : "กลับหน้า Fight Monster";

  }else{

    battleFinished =
      true;


    document
      .getElementById(
        "playerImage"
      )
      .src =
        CHARACTER_ASSETS[
          playerGender
        ].lose;


    icon.textContent =
      "⚡";


    title.textContent =
      "ENERGY NOT ENOUGH";


    title.className =
      "result-title lose";


    primary.textContent =
      "กลับหน้า Fight Monster";
  }


  body.textContent =
    text || "";


  modal.classList.add(
    "show"
  );
}


/* =========================================================
   RESULT PRIMARY
========================================================= */

function resultPrimary(){

  if(
    monsterHp <= 0 &&
    CURRENT_STAGE.id < 10
  ){

    window.location.href =
      `./battle_stage.html?stage=${CURRENT_STAGE.id + 1}${TEST_MODE ? "&test=1" : ""}`;

    return;
  }


  goBattleMap();
}


/* =========================================================
   BACK
========================================================= */

function goBattleMap(){

  window.location.href =
    "./battle.html?fight=1";
}


/* =========================================================
   LOAD DASHBOARD CACHE/API
========================================================= */

async function loadEnergy(){

  try{

    if(
      window.ROCK &&
      typeof ROCK.fetchDashboard ===
        "function"
    ){

      const result =
        await ROCK.fetchDashboard();


      const energy =
        Number(
          result?.energy?.current ??
          result?.energy ??
          result?.player?.energy ??
          result?.user?.energy
        );


      if(
        Number.isFinite(
          energy
        )
      ){

        playerEnergy =
          energy;


        localStorage.setItem(
          "rockEnergy",
          String(energy)
        );


        updateEnergyUI();
      }
    }


  }catch(error){

    console.warn(
      "LOAD ENERGY:",
      error
    );
  }
}


/* =========================================================
   START
========================================================= */

async function startStage(){

  renderStage();


  if(TEST_MODE){

    document
      .getElementById(
        "battleStatus"
      )
      .textContent =
        `TEST MODE: กดโจมตี ${Math.ceil(CURRENT_STAGE.hp / CURRENT_STAGE.damage)} ครั้งเพื่อฆ่า Monster`;

    return;
  }


  try{

    if(
      window.ROCK &&
      typeof ROCK.initLiff ===
        "function"
    ){

      const ready =
        await ROCK.initLiff();


      if(!ready){
        return;
      }


      await loadEnergy();
    }


  }catch(error){

    console.warn(
      "STAGE INIT:",
      error
    );
  }
}


document.addEventListener(
  "DOMContentLoaded",
  startStage
);

</script>
