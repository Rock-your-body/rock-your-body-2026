<script src="./common.js"></script>


<script>

const ROCK = window.ROCK;

const $ =
  id =>
    document.getElementById(id);


function goPage(name){

  const url =
    ROCK.CFG.PAGE[name];

  if(url){
    ROCK.go(url);
  }
}


function showStatus(
  message,
  error = false
){

  const el =
    $("status");

  el.textContent =
    message;

  el.className =
    error
      ? "status show error"
      : "status show";
}


function hideStatus(){

  $("status").className =
    "status";
}


function percent(
  current,
  max
){

  const c =
    Number(current) || 0;

  const m =
    Number(max) || 0;

  if(m <= 0){
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      100,
      c / m * 100
    )
  );
}


function missionValue(
  missions,
  name
){

  return (
    missions?.[name] ||
    missions?.[
      name.toLowerCase()
    ] ||
    {}
  );
}


function renderMission(raw){

  const user =
    raw?.user ||
    raw?.player ||
    {};

  const energy =
    raw?.energy &&
    typeof raw.energy === "object"
      ? raw.energy
      : {};

  const missions =
    raw?.missions ||
    {};


  /* TOP */

  $("coin").textContent =
    ROCK.fmtInt(
      raw?.rockCoin ??
      raw?.rock_coin ??
      user?.rock_coin ??
      0
    );


  const currentEnergy =
    ROCK.num(
      energy.current ??
      user.energy,
      0
    );


  const maxEnergy =
    ROCK.num(
      energy.max ??
      user.max_energy,
      ROCK.CFG.MAX_ENERGY
    );


  $("energy").textContent =
    ROCK.fmtInt(currentEnergy) +
    " / " +
    ROCK.fmtInt(maxEnergy);


  $("missionPoint").textContent =
    ROCK.fmtInt(
      raw?.missionPoint ??
      raw?.mission_point ??
      missions?.points ??
      0
    ) +
    " PTS";


  /* DAILY */

  renderMissionBox(
    "daily",
    missionValue(
      missions,
      "daily"
    )
  );


  /* WEEKLY */

  renderMissionBox(
    "weekly",
    missionValue(
      missions,
      "weekly"
    )
  );


  /* MONTHLY */

  renderMissionBox(
    "monthly",
    missionValue(
      missions,
      "monthly"
    )
  );


  /* BONUS */

  renderMissionBox(
    "bonus",
    missionValue(
      missions,
      "bonus"
    )
  );
}


function renderMissionBox(
  prefix,
  data
){

  const current =
    Number(
      data.current ??
      data.progress ??
      data.completed ??
      0
    );


  const max =
    Number(
      data.max ??
      data.target ??
      data.total ??
      1
    );


  const coin =
    Number(
      data.rockCoin ??
      data.rock_coin ??
      data.coin ??
      data.rewardCoin ??
      0
    );


  const energy =
    Number(
      data.energy ??
      data.rewardEnergy ??
      0
    );


  $(
    prefix +
    "ProgressText"
  ).textContent =
    ROCK.fmtInt(current) +
    " / " +
    ROCK.fmtInt(max);


  $(
    prefix +
    "Bar"
  ).style.width =
    percent(
      current,
      max
    ) +
    "%";


  $(
    prefix +
    "Coin"
  ).textContent =
    "+" +
    ROCK.fmtInt(coin);


  $(
    prefix +
    "Energy"
  ).textContent =
    "+" +
    ROCK.fmtInt(energy);
}


let loading =
  false;


async function loadMission(){

  if(loading){
    return;
  }

  loading =
    true;

  try{

    const raw =
      await ROCK.fetchDashboard();

    console.log(
      "MISSION DATA:",
      raw
    );

    renderMission(raw);

    hideStatus();

  }catch(error){

    console.error(
      "MISSION LOAD ERROR:",
      error
    );

    showStatus(
      error?.message ||
      String(error),
      true
    );

  }finally{

    loading =
      false;
  }
}


(async()=>{

  try{

    if(!ROCK){
      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );
    }

    showStatus(
      "กำลังโหลดภารกิจ..."
    );


    /*
      Mission ใช้ Dashboard LIFF
    */

    const ok =
      await ROCK.initLiff(
        "DASHBOARD"
      );


    if(!ok){
      return;
    }


    await loadMission();


    setInterval(
      ()=>{

        if(
          document.visibilityState ===
          "visible"
        ){
          loadMission();
        }

      },
      ROCK.CFG.REFRESH_MS ||
      30000
    );


  }catch(error){

    console.error(error);

    showStatus(
      error?.message ||
      String(error),
      true
    );
  }

})();

</script>
