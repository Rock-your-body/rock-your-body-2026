    /* =====================================================
       MISSION PAGE EXTRA
    ====================================================== */

    body{
      background:#eef5ff;
    }


    /* =====================================================
       CLICKABLE MISSION CARD
    ====================================================== */

    .mission-hotspot{
      position:absolute;

      z-index:40;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      cursor:pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    /*
      ตำแหน่งปุ่มกดบน Template

      หากต้องการขยับ:
      left เพิ่ม = ขวา
      top เพิ่ม = ลง
    */


    /* DAILY */

    .mission-hotspot.daily{
      left:33.2%;
      top:29.5%;

      width:27.4%;
      height:27.5%;
    }


    /* WEEKLY */

    .mission-hotspot.weekly{
      left:63.0%;
      top:29.5%;

      width:31.0%;
      height:27.5%;
    }


    /* MONTHLY */

    .mission-hotspot.monthly{
      left:33.2%;
      top:58%;

      width:27.4%;
      height:27.5%;
    }


    /* BONUS */

    .mission-hotspot.bonus{
      left:63.0%;
      top:58%;

      width:31.0%;
      height:27.5%;
    }


    /* =====================================================
       MODAL BACKDROP
    ====================================================== */

    .mission-modal{
      position:fixed;

      inset:0;

      z-index:99999;

      display:none;

      align-items:flex-end;
      justify-content:center;

      background:
        rgba(0,20,55,.55);

      backdrop-filter:
        blur(3px);
    }


    .mission-modal.show{
      display:flex;
    }


    /* =====================================================
       MODAL PANEL
    ====================================================== */

    .mission-panel{
      width:min(
        100%,
        720px
      );

      max-height:88vh;

      overflow-y:auto;

      border-radius:
        28px 28px 0 0;

      background:#f5f9ff;

      box-shadow:
        0 -10px 40px
        rgba(0,35,90,.25);

      padding:
        0
        14px
        max(
          24px,
          env(safe-area-inset-bottom)
        );

      animation:
        missionPanelUp
        .25s ease;
    }


    @keyframes missionPanelUp{

      from{
        transform:
          translateY(100%);
      }

      to{
        transform:
          translateY(0);
      }

    }


    /* =====================================================
       PANEL HEADER
    ====================================================== */

    .mission-panel-header{
      position:sticky;

      top:0;

      z-index:20;

      display:flex;

      align-items:center;

      gap:12px;

      padding:
        18px
        4px
        14px;

      background:
        rgba(245,249,255,.97);

      backdrop-filter:
        blur(8px);
    }


    .mission-panel-icon{
      width:54px;
      height:54px;

      flex:0 0 54px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:18px;

      font-size:28px;

      background:#e1edff;
    }


    .mission-panel-title-wrap{
      min-width:0;

      flex:1;
    }


    .mission-panel-title{
      margin:0;

      color:#073b93;

      font-size:
        clamp(
          20px,
          5vw,
          30px
        );

      font-weight:900;

      line-height:1.1;
    }


    .mission-panel-subtitle{
      margin-top:4px;

      color:#667895;

      font-size:
        clamp(
          11px,
          3vw,
          14px
        );

      font-weight:600;
    }


    .mission-close{
      width:42px;
      height:42px;

      flex:0 0 42px;

      display:flex;

      align-items:center;
      justify-content:center;

      border:0;

      border-radius:50%;

      background:#e7eef9;

      color:#173b78;

      font-size:24px;

      font-weight:900;

      cursor:pointer;
    }


    /* =====================================================
       CATEGORY SUMMARY
    ====================================================== */

    .category-summary{
      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:8px;

      margin-bottom:14px;
    }


    .summary-chip{
      min-width:0;

      padding:
        10px
        8px;

      border-radius:15px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 4px 14px
        rgba(20,60,110,.07);
    }


    .summary-chip-label{
      color:#6f7f9b;

      font-size:
        clamp(
          9px,
          2.5vw,
          12px
        );

      font-weight:700;
    }


    .summary-chip-value{
      margin-top:2px;

      color:#073b93;

      font-size:
        clamp(
          15px,
          4vw,
          21px
        );

      font-weight:900;
    }


    /* =====================================================
       MISSION LIST
    ====================================================== */

    #missionList{
      display:grid;

      gap:11px;
    }


    /* =====================================================
       MISSION ITEM
    ====================================================== */

    .mission-item{
      overflow:hidden;

      border:
        1px solid #dfe9f7;

      border-radius:20px;

      background:#fff;

      box-shadow:
        0 5px 16px
        rgba(20,60,110,.07);
    }


    .mission-item.complete{
      border-color:
        #9bddb5;

      background:
        linear-gradient(
          135deg,
          #f8fffa,
          #effcf4
        );
    }


    .mission-item.claimed{
      opacity:.65;
    }


    .mission-item-main{
      display:grid;

      grid-template-columns:
        50px
        minmax(0,1fr);

      gap:12px;

      padding:15px;
    }


    .mission-icon{
      width:50px;
      height:50px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:#eaf2ff;

      font-size:25px;
    }


    .mission-name{
      color:#082f73;

      font-size:
        clamp(
          14px,
          3.5vw,
          18px
        );

      font-weight:800;

      line-height:1.35;
    }


    .mission-description{
      margin-top:3px;

      color:#71809b;

      font-size:
        clamp(
          10px,
          2.7vw,
          13px
        );

      font-weight:500;

      line-height:1.4;
    }


    /* =====================================================
       MISSION PROGRESS
    ====================================================== */

    .mission-progress-row{
      display:flex;

      align-items:center;

      gap:10px;

      margin-top:10px;
    }


    .mission-progress-track{
      flex:1;

      height:9px;

      overflow:hidden;

      border-radius:999px;

      background:#dde8f6;
    }


    .mission-progress-fill{
      width:0%;
      height:100%;

      border-radius:inherit;

      background:
        linear-gradient(
          90deg,
          #087bf0,
          #10b7ff
        );

      transition:
        width .35s ease;
    }


    .mission-progress-text{
      min-width:48px;

      color:#073b93;

      font-size:
        clamp(
          10px,
          2.7vw,
          13px
        );

      font-weight:900;

      text-align:right;
    }


    /* =====================================================
       REWARD
    ====================================================== */

    .mission-bottom{
      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

      padding:
        10px
        15px
        14px;

      border-top:
        1px solid #edf2f9;
    }


    .reward-list{
      display:flex;

      align-items:center;

      flex-wrap:wrap;

      gap:6px;
    }


    .reward{
      display:inline-flex;

      align-items:center;

      gap:3px;

      padding:
        5px
        8px;

      border-radius:999px;

      background:#f0f5fc;

      color:#153a76;

      font-size:
        clamp(
          9px,
          2.5vw,
          12px
        );

      font-weight:800;
    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    .mission-actions{
      display:flex;

      align-items:center;

      gap:6px;

      flex-shrink:0;
    }


    .test-button,
    .claim-button{
      min-height:36px;

      padding:
        7px
        11px;

      border:0;

      border-radius:11px;

      font-size:
        clamp(
          9px,
          2.5vw,
          12px
        );

      font-weight:900;

      cursor:pointer;

      white-space:nowrap;
    }


    .test-button{
      color:#0755b7;

      background:#e2efff;
    }


    .claim-button{
      color:#fff;

      background:#06c755;
    }


    .claim-button:disabled{
      cursor:default;

      background:#c7d3e2;

      color:#6c7c92;
    }


    /* =====================================================
       RESET TEST
    ====================================================== */

    .mission-test-reset{
      width:100%;

      margin-top:14px;

      min-height:46px;

      border:
        1px solid #c9d8ec;

      border-radius:14px;

      background:#fff;

      color:#49617f;

      font-weight:800;

      cursor:pointer;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:480px){

      .mission-panel{
        border-radius:
          23px 23px 0 0;

        padding-left:10px;
        padding-right:10px;
      }


      .mission-panel-header{
        padding-top:14px;
      }


      .mission-panel-icon{
        width:46px;
        height:46px;

        flex-basis:46px;

        border-radius:14px;

        font-size:23px;
      }


      .mission-item-main{
        grid-template-columns:
          42px
          minmax(0,1fr);

        gap:10px;

        padding:12px;
      }


      .mission-icon{
        width:42px;
        height:42px;

        border-radius:13px;

        font-size:21px;
      }


      .mission-bottom{
        padding:
          9px
          12px
          12px;
      }

    }

  </style>

</head>

<!-- =========================================================

       CLICK WEEKLY
  ====================================================== -->

    type="button"
    class="
      mission-hotspot

    aria-label="Weekly Mission"
  ></button>


  <!-- =====================================================
       CLICK MONTHLY
  ====================================================== -->

  <button
    type="button"
    class="
      mission-hotspot

  ></button>

       CLICK BONUS
  ====================================================== -->

    type="button"
    class="
      mission-hotspot

  ></button>

       HOME BUTTON

  ====================================================== -->

  <button
    type="button"
    class="hotspot"
    style="
      left:1%;
      top:88%;
      width:31%;
      height:11%;
    "
    onclick="goHome()"
    aria-label="Home"
  ></button>


</div>


<!-- =========================================================
     MISSION MODAL
========================================================= -->

<div
  id="missionModal"
  class="mission-modal"
  onclick="modalBackdrop(event)"
>

  <section
    class="mission-panel"
  >


    <!-- HEADER -->

    <header
      class="mission-panel-header"
    >

      <div
        id="panelIcon"
        class="mission-panel-icon"
      >
        🎯
      </div>


      <div
        class="mission-panel-title-wrap"
      >

          DAILY MISSION
        </h2>

          ภารกิจประจำวัน

      </div>


      <button
        type="button"
        class="mission-close"
        onclick="closeMission()"
        aria-label="Close"
      >
        ×
      </button>

    </header>


    <!-- CATEGORY SUMMARY -->

    <section
      class="category-summary"
    >

      <div
        class="summary-chip"
      >

        <div
          class="summary-chip-label"
        >

        </div>

        <div
          id="summaryComplete"

          0
        </div>

      </div>


      <div
        class="summary-chip"

        <div

        </div>

        <div

          0

      </div>


      <div

        <div
          class="summary-chip-label"
        >
          %
        </div>

        <div
          id="summaryPercent"
          class="summary-chip-value"
        >
          0%
        </div>

      </div>

    </section>


    <!-- LIST -->

    <section
      id="missionList"
    ></section>


    <!-- TEST RESET -->

    <button
      type="button"
      class="mission-test-reset"
      onclick="resetMissionTest()"
    >
      รีเซ็ตข้อมูลภารกิจสำหรับ TEST
    </button>

  </section>

</div>


<!-- STATUS -->

<div id="status"></div>

/* =========================================================
   STORAGE
========================================================= */

function loadMissionState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){
      return {};
    }


    return (
      JSON.parse(raw) ||
      {}
    );


  }catch(error){

    console.warn(
      "MISSION STORAGE READ:",
      error
    );

    return {};
  }
}


function saveMissionState(
  state
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      state
    )
  );
}


/* =========================================================
   GET STATE
========================================================= */

function getMissionState(
  id
){

  const state =
    loadMissionState();


  return (
    state[id] ||
    {
      progress:0,
      claimed:false
    }
  );
}


/* =========================================================
   SET STATE
========================================================= */

function setMissionState(
  id,
  value
){

  const state =
    loadMissionState();


  state[id] = value;


  saveMissionState(
    state
  );
}


/* =========================================================
   FORMAT
========================================================= */

function formatNumber(
  value
){

  const n =
    Number(value);


  if(
    !Number.isFinite(n)
  ){
    return "0";
  }


  if(
    Number.isInteger(n)
  ){
    return String(n);
  }


  return n.toFixed(1);
}


/* =========================================================
   OPEN MISSION
========================================================= */

function openMission(
  category
){

  if(
    !missionConfig[category]
  ){
    return;
  }


  activeCategory =
    category;


  renderMissionPanel();


  document
    .getElementById(
      "missionModal"
    )
    .classList
    .add(
      "show"
    );


  document.body.style.overflow =
    "hidden";
}


/* =========================================================
   CLOSE
========================================================= */

function closeMission(){

  document
    .getElementById(
      "missionModal"
    )
    .classList
    .remove(
      "show"
    );


  document.body.style.overflow =
    "";
}


/* =========================================================
   BACKDROP
========================================================= */

function modalBackdrop(
  event
){

  if(
    event.target.id ===
    "missionModal"
  ){
    closeMission();
  }
}


/* =========================================================
   RENDER PANEL
========================================================= */

function renderMissionPanel(){

  const config =
    missionConfig[
      activeCategory
    ];


  document
    .getElementById(
      "panelIcon"
    )
    .textContent =
      config.icon;


  document
    .getElementById(
      "panelTitle"
    )
    .textContent =
      config.title;


  document
    .getElementById(
      "panelSubtitle"
    )
    .textContent =
      config.subtitle;


  const container =
    document
      .getElementById(
        "missionList"
      );


  container.innerHTML =
    "";


  let completed =
    0;


  config.missions
    .forEach(
      mission => {


        const state =
          getMissionState(
            mission.id
          );


        const progress =
          Math.max(
            0,
            Math.min(
              mission.target,
              Number(
                state.progress
              ) || 0
            )
          );


        const isComplete =
          progress >=
          mission.target;


        if(isComplete){
          completed++;
        }


        const percent =
          mission.target > 0

            ? Math.min(
                100,
                (
                  progress /
                  mission.target
                ) * 100
              )

            : 0;


        const item =
          document.createElement(
            "article"
          );


        item.className =
          "mission-item";


        if(isComplete){
          item.classList.add(
            "complete"
          );
        }


        if(state.claimed){
          item.classList.add(
            "claimed"
          );
        }


        item.innerHTML = `

          <div class="mission-item-main">

            <div class="mission-icon">
              ${mission.icon}
            </div>


            <div>

              <div class="mission-name">
                ${mission.name}
              </div>


              <div class="mission-description">
                ${mission.description}
              </div>


              <div class="mission-progress-row">

                <div class="mission-progress-track">

                  <div
                    class="mission-progress-fill"
                    style="
                      width:${percent}%;
                    "
                  ></div>

                </div>


                <div class="mission-progress-text">

                  ${formatNumber(progress)}
                  /
                  ${formatNumber(mission.target)}

                </div>

              </div>

            </div>

          </div>


          <div class="mission-bottom">

            <div class="reward-list">

              <span class="reward">
                🪙 +${mission.reward.coin}
              </span>

              <span class="reward">
                ⚡ +${mission.reward.energy}
              </span>

              <span class="reward">
                ⭐ +${mission.reward.exp}
              </span>

            </div>


            <div class="mission-actions">

              <button
                type="button"
                class="test-button"
                onclick="
                  addMissionTest(
                    '${mission.id}'
                  )
                "
              >
                + TEST
              </button>


              <button
                type="button"
                class="claim-button"
                onclick="
                  claimMission(
                    '${mission.id}'
                  )
                "
                ${
                  !isComplete ||
                  state.claimed
                    ? "disabled"
                    : ""
                }
              >

                ${
                  state.claimed
                    ? "รับแล้ว"
                    : "รับรางวัล"
                }

              </button>

            </div>

          </div>

        `;


        container.appendChild(
          item
        );

      }
    );


  document
    .getElementById(
      "summaryComplete"
    )
    .textContent =
      completed;


  document
    .getElementById(
      "summaryTotal"
    )
    .textContent =
      config.missions.length;


  const percent =
    config.missions.length > 0

      ? Math.round(
          (
            completed /
            config.missions.length
          ) * 100
        )

      : 0;


  document
    .getElementById(
      "summaryPercent"
    )
    .textContent =
      `${percent}%`;


  updateMissionStage();
}


/* =========================================================
   TEST PROGRESS
========================================================= */

function addMissionTest(
  id
){

  const mission =
    findMission(
      id
    );


  if(!mission){
    return;
  }


  const state =
    getMissionState(
      id
    );


  if(state.claimed){
    return;
  }


  const step =
    Number(
      mission.step ??
      1
    );


  state.progress =
    Math.min(
      mission.target,
      (
        Number(
          state.progress
        ) || 0
      ) + step
    );


  setMissionState(
    id,
    state
  );


  renderMissionPanel();
}


/* =========================================================
   FIND MISSION
========================================================= */

function findMission(
  id
){

  for(
    const category
    of Object.values(
      missionConfig
    )
  ){

    const mission =
      category.missions
        .find(
          item =>
            item.id === id
        );


    if(mission){
      return mission;
    }

  }


  return null;
}


/* =========================================================
   CLAIM
========================================================= */

function claimMission(
  id
){

  const mission =
    findMission(
      id
    );


  if(!mission){
    return;
  }


  const state =
    getMissionState(
      id
    );


  if(
    state.claimed ||
    Number(
      state.progress
    ) <
    mission.target
  ){
    return;
  }


  state.claimed =
    true;


  setMissionState(
    id,
    state
  );


  /*
    TEST MODE

    ตอนต่อ Supabase จริง
    ตรงนี้จะส่ง:
      rock_coin
      energy
      exp
  */


  renderMissionPanel();


  showStatus(
    `รับรางวัล ${mission.name} สำเร็จ`
  );
}


/* =========================================================
   CATEGORY PROGRESS
========================================================= */

function categoryProgress(
  category
){

  const config =
    missionConfig[
      category
    ];


  let complete =
    0;


  config.missions
    .forEach(
      mission => {

        const state =
          getMissionState(
            mission.id
          );


        if(
          Number(
            state.progress
          ) >=
          mission.target
        ){
          complete++;
        }

      }
    );


  const total =
    config.missions.length;


  const percent =
    total > 0

      ? (
          complete /
          total
        ) * 100

      : 0;


  return {
    complete,
    total,
    percent
  };
}


/* =========================================================

========================================================= */

  const daily =

  const weekly =

  const monthly =

      `${weekly.complete} / ${weekly.total}`;


  document
    .getElementById(
      "weeklyProgress"
    )
    .style.width =
      `${weekly.percent}%`;


  /* MONTHLY */

      "monthlyCount"
    )

      `${monthly.complete} / ${monthly.total}`;


  document
    .getElementById(
      "monthlyProgress"
    )
    .style.width =
      `${monthly.percent}%`;


  /* BONUS */

      `${bonus.complete} / ${bonus.total}`;


  document
    .getElementById(

}

========================================================= */

function resetMissionTest(){

  const ok =
    confirm(
      "รีเซ็ตความคืบหน้าภารกิจสำหรับการทดสอบ?"
    );


  if(!ok){
    return;
  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  renderMissionPanel();

  updateMissionStage();
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message
){

  const el =
    document
      .getElementById(
        "status"
      );


  if(!el){
    return;
  }


  el.textContent =
    message;


  el.className =
    "show";


  setTimeout(
    () => {

      el.className =
        "";

    },
    2200
  );
}

/* =========================================================
   LOAD USER DATA
========================================================= */

async function loadMissionUser(){

  try{

    const raw =
      await ROCK.fetchDashboard();


    const coin =
      Number(
        raw?.rockCoin ??
        raw?.rock_coin ??
        0
      );


    const energy =
      Number(
        raw?.energy?.current ??
        raw?.energy ??
        0
      );


    const maxEnergy =
      Number(
        raw?.energy?.max ??
        ROCK.CFG.MAX_ENERGY ??
        200
      );


    document
      .getElementById(
        "missionCoin"
      )
      .textContent =
        ROCK.fmtInt(
          coin
        );


    document
      .getElementById(
        "missionEnergy"
      )
      .textContent =
        `${ROCK.fmtInt(energy)} / ${ROCK.fmtInt(maxEnergy)}`;


  }catch(error){

    console.error(
      "MISSION USER ERROR:",
      error
    );

  }
}


/* =========================================================
   START
========================================================= */

async function startMission(){

  try{

    if(!ROCK){

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );

    }


    const ready =
      await ROCK.initLiff();


    if(!ready){
      return;
    }


    updateMissionStage();


    await loadMissionUser();


  }catch(error){

    console.error(
      "MISSION START ERROR:",
      error
    );


    showStatus(
      error?.message ||
      String(error)
    );

  }
}


startMission();
