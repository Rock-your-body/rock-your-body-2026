  <!-- =====================================================

  ====================================================== -->

  <link
    rel="stylesheet"
    href="./base.css?v=20260823-30"
  >


  <style>

    /* =====================================================
       MISSION CLICK AREA - FIX CURRENT TEMPLATE
    ====================================================== */

    .mission-card-button{
      position:absolute;
      z-index:500;
      display:block;
      margin:0;
      padding:0;
      border:0;
      background:rgba(0,0,0,0);
      cursor:pointer;
      pointer-events:auto;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .mission-card-button.daily{
      left:2.8%;
      top:38.4%;
      width:28.8%;
      height:5.5%;
    }

    .mission-card-button.weekly{
      left:35.0%;
      top:38.4%;
      width:29.8%;
      height:5.5%;
    }

    .mission-card-button.monthly{
      left:67.4%;
      top:38.4%;
      width:31.0%;
      height:5.5%;
    }

    .mission-card-button.bonus{
      left:2.8%;
      top:67.5%;
      width:28.8%;
      height:5.5%;
    }

    /* =====================================================
       MODAL
    ====================================================== */

    .mission-modal{

      position:fixed;

      inset:0;

      z-index:99999;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,25,65,.62);

      backdrop-filter:
        blur(3px);

    }


    .mission-modal.show{

      display:flex;

    }


    /* =====================================================
       PANEL
    ====================================================== */

    .mission-panel{

      width:min(
        100%,
        760px
      );

      max-height:92vh;

      overflow-y:auto;

      padding:
        0
        14px
        max(
          26px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        28px 28px 0 0;

      background:#f3f8ff;

      box-shadow:
        0 -12px 40px
        rgba(0,35,90,.30);

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .panel-header{

      position:sticky;

      top:0;

      z-index:30;

      display:flex;

      align-items:center;

      gap:12px;

      padding:
        16px
        2px
        14px;

      background:
        rgba(243,248,255,.97);

      backdrop-filter:
        blur(10px);

    }


    .panel-icon{

      width:52px;
      height:52px;

      flex:
        0 0 52px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:17px;

      background:#dcecff;

      font-size:27px;

    }


    .panel-title-wrap{

      flex:1;

      min-width:0;

    }


    .panel-title{

      margin:0;

      color:#073b93;

      font-size:
        clamp(
          20px,
          5vw,
          29px
        );

      font-weight:900;

      line-height:1.1;

    }


    .panel-subtitle{

      margin-top:4px;

      color:#687c9b;

      font-size:
        clamp(
          11px,
          2.8vw,
          14px
        );

      font-weight:600;

    }


    .panel-close{

      width:42px;
      height:42px;

      flex:
        0 0 42px;

      border:0;

      border-radius:50%;

      background:#e0e9f6;

      color:#153d79;

      font-size:25px;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       CATEGORY INFO
    ====================================================== */

    .category-info{

      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:8px;

      margin-bottom:14px;

    }


    .category-stat{

      padding:
        10px
        5px;

      border-radius:15px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 4px 14px
        rgba(20,60,110,.07);

    }


    .category-stat-label{

      color:#74839c;

      font-size:11px;

      font-weight:700;

    }


    .category-stat-value{

      margin-top:2px;

      color:#073b93;

      font-size:
        clamp(
          16px,
          4vw,
          22px
        );

      font-weight:900;

    }


    /* =====================================================
       SECTION TITLE
    ====================================================== */

    .mission-section-title{

      margin:
        18px
        2px
        8px;

      color:#073b93;

      font-size:16px;

      font-weight:900;

    }


    /* =====================================================
       MISSION LIST
    ====================================================== */

    .mission-list{

      display:grid;

      gap:11px;

    }


    /* =====================================================
       MISSION ITEM
    ====================================================== */

    .mission-item{

      overflow:hidden;

      border:
        1px solid #dce7f5;

      border-radius:20px;

      background:#fff;

      box-shadow:
        0 5px 16px
        rgba(20,60,110,.07);

    }


    .mission-item.pending{

      border-color:#ffd574;

      background:#fffdf6;

    }


    .mission-item.approved{

      border-color:#87d6a5;

      background:#f4fff8;

    }


    .mission-item.rejected{

      border-color:#ef9b9b;

      background:#fff7f7;

    }


    .mission-main{

      display:grid;

      grid-template-columns:
        50px
        minmax(0,1fr);

      gap:12px;

      padding:14px;

    }


    .mission-icon{

      width:50px;
      height:50px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:#e6f0ff;

      font-size:25px;

    }


    .mission-name{

      color:#082f73;

      font-size:
        clamp(
          14px,
          3.4vw,
          18px
        );

      font-weight:900;

      line-height:1.3;

    }


    .mission-description{

      margin-top:4px;

      color:#6f809d;

      font-size:
        clamp(
          10px,
          2.6vw,
          13px
        );

      font-weight:500;

      line-height:1.45;

    }


    /* =====================================================
       REWARD
    ====================================================== */

    .reward-row{

      display:flex;

      flex-wrap:wrap;

      gap:5px;

      margin-top:9px;

    }


    .reward-badge{

      display:inline-flex;

      align-items:center;

      gap:3px;

      padding:
        4px
        7px;

      border-radius:999px;

      background:#edf4fd;

      color:#173d78;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    /* =====================================================
       STATUS BADGE
    ====================================================== */

    .mission-status-row{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

      margin-top:9px;

    }


    .status-badge{

      display:inline-flex;

      align-items:center;

      min-height:25px;

      padding:
        4px
        9px;

      border-radius:999px;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    .status-not-submitted{

      color:#60718d;

      background:#edf2f8;

    }


    .status-pending{

      color:#996200;

      background:#fff1bd;

    }


    .status-approved{

      color:#08733a;

      background:#dff8e9;

    }


    .status-rejected{

      color:#a51c1c;

      background:#ffe1e1;

    }


    /* =====================================================
       SUBMIT BUTTON
    ====================================================== */

    .mission-submit-button{

      min-height:37px;

      padding:
        7px
        12px;

      border:0;

      border-radius:12px;

      color:#fff;

      background:#0878e8;

      font-size:
        clamp(
          10px,
          2.4vw,
          13px
        );

      font-weight:900;

      cursor:pointer;

      white-space:nowrap;

    }


    .mission-submit-button:disabled{

      cursor:default;

      background:#bdc9d8;

    }


    /* =====================================================
       EVIDENCE MODAL
    ====================================================== */

    .evidence-modal{

      position:fixed;

      inset:0;

      z-index:100000;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,20,55,.68);

    }


    .evidence-modal.show{

      display:flex;

    }


    .evidence-panel{

      width:min(
        100%,
        650px
      );

      max-height:90vh;

      overflow-y:auto;

      padding:
        18px
        16px
        max(
          25px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        26px 26px 0 0;

      background:#fff;

    }


    .evidence-header{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

    }


    .evidence-title{

      color:#073b93;

      font-size:
        clamp(
          19px,
          4.8vw,
          27px
        );

      font-weight:900;

    }


    .evidence-close{

      width:40px;
      height:40px;

      border:0;

      border-radius:50%;

      background:#e7eef7;

      color:#173b78;

      font-size:23px;

      cursor:pointer;

    }


    .evidence-mission-name{

      margin-top:7px;

      color:#183f7e;

      font-size:15px;

      font-weight:800;

    }


    .form-group{

      margin-top:16px;

    }


    .form-label{

      display:block;

      margin-bottom:6px;

      color:#324f7d;

      font-size:13px;

      font-weight:800;

    }


    .form-note{

      margin-top:5px;

      color:#7d899b;

      font-size:11px;

      line-height:1.4;

    }


    .evidence-input,
    .evidence-textarea{

      width:100%;

      border:
        1px solid #cbd9eb;

      border-radius:13px;

      background:#f9fbfe;

      color:#17365f;

    }


    .evidence-input{

      min-height:48px;

      padding:
        10px
        12px;

    }


    .evidence-textarea{

      min-height:90px;

      padding:12px;

      resize:vertical;

    }


    .file-input{

      width:100%;

      padding:12px;

      border:
        1px dashed #95b5dc;

      border-radius:14px;

      background:#f4f9ff;

    }


    .submit-evidence-button{

      width:100%;

      min-height:52px;

      margin-top:18px;

      border:0;

      border-radius:15px;

      background:#06c755;

      color:#fff;

      font-size:16px;

      font-weight:900;

      cursor:pointer;

    }


    .submit-evidence-button:disabled{

      background:#b7c4d3;

    }


    /* =====================================================
       APPROVED MESSAGE
    ====================================================== */

    .success-modal{

      position:fixed;

      inset:0;

      z-index:100001;

      display:none;

      align-items:center;

      justify-content:center;

      padding:18px;

      background:
        rgba(0,20,50,.68);

    }


    .success-modal.show{

      display:flex;

    }


    .success-card{

      width:min(
        100%,
        430px
      );

      padding:
        27px
        20px;

      border-radius:25px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 15px 50px
        rgba(0,25,70,.30);

    }


    .success-icon{

      font-size:55px;

    }


    .success-title{

      margin-top:10px;

      color:#07934b;

      font-size:25px;

      font-weight:900;

    }


    .success-name{

      margin-top:7px;

      color:#073b93;

      font-size:16px;

      font-weight:800;

    }


    .success-reward{

      margin-top:14px;

      padding:12px;

      border-radius:14px;

      background:#eef7ff;

      color:#173b78;

      font-weight:800;

      line-height:1.7;

    }


    .success-close{

      width:100%;

      min-height:47px;

      margin-top:17px;

      border:0;

      border-radius:13px;

      background:#0877e7;

      color:#fff;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       TOP MESSAGE
    ====================================================== */

    #missionStatus{

      position:fixed;

      z-index:120000;

      left:50%;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      display:none;

      max-width:90vw;

      padding:
        10px
        16px;

      border-radius:999px;

      background:#0755b7;

      color:#fff;

      font-size:13px;

      font-weight:800;

      text-align:center;

    }


    #missionStatus.show{

      display:block;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:480px){

      .mission-panel{

        border-radius:
          22px 22px 0 0;

        padding-left:10px;
        padding-right:10px;

      }


      .mission-main{

        grid-template-columns:
          42px
          minmax(0,1fr);

        padding:12px;

        gap:9px;

      }


      .mission-icon{

        width:42px;
        height:42px;

        border-radius:13px;

        font-size:21px;

      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     MISSION STAGE
========================================================= -->

<div
  id="missionStage"
  class="stage"
>


  <!-- TEMPLATE -->

  <img
    class="template"
    src="./mission-template.png?v=20260829-mission-click-fix-01"
    alt=""
    draggable="false"
  >


  <!-- TOP COIN -->

  <div
    id="missionCoin"
    class="
      overlay
      mission-coin-box
      live-blue
    "
  >
    0
  </div>


  <!-- TOP ENERGY -->

  <div
    id="missionEnergy"
    class="
      overlay
      mission-energy-box
      live-blue
    "
  >
    0 / 200
  </div>


  <!-- =====================================================
       DAILY
  ====================================================== -->

  <div
    class="
      live-track
      daily-track
    "
  >

    <div
      id="dailyProgress"
      class="
        live-fill
        mission-fill-daily
      "
    ></div>

  </div>


  <div
    id="dailyCount"
    class="daily-count"
  >
    0 / 4
  </div>


  <!-- =====================================================
       WEEKLY
  ====================================================== -->

  <div
    class="
      live-track
      weekly-track
    "
  >

    <div
      id="weeklyProgress"
      class="
        live-fill
        mission-fill-weekly
      "
    ></div>

  </div>


  <div
    id="weeklyCount"
    class="weekly-count"
  >
    0 / 6
  </div>


  <!-- =====================================================
       MONTHLY
  ====================================================== -->

  <div
    class="
      live-track
      monthly-track
    "
  >

    <div
      id="monthlyProgress"
      class="
        live-fill
        mission-fill-monthly
      "
    ></div>

  </div>


  <div
    id="monthlyCount"
    class="monthly-count"
  >
    0 / 1
  </div>


  <!-- =====================================================
       BONUS
  ====================================================== -->

  <div
    class="
      live-track
      bonus-track
    "
  >

    <div
      id="bonusProgress"
      class="
        live-fill
        mission-fill-bonus
      "
    ></div>

  </div>


  <div
    id="bonusCount"
    class="bonus-count"
  >
    0 / 9
  </div>


  <!-- =====================================================
       CLICK AREAS
  ====================================================== -->

  <button
    type="button"
    class="
      mission-card-button
      daily
    "
    onclick="openCategory('daily')"
    aria-label="Daily Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      weekly
    "
    onclick="openCategory('weekly')"
    aria-label="Weekly Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      monthly
    "
    onclick="openCategory('monthly')"
    aria-label="Monthly Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      bonus
    "
    onclick="openCategory('bonus')"
    aria-label="Bonus Mission"
  ></button>


  <!-- =====================================================
       BOTTOM NAVIGATION HOTSPOTS
       กดตรงปุ่ม HOME / MISSION / BATTLE บน Template ได้จริง
  ====================================================== -->

  <!-- HOME -->
  <button
    type="button"
    class="hotspot"
    style="
      left:1%;
      top:88%;
      width:31%;
      height:11%;
    "
    onclick="goHome()"
    aria-label="Home"
  ></button>


  <!-- MISSION -->
  <button
    type="button"
    class="hotspot"
    style="
      left:33%;
      top:88%;
      width:32%;
      height:11%;
    "
    onclick="openCategory('daily')"
    aria-label="Mission"
  ></button>


  <!-- BATTLE -->
  <button
    type="button"
    class="hotspot"
    style="
      left:66%;
      top:88%;
      width:33%;
      height:11%;
    "
    onclick="goBattle()"
    aria-label="Battle"
  ></button>


</div>


<!-- =========================================================
     CATEGORY MODAL
========================================================= -->

<div
  id="missionModal"
  class="mission-modal"
  onclick="closeCategoryBackdrop(event)"
>

  <section
    class="mission-panel"
  >

    <header
      class="panel-header"
    >

      <div
        id="panelIcon"
        class="panel-icon"
      >
        🎯
      </div>


      <div
        class="panel-title-wrap"
      >

        <h2
          id="panelTitle"
          class="panel-title"
        >
          MISSION
        </h2>


        <div
          id="panelSubtitle"
          class="panel-subtitle"
        >
        </div>

      </div>


      <button
        type="button"
        class="panel-close"
        onclick="closeCategory()"
      >
        ×
      </button>

    </header>


    <section
      class="category-info"
    >

      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          อนุมัติแล้ว
        </div>

        <div
          id="statApproved"
          class="category-stat-value"
        >
          0
        </div>

      </div>


      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          ทั้งหมด
        </div>

        <div
          id="statTotal"
          class="category-stat-value"
        >
          0
        </div>

      </div>


      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          ความสำเร็จ
        </div>

        <div
          id="statPercent"
          class="category-stat-value"
        >
          0%
        </div>

      </div>

    </section>


    <section
      id="missionList"
      class="mission-list"
    ></section>

  </section>

</div>


<!-- =========================================================
     EVIDENCE MODAL
========================================================= -->

<div
  id="evidenceModal"
  class="evidence-modal"
>

  <section
    class="evidence-panel"
  >

    <header
      class="evidence-header"
    >

      <div
        class="evidence-title"
      >
        ส่งหลักฐาน
      </div>


      <button
        type="button"
        class="evidence-close"
        onclick="closeEvidence()"
      >
        ×
      </button>

    </header>


    <div
      id="evidenceMissionName"
      class="evidence-mission-name"
    ></div>


    <!-- FILE -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        รูปภาพ / VDO
      </label>


      <input
        id="evidenceFile"
        class="file-input"
        type="file"
        accept="
          image/*,
          video/*
        "
      >


      <div
        class="form-note"
      >
        เลือกรูปหรือวิดีโอที่ใช้เป็นหลักฐานตามเงื่อนไขของภารกิจ
      </div>

    </div>


    <!-- LINK -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        Link
      </label>


      <input
        id="evidenceLink"
        class="evidence-input"
        type="url"
        placeholder="https://..."
      >

    </div>


    <!-- NOTE -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        รายละเอียดเพิ่มเติม
      </label>


      <textarea
        id="evidenceNote"
        class="evidence-textarea"
        placeholder="อธิบายกิจกรรมที่ทำ..."
      ></textarea>

    </div>


    <button
      id="submitEvidenceButton"
      type="button"
      class="submit-evidence-button"
        onclick="submitEvidence()"
    >
      ส่งหลักฐานให้ Admin ตรวจสอบ
    </button>


  </section>

</div>


<!-- =========================================================
     SUCCESS
========================================================= -->

<div
  id="successModal"
  class="success-modal"
>

  <section
    class="success-card"
  >

    <div
      class="success-icon"
    >
      🎉
    </div>


    <div
      class="success-title"
    >
      ภารกิจสำเร็จ!
    </div>


    <div
      id="successMissionName"
      class="success-name"
    ></div>


    <div
      id="successReward"
      class="success-reward"
    ></div>


    <button
      type="button"
      class="success-close"
      onclick="closeSuccess()"

      String(
        today.getFullYear()
      ) +
      String(
        today.getMonth() + 1
      ).padStart(2,"0") +
      String(
        today.getDate()
      ).padStart(2,"0")

    seed %
    dailyExtraPool.length;


  return dailyExtraPool[
    index

/* =========================================================
   LOCAL TEST STORAGE
========================================================= */

function readLocal(){

  try{

    return JSON.parse(
      localStorage.getItem(
        LOCAL_KEY
      ) ||
      "{}"
    );

  }catch{

    return {};

  }

}


function writeLocal(
  value
){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(
      value
    )
  );

}


/* =========================================================
   STATUS
========================================================= */

function getMissionStatus(
  id
){

  const local =
    readLocal();


  return (
    local[id] ||
    {
      status:
        "not_submitted",

      approvedNotified:
        false
    }
  );

}


/* =========================================================
   FIND MISSION
========================================================= */

function findMission(
  id
){

  for(
    const categoryName
    of Object.keys(
      missionData
    )
  ){

    const config =
      missionData[
        categoryName
      ];


    const missions =
      Array.isArray(
        config.missions
      )
        ? config.missions
        : config.missions;


    const found =
      missions.find(
        item =>
          item.id === id
      );


    if(found){
      return found;
    }

  }


  return null;

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategoryMissions(
  category
){

  return (
    missionData[
      category
    ]?.missions ||
    []
  );

}


/* =========================================================
   OPEN CATEGORY
========================================================= */

function openCategory(
  category
){

  if(
    !missionData[
      category
    ]
  ){
    return;
  }


  activeCategory =
    category;


  renderCategory();


  document
    .getElementById(
      "missionModal"
    )
    .classList
    .add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE CATEGORY
========================================================= */

function closeCategory(){

  document
    .getElementById(
      "missionModal"
    )
    .classList
    .remove(
      "show"
    );


  document.body.style.overflow =
    "";

}


function closeCategoryBackdrop(
  event
){

  if(
    event.target.id ===
    "missionModal"
  ){

    closeCategory();

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderCategory(){

  const config =
    missionData[
      activeCategory
    ];


  const missions =
    getCategoryMissions(
      activeCategory
    );


  document
    .getElementById(
      "panelIcon"
    )
    .textContent =
      config.icon;


  document
    .getElementById(
      "panelTitle"
    )
    .textContent =
      config.title;


  document
    .getElementById(
      "panelSubtitle"
    )
    .textContent =
      config.subtitle;


  const list =
    document
      .getElementById(
        "missionList"
      );


  list.innerHTML =
    "";


  let approvedCount =
    0;


  let lastSection =
    "";


  missions.forEach(
    mission => {


      const state =
        getMissionStatus(
          mission.id
        );


      if(
        state.status ===
        "approved"
      ){

        approvedCount++;

      }


      if(
        mission.section &&
        mission.section !==
        lastSection
      ){

        lastSection =
          mission.section;


        const section =
          document
            .createElement(
              "div"
            );


        section.className =
          "mission-section-title";


        section.textContent =
          mission.section;


        list.appendChild(
          section
        );

      }


      const item =
        document
          .createElement(
            "article"
          );


      item.className =
        `mission-item ${state.status}`;


      let statusText =
        "ยังไม่ได้ส่งหลักฐาน";


      let statusClass =
        "status-not-submitted";


      if(
        state.status ===
        "pending"
      ){

        statusText =
          "⏳ รอ Admin ตรวจสอบ";

        statusClass =
          "status-pending";

      }


      if(
        state.status ===
        "approved"
      ){

        statusText =
          "✅ Admin อนุมัติแล้ว";

        statusClass =
          "status-approved";

      }


      if(
        state.status ===
        "rejected"
      ){

        statusText =
          "❌ ไม่ผ่าน กรุณาส่งใหม่";

        statusClass =
          "status-rejected";

      }


      if(
        mission.auto
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ สำเร็จแล้ว"
            : "ตรวจสำเร็จอัตโนมัติ";

      }


      if(
        mission.adminOnly
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ Admin มอบ Bonus แล้ว"
            : "รอการคัดเลือกจาก Admin";

      }


      const canSubmit =

        !mission.auto &&
        !mission.adminOnly &&
        state.status !==
          "pending" &&
        state.status !==
          "approved";


      item.innerHTML = `

        <div class="mission-main">

          <div class="mission-icon">
            ${mission.icon}
          </div>


          <div>

            <div class="mission-name">
              ${mission.name}
            </div>


            <div class="mission-description">
              ${mission.description}
            </div>


            <div class="reward-row">

              <span class="reward-badge">
                ⭐ +${mission.reward.coin}
                ROCK COIN
              </span>


              <span class="reward-badge">
                ⚡ +${mission.reward.energy}
                ENERGY
              </span>


              <span class="reward-badge">
                🏆 +${mission.reward.exp}
                EXP
              </span>

            </div>


            <div class="mission-status-row">

              <span
                class="
                  status-badge
                  ${statusClass}
                "
              >
                ${statusText}
              </span>


              ${
                canSubmit
                  ? `

                    <button
                      type="button"
                      class="mission-submit-button"
                      onclick="
                        openEvidence(
                          '${mission.id}'
                        )
                      "
                    >
                      ส่งหลักฐาน
                    </button>

                  `
                  : ""
              }

            </div>

          </div>

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );


  const total =
    missions.length;


  const percent =
    total > 0

      ? Math.round(
          (
            approvedCount /
            total
          ) * 100
        )

      : 0;


  document
    .getElementById(
      "statApproved"
    )
    .textContent =
      approvedCount;


  document
    .getElementById(
      "statTotal"
    )
    .textContent =
      total;


  document
    .getElementById(
      "statPercent"
    )
    .textContent =
      `${percent}%`;


  updateTemplate();

}

/* =========================================================
   SUBMIT EVIDENCE
========================================================= */
async function submitEvidence(){
  const mission = findMission(activeMissionId);
  if(!mission){ showMissionStatus('ไม่พบข้อมูลภารกิจ'); return; }

  const fileInput = document.getElementById('evidenceFile');
  const linkInput = document.getElementById('evidenceLink');
  const noteInput = document.getElementById('evidenceNote');
  const button = document.getElementById('submitEvidenceButton');
  const file = fileInput?.files?.[0] || null;
  const link = linkInput?.value?.trim() || '';
  const note = noteInput?.value?.trim() || '';

  if(mission.requireLink && !link){ showMissionStatus('กรุณาใส่ Link TikTok'); return; }
  if(!file && !link){ showMissionStatus('กรุณาเลือกรูป / VDO หรือใส่ Link'); return; }
  if(!MISSION_API){ showMissionStatus('ไม่พบ MISSION API'); return; }
  if(!button){ return; }
  if(file && file.size > 50 * 1024 * 1024){ showMissionStatus('ไฟล์ต้องมีขนาดไม่เกิน 50 MB'); return; }

  button.disabled = true;
  button.textContent = 'กำลังส่งหลักฐาน...';

  try{
    const idToken = ROCK?.getIdToken?.() || window.liff?.getIDToken?.();
    if(!idToken) throw new Error('ไม่พบ LINE ID Token');

    const form = new FormData();
    form.append('action','submitEvidence');
    form.append('idToken',idToken);
    form.append('missionId',String(mission.id));
    form.append('category',String(activeCategory));
    form.append('note',note);
    form.append('link',link);
    if(file) form.append('file',file,file.name);

    const response = await fetch(MISSION_API,{method:'POST',body:form});
    const raw = await response.text();
    let result = {};
    try{ result = raw ? JSON.parse(raw) : {}; }
    catch{ throw new Error(`Server ตอบกลับไม่ถูกต้อง HTTP ${response.status}`); }

    if(!response.ok || result?.success === false){
      throw new Error(result?.error || result?.message || result?.details || `HTTP ${response.status}`);
    }

    const local = readLocal();
    local[mission.id] = {
      ...local[mission.id], status:'pending', submittedAt:new Date().toISOString(),
      fileName:file?.name || '', link, note, approvedNotified:false
    };
    writeLocal(local);
    closeEvidence();
    updateTemplate();
    if(document.getElementById('missionModal')?.classList.contains('show')) renderCategory();
    showMissionStatus('✅ ส่งหลักฐานแล้ว รอ Admin ตรวจสอบ');
    await refreshMissionStatus();
  }catch(error){
    console.error('MISSION SUBMIT ERROR:',error);
    showMissionStatus('ERROR: ' + (error?.message || String(error) || 'UNKNOWN ERROR'));
  }finally{
    button.disabled = false;
    button.textContent = 'ส่งหลักฐานให้ Admin ตรวจสอบ';
  }
}

/* =========================================================
   LOAD STATUS FROM API
========================================================= */
async function refreshMissionStatus(){
  if(!MISSION_API){ updateTemplate(); return null; }
  try{
    const idToken = ROCK?.getIdToken?.() || window.liff?.getIDToken?.();
    if(!idToken) return null;

    const response = await fetch(MISSION_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'myMissionStatus',idToken})
    });
    const raw = await response.text();
    let result = {};
    try{ result = raw ? JSON.parse(raw) : {}; }
    catch{ throw new Error(`Mission Status JSON ไม่ถูกต้อง HTTP ${response.status}`); }
    if(!response.ok || result?.success === false){
      throw new Error(result?.error || result?.message || `HTTP ${response.status}`);
    }

    const local = readLocal();
    const submissions = Array.isArray(result?.submissions) ? result.submissions : [];
    submissions.forEach(item=>{
      const missionId = item?.mission_id || item?.missionId;
      if(!missionId) return;
      const old = local[missionId] || {};
      local[missionId] = {
        ...old,
        status:item?.status || 'pending',
        approvedAt:item?.approved_at || item?.approvedAt || null,
        reviewedAt:item?.reviewed_at || item?.reviewedAt || null,
        rejectReason:item?.reject_reason || item?.rejected_reason || item?.rejectReason || '',
        rewardGranted:item?.reward_granted === true,
        submittedAt:item?.submitted_at || item?.submittedAt || old?.submittedAt || null
      };
    });
    writeLocal(local);
    updateTemplate();
    checkApprovedMessage();
    if(document.getElementById('missionModal')?.classList.contains('show')) renderCategory();
    return result;
  }catch(error){
    console.error('MISSION STATUS ERROR:',error);
    return null;
  }
}

/* =========================================================
   MAIN PROGRESS
========================================================= */
function countApprovedMission(category){
  return getCategoryMissions(category).filter(m=>getMissionStatus(m.id)?.status === 'approved').length;
}

function updateTemplate(){
  ['daily','weekly','monthly','bonus'].forEach(category=>{
    const total = getCategoryMissions(category).length;
    const approved = countApprovedMission(category);
    const count = document.getElementById(`${category}Count`);
    const progress = document.getElementById(`${category}Progress`);
    if(count) count.textContent = `${approved} / ${total}`;
    if(progress) progress.style.width = `${total ? Math.min(100,(approved/total)*100) : 0}%`;
  });
}

/* =========================================================
   SUCCESS MODAL
========================================================= */
function checkApprovedMessage(){
  const local = readLocal();
  for(const category of Object.keys(missionData)){
    for(const mission of getCategoryMissions(category)){
      const state = local[mission.id];
      if(!state || state.status !== 'approved' || state.approvedNotified === true) continue;
      const name = document.getElementById('successMissionName');
      const reward = document.getElementById('successReward');
      if(name) name.textContent = mission.name;
      if(reward) reward.innerHTML = `⭐ +${mission.reward.coin} ROCK COIN<br>⚡ +${mission.reward.energy} ENERGY<br>🏆 +${mission.reward.exp} EXP`;
      document.getElementById('successModal')?.classList.add('show');
      local[mission.id] = {...state,approvedNotified:true};
      writeLocal(local);
      return;
    }
  }
}
function closeSuccess(){ document.getElementById('successModal')?.classList.remove('show'); }

/* =========================================================
   STATUS MESSAGE
========================================================= */
let missionStatusTimer = null;
function showMissionStatus(message){
  const el = document.getElementById('missionStatus');
  if(!el){ console.log(message); return; }
  el.textContent = String(message || '');
  el.classList.add('show');
  if(missionStatusTimer) clearTimeout(missionStatusTimer);
  missionStatusTimer = setTimeout(()=>el.classList.remove('show'),3500);
}

/* =========================================================
   DASHBOARD / COIN / ENERGY
========================================================= */
function applyMissionDashboard(raw){
  const d = raw?.data || raw?.dashboard || raw;
  if(!d) return;
  const coin = Number(d?.rockCoin ?? d?.rock_coin ?? d?.coin ?? 0) || 0;
  const current = Number(d?.energy?.current ?? d?.currentEnergy ?? d?.current_energy ?? d?.energy ?? 0) || 0;
  const max = Number(d?.energy?.max ?? d?.maxEnergy ?? d?.max_energy ?? window.APP_CONFIG?.MAX_ENERGY ?? 200) || 200;
  const coinEl = document.getElementById('missionCoin');
  const energyEl = document.getElementById('missionEnergy');
  if(coinEl) coinEl.textContent = coin.toLocaleString('en-US');
  if(energyEl) energyEl.textContent = `${current.toLocaleString('en-US')} / ${max.toLocaleString('en-US')}`;
}

async function loadMissionDashboard(){
  try{
    let data = null;
    if(typeof ROCK?.dashboard === 'function') data = await ROCK.dashboard();
    else if(typeof ROCK?.fetchDashboard === 'function') data = await ROCK.fetchDashboard();
    else if(typeof ROCK?.getDashboard === 'function') data = await ROCK.getDashboard();
    if(data) applyMissionDashboard(data);
    return data;
  }catch(error){
    console.error('MISSION DASHBOARD ERROR:',error);
    return null;
  }
}

/* =========================================================
   NAVIGATION
========================================================= */
function goHome(){

  const url =
    window.APP_CONFIG?.PAGE?.HOME ||
    "./dashboard.html";

  /*
    ใช้ location.href ตรง ๆ
    ไม่ส่งคำว่า "HOME" เข้า ROCK.go()
    เพราะ ROCK.go() ควรได้รับ URL จริง ไม่ใช่ key
  */
  window.location.href =
    url;
}


function goBattle(){

  const url =
    window.APP_CONFIG?.PAGE?.BATTLE ||
    "./battle.html";

  /*
    ใช้ location.href ตรง ๆ เพื่อให้ทำงานได้
    แม้ common.js / ROCK navigation มีปัญหา
  */
  window.location.href =
    url;
}

/* =========================================================
   INITIALIZE LIFF
========================================================= */
async function prepareMissionApp(){
  if(!window.ROCK) throw new Error('common.js โหลดไม่สำเร็จ');
  if(typeof ROCK.initLiff === 'function'){
    const liffId = window.APP_CONFIG?.LIFF_ID || ROCK?.CFG?.LIFF?.HOME || undefined;
    const ready = await ROCK.initLiff(liffId);
    if(ready === false) return false;
  }
  return true;
}

/* =========================================================
   START PAGE
========================================================= */
let missionPageStarted = false;
let missionRefreshTimer = null;

async function initMissionPage(){
  if(missionPageStarted) return;
  missionPageStarted = true;
  updateTemplate();
  try{
    const ready = await prepareMissionApp();
    if(ready === false) return;
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
    updateTemplate();
    checkApprovedMessage();
  }catch(error){
    console.error('MISSION INIT ERROR:',error);
    showMissionStatus(error?.message || 'ระบบยังไม่พร้อม');
  }
}

function startMissionRefresh(){
  if(missionRefreshTimer) clearInterval(missionRefreshTimer);
  const ms = Number(window.APP_CONFIG?.REFRESH_MS || ROCK?.CFG?.REFRESH_MS) || 30000;
  missionRefreshTimer = setInterval(async()=>{
    if(document.visibilityState !== 'visible') return;
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
  },ms);
}

document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState === 'visible'){
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
  }
});

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded',async()=>{
    await initMissionPage();
    startMissionRefresh();
  },{once:true});
}else{
  initMissionPage().then(startMissionRefresh);
}
</script>
