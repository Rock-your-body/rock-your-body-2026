<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#eef5ff">

<title>ROCK YOUR BODY 2026 - Mission</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #eef5ff;
  color: #08245b;
}

.page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 10px;
}

.mission {
  position: relative;
  width: 100%;
  max-width: 1250px;
  aspect-ratio: 2500 / 1686;
  overflow: hidden;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,.12);
}

.mission-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* =========================================
   LIVE VALUES
========================================= */

.live-value {
  position: absolute;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  white-space: nowrap;
  line-height: 1;
  text-align: center;
  pointer-events: none;
}

/* ROCK COIN */

#rockCoinValue {
  left: 80.8%;
  top: 6.1%;
  transform: translate(-50%, -50%);
  width: 8%;
  color: #08245b;
  font-size: clamp(12px, 1.5vw, 25px);
}

/* ENERGY */

#energyValue {
  left: 92.8%;
  top: 6.1%;
  transform: translate(-50%, -50%);
  width: 10%;
  color: #08245b;
  font-size: clamp(11px, 1.35vw, 23px);
}

/* MISSION POINT */

#missionPointValue {
  left: 92.0%;
  top: 17.2%;
  transform: translate(-50%, -50%);
  width: 7%;
  color: #ffffff;
  font-size: clamp(10px, 1.25vw, 21px);
  text-shadow: 0 2px 4px rgba(0,0,0,.45);
}

/* =========================================
   MISSION STATUS BADGES
========================================= */

.mission-status {
  position: absolute;
  z-index: 20;
  width: 5.2%;
  height: 4.8%;
  border-radius: 10px;
  opacity: .95;
  pointer-events: none;
}

/* DAILY */

#dailyStatus {
  left: 56.8%;
  top: 25.3%;
  background: transparent;
}

/* WEEKLY */

#weeklyStatus {
  left: 90.8%;
  top: 25.3%;
  background: transparent;
}

/* MONTHLY */

#monthlyStatus {
  left: 56.8%;
  top: 57.5%;
  background: transparent;
}

/* BONUS */

#bonusStatus {
  left: 90.8%;
  top: 57.5%;
  background: transparent;
}

.mission-status.active {
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.28),
    0 0 20px rgba(255,255,255,.18);
}

.mission-status.completed::after {
  content: "✓";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: clamp(16px, 2.2vw, 36px);
  font-weight: 900;
}

/* =========================================
   CLICK AREAS
========================================= */

.click-area {
  position: absolute;
  z-index: 30;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

/* DAILY */
#dailyButton {
  left: 34%;
  top: 22%;
  width: 31%;
  height: 30%;
}

/* WEEKLY */
#weeklyButton {
  left: 66%;
  top: 22%;
  width: 31%;
  height: 30%;
}

/* MONTHLY */
#monthlyButton {
  left: 34%;
  top: 54%;
  width: 31%;
  height: 28%;
}

/* BONUS */
#bonusButton {
  left: 66%;
  top: 54%;
  width: 31%;
  height: 28%;
}

/* HOME */
#homeButton {
  left: 1%;
  top: 82%;
  width: 32%;
  height: 17%;
}

/* MISSION */
#missionButton {
  left: 34%;
  top: 82%;
  width: 32%;
  height: 17%;
}

/* BATTLE */
#battleButton {
  left: 67%;
  top: 82%;
  width: 32%;
  height: 17%;
}

/* =========================================
   STATUS
========================================= */

.status {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  max-width: 90vw;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(7,59,147,.94);
  color: #fff;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 8px 25px rgba(0,0,0,.22);
  display: none;
}

.status.show {
  display: block;
}

.status.error {
  background: rgba(190,27,27,.96);
}

.status.success {
  background: rgba(3,143,69,.95);
}

@media (max-width: 650px) {
  .page {
    padding: 0;
  }

  .mission {
    width: 100vw;
    border-radius: 0;
    box-shadow: none;
  }

  #rockCoinValue {
    font-size: clamp(8px, 2.4vw, 14px);
  }

  #energyValue {
    font-size: clamp(8px, 2.3vw, 14px);
  }

  #missionPointValue {
    font-size: clamp(8px, 2.2vw, 14px);
  }
}
</style>
</head>

<body>

<div class="page">

  <div
    id="mission"
    class="mission"
  >

    <img
      class="mission-bg"
      src="./rock-mission-2500x1686-682KB.jpg"
      alt="ROCK YOUR BODY MISSION"
    >

    <div
      id="rockCoinValue"
      class="live-value"
    ></div>

    <div
      id="energyValue"
      class="live-value"
    ></div>

    <div
      id="missionPointValue"
      class="live-value"
    ></div>

    <div
      id="dailyStatus"
      class="mission-status"
    ></div>

    <div
      id="weeklyStatus"
      class="mission-status"
    ></div>

    <div
      id="monthlyStatus"
      class="mission-status"
    ></div>

    <div
      id="bonusStatus"
      class="mission-status"
    ></div>

    <button
      id="dailyButton"
      class="click-area"
      type="button"
      aria-label="Daily Mission"
    ></button>

    <button
      id="weeklyButton"
      class="click-area"
      type="button"
      aria-label="Weekly Mission"
    ></button>

    <button
      id="monthlyButton"
      class="click-area"
      type="button"
      aria-label="Monthly Mission"
    ></button>

    <button
      id="bonusButton"
      class="click-area"
      type="button"
      aria-label="Bonus Mission"
    ></button>

    <button
      id="homeButton"
      class="click-area"
      type="button"
      aria-label="Home"
    ></button>

    <button
      id="missionButton"
      class="click-area"
      type="button"
      aria-label="Mission"
    ></button>

    <button
      id="battleButton"
      class="click-area"
      type="button"
      aria-label="Battle"
    ></button>

  </div>

</div>

<div
  id="status"
  class="status"
></div>

<script>

/* =========================================
   CONFIG
========================================= */

const LIFF_ID =
  "2011201679-uNWz5yqF";

const API_URL =
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";

const HOME_URL =
  "dashboard.html";

const BATTLE_URL =
  "battle.html";

const AUTO_REFRESH_MS =
  10000;

/* =========================================
   STATE
========================================= */

let refreshTimer = null;
let requestRunning = false;

/* =========================================
   ELEMENTS
========================================= */

const statusEl =
  document.getElementById("status");

const rockCoinValue =
  document.getElementById("rockCoinValue");

const energyValue =
  document.getElementById("energyValue");

const missionPointValue =
  document.getElementById("missionPointValue");

const dailyStatus =
  document.getElementById("dailyStatus");

const weeklyStatus =
  document.getElementById("weeklyStatus");

const monthlyStatus =
  document.getElementById("monthlyStatus");

const bonusStatus =
  document.getElementById("bonusStatus");

/* =========================================
   STATUS
========================================= */

function showStatus(
  message,
  type = ""
) {
  statusEl.textContent = message;

  statusEl.className =
    "status show" +
    (
      type
        ? " " + type
        : ""
    );
}

function hideStatus() {
  statusEl.className = "status";
}

/* =========================================
   FORMAT
========================================= */

function formatInteger(value) {
  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return "0";
  }

  return Math
    .round(number)
    .toLocaleString("en-US");
}

/* =========================================
   API
========================================= */

async function callAPI(
  action,
  extra = {}
) {

  const idToken =
    liff.getIDToken();

  if (!idToken) {
    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action,
            idToken,
            ...extra
          })
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "API ตอบกลับไม่ถูกต้อง"
    );
  }

  if (
    !response.ok ||
    !data.success
  ) {
    throw new Error(
      data.error ||
      "โหลดข้อมูลไม่สำเร็จ"
    );
  }

  return data;
}

/* =========================================
   STATUS HELPER
========================================= */

function setMissionState(
  element,
  state
) {

  element.className =
    "mission-status";

  if (!state) {
    return;
  }

  if (state.active) {
    element.classList.add("active");
  }

  if (state.completed) {
    element.classList.add("completed");
  }
}

/* =========================================
   RENDER
========================================= */

function renderMission(data) {

  rockCoinValue.textContent =
    formatInteger(
      data.rockCoin
    );

  if (
    data.energy &&
    data.energy.current !== undefined
  ) {

    energyValue.textContent =
      formatInteger(
        data.energy.current
      ) +
      "/" +
      formatInteger(
        data.energy.max
      );

  } else {

    energyValue.textContent = "";
  }

  missionPointValue.textContent =
    formatInteger(
      data.missionPoint ?? 0
    );

  setMissionState(
    dailyStatus,
    data.missions?.daily
  );

  setMissionState(
    weeklyStatus,
    data.missions?.weekly
  );

  setMissionState(
    monthlyStatus,
    data.missions?.monthly
  );

  setMissionState(
    bonusStatus,
    data.missions?.bonus
  );
}

/* =========================================
   LOAD
========================================= */

async function loadMission(
  showLoading = true
) {

  if (requestRunning) {
    return;
  }

  requestRunning = true;

  if (showLoading) {
    showStatus(
      "กำลังโหลดภารกิจ..."
    );
  }

  try {

    const data =
      await callAPI(
        "dashboard"
      );

    renderMission(data);

    hideStatus();

  } catch (error) {

    console.error(
      "MISSION LOAD ERROR:",
      error
    );

    showStatus(
      error.message ||
      "โหลดข้อมูลภารกิจไม่สำเร็จ",
      "error"
    );

  } finally {

    requestRunning = false;
  }
}

/* =========================================
   AUTO REFRESH
========================================= */

function startAutoRefresh() {

  if (refreshTimer) {
    clearInterval(
      refreshTimer
    );
  }

  refreshTimer =
    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadMission(false);
        }

      },
      AUTO_REFRESH_MS
    );
}

/* =========================================
   NAVIGATION
========================================= */

function go(url) {
  window.location.href = url;
}

/* =========================================
   MISSION BUTTONS
========================================= */

function showMissionMessage(name) {

  alert(
    name +
    "\n\nระบบรายละเอียดภารกิจจะเชื่อมในขั้นถัดไป"
  );
}

document
  .getElementById("dailyButton")
  .addEventListener(
    "click",
    function () {
      showMissionMessage(
        "DAILY MISSION"
      );
    }
  );

document
  .getElementById("weeklyButton")
  .addEventListener(
    "click",
    function () {
      showMissionMessage(
        "WEEKLY MISSION"
      );
    }
  );

document
  .getElementById("monthlyButton")
  .addEventListener(
    "click",
    function () {
      showMissionMessage(
        "MONTHLY MISSION"
      );
    }
  );

document
  .getElementById("bonusButton")
  .addEventListener(
    "click",
    function () {
      showMissionMessage(
        "BONUS MISSION"
      );
    }
  );

/* =========================================
   BOTTOM NAV
========================================= */

document
  .getElementById("homeButton")
  .addEventListener(
    "click",
    function () {
      go(HOME_URL);
    }
  );

document
  .getElementById("missionButton")
  .addEventListener(
    "click",
    function () {
      loadMission(true);
    }
  );

document
  .getElementById("battleButton")
  .addEventListener(
    "click",
    function () {
      go(BATTLE_URL);
    }
  );

/* =========================================
   VISIBILITY
========================================= */

document
  .addEventListener(
    "visibilitychange",
    function () {

      if (
        document.visibilityState ===
          "visible" &&
        liff.isLoggedIn()
      ) {

        loadMission(false);
      }
    }
  );

/* =========================================
   LIFF
========================================= */

async function initLIFF() {

  showStatus(
    "กำลังเชื่อมต่อ LINE..."
  );

  try {

    await liff.init({
      liffId:
        LIFF_ID
    });

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();
      return;
    }

    await loadMission(true);

    startAutoRefresh();

  } catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );

    showStatus(
      "เปิด Mission ไม่สำเร็จ: " +
      (
        error.message ||
        error
      ),
      "error"
    );
  }
}

/* =========================================
   START
========================================= */

initLIFF();

</script>

</body>
</html>
