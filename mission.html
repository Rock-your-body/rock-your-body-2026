<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>ROCK YOUR BODY 2026 - MISSION</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script src="./app-config.js?v=20260827-01"></script>

  <script src="./common.js?v=20260827-01"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #eef4ff;

      font-family:
        "Noto Sans Thai",
        Tahoma,
        Arial,
        sans-serif;

      color: #082b68;

    }


    #loading {

      position: fixed;
      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eef4ff;

      font-size: 20px;
      font-weight: 800;

    }


    #app {

      display: none;

      width: 100%;
      max-width: 1000px;

      margin: auto;

      padding: 20px;

    }


    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

    }


    h1 {

      margin: 0;

      font-size: 34px;

    }


    .back {

      border: 0;

      background: #102f78;

      color: white;

      padding: 12px 20px;

      border-radius: 14px;

      font-weight: 800;

      cursor: pointer;

    }


    .mission-section {

      margin-bottom: 25px;

    }


    .section-title {

      font-size: 23px;

      font-weight: 900;

      margin-bottom: 12px;

    }


    .mission {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      background: white;

      border-radius: 20px;

      padding: 18px;

      margin-bottom: 12px;

      box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    }


    .mission-title {

      font-size: 18px;

      font-weight: 800;

    }


    .mission-meta {

      color: #65738b;

      font-size: 14px;

      margin-top: 5px;

    }


    .complete {

      border: 0;

      background: #102f78;

      color: white;

      padding: 12px 18px;

      border-radius: 13px;

      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;

    }


    .complete.done {

      background: #6b7280;

    }


    @media(max-width:650px){

      .mission {

        flex-direction: column;

        align-items: stretch;

      }

    }

  </style>

</head>


<body>


<div id="loading">
  กำลังโหลด MISSION...
</div>


<main id="app">


  <header class="header">

    <h1>
      MISSION
    </h1>

    <button
      class="back"
      onclick="window.ROCK.goHome()"
    >
      HOME
    </button>

  </header>


  <section
    id="dailySection"
    class="mission-section"
  >

    <div class="section-title">
      DAILY MISSION
    </div>

    <div id="dailyList"></div>

  </section>


  <section
    id="weeklySection"
    class="mission-section"
  >

    <div class="section-title">
      WEEKLY MISSION
    </div>

    <div id="weeklyList"></div>

  </section>


  <section
    id="monthlySection"
    class="mission-section"
  >

    <div class="section-title">
      MONTHLY MISSION
    </div>

    <div id="monthlyList"></div>

  </section>


  <section
    id="bonusSection"
    class="mission-section"
  >

    <div class="section-title">
      BONUS
    </div>

    <div id="bonusList"></div>

  </section>


</main>


<script>

(function(){

  "use strict";


  function escapeHTML(
    value
  ){

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function renderList(
    elementId,
    list
  ){

    const el =
      document.getElementById(
        elementId
      );


    if(!el){

      return;

    }


    if(
      !Array.isArray(list) ||
      list.length === 0
    ){

      el.innerHTML =
        `<div class="mission">
          ยังไม่มีภารกิจ
        </div>`;

      return;

    }


    el.innerHTML =
      list
        .map(
          mission => {

            const done =
              Boolean(
                mission.completed
              );


            return `
              <div class="mission">

                <div>

                  <div class="mission-title">
                    ${escapeHTML(
                      mission.title
                    )}
                  </div>

                  <div class="mission-meta">
                    ${escapeHTML(
                      mission.type || ""
                    )}

                    ·

                    🪙
                    ${Number(
                      mission.rewardCoin || 0
                    ).toLocaleString()}

                    ·

                    ⚡
                    ${Number(
                      mission.rewardEnergy || 0
                    ).toLocaleString()}
                  </div>

                </div>


                <button
                  class="complete ${done ? "done" : ""}"
                  data-mission-id="${escapeHTML(
                    mission.id
                  )}"
                  ${done ? "disabled" : ""}
                >

                  ${
                    done
                      ? "COMPLETED"
                      : "COMPLETE"
                  }

                </button>

              </div>
            `;

          }
        )
        .join("");


    el
      .querySelectorAll(
        "[data-mission-id]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            async function(){

              const id =
                button.dataset.missionId;


              try{

                button.disabled =
                  true;


                button.textContent =
                  "กำลังทำ...";


                const result =
                  await window.ROCK
                    .completeMission(
                      id
                    );


                console.log(
                  "MISSION COMPLETE:",
                  result
                );


                button.textContent =
                  "COMPLETED";


                button.classList.add(
                  "done"
                );


              }catch(error){

                console.error(
                  error
                );


                button.disabled =
                  false;


                button.textContent =
                  "COMPLETE";


                alert(
                  error.message ||
                  "ไม่สามารถทำภารกิจได้"
                );

              }

            }
          );

        }
      );

  }


  async function start(){

    try{

      const ready =
        await window.ROCK
          .initLiff();


      if(
        ready === false
      ){

        return;

      }


      const result =
        await window.ROCK
          .getMissions();


      console.log(
        "MISSIONS:",
        result
      );


      const missions =
        result?.missions ||
        result?.data?.missions ||
        {};


      renderList(
        "dailyList",
        missions.daily
      );


      renderList(
        "weeklyList",
        missions.weekly
      );


      renderList(
        "monthlyList",
        missions.monthly
      );


      renderList(
        "bonusList",
        missions.bonus
      );


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "app"
        )
        .style.display =
        "block";


    }catch(error){

      console.error(
        "MISSION ERROR:",
        error
      );


      document
        .getElementById(
          "loading"
        )
        .innerHTML =
        `
        ไม่สามารถโหลด Mission ได้
        <br><br>
        <small>
          ${error.message}
        </small>
        `;

    }

  }


  start();

})();

</script>


</body>
</html>
