<!doctype html>

<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"

  </title>

  <!-- =====================================================
       BASE CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="./base.css?v=20260823-30"
  >


  <style>

    /* =====================================================
       MISSION CLICK AREA
    ====================================================== */

    .mission-card-button{

      position:absolute;

      z-index:40;

      border:0;

      background:transparent;

      cursor:pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    .mission-card-button.daily{

      left:33%;
      top:29%;

      width:28%;
      height:28%;

    }


    .mission-card-button.weekly{

      left:62%;
      top:29%;

      width:33%;
      height:28%;

    }


    .mission-card-button.monthly{

      left:33%;
      top:58%;

      width:28%;
      height:28%;

    }


    .mission-card-button.bonus{

      left:62%;
      top:58%;

      width:33%;
      height:28%;

    }


    /* =====================================================
       MODAL
    ====================================================== */

    .mission-modal{

      position:fixed;

      inset:0;

      z-index:99999;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,25,65,.62);

      backdrop-filter:
        blur(3px);

    }


    .mission-modal.show{

      display:flex;

    }


    /* =====================================================
       PANEL
    ====================================================== */

    .mission-panel{

      width:min(
        100%,
        760px
      );

      max-height:92vh;

      overflow-y:auto;

      padding:
        0
        14px
        max(
          26px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        28px 28px 0 0;

      background:#f3f8ff;

      box-shadow:
        0 -12px 40px
        rgba(0,35,90,.30);

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .panel-header{

      position:sticky;

      top:0;

      z-index:30;

      display:flex;

      align-items:center;

      gap:12px;

      padding:
        16px
        2px
        14px;

      background:
        rgba(243,248,255,.97);

      backdrop-filter:
        blur(10px);

    }


    .panel-icon{

      width:52px;
      height:52px;

      flex:
        0 0 52px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:17px;

      background:#dcecff;

      font-size:27px;

    }


    .panel-title-wrap{

      flex:1;

      min-width:0;

    }


    .panel-title{

      margin:0;

      color:#073b93;

      font-size:
        clamp(
          20px,
          5vw,
          29px
        );

      font-weight:900;

      line-height:1.1;

    }


    .panel-subtitle{

      margin-top:4px;

      color:#687c9b;

      font-size:
        clamp(
          11px,
          2.8vw,
          14px
        );

      font-weight:600;

    }


    .panel-close{

      width:42px;
      height:42px;

      flex:
        0 0 42px;

      border:0;

      border-radius:50%;

      background:#e0e9f6;

      color:#153d79;

      font-size:25px;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       CATEGORY INFO
    ====================================================== */

    .category-info{

      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:8px;

      margin-bottom:14px;

    }


    .category-stat{

      padding:
        10px
        5px;

      border-radius:15px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 4px 14px
        rgba(20,60,110,.07);

    }


    .category-stat-label{

      color:#74839c;

      font-size:11px;

      font-weight:700;

    }


    .category-stat-value{

      margin-top:2px;

      color:#073b93;

      font-size:
        clamp(
          16px,
          4vw,
          22px
        );

      font-weight:900;

    }


    /* =====================================================
       SECTION TITLE
    ====================================================== */

    .mission-section-title{

      margin:
        18px
        2px
        8px;

      color:#073b93;

      font-size:16px;

      font-weight:900;

    }


    /* =====================================================
       MISSION LIST
    ====================================================== */

    .mission-list{

      display:grid;

      gap:11px;

    }


    /* =====================================================
       MISSION ITEM
    ====================================================== */

    .mission-item{

      overflow:hidden;

      border:
        1px solid #dce7f5;

      border-radius:20px;

      background:#fff;

      box-shadow:
        0 5px 16px
        rgba(20,60,110,.07);

    }


    .mission-item.pending{

      border-color:#ffd574;

      background:#fffdf6;

    }


    .mission-item.approved{

      border-color:#87d6a5;

      background:#f4fff8;

    }


    .mission-item.rejected{

      border-color:#ef9b9b;

      background:#fff7f7;

    }


    .mission-main{

      display:grid;

      grid-template-columns:
        50px
        minmax(0,1fr);

      gap:12px;

      padding:14px;

    }


    .mission-icon{

      width:50px;
      height:50px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:#e6f0ff;

      font-size:25px;

    }


    .mission-name{

      color:#082f73;

      font-size:
        clamp(
          14px,
          3.4vw,
          18px
        );

      font-weight:900;

      line-height:1.3;

    }


    .mission-description{

      margin-top:4px;

      color:#6f809d;

      font-size:
        clamp(
          10px,
          2.6vw,
          13px
        );

      font-weight:500;

      line-height:1.45;

    }


    /* =====================================================
       REWARD
    ====================================================== */

    .reward-row{

      display:flex;

      flex-wrap:wrap;

      gap:5px;

      margin-top:9px;

    }


    .reward-badge{

      display:inline-flex;

      align-items:center;

      gap:3px;

      padding:
        4px
        7px;

      border-radius:999px;

      background:#edf4fd;

      color:#173d78;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    /* =====================================================
       STATUS BADGE
    ====================================================== */

    .mission-status-row{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

      margin-top:9px;

    }


    .status-badge{

      display:inline-flex;

      align-items:center;

      min-height:25px;

      padding:
        4px
        9px;

      border-radius:999px;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    .status-not-submitted{

      color:#60718d;

      background:#edf2f8;

    }


    .status-pending{

      color:#996200;

      background:#fff1bd;

    }


    .status-approved{

      color:#08733a;

      background:#dff8e9;

    }


    .status-rejected{

      color:#a51c1c;

      background:#ffe1e1;

    }


    /* =====================================================
       SUBMIT BUTTON
    ====================================================== */

    .mission-submit-button{

      min-height:37px;

      padding:
        7px
        12px;

      border:0;

      border-radius:12px;

      color:#fff;

      background:#0878e8;

      font-size:
        clamp(
          10px,
          2.4vw,
          13px
        );

      font-weight:900;

      cursor:pointer;

      white-space:nowrap;

    }


    .mission-submit-button:disabled{

      cursor:default;

      background:#bdc9d8;

    }


    /* =====================================================
       EVIDENCE MODAL
    ====================================================== */

    .evidence-modal{

      position:fixed;

      inset:0;

      z-index:100000;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,20,55,.68);

    }


    .evidence-modal.show{

      display:flex;

    }


    .evidence-panel{

      width:min(
        100%,
        650px
      );

      max-height:90vh;

      overflow-y:auto;

      padding:
        18px
        16px
        max(
          25px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        26px 26px 0 0;

      background:#fff;

    }


    .evidence-header{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

    }


    .evidence-title{

      color:#073b93;

      font-size:
        clamp(
          19px,
          4.8vw,
          27px
        );

      font-weight:900;

    }


    .evidence-close{

      width:40px;
      height:40px;

      border:0;

      border-radius:50%;

      background:#e7eef7;

      color:#173b78;

      font-size:23px;

      cursor:pointer;

    }


    .evidence-mission-name{

      margin-top:7px;

      color:#183f7e;

      font-size:15px;

      font-weight:800;

    }


    .form-group{

      margin-top:16px;

    }


    .form-label{

      display:block;

      margin-bottom:6px;

      color:#324f7d;

      font-size:13px;

      font-weight:800;

    }


    .form-note{

      margin-top:5px;

      color:#7d899b;

      font-size:11px;

      line-height:1.4;

    }


    .evidence-input,
    .evidence-textarea{

      width:100%;

      border:
        1px solid #cbd9eb;

      border-radius:13px;

      background:#f9fbfe;

      color:#17365f;

    }


    .evidence-input{

      min-height:48px;

      padding:
        10px
        12px;

    }


    .evidence-textarea{

      min-height:90px;

      padding:12px;

      resize:vertical;

    }


    .file-input{

      width:100%;

      padding:12px;

      border:
        1px dashed #95b5dc;

      border-radius:14px;

      background:#f4f9ff;

    }


    .submit-evidence-button{

      width:100%;

      min-height:52px;

      margin-top:18px;

      border:0;

      border-radius:15px;

      background:#06c755;

      color:#fff;

      font-size:16px;

      font-weight:900;

      cursor:pointer;

    }


    .submit-evidence-button:disabled{

      background:#b7c4d3;

    }


    /* =====================================================
       APPROVED MESSAGE
    ====================================================== */

    .success-modal{

      position:fixed;

      inset:0;

      z-index:100001;

      display:none;

      align-items:center;

      justify-content:center;

      padding:18px;

      background:
        rgba(0,20,50,.68);

    }


    .success-modal.show{

      display:flex;

    }


    .success-card{

      width:min(
        100%,
        430px
      );

      padding:
        27px
        20px;

      border-radius:25px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 15px 50px
        rgba(0,25,70,.30);

    }


    .success-icon{

      font-size:55px;

    }


    .success-title{

      margin-top:10px;

      color:#07934b;

      font-size:25px;

      font-weight:900;

    }


    .success-name{

      margin-top:7px;

      color:#073b93;

      font-size:16px;

      font-weight:800;

    }


    .success-reward{

      margin-top:14px;

      padding:12px;

      border-radius:14px;

      background:#eef7ff;

      color:#173b78;

      font-weight:800;

      line-height:1.7;

    }


    .success-close{

      width:100%;

      min-height:47px;

      margin-top:17px;

      border:0;

      border-radius:13px;

      background:#0877e7;

      color:#fff;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       TOP MESSAGE
    ====================================================== */

    #missionStatus{

      position:fixed;

      z-index:120000;

      left:50%;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      display:none;

      max-width:90vw;

      padding:
        10px
        16px;

      border-radius:999px;

      background:#0755b7;

      color:#fff;

      font-size:13px;

      font-weight:800;

      text-align:center;

    }


    #missionStatus.show{

      display:block;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:480px){

      .mission-panel{

        border-radius:
          22px 22px 0 0;

        padding-left:10px;
        padding-right:10px;

      }


      .mission-main{

        grid-template-columns:
          42px
          minmax(0,1fr);

        padding:12px;

        gap:9px;

      }


      .mission-icon{

        width:42px;
        height:42px;

        border-radius:13px;

        font-size:21px;

      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     MISSION STAGE
========================================================= -->

<div
  id="missionStage"
  class="stage"
>


  <!-- TEMPLATE -->

  <img
    class="template"
    src="./mission-template.png"
    alt=""
    draggable="false"
  >


  <!-- TOP COIN -->

  <div
    id="missionCoin"
    class="
      overlay
      mission-coin-box
      live-blue
    "
  >
    0
  </div>


  <!-- TOP ENERGY -->

  <div
    id="missionEnergy"
    class="
      overlay
      mission-energy-box
      live-blue
    "
  >
    0 / 200
  </div>


  <!-- =====================================================
       DAILY
  ====================================================== -->

  <div
    class="
      live-track
      daily-track
    "
  >

    <div
      id="dailyProgress"
      class="
        live-fill
        mission-fill-daily
      "
    ></div>

  </div>


  <div
    id="dailyCount"
    class="daily-count"
  >
    0 / 4
  </div>


  <!-- =====================================================
       WEEKLY
  ====================================================== -->

  <div
    class="
      live-track
      weekly-track
    "
  >

    <div
      id="weeklyProgress"
      class="
        live-fill
        mission-fill-weekly
      "
    ></div>

  </div>


  <div
    id="weeklyCount"
    class="weekly-count"
  >
    0 / 6
  </div>


  <!-- =====================================================
       MONTHLY
  ====================================================== -->

  <div
    class="
      live-track
      monthly-track
    "
  >

    <div
      id="monthlyProgress"
      class="
        live-fill
        mission-fill-monthly
      "
    ></div>

  </div>


  <div
    id="monthlyCount"
    class="monthly-count"
  >
    0 / 1
  </div>


  <!-- =====================================================
       BONUS
  ====================================================== -->

  <div
    class="
      live-track
      bonus-track
    "
  >

    <div
      id="bonusProgress"
      class="
        live-fill
        mission-fill-bonus
      "
    ></div>

  </div>


  <div
    id="bonusCount"
    class="bonus-count"
  >
    0 / 9
  </div>


  <!-- =====================================================
       CLICK AREAS
  ====================================================== -->

  <button
    type="button"
    class="
      mission-card-button
      daily
    "
    onclick="openCategory('daily')"
    aria-label="Daily Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      weekly
    "
    onclick="openCategory('weekly')"
    aria-label="Weekly Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      monthly
    "
    onclick="openCategory('monthly')"
    aria-label="Monthly Mission"
  ></button>


  <button
    type="button"
    class="
      mission-card-button
      bonus
    "
    onclick="openCategory('bonus')"
    aria-label="Bonus Mission"
  ></button>


  <!-- HOME -->

  <button
    type="button"
    class="hotspot"
    style="
      left:1%;
      top:88%;
      width:31%;
      height:11%;
    "
    onclick="goHome()"
    aria-label="Home"
  ></button>


</div>


<!-- =========================================================
     CATEGORY MODAL
========================================================= -->

<div
  id="missionModal"
  class="mission-modal"
  onclick="closeCategoryBackdrop(event)"
>

  <section
    class="mission-panel"
  >

    <header
      class="panel-header"
    >

      <div
        id="panelIcon"
        class="panel-icon"
      >
        🎯
      </div>


      <div
        class="panel-title-wrap"
      >

        <h2
          id="panelTitle"
          class="panel-title"
        >
          MISSION
        </h2>


        <div
          id="panelSubtitle"
          class="panel-subtitle"
        >
        </div>

      </div>


      <button
        type="button"
        class="panel-close"
        onclick="closeCategory()"
      >
        ×
      </button>

    </header>


    <section
      class="category-info"
    >

      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          อนุมัติแล้ว
        </div>

        <div
          id="statApproved"
          class="category-stat-value"
        >
          0
        </div>

      </div>


      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          ทั้งหมด
        </div>

        <div
          id="statTotal"
          class="category-stat-value"
        >
          0
        </div>

      </div>


      <div
        class="category-stat"
      >

        <div
          class="category-stat-label"
        >
          ความสำเร็จ
        </div>

        <div
          id="statPercent"
          class="category-stat-value"
        >
          0%
        </div>

      </div>

    </section>


    <section
      id="missionList"
      class="mission-list"
    ></section>

  </section>

</div>


<!-- =========================================================
     EVIDENCE MODAL
========================================================= -->

<div
  id="evidenceModal"
  class="evidence-modal"
>

  <section
    class="evidence-panel"
  >

    <header
      class="evidence-header"
    >

      <div
        class="evidence-title"
      >
        ส่งหลักฐาน
      </div>


      <button
        type="button"
        class="evidence-close"
        onclick="closeEvidence()"
      >
        ×
      </button>

    </header>


    <div
      id="evidenceMissionName"
      class="evidence-mission-name"
    ></div>


    <!-- FILE -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        รูปภาพ / VDO
      </label>


      <input
        id="evidenceFile"
        class="file-input"
        type="file"
        accept="
          image/*,
          video/*
        "
      >


      <div
        class="form-note"
      >
        เลือกรูปหรือวิดีโอที่ใช้เป็นหลักฐานตามเงื่อนไขของภารกิจ
      </div>

    </div>


    <!-- LINK -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        Link
      </label>


      <input
        id="evidenceLink"
        class="evidence-input"
        type="url"
        placeholder="https://..."
      >

    </div>


    <!-- NOTE -->

    <div
      class="form-group"
    >

      <label
        class="form-label"
      >
        รายละเอียดเพิ่มเติม
      </label>


      <textarea
        id="evidenceNote"
        class="evidence-textarea"
        placeholder="อธิบายกิจกรรมที่ทำ..."
      ></textarea>

    </div>


    <button
      id="submitEvidenceButton"
      type="button"
      class="submit-evidence-button"
      onclick="submitEvidence()"
    >
      ส่งหลักฐานให้ Admin ตรวจสอบ
    </button>


  </section>

</div>


<!-- =========================================================
     SUCCESS
========================================================= -->

<div
  id="successModal"
  class="success-modal"
>

  <section
    class="success-card"
  >

    <div
      class="success-icon"
    >
      🎉
    </div>


    <div
      class="success-title"
    >
      ภารกิจสำเร็จ!
    </div>


    <div
      id="successMissionName"
      class="success-name"
    ></div>


    <div
      id="successReward"
      class="success-reward"
    ></div>


    <button
      type="button"
      class="success-close"
      onclick="closeSuccess()"
    >
      เยี่ยมมาก!
    </button>

  </section>

</div>


<div id="missionStatus"></div>


<!-- =========================================================
     COMMON
========================================================= -->

<script
  src="./common.js"
></script>


<script>

/* =========================================================
   GLOBAL
========================================================= */

const ROCK =
  window.ROCK;


const MISSION_API =
  ROCK?.CFG?.API?.MISSION ||
  "";


const LOCAL_KEY =
  "rock_mission_submissions_v3";


let activeCategory =
  "daily";


let activeMissionId =
  null;


/* =========================================================
   EXTRA DAILY
========================================================= */

const dailyExtraPool = [

  {
    id:
      "daily_extra_stair",

    icon:
      "🪜",

    name:
      "STAIR CHALLENGE",

    description:
      "ถ่ายรูปบริเวณบันได พร้อมทำกิจกรรมเดินขึ้น–ลงอย่างน้อย 3 ชั้น",

    evidence:
      "photo",

    reward:{
      coin:10,

/* =========================================================
   RANDOM EXTRA OF DAY
========================================================= */

function getDailyExtra(){

  const today =
    new Date();


  const seed =
    Number(
      String(
        today.getFullYear()
      ) +
      String(
        today.getMonth() + 1
      ).padStart(2,"0") +
      String(
        today.getDate()
      ).padStart(2,"0")
    );


  const index =
    seed %
    dailyExtraPool.length;


  return dailyExtraPool[
    index
  ];
}

/* =========================================================
   LOCAL TEST STORAGE
========================================================= */

function readLocal(){

  try{

    return JSON.parse(
      localStorage.getItem(
        LOCAL_KEY
      ) ||
      "{}"
    );

  }catch{

    return {};

  }

}


function writeLocal(
  value
){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(
      value
    )
  );

}


/* =========================================================
   STATUS
========================================================= */

function getMissionStatus(
  id
){

  const local =
    readLocal();


  return (
    local[id] ||
    {
      status:
        "not_submitted",

      approvedNotified:
        false
    }
  );

}


/* =========================================================
   FIND MISSION
========================================================= */

function findMission(
  id
){

  for(
    const categoryName
    of Object.keys(
      missionData
    )
  ){

    const config =
      missionData[
        categoryName
      ];


    const missions =
      Array.isArray(
        config.missions
      )
        ? config.missions
        : config.missions;


    const found =
      missions.find(
        item =>
          item.id === id
      );


    if(found){
      return found;
    }

  }


  return null;

}

/* =========================================================
   RENDER
========================================================= */

function renderCategory(){

  const config =
    missionData[
      activeCategory
    ];


  const missions =
    getCategoryMissions(
      activeCategory
    );


  document
    .getElementById(
      "panelIcon"
    )
    .textContent =
      config.icon;


  document
    .getElementById(
      "panelTitle"
    )
    .textContent =
      config.title;


  document
    .getElementById(
      "panelSubtitle"
    )
    .textContent =
      config.subtitle;


  const list =
    document
      .getElementById(
        "missionList"
      );


  list.innerHTML =
    "";


  let approvedCount =
    0;


  let lastSection =
    "";


  missions.forEach(
    mission => {


      const state =
        getMissionStatus(
          mission.id
        );


      if(
        state.status ===
        "approved"
      ){

        approvedCount++;

      }


      if(
        mission.section &&
        mission.section !==
        lastSection
      ){

        lastSection =
          mission.section;


        const section =
          document
            .createElement(
              "div"
            );


        section.className =
          "mission-section-title";


        section.textContent =
          mission.section;


        list.appendChild(
          section
        );

      }


      const item =
        document
          .createElement(
            "article"
          );


      item.className =
        `mission-item ${state.status}`;


      let statusText =
        "ยังไม่ได้ส่งหลักฐาน";


      let statusClass =
        "status-not-submitted";


      if(
        state.status ===
        "pending"
      ){

        statusText =
          "⏳ รอ Admin ตรวจสอบ";

        statusClass =
          "status-pending";

      }


      if(
        state.status ===
        "approved"
      ){

        statusText =
          "✅ Admin อนุมัติแล้ว";

        statusClass =
          "status-approved";

      }


      if(
        state.status ===
        "rejected"
      ){

        statusText =
          "❌ ไม่ผ่าน กรุณาส่งใหม่";

        statusClass =
          "status-rejected";

      }


      if(
        mission.auto
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ สำเร็จแล้ว"
            : "ตรวจสำเร็จอัตโนมัติ";

      }


      if(
        mission.adminOnly
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ Admin มอบ Bonus แล้ว"
            : "รอการคัดเลือกจาก Admin";

      }


      const canSubmit =

        !mission.auto &&
        !mission.adminOnly &&
        state.status !==
          "pending" &&
        state.status !==
          "approved";


      item.innerHTML = `

        <div class="mission-main">

          <div class="mission-icon">
            ${mission.icon}
          </div>


          <div>

            <div class="mission-name">
              ${mission.name}
            </div>


            <div class="mission-description">
              ${mission.description}
            </div>


            <div class="reward-row">

              <span class="reward-badge">
                ⭐ +${mission.reward.coin}
                ROCK COIN
              </span>


              <span class="reward-badge">
                ⚡ +${mission.reward.energy}
                ENERGY
              </span>


              <span class="reward-badge">
                🏆 +${mission.reward.exp}
                EXP
              </span>

            </div>


            <div class="mission-status-row">

              <span
                class="
                  status-badge
                  ${statusClass}
                "
              >
                ${statusText}
              </span>


              ${
                canSubmit
                  ? `

                    <button
                      type="button"
                      class="mission-submit-button"
                      onclick="
                        openEvidence(
                          '${mission.id}'
                        )
                      "
                    >
                      ส่งหลักฐาน
                    </button>

                  `
                  : ""
              }

            </div>

          </div>

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );


  const total =
    missions.length;


  const percent =
    total > 0

      ? Math.round(
          (
            approvedCount /
            total
          ) * 100
        )

      : 0;


  document
    .getElementById(
      "statApproved"
    )
    .textContent =
      approvedCount;


  document
    .getElementById(
      "statTotal"
    )
    .textContent =
      total;


  document
    .getElementById(
      "statPercent"
    )
    .textContent =
      `${percent}%`;


  updateTemplate();

}

/* =========================================================
   SUBMIT EVIDENCE
========================================================= */

async function submitEvidence(){

  const mission =
    findMission(
      activeMissionId
    );


  if(!mission){
    return;
  }


  const fileInput =
    document
      .getElementById(
        "evidenceFile"
      );


  const file =
    fileInput.files?.[0] ||
    null;


  const link =
    document
      .getElementById(
        "evidenceLink"
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        "evidenceNote"
      )
      .value
      .trim();


  if(
    mission.requireLink &&
    !link
  ){

    showMissionStatus(
      "กรุณาใส่ Link TikTok"
    );

    return;

  }


  if(
    !file &&
    !link
  ){

    showMissionStatus(
      "กรุณาเลือกรูป / VDO หรือใส่ Link"
    );

    return;

  }


  const button =
    document
      .getElementById(
        "submitEvidenceButton"
      );


  button.disabled =
    true;


  button.textContent =
    "กำลังส่งหลักฐาน...";


  try{


    /* =====================================================
       REAL API MODE
    ====================================================== */

    if(
      MISSION_API
    ){

      const form =
        new FormData();


      form.append(
        "action",
        "submitEvidence"
      );


      form.append(
        "idToken",
        ROCK.getIdToken()
      );


      form.append(
        "missionId",
        mission.id
      );


      form.append(
        "category",
        activeCategory
      );


      form.append(
        "note",
        note
      );


      form.append(
        "link",
        link
      );


      if(file){

        form.append(
          "file",
          file
        );

      }


      const response =
        await fetch(
          MISSION_API,
          {
            method:
              "POST",

            body:
              form
          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        result?.success === false
      ){

        throw new Error(
          result?.error ||
          "ส่งหลักฐานไม่สำเร็จ"
        );

      }

    }


    /* =====================================================
       LOCAL TEST MODE
    ====================================================== */

    else{

      const local =
        readLocal();


      local[
        mission.id
      ] = {

        status:
          "pending",

        submittedAt:
          new Date()
            .toISOString(),

        fileName:
          file?.name ||
          "",

        link,

        note,

        approvedNotified:
          false

      };


      writeLocal(
        local
      );

    }


    closeEvidence();


    renderCategory();


    showMissionStatus(
      "ส่งหลักฐานแล้ว รอ Admin ตรวจสอบ"
    );


  }catch(error){

    console.error(
      "MISSION SUBMIT ERROR:",
      error
    );


    showMissionStatus(
      error?.message ||
      "ส่งหลักฐานไม่สำเร็จ"
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      "ส่งหลักฐานให้ Admin ตรวจสอบ";

  }

}


/* =========================================================
   LOAD STATUS FROM API
========================================================= */

async function refreshMissionStatus(){

  if(
    !MISSION_API
  ){

    updateAutoBonus();

    checkApprovedMessage();

    updateTemplate();

    return;

  }


  try{

    const response =
      await fetch(
        MISSION_API,
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "myMissionStatus",

              idToken:
                ROCK.getIdToken()

            })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      result?.success === false
    ){

      throw new Error(
        result?.error ||
        "โหลด Mission ไม่สำเร็จ"
      );

    }


    const local =
      readLocal();


    (
      result.submissions ||
      []
    )
      .forEach(
        item => {

          local[
            item.mission_id
          ] = {

            ...local[
              item.mission_id
            ],

            status:
              item.status,

            approvedAt:
              item.approved_at,

            rejectReason:
              item.reject_reason,

            rewardGranted:
              item.reward_granted ===
              true

          };

        }
      );


    writeLocal(
      local
    );


    updateAutoBonus();

    checkApprovedMessage();

    updateTemplate();


    if(
      document
        .getElementById(
          "missionModal"
        )
        .classList
        .contains(
          "show"
        )
    ){

      renderCategory();

    }


  }catch(error){

    console.error(
      "MISSION STATUS ERROR:",
      error
    );

  }

}


/* =========================================================
   AUTO BONUS
========================================================= */

function updateAutoBonus(){

  const local =
    readLocal();


  const approved = id =>

    local[id]?.status ===
    "approved";


  /* Core Daily 3/3 */

  const coreComplete =

    approved(
      "daily_move_more"
    ) &&

    approved(
      "daily_eat_smart"
    ) &&

    approved(
      "daily_exercise_30"
    );


  if(
    coreComplete &&
    !local[
      "bonus_core_daily"
    ]
  ){

    local[
      "bonus_core_daily"
    ] = {

      status:
        "approved",

      approvedAt:
        new Date()
          .toISOString(),

      approvedNotified:
        false

    };

  }


  /* Perfect Day */

  const dailyExtra =
    getDailyExtra();


  if(
    coreComplete &&
    approved(
      dailyExtra.id
    ) &&
    !local[
      "bonus_perfect_day"
    ]
  ){

    local[
      "bonus_perfect_day"
    ] = {

      status:
        "approved",

      approvedAt:
        new Date()
          .toISOString(),

      approvedNotified:
        false

    };

  }


  /* Weekly 4 missions */

  const weeklyApproved =
    missionData.weekly
      .missions
      .filter(
        mission =>
          approved(
            mission.id
          )
      )
      .length;


  if(
    weeklyApproved >= 4 &&
    !local[
      "bonus_weekly_four"
    ]
  ){

    local[
      "bonus_weekly_four"
    ] = {

      status:
        "approved",

      approvedAt:
        new Date()
          .toISOString(),

      approvedNotified:
        false

    };

  }


  writeLocal(
    local
  );

}


/* =========================================================
   TEMPLATE COUNTERS
========================================================= */

function categoryStats(
  category
){

  const local =
    readLocal();


  const missions =
    getCategoryMissions(
      category
    );


  const approved =
    missions.filter(
      mission =>
        local[
          mission.id
        ]?.status ===
        "approved"
    )
    .length;


  const total =
    missions.length;


  return {

    approved,

    total,

    percent:

      total > 0

        ? (
            approved /
            total
          ) * 100

        : 0

  };

}


/* =========================================================
   UPDATE TEMPLATE
========================================================= */

function updateTemplate(){

  const daily =
    categoryStats(
      "daily"
    );


  const weekly =
    categoryStats(
      "weekly"
    );


  const monthly =
    categoryStats(
      "monthly"
    );


  const bonus =
    categoryStats(
      "bonus"
    );


  setCategoryTemplate(
    "daily",
    daily
  );


  setCategoryTemplate(
    "weekly",
    weekly
  );


  setCategoryTemplate(
    "monthly",
    monthly
  );


  setCategoryTemplate(
    "bonus",
    bonus
  );

}


function setCategoryTemplate(
  category,
  stats
){

  const count =
    document
      .getElementById(
        `${category}Count`
      );


  const progress =
    document
      .getElementById(
        `${category}Progress`
      );


  if(count){

    count.textContent =
      `${stats.approved} / ${stats.total}`;

  }


  if(progress){

    progress.style.width =
      `${stats.percent}%`;

  }

}


/* =========================================================
   CONGRATULATION MESSAGE
========================================================= */

function checkApprovedMessage(){

  const local =
    readLocal();


  for(
    const [
      missionId,
      state
    ]
    of Object.entries(
      local
    )
  ){

    if(
      state.status !==
      "approved" ||
      state.approvedNotified ===
      true
    ){

      continue;

    }


    const mission =
      findMission(
        missionId
      );


    if(!mission){
      continue;
    }


    state.approvedNotified =
      true;


    local[
      missionId
    ] =
      state;


    writeLocal(
      local
    );


    showSuccess(
      mission
    );


    break;

  }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
  mission
){

  document
    .getElementById(
      "successMissionName"
    )
    .textContent =
      mission.name;


  document
    .getElementById(
      "successReward"
    )
    .innerHTML = `

      ⭐ +${mission.reward.coin}
      ROCK COIN

      <br>

      ⚡ +${mission.reward.energy}
      ENERGY

      <br>

      🏆 +${mission.reward.exp}
      EXP

    `;


  document
    .getElementById(
      "successModal"
    )
    .classList
    .add(
      "show"
    );

}


function closeSuccess(){

  document
    .getElementById(
      "successModal"
    )
    .classList
    .remove(
      "show"
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMissionStatus(
  message
){

  const el =
    document
      .getElementById(
        "missionStatus"
      );


  el.textContent =
    message;


  el.classList.add(
    "show"
  );


  setTimeout(
    () => {

      el.classList.remove(
        "show"
      );

    },
    2800
  );

}


/* =========================================================
   TOP COIN / ENERGY
========================================================= */

async function loadPlayer(){

  try{

    const raw =
      await ROCK.fetchDashboard();


    const coin =
      Number(

        raw?.rockCoin ??

        raw?.rock_coin ??

        raw?.user?.rock_coin ??

        0

      );


    const currentEnergy =
      Number(

        raw?.energy?.current ??

        raw?.user?.energy ??

        0

      );


    const maxEnergy =
      Number(

        raw?.energy?.max ??

        raw?.user?.max_energy ??

        ROCK.CFG.MAX_ENERGY ??

        200

      );


    document
      .getElementById(
        "missionCoin"
      )
      .textContent =
        ROCK.fmtInt(
          coin
        );


    document
      .getElementById(
        "missionEnergy"
      )
      .textContent =
        `${ROCK.fmtInt(currentEnergy)} / ${ROCK.fmtInt(maxEnergy)}`;


  }catch(error){

    console.error(
      "PLAYER MISSION ERROR:",
      error
    );

  }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  ROCK.go(

    ROCK?.CFG?.PAGE?.HOME ||

    "./dashboard.html"

  );

}


/* =========================================================
   START
========================================================= */

async function startMission(){

  try{

    if(!ROCK){

      throw new Error(
        "common.js โหลดไม่สำเร็จ"
      );

    }


    const ready =
      await ROCK.initLiff();


    if(!ready){
      return;
    }


    updateAutoBonus();

    updateTemplate();


    await Promise.all([

      loadPlayer(),

      refreshMissionStatus()

    ]);


    /*
      เช็กผลอนุมัติทุก 30 วินาที
      ถ้า Admin อนุมัติระหว่างเปิดหน้าอยู่
      ผู้เล่นจะได้รับข้อความแสดงความยินดี
    */

    setInterval(
      refreshMissionStatus,
      30000
    );


  }catch(error){

    console.error(
      "MISSION START ERROR:",
      error
    );


    showMissionStatus(
      error?.message ||
      String(error)
    );

  }

}


startMission();
