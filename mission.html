<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROCK YOUR BODY 2026 - MISSION</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><link rel="stylesheet" href="base.css"><script src="app-config.js"></script></head><body>
<div class="stage">
  <img class="template" src="./mission-template.png" alt="MISSION template">
  <div id="coin" class="overlay cover" style="left:76.6%;top:4.1%;width:7.2%;height:4.8%;font-size:clamp(11px,1.5vw,27px)">--</div>
  <div id="energy" class="overlay cover" style="left:88.8%;top:4.1%;width:9.3%;height:4.8%;font-size:clamp(10px,1.35vw,24px)">-- / --</div>

  <div id="dailyCoin" class="overlay cover" style="left:44.8%;top:41%;width:5.7%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>
  <div id="dailyEnergy" class="overlay cover" style="left:55.2%;top:41%;width:5.5%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>

  <div id="weeklyCount" class="overlay" style="left:89.3%;top:27.3%;width:5.2%;height:4.4%;color:#fff;font-size:clamp(10px,1.45vw,24px)">--/--</div>
  <div style="position:absolute;z-index:5;left:65.2%;top:36.1%;width:30.5%;height:1.3%;border-radius:999px;overflow:hidden"><div id="weeklyBar" style="height:100%;width:0;background:#0a63d8"></div></div>
  <div id="weeklyCoin" class="overlay cover" style="left:75.5%;top:41%;width:5.7%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>
  <div id="weeklyEnergy" class="overlay cover" style="left:86.1%;top:41%;width:5.5%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>

  <div id="monthlyCount" class="overlay" style="left:56.6%;top:59%;width:5.2%;height:4.4%;color:#fff;font-size:clamp(10px,1.45vw,24px)">--/--</div>
  <div style="position:absolute;z-index:5;left:35.2%;top:67%;width:25.9%;height:1.3%;border-radius:999px;overflow:hidden"><div id="monthlyBar" style="height:100%;width:0;background:#6c24c2"></div></div>
  <div id="monthlyCoin" class="overlay cover" style="left:44.8%;top:71%;width:5.7%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>
  <div id="monthlyEnergy" class="overlay cover" style="left:55.2%;top:71%;width:5.5%;height:4.5%;font-size:clamp(9px,1.25vw,21px)">--</div>

  <div id="bonusCount" class="overlay" style="left:89.3%;top:59%;width:5.2%;height:4.4%;color:#fff;font-size:clamp(10px,1.45vw,24px)">--/--</div>

  <button class="hotspot" style="left:34.5%;top:45.2%;width:26.9%;height:5.5%" onclick="go(CFG.PAGE.WEIGHT)" aria-label="Daily mission"></button>
  <button class="hotspot" style="left:64.8%;top:45.2%;width:31%;height:5.5%" onclick="go(CFG.PAGE.FOOD)" aria-label="Weekly mission"></button>

  <button class="hotspot" style="left:1.4%;top:83.2%;width:31.5%;height:14.5%" onclick="go(CFG.PAGE.HOME)"></button>
  <button class="hotspot" style="left:33.7%;top:83.2%;width:32.2%;height:14.5%" onclick="go(CFG.PAGE.MISSION)"></button>
  <button class="hotspot" style="left:66.5%;top:83.2%;width:32.1%;height:14.5%" onclick="go(CFG.PAGE.BATTLE)"></button>
</div><div id="status" class="status"></div><script src="common.js"></script><script>
function missionObj(m){return m&&typeof m==='object'?m:{}}
function renderOne(k,m){m=missionObj(m);const pr=num(m.progress,0),tg=num(m.target,0);$(k+'Count').textContent=tg>0?`${pr}/${tg}`:'--/--';$(k+'Bar').style.width=tg>0?pct(pr,tg)+'%':'0%';$(k+'Coin').textContent=m.rewardCoin??m.reward_coin??'--';$(k+'Energy').textContent=m.rewardEnergy??m.reward_energy??'--'}
function render(raw){const d=normalize(raw),p=d.player;$('coin').textContent=fmtInt(p.coin);$('energy').textContent=`${fmtInt(p.energy)} / ${fmtInt(p.maxEnergy)}`;$('missionPoint').textContent=raw.missionPoint??raw.mission_point??'--';renderOne('daily',d.missions.daily);renderOne('weekly',d.missions.weekly);renderOne('monthly',d.missions.monthly);renderOne('bonus',d.missions.bonus)}
(async()=>{try{showStatus('กำลังเชื่อมต่อ LINE...');if(!await initLiff())return;render(await fetchDashboard());hideStatus()}catch(e){console.error(e);showStatus(e.message||String(e),true)}})();
</script></body></html>
