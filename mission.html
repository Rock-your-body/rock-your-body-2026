  <style>

    /* =====================================================
       MISSION CLICK AREA - FIX CURRENT TEMPLATE
    ====================================================== */

    .mission-card-button{
      position:absolute;
      z-index:500;
      display:block;
      margin:0;
      padding:0;
      border:0;
      background:rgba(0,0,0,0);
      cursor:pointer;
      pointer-events:auto;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    .mission-card-button.daily{
      left:2.8%;
      top:38.4%;
      width:28.8%;
      height:5.5%;
    }

    .mission-card-button.weekly{
      left:35.0%;
      top:38.4%;
      width:29.8%;
      height:5.5%;
    }

    .mission-card-button.monthly{
      left:67.4%;
      top:38.4%;
      width:31.0%;
      height:5.5%;
    }

    .mission-card-button.bonus{
      left:2.8%;
      top:67.5%;
      width:28.8%;
      height:5.5%;
    }

    /* =====================================================
       MODAL
    ====================================================== */

    .mission-modal{

      position:fixed;

      inset:0;

      z-index:99999;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,25,65,.62);

      backdrop-filter:
        blur(3px);

    }


    .mission-modal.show{

      display:flex;

    }


    /* =====================================================
       PANEL
    ====================================================== */

    .mission-panel{

      width:min(
        100%,
        760px
      );

      max-height:92vh;

      overflow-y:auto;

      padding:
        0
        14px
        max(
          26px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        28px 28px 0 0;

      background:#f3f8ff;

      box-shadow:
        0 -12px 40px
        rgba(0,35,90,.30);

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .panel-header{

      position:sticky;

      top:0;

      z-index:30;

      display:flex;

      align-items:center;

      gap:12px;

      padding:
        16px
        2px
        14px;

      background:
        rgba(243,248,255,.97);

      backdrop-filter:
        blur(10px);

    }


    .panel-icon{

      width:52px;
      height:52px;

      flex:
        0 0 52px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:17px;

      background:#dcecff;

      font-size:27px;

    }


    .panel-title-wrap{

      flex:1;

      min-width:0;

    }


    .panel-title{

      margin:0;

      color:#073b93;

      font-size:
        clamp(
          20px,
          5vw,
          29px
        );

      font-weight:900;

      line-height:1.1;

    }


    .panel-subtitle{

      margin-top:4px;

      color:#687c9b;

      font-size:
        clamp(
          11px,
          2.8vw,
          14px
        );

      font-weight:600;

    }


    .panel-close{

      width:42px;
      height:42px;

      flex:
        0 0 42px;

      border:0;

      border-radius:50%;

      background:#e0e9f6;

      color:#153d79;

      font-size:25px;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       CATEGORY INFO
    ====================================================== */

    .category-info{

      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:8px;

      margin-bottom:14px;

    }


    .category-stat{

      padding:
        10px
        5px;

      border-radius:15px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 4px 14px
        rgba(20,60,110,.07);

    }


    .category-stat-label{

      color:#74839c;

      font-size:11px;

      font-weight:700;

    }


    .category-stat-value{

      margin-top:2px;

      color:#073b93;

      font-size:
        clamp(
          16px,
          4vw,
          22px
        );

      font-weight:900;

    }


    /* =====================================================
       SECTION TITLE
    ====================================================== */

    .mission-section-title{

      margin:
        18px
        2px
        8px;

      color:#073b93;

      font-size:16px;

      font-weight:900;

    }


    /* =====================================================
       MISSION LIST
    ====================================================== */

    .mission-list{

      display:grid;

      gap:11px;

    }


    /* =====================================================
       MISSION ITEM
    ====================================================== */

    .mission-item{

      overflow:hidden;

      border:
        1px solid #dce7f5;

      border-radius:20px;

      background:#fff;

      box-shadow:
        0 5px 16px
        rgba(20,60,110,.07);

    }


    .mission-item.pending{

      border-color:#ffd574;

      background:#fffdf6;

    }


    .mission-item.approved{

      border-color:#87d6a5;

      background:#f4fff8;

    }


    .mission-item.rejected{

      border-color:#ef9b9b;

      background:#fff7f7;

    }


    .mission-main{

      display:grid;

      grid-template-columns:
        50px
        minmax(0,1fr);

      gap:12px;

      padding:14px;

    }


    .mission-icon{

      width:50px;
      height:50px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:16px;

      background:#e6f0ff;

      font-size:25px;

    }


    .mission-name{

      color:#082f73;

      font-size:
        clamp(
          14px,
          3.4vw,
          18px
        );

      font-weight:900;

      line-height:1.3;

    }


    .mission-description{

      margin-top:4px;

      color:#6f809d;

      font-size:
        clamp(
          10px,
          2.6vw,
          13px
        );

      font-weight:500;

      line-height:1.45;

    }



    .mission-detail-grid{
      display:grid;
      gap:7px;
      margin-top:10px;
      padding:10px 11px;
      border-radius:13px;
      background:#f7faff;
      border:1px solid #e0eaf6;
    }

    .mission-detail-row{
      display:grid;
      grid-template-columns:88px minmax(0,1fr);
      gap:8px;
      align-items:start;
      color:#425c82;
      font-size:12px;
      line-height:1.45;
    }

    .mission-detail-label{
      color:#0b5ab8;
      font-weight:900;
    }

    .mission-detail-value{
      font-weight:600;
      overflow-wrap:anywhere;
    }

    /* =====================================================
       REWARD
    ====================================================== */

    .reward-row{

      display:flex;

      flex-wrap:wrap;

      gap:5px;

      margin-top:9px;

    }


    .reward-badge{

      display:inline-flex;

      align-items:center;

      gap:3px;

      padding:
        4px
        7px;

      border-radius:999px;

      background:#edf4fd;

      color:#173d78;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    /* =====================================================
       STATUS BADGE
    ====================================================== */

    .mission-status-row{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

      margin-top:9px;

    }


    .status-badge{

      display:inline-flex;

      align-items:center;

      min-height:25px;

      padding:
        4px
        9px;

      border-radius:999px;

      font-size:
        clamp(
          9px,
          2.3vw,
          12px
        );

      font-weight:800;

    }


    .status-not-submitted{

      color:#60718d;

      background:#edf2f8;

    }


    .status-pending{

      color:#996200;

      background:#fff1bd;

    }


    .status-approved{

      color:#08733a;

      background:#dff8e9;

    }


    .status-rejected{

      color:#a51c1c;

      background:#ffe1e1;

    }


    /* =====================================================
       SUBMIT BUTTON
    ====================================================== */

    .mission-submit-button{

      min-height:37px;

      padding:
        7px
        12px;

      border:0;

      border-radius:12px;

      color:#fff;

      background:#0878e8;

      font-size:
        clamp(
          10px,
          2.4vw,
          13px
        );

      font-weight:900;

      cursor:pointer;

      white-space:nowrap;

    }


    .mission-submit-button:disabled{

      cursor:default;

      background:#bdc9d8;

    }


    /* =====================================================
       EVIDENCE MODAL
    ====================================================== */

    .evidence-modal{

      position:fixed;

      inset:0;

      z-index:100000;

      display:none;

      align-items:flex-end;

      justify-content:center;

      background:
        rgba(0,20,55,.68);

    }


    .evidence-modal.show{

      display:flex;

    }


    .evidence-panel{

      width:min(
        100%,
        650px
      );

      max-height:90vh;

      overflow-y:auto;

      padding:
        18px
        16px
        max(
          25px,
          env(safe-area-inset-bottom)
        );

      border-radius:
        26px 26px 0 0;

      background:#fff;

    }


    .evidence-header{

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:10px;

    }


    .evidence-title{

      color:#073b93;

      font-size:
        clamp(
          19px,
          4.8vw,
          27px
        );

      font-weight:900;

    }


    .evidence-close{

      width:40px;
      height:40px;

      border:0;

      border-radius:50%;

      background:#e7eef7;

      color:#173b78;

      font-size:23px;

      cursor:pointer;

    }


    .evidence-mission-name{

      margin-top:7px;

      color:#183f7e;

      font-size:15px;

      font-weight:800;

    }


    .form-group{

      margin-top:16px;

    }


    .form-label{

      display:block;

      margin-bottom:6px;

      color:#324f7d;

      font-size:13px;

      font-weight:800;

    }


    .form-note{

      margin-top:5px;

      color:#7d899b;

      font-size:11px;

      line-height:1.4;

    }


    .evidence-input,
    .evidence-textarea{

      width:100%;

      border:
        1px solid #cbd9eb;

      border-radius:13px;

      background:#f9fbfe;

      color:#17365f;

    }


    .evidence-input{

      min-height:48px;

      padding:
        10px
        12px;

    }


    .evidence-textarea{

      min-height:90px;

      padding:12px;

      resize:vertical;

    }


    .file-input{

      width:100%;

      padding:12px;

      border:
        1px dashed #95b5dc;

      border-radius:14px;

      background:#f4f9ff;

    }


    .submit-evidence-button{

      width:100%;

      min-height:52px;

      margin-top:18px;

      border:0;

      border-radius:15px;

      background:#06c755;

      color:#fff;

      font-size:16px;

      font-weight:900;

      cursor:pointer;

    }



    .v2-input-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .v2-input-grid.one{
      grid-template-columns:1fr;
    }

    .v2-field{
      margin-bottom:12px;
    }

    .v2-field label{
      display:block;
      margin-bottom:6px;
      color:#315b91;
      font-size:12px;
      font-weight:900;
    }

    .v2-field input,
    .v2-field select,
    .v2-field textarea{
      width:100%;
      border:1px solid #d9e5f2;
      border-radius:12px;
      padding:11px 12px;
      background:#fff;
      color:#173454;
      font:inherit;
      outline:none;
      box-sizing:border-box;
    }

    .v2-field textarea{
      min-height:82px;
      resize:vertical;
    }

    .v2-hint{
      margin:-3px 0 12px;
      padding:9px 11px;
      border-radius:12px;
      background:#f6faff;
      color:#4b6585;
      font-size:12px;
      line-height:1.45;
    }

    .v2-week-progress{
      margin:8px 0 12px;
      padding:10px 12px;
      border-radius:12px;
      background:#eef7ff;
      color:#184f86;
      font-size:12px;
      font-weight:800;
    }

    .submit-evidence-button:disabled{

      background:#b7c4d3;

    }


    /* =====================================================
       APPROVED MESSAGE
    ====================================================== */

    .success-modal{

      position:fixed;

      inset:0;

      z-index:100001;

      display:none;

      align-items:center;

      justify-content:center;

      padding:18px;

      background:
        rgba(0,20,50,.68);

    }


    .success-modal.show{

      display:flex;

    }


    .success-card{

      width:min(
        100%,
        430px
      );

      padding:
        27px
        20px;

      border-radius:25px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 15px 50px
        rgba(0,25,70,.30);

    }


    .success-icon{

      font-size:55px;

    }


    .success-title{

      margin-top:10px;

      color:#07934b;

      font-size:25px;

      font-weight:900;

    }


    .success-name{

      margin-top:7px;

      color:#073b93;

      font-size:16px;

      font-weight:800;

    }


    .success-reward{

      margin-top:14px;

      padding:12px;

      border-radius:14px;

      background:#eef7ff;

      color:#173b78;

      font-weight:800;

      line-height:1.7;

    }


    .success-close{

      width:100%;

      min-height:47px;

      margin-top:17px;

      border:0;

      border-radius:13px;

      background:#0877e7;

      color:#fff;

      font-weight:900;

      cursor:pointer;

    }


    /* =====================================================
       TOP MESSAGE
    ====================================================== */

    #missionStatus{

      position:fixed;

      z-index:120000;

      left:50%;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      display:none;

      max-width:90vw;

      padding:
        10px
        16px;

      border-radius:999px;

      background:#0755b7;

      color:#fff;

      font-size:13px;

      font-weight:800;

      text-align:center;

    }


    #missionStatus.show{

      display:block;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:480px){

      .mission-panel{

        border-radius:
          22px 22px 0 0;

        padding-left:10px;
        padding-right:10px;

      }


      .mission-main{

        grid-template-columns:
          42px
          minmax(0,1fr);

        padding:12px;

        gap:9px;

      }


      .mission-icon{

        width:42px;
        height:42px;

        border-radius:13px;

        font-size:21px;

      }

    }

  </style>

</head>

  <button

    class="
      mission-card-button

    "

  ></button>


  <button
    type="button"
    class="
      mission-card-button

     EVIDENCE MODAL
========================================================= -->

<div

>

  <section

      class="evidence-header"

function getDailyExtra(){

  const today =
    new Date();


  const seed =
    Number(
      String(
        today.getFullYear()
      ) +
      String(
        today.getMonth() + 1
      ).padStart(2,"0") +
      String(
        today.getDate()
      ).padStart(2,"0")
    );


  const index =
    seed %
    dailyExtraPool.length;


  return dailyExtraPool[
    index
  ];
}

/* =========================================================
   LOCAL TEST STORAGE
========================================================= */

function readLocal(){

  try{

    return JSON.parse(
      localStorage.getItem(
        LOCAL_KEY
      ) ||
      "{}"
    );

  }catch{

    return {};

  }

}


function writeLocal(
  value
){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(
      value
    )
  );

}


/* =========================================================
   STATUS
========================================================= */

function getMissionStatus(
  id
){

  const local =
    readLocal();


  return (
    local[id] ||
    {
      status:
        "not_submitted",

      approvedNotified:
        false
    }
  );

}


/* =========================================================
   FIND MISSION
========================================================= */

function findMission(
  id
){

  for(
    const categoryName
    of Object.keys(
      missionData
    )
  ){

    const config =
      missionData[
        categoryName
      ];


    const missions =
      Array.isArray(
        config.missions
      )
        ? config.missions
        : config.missions;


    const found =
      missions.find(
        item =>
          item.id === id
      );


    if(found){
      return found;
    }

  }


  return null;

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategoryMissions(
  category
){

  return (
    missionData[
      category
    ]?.missions ||
    []
  );

}


/* =========================================================
   OPEN CATEGORY
========================================================= */

function openCategory(
  category
){

  if(
    !missionData[
      category
    ]
  ){
    return;
  }


  activeCategory =
    category;


  renderCategory();


  document
    .getElementById(
      "missionModal"
    )
    .classList
    .add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE CATEGORY
========================================================= */

function closeCategory(){

  document
    .getElementById(
      "missionModal"
    )
    .classList
    .remove(
      "show"
    );


  document.body.style.overflow =
    "";

}


function closeCategoryBackdrop(
  event
){

  if(
    event.target.id ===
    "missionModal"
  ){

    closeCategory();

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderCategory(){

  const config =
    missionData[
      activeCategory
    ];


  const missions =
    getCategoryMissions(
      activeCategory
    );


  document
    .getElementById(
      "panelIcon"
    )
    .textContent =
      config.icon;


  document
    .getElementById(
      "panelTitle"
    )
    .textContent =
      config.title;


  document
    .getElementById(
      "panelSubtitle"
    )
    .textContent =
      config.subtitle;


  const list =
    document
      .getElementById(
        "missionList"
      );


  list.innerHTML =
    "";


  let approvedCount =
    0;


  let lastSection =
    "";


  missions.forEach(
    mission => {


      const state =
        getMissionStatus(
          mission.id
        );


      if(
        state.status ===
        "approved"
      ){

        approvedCount++;

      }


      if(
        mission.section &&
        mission.section !==
        lastSection
      ){

        lastSection =
          mission.section;


        const section =
          document
            .createElement(
              "div"
            );


        section.className =
          "mission-section-title";


        section.textContent =
          mission.section;


        list.appendChild(
          section
        );

      }


      const item =
        document
          .createElement(
            "article"
          );


      item.className =
        `mission-item ${state.status}`;


      let statusText =
        "ยังไม่ได้ส่งหลักฐาน";


      let statusClass =
        "status-not-submitted";


      if(
        state.status ===
        "pending"
      ){

        statusText =
          "⏳ รอ Admin ตรวจสอบ";

        statusClass =
          "status-pending";

      }


      if(
        state.status ===
        "approved"
      ){

        statusText =
          "✅ Admin อนุมัติแล้ว";

        statusClass =
          "status-approved";

      }


      if(
        state.status ===
        "rejected"
      ){

        statusText =
          "❌ ไม่ผ่าน กรุณาส่งใหม่";

        statusClass =
          "status-rejected";

      }


      if(
        mission.auto
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ สำเร็จแล้ว"
            : "ตรวจสำเร็จอัตโนมัติ";

      }


      if(
        mission.adminOnly
      ){

        statusText =
          state.status ===
          "approved"
            ? "✅ Admin มอบ Bonus แล้ว"
            : "รอการคัดเลือกจาก Admin";

      }


      let canSubmit =

        !mission.auto &&
        !mission.adminOnly &&
        state.status !==
          "pending" &&
        state.status !==
          "approved";


      if(
        mission.id ===
        "weekly_aerobic"
      ){

        canSubmit =
          weeklyAerobicCanSubmit();

        statusText =
          weeklyAerobicProgressText();

        statusClass =
          canSubmit
            ? "status-not-submitted"
            : "status-pending";

      }


      item.innerHTML = `

        <div class="mission-main">

          <div class="mission-icon">
            ${mission.icon}
          </div>


          <div>

            <div class="mission-name">
              ${mission.name}
            </div>


            <div class="mission-description">
              ${mission.description}
            </div>

            <div class="mission-detail-grid">

              <div class="mission-detail-row">
                <div class="mission-detail-label">ผู้ใช้กรอก</div>
                <div class="mission-detail-value">
                  ${mission.userInput || "รายละเอียดกิจกรรม"}
                </div>
              </div>

              <div class="mission-detail-row">
                <div class="mission-detail-label">หลักฐาน</div>
                <div class="mission-detail-value">
                  ${mission.evidenceText || (
                    mission.evidence === "video"
                      ? "วิดีโอ"
                      : mission.evidence === "photo_link"
                        ? "รูปภาพ + Link"
                        : mission.evidence === "photo_or_video"
                          ? "รูปภาพ / วิดีโอ"
                          : "รูปภาพ"
                  )}
                </div>
              </div>

              <div class="mission-detail-row">
                <div class="mission-detail-label">ผ่านเมื่อ</div>
                <div class="mission-detail-value">
                  ${mission.passCondition || "Admin ตรวจสอบตามเงื่อนไขภารกิจ"}
                </div>
              </div>

            </div>


            <div class="reward-row">

              <span class="reward-badge">
                ⭐ +${mission.reward.coin}
                ROCK COIN
              </span>


              <span class="reward-badge">
                ⚡ +${mission.reward.energy}
                ENERGY
              </span>


              <span class="reward-badge">
                🏆 +${mission.reward.exp}
                EXP
              </span>

            </div>


            <div class="mission-status-row">

              <span
                class="
                  status-badge
                  ${statusClass}
                "
              >
                ${statusText}
              </span>


              ${
                canSubmit
                  ? `

                    <button
                      type="button"
                      class="mission-submit-button"
                      onclick="
                        openEvidence(
                          '${mission.id}'
                        )
                      "
                    >
                      ส่งหลักฐาน
                    </button>

                  `
                  : ""
              }

            </div>

          </div>

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );


  const total =
    missions.length;


  const percent =
    total > 0

      ? Math.round(
          (
            approvedCount /
            total
          ) * 100
        )

      : 0;


  document
    .getElementById(
      "statApproved"
    )
    .textContent =
      approvedCount;


  document
    .getElementById(
      "statTotal"
    )
    .textContent =
      total;


  document
    .getElementById(
      "statPercent"
    )
    .textContent =
      `${percent}%`;


  updateTemplate();

}

========================================================= */

async function loadMissionCatalog(){

  if(!MISSION_API){
    return null;
  }

  try{

    const idToken =
      ROCK?.getIdToken?.() ||
      window.liff?.getIDToken?.();

    if(!idToken){
      return null;
    }

    const response =
      await fetch(
        MISSION_API,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            action:"missionCatalog",
            idToken
          })
        }
      );

    const raw =
      await response.text();

    let result = {};

    try{
      result =
        raw
          ? JSON.parse(raw)
          : {};
    }catch{
      throw new Error(
        `Mission Catalog JSON ไม่ถูกต้อง HTTP ${response.status}`
      );
    }

    if(
      !response.ok ||
      result?.success === false
    ){
      throw new Error(
        result?.error ||
        result?.message ||
        `HTTP ${response.status}`
      );
    }

    missionCatalogState =
      result;

    /*
      MONTHLY:
      แสดงเฉพาะหัวข้อของเดือนปัจจุบันจาก backend
      ถ้าเดือนนี้ไม่มี schedule ให้ monthly เป็นรายการว่าง
    */
    if(result?.monthly){

      const m =
        result.monthly;

      missionData.monthly.missions = [
        {
          section:"MISSION ประจำเดือน",
          id:
            m.mission_id ||
            "monthly_tiktok",
          icon:"🎬",
          name:
            m.mission_name ||
            "HEALTHY TIKTOK CHALLENGE",
          topic:
            m.topic ||
            "",
          description:
            `${m.description || "สร้างคลิป TikTok เกี่ยวกับการดูแลสุขภาพ"} หัวข้อประจำเดือน: ${m.topic || "-"}`,
          userInput:
            "รายละเอียดคลิป + Link TikTok",
          evidenceText:
            "Screenshot โพสต์ TikTok + Link คลิป",
          passCondition:
            `คลิป ${m.min_video_seconds || 15}–${m.max_video_seconds || 60} วินาที ตรงหัวข้อ ${m.topic || ""} และมี ${m.hashtag || "#RockYourBody2026"}`,
          evidence:"photo_link",
          requireLink:true,
          reward:{
            coin:Number(m.reward_coin || 100),
            energy:Number(m.reward_energy || 100),
            exp:Number(m.reward_exp || 150)
          }
        }
      ];

    }else{

      missionData.monthly.missions = [];

    }

    if(
      document
        .getElementById("missionModal")
        ?.classList
        .contains("show")
    ){
      renderCategory();
    }

    updateTemplate();

    return result;

  }catch(error){

    console.error(
      "MISSION CATALOG ERROR:",
      error
    );

    return null;
  }
}


function weeklyAerobicCanSubmit(){

  const weekly =
    missionCatalogState?.weekly;

  if(!weekly){
    return true;
  }

  const currentDate =
    missionCatalogState
      ?.current
      ?.date ||
    "";

  const submissions =
    Array.isArray(
      weekly.submissions
    )
      ? weekly.submissions
      : [];

  const sameDay =
    submissions.some(
      item =>
        String(
          item?.activity_date ||
          ""
        ) === currentDate
    );

  const submittedCount =
    Number(
      weekly.submittedCount ||
      submissions.length ||
      0
    );

  return (
    !sameDay &&
    submittedCount < 3
  );
}


function weeklyAerobicProgressText(){

  const weekly =
    missionCatalogState?.weekly;

  if(!weekly){
    return "เป้าหมาย 3 ครั้ง / สัปดาห์";
  }

  const count =
    Number(
      weekly.submittedCount ||
      0
    );

  return `ทำแล้ว ${count} / 3 ครั้งในสัปดาห์นี้`;
}

/* =========================================================
   SUBMIT EVIDENCE
========================================================= */
async function submitEvidence(){

  const mission =
    findMission(
      activeMissionId
    );

  if(!mission){
    showMissionStatus(
      "ไม่พบข้อมูลภารกิจ"
    );
    return;
  }

  const fileInput =
    document
      .getElementById(
        "evidenceFile"
      );

  const linkInput =
    document
      .getElementById(
        "evidenceLink"
      );

  const noteInput =
    document
      .getElementById(
        "evidenceNote"
      );

  const button =
    document
      .getElementById(
        "submitEvidenceButton"
      );

  const file =
    fileInput
      ?.files
      ?.[0] ||
    null;

  const link =
    linkInput
      ?.value
      ?.trim() ||
    "";

  let note =
    noteInput
      ?.value
      ?.trim() ||
    "";

  if(
    mission.requireLink &&
    !link
  ){
    showMissionStatus(
      "กรุณาใส่ Link TikTok"
    );
    return;
  }

  if(
    !file &&
    !link
  ){
    showMissionStatus(
      "กรุณาเลือกรูป / VDO หรือใส่ Link"
    );
    return;
  }

  if(!MISSION_API){
    showMissionStatus(
      "ไม่พบ MISSION API"
    );
    return;
  }

  if(!button){
    return;
  }

  if(
    file &&
    file.size >
      50 * 1024 * 1024
  ){
    showMissionStatus(
      "ไฟล์ต้องมีขนาดไม่เกิน 50 MB"
    );
    return;
  }

  const form =
    new FormData();

  /*
    DAILY: MOVE MORE
  */
  if(
    mission.id ===
    "daily_move_more"
  ){

    const steps =
      Number(
        document
          .getElementById(
            "v2Steps"
          )
          ?.value ||
        0
      );

    if(
      !Number.isFinite(steps) ||
      steps <= 0
    ){
      showMissionStatus(
        "กรุณากรอกจำนวนก้าว"
      );
      return;
    }

    form.append(
      "steps",
      String(
        Math.round(steps)
      )
    );
  }


  /*
    DAILY: SLEEP WELL
  */
  if(
    mission.id ===
    "daily_sleep"
  ){

    const hours =
      Number(
        document
          .getElementById(
            "v2SleepHours"
          )
          ?.value ||
        0
      );

    const minutes =
      Number(
        document
          .getElementById(
            "v2SleepMinutesPart"
          )
          ?.value ||
        0
      );

    const sleepTotal =
      (
        Math.max(
          0,
          Math.round(hours)
        ) *
        60
      ) +
      Math.max(
        0,
        Math.round(minutes)
      );

    if(
      sleepTotal <= 0 ||
      sleepTotal > 1440
    ){
      showMissionStatus(
        "กรุณากรอกเวลานอนให้ถูกต้อง"
      );
      return;
    }

    const bedTime =
      document
        .getElementById(
          "v2BedTime"
        )
        ?.value ||
      "";

    const wakeTime =
      document
        .getElementById(
          "v2WakeTime"
        )
        ?.value ||
      "";

    form.append(
      "sleepMinutes",
      String(sleepTotal)
    );

    note =
      [
        note,
        bedTime
          ? `เวลานอน ${bedTime}`
          : "",
        wakeTime
          ? `เวลาตื่น ${wakeTime}`
          : ""
      ]
        .filter(Boolean)
        .join(" | ");
  }


  /*
    DAILY: EAT SMART
  */
  if(
    mission.id ===
    "daily_eat_smart"
  ){

    const mealType =
      document
        .getElementById(
          "v2MealType"
        )
        ?.value ||
      "";

    const mealName =
      document
        .getElementById(
          "v2MealName"
        )
        ?.value
        ?.trim() ||
      "";

    const mealDescription =
      document
        .getElementById(
          "v2MealDescription"
        )
        ?.value
        ?.trim() ||
      "";

    if(
      !mealType ||
      !mealName
    ){
      showMissionStatus(
        "กรุณาเลือกมื้อและกรอกชื่อเมนู"
      );
      return;
    }

    form.append(
      "mealType",
      mealType
    );

    form.append(
      "mealName",
      mealName
    );

    form.append(
      "mealDescription",
      mealDescription
    );
  }


  /*
    DAILY: HYDRATE
  */
  if(
    mission.id ===
    "daily_hydrate"
  ){

    const amount =
      Number(
        document
          .getElementById(
            "v2WaterAmount"
          )
          ?.value ||
        0
      );

    const unit =
      document
        .getElementById(
          "v2WaterUnit"
        )
        ?.value ||
      "glass";

    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){
      showMissionStatus(
        "กรุณากรอกปริมาณน้ำ"
      );
      return;
    }

    const waterMl =
      unit === "glass"
        ? Math.round(
            amount * 250
          )
        : Math.round(
            amount
          );

    form.append(
      "waterMl",
      String(waterMl)
    );
  }


  /*
    DAILY / WEEKLY EXERCISE
  */
  if(
    mission.id ===
      "daily_exercise_30" ||
    mission.id ===
      "weekly_aerobic"
  ){

    const exerciseType =
      document
        .getElementById(
          "v2ExerciseType"
        )
        ?.value ||
      "";

    const exerciseMinutes =
      Number(
        document
          .getElementById(
            "v2ExerciseMinutes"
          )
          ?.value ||
        0
      );

    if(!exerciseType){
      showMissionStatus(
        "กรุณาเลือกประเภทกิจกรรม"
      );
      return;
    }

    if(
      !Number.isFinite(
        exerciseMinutes
      ) ||
      exerciseMinutes <= 0
    ){
      showMissionStatus(
        "กรุณากรอกระยะเวลาออกกำลังกาย"
      );
      return;
    }

    if(
      mission.id ===
        "daily_exercise_30" &&
      exerciseMinutes < 30
    ){
      showMissionStatus(
        "EXERCISE ต้องอย่างน้อย 30 นาที"
      );
      return;
    }

    form.append(
      "exerciseType",
      exerciseType
    );

    form.append(
      "exerciseMinutes",
      String(
        Math.round(
          exerciseMinutes
        )
      )
    );
  }


  button.disabled =
    true;

  button.textContent =
    "กำลังส่งหลักฐาน...";


  try{

    const idToken =
      ROCK?.getIdToken?.() ||
      window.liff?.getIDToken?.();

    if(!idToken){
      throw new Error(
        "ไม่พบ LINE ID Token"
      );
    }


    form.append(
      "action",
      "submitEvidence"
    );

    form.append(
      "idToken",
      idToken
    );

    form.append(
      "missionId",
      String(
        mission.id
      )
    );

    form.append(
      "category",
      String(
        activeCategory
      )
    );

    form.append(
      "note",
      note
    );

    form.append(
      "link",
      link
    );

    if(file){
      form.append(
        "file",
        file,
        file.name
      );
    }


    const response =
      await fetch(
        MISSION_API,
        {
          method:"POST",
          body:form
        }
      );


    const raw =
      await response.text();

    let result = {};

    try{
      result =
        raw
          ? JSON.parse(raw)
          : {};
    }catch{
      throw new Error(
        `Server ตอบกลับไม่ถูกต้อง HTTP ${response.status}`
      );
    }


    if(
      !response.ok ||
      result?.success === false
    ){
      throw new Error(
        result?.error ||
        result?.message ||
        result?.details ||
        `HTTP ${response.status}`
      );
    }


    const local =
      readLocal();

    local[mission.id] = {
      ...local[mission.id],
      status:"pending",
      submittedAt:
        new Date()
          .toISOString(),
      fileName:
        file?.name ||
        "",
      link,
      note,
      estimatedCalories:
        result
          ?.calculated
          ?.estimatedCalories ??
        null,
      approvedNotified:false
    };

    writeLocal(
      local
    );

    closeEvidence();

    updateTemplate();

    await loadMissionCatalog();

    await loadMissionCatalog();

    await refreshMissionStatus();

    if(
      document
        .getElementById(
          "missionModal"
        )
        ?.classList
        .contains("show")
    ){
      renderCategory();
    }

    const calories =
      Number(
        result
          ?.calculated
          ?.estimatedCalories ||
        0
      );

    showMissionStatus(
      calories > 0
        ? `✅ ส่งหลักฐานแล้ว • ประมาณ ${calories} kcal • รอ Admin ตรวจสอบ`
        : "✅ ส่งหลักฐานแล้ว รอ Admin ตรวจสอบ"
    );


  }catch(error){

    console.error(
      "MISSION SUBMIT ERROR:",
      error
    );

    showMissionStatus(
      "ERROR: " +
      (
        error?.message ||
        String(error) ||
        "UNKNOWN ERROR"
      )
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "ส่งหลักฐานให้ Admin ตรวจสอบ";

  }

}


/* =========================================================
   LOAD CURRENT-PERIOD STATUS FROM API
   STEP 4.2
========================================================= */

async function refreshMissionStatus(){

  if(!MISSION_API){
    updateTemplate();
    return null;
  }

  try{

    const idToken =
      ROCK?.getIdToken?.() ||
      window.liff?.getIDToken?.();

    if(!idToken){
      return null;
    }

    const response = await fetch(
      MISSION_API,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          action:"myMissionStatus",
          idToken
        })
      }
    );

    const raw = await response.text();
    let result = {};

    try{
      result = raw ? JSON.parse(raw) : {};
    }catch{
      throw new Error(
        `Mission Status JSON ไม่ถูกต้อง HTTP ${response.status}`
      );
    }

    if(!response.ok || result?.success === false){
      throw new Error(
        result?.error ||
        result?.message ||
        `HTTP ${response.status}`
      );
    }

    /* =====================================================
       RESET CURRENT UI STATUS
       ล้างสถานะเก่าก่อน เพื่อไม่ให้ Approved/Pending
       จาก period ก่อนหน้าค้างใน localStorage
    ====================================================== */

    const oldLocal = readLocal();
    const local = {};

    for(const category of Object.keys(missionData)){
      for(const mission of getCategoryMissions(category)){
        local[mission.id] = {
          status:"not_submitted",
          approvedNotified:false
        };
      }
    }

    /* =====================================================
       APPLY CURRENT PERIOD DATA FROM BACKEND
    ====================================================== */

    const submissions = Array.isArray(result?.submissions)
      ? result.submissions
      : [];

    submissions.forEach(item=>{

      const missionId =
        item?.mission_id ||
        item?.missionId;

      if(!missionId){
        return;
      }

      const old = oldLocal[missionId] || {};

      local[missionId] = {
        ...local[missionId],

        status:
          item?.status ||
          "pending",

        periodKey:
          item?.period_key ||
          null,

        approvedAt:
          item?.approved_at ||
          item?.approvedAt ||
          null,

        reviewedAt:
          item?.reviewed_at ||
          item?.reviewedAt ||
          null,

        rejectReason:
          item?.reject_reason ||
          item?.rejected_reason ||
          item?.rejectReason ||
          "",

        rewardGranted:
          item?.reward_granted === true,

        submittedAt:
          item?.submitted_at ||
          item?.submittedAt ||
          null,

        approvedNotified:
          (
            old?.periodKey === item?.period_key &&
            old?.approvedNotified === true
          )
      };
    });

    writeLocal(local);
    updateTemplate();
    checkApprovedMessage();

    if(
      document
        .getElementById("missionModal")
        ?.classList
        .contains("show")
    ){
      renderCategory();
    }

    return result;

  }catch(error){

    console.error(
      "MISSION STATUS ERROR:",
      error
    );

    return null;
  }
}

/* =========================================================
   MAIN PROGRESS
========================================================= */
function countApprovedMission(category){
  return getCategoryMissions(category).filter(m=>getMissionStatus(m.id)?.status === 'approved').length;
}

function updateTemplate(){
  ['daily','weekly','monthly','bonus'].forEach(category=>{
    const total = getCategoryMissions(category).length;
    const approved = countApprovedMission(category);
    const count = document.getElementById(`${category}Count`);
    const progress = document.getElementById(`${category}Progress`);
    if(count) count.textContent = `${approved} / ${total}`;
    if(progress) progress.style.width = `${total ? Math.min(100,(approved/total)*100) : 0}%`;
  });
}

/* =========================================================
   SUCCESS MODAL
========================================================= */
function checkApprovedMessage(){
  const local = readLocal();
  for(const category of Object.keys(missionData)){
    for(const mission of getCategoryMissions(category)){
      const state = local[mission.id];
      if(!state || state.status !== 'approved' || state.approvedNotified === true) continue;
      const name = document.getElementById('successMissionName');
      const reward = document.getElementById('successReward');
      if(name) name.textContent = mission.name;
      if(reward) reward.innerHTML = `⭐ +${mission.reward.coin} ROCK COIN<br>⚡ +${mission.reward.energy} ENERGY<br>🏆 +${mission.reward.exp} EXP`;
      document.getElementById('successModal')?.classList.add('show');
      local[mission.id] = {...state,approvedNotified:true};
      writeLocal(local);
      return;
    }
  }
}
function closeSuccess(){ document.getElementById('successModal')?.classList.remove('show'); }

/* =========================================================
   STATUS MESSAGE
========================================================= */
let missionStatusTimer = null;
function showMissionStatus(message){
  const el = document.getElementById('missionStatus');
  if(!el){ console.log(message); return; }
  el.textContent = String(message || '');
  el.classList.add('show');
  if(missionStatusTimer) clearTimeout(missionStatusTimer);
  missionStatusTimer = setTimeout(()=>el.classList.remove('show'),3500);
}

/* =========================================================
   DASHBOARD / COIN / ENERGY
========================================================= */
function applyMissionDashboard(raw){
  const d = raw?.data || raw?.dashboard || raw;
  if(!d) return;
  const coin = Number(d?.rockCoin ?? d?.rock_coin ?? d?.coin ?? 0) || 0;
  const current = Number(d?.energy?.current ?? d?.currentEnergy ?? d?.current_energy ?? d?.energy ?? 0) || 0;
  const max = Number(d?.energy?.max ?? d?.maxEnergy ?? d?.max_energy ?? window.APP_CONFIG?.MAX_ENERGY ?? 200) || 200;
  const coinEl = document.getElementById('missionCoin');
  const energyEl = document.getElementById('missionEnergy');
  if(coinEl) coinEl.textContent = coin.toLocaleString('en-US');
  if(energyEl) energyEl.textContent = `${current.toLocaleString('en-US')} / ${max.toLocaleString('en-US')}`;
}

async function loadMissionDashboard(){
  try{
    let data = null;
    if(typeof ROCK?.dashboard === 'function') data = await ROCK.dashboard();
    else if(typeof ROCK?.fetchDashboard === 'function') data = await ROCK.fetchDashboard();
    else if(typeof ROCK?.getDashboard === 'function') data = await ROCK.getDashboard();
    if(data) applyMissionDashboard(data);
    return data;
  }catch(error){
    console.error('MISSION DASHBOARD ERROR:',error);
    return null;
  }
}

/* =========================================================
   NAVIGATION
========================================================= */
function goHome(){

  const url =
    window.APP_CONFIG?.PAGE?.HOME ||
    "./dashboard.html";

  /*
    ใช้ location.href ตรง ๆ
    ไม่ส่งคำว่า "HOME" เข้า ROCK.go()
    เพราะ ROCK.go() ควรได้รับ URL จริง ไม่ใช่ key
  */
  window.location.href =
    url;
}


function goBattle(){

  const url =
    window.APP_CONFIG?.PAGE?.BATTLE ||
    "./battle.html";

  /*
    ใช้ location.href ตรง ๆ เพื่อให้ทำงานได้
    แม้ common.js / ROCK navigation มีปัญหา
  */
  window.location.href =
    url;
}

/* =========================================================
   INITIALIZE LIFF
========================================================= */
async function prepareMissionApp(){
  if(!window.ROCK) throw new Error('common.js โหลดไม่สำเร็จ');
  if(typeof ROCK.initLiff === 'function'){
    const liffId = window.APP_CONFIG?.LIFF_ID || ROCK?.CFG?.LIFF?.HOME || undefined;
    const ready = await ROCK.initLiff(liffId);
    if(ready === false) return false;
  }
  return true;
}

/* =========================================================
   START PAGE
========================================================= */
let missionPageStarted = false;
let missionRefreshTimer = null;

async function initMissionPage(){
  if(missionPageStarted) return;
  missionPageStarted = true;
  updateTemplate();
  try{
    const ready = await prepareMissionApp();
    if(ready === false) return;
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
    updateTemplate();
    checkApprovedMessage();
  }catch(error){
    console.error('MISSION INIT ERROR:',error);
    showMissionStatus(error?.message || 'ระบบยังไม่พร้อม');
  }
}

function startMissionRefresh(){
  if(missionRefreshTimer) clearInterval(missionRefreshTimer);
  const ms = Number(window.APP_CONFIG?.REFRESH_MS || ROCK?.CFG?.REFRESH_MS) || 30000;
  missionRefreshTimer = setInterval(async()=>{
    if(document.visibilityState !== 'visible') return;
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
  },ms);
}

document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState === 'visible'){
    await Promise.allSettled([loadMissionDashboard(),refreshMissionStatus()]);
  }
});

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded',async()=>{
    await initMissionPage();
    startMissionRefresh();
  },{once:true});
}else{
  initMissionPage().then(startMissionRefresh);
}
</script>
