<script>
"use strict";


/* ============================================================
   ROCK YOUR BODY 2026
   BATTLE MAP V8
============================================================ */


/* ============================================================
   BASIC
============================================================ */

const $ =
  id =>
    document.getElementById(id);


const CFG =
  window.APP_CONFIG ||
  {};


const LIFF_ID =
  CFG.LIFF_ID ||
  "2011201679-uNWz5yqF";


const MAX_ENERGY =
  Number(
    CFG.MAX_ENERGY ||
    200
  );


/* ============================================================
   STAGE CONFIG
============================================================ */

const STAGE_CONFIG = {

  1:{
    name:"เจ้าจอมเอื่อย",
    expRequired:300
  },

  2:{
    name:"จอมหวาน",
    expRequired:900
  },

  3:{
    name:"ปีศาจของทอด",
    expRequired:1500
  },

  4:{
    name:"จอมเค็ม",
    expRequired:2100
  },

  5:{
    name:"ราชาอาหารไร้ประโยชน์",
    expRequired:2700
  },

  6:{
    name:"ปีศาจพักผ่อนน้อย",
    expRequired:3300
  },

  7:{
    name:"จอมเนือยนิ่ง",
    expRequired:3900
  },

  8:{
    name:"ปีศาจพฤติกรรมเสี่ยง",
    expRequired:4500
  },

  9:{
    name:"ราชาความเสี่ยงสุขภาพ",
    expRequired:5100
  },

  10:{
    name:"จอมมาร Final Boss",
    expRequired:5700
  }

};


/* ============================================================
   STATE
============================================================ */

let battleState =
  null;


/* ============================================================
   STATUS
============================================================ */

function showLoading(
  show
){

  $("loading")
    .classList
    .toggle(
      "hide",
      !show
    );
}


function toast(
  message,
  error = false
){

  const el =
    $("toast");


  el.textContent =
    String(
      message ||
      ""
    );


  el.classList
    .toggle(
      "error",
      error
    );


  el.classList
    .add(
      "show"
    );


  clearTimeout(
    window.__battleMapToast
  );


  window.__battleMapToast =
    setTimeout(
      ()=>{

        el.classList
          .remove(
            "show"
          );

      },
      error
        ? 4500
        : 2300
    );
}


/* ============================================================
   BATTLE API
============================================================ */

function battleApi(){

  if(
    CFG?.getApi
  ){

    return CFG.getApi(
      "BATTLE"
    );
  }


  const url =
    CFG
      ?.API
      ?.BATTLE;


  if(!url){

    throw new Error(
      "ไม่พบ API.BATTLE"
    );
  }


  return url;
}


/* ============================================================
   LIFF
============================================================ */

async function initLine(){

  if(
    !window.liff
  ){

    throw new Error(
      "ไม่พบ LINE LIFF SDK"
    );
  }


  await liff.init({
    liffId:LIFF_ID
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        location.href
    });


    return false;
  }


  const token =
    liff.getIDToken();


  if(
    !token ||
    token
      .split(".")
      .length !==
      3
  ){

    liff.logout();


    liff.login({
      redirectUri:
        location.href
    });


    return false;
  }


  return true;
}


/* ============================================================
   API POST

   ใช้ protocol เดียวกับ Battle V6.x:
   idToken อยู่ใน JSON body
============================================================ */

async function postBattle(
  action,
  payload = {}
){

  const idToken =
    liff.getIDToken();


  if(
    !idToken
  ){

    throw new Error(
      "INVALID_LINE_ID_TOKEN"
    );
  }


  const response =
    await fetch(
      battleApi(),
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        cache:
          "no-store",

        body:
          JSON.stringify({

            action,
            idToken,

            ...payload

          })

      }
    );


  const raw =
    await response.text();


  let data =
    {};


  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      "Battle API ตอบกลับไม่ใช่ JSON"
    );
  }


  if(
    !response.ok ||
    data?.success ===
    false
  ){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* ============================================================
   RENDER
============================================================ */

function render(
  data
){

  battleState =
    data;


  const player =
    data?.player ||
    {};


  const energy =
    data?.healthEnergy ||
    {};


  const exp =
    Number(
      player?.exp ||
      0
    );


  const availableEnergy =
    Number(
      energy?.available ||
      0
    );


  const maxEnergy =
    Number(
      energy?.max ||
      MAX_ENERGY
    );


  $("playerExp")
    .textContent =
      `EXP ${exp.toLocaleString()}`;


  $("playerEnergy")
    .textContent =
      `⚡ ${availableEnergy.toLocaleString()} / ${maxEnergy.toLocaleString()}`;


  const apiStages =
    Array.isArray(
      data?.stages
    )
      ? data.stages
      : [];


  for(
    let stageNo = 1;
    stageNo <= 10;
    stageNo++
  ){

    const config =
      STAGE_CONFIG[
        stageNo
      ];


    const apiStage =
      apiStages.find(
        item =>
          Number(
            item.id
          ) ===
          stageNo
      ) ||
      {};


    const expRequired =
      Number(
        apiStage?.expRequired ??
        config.expRequired
      );


    /*
      Backend เป็นแหล่งข้อมูลหลัก

      ถ้า backend ไม่มี unlocked
      จะคำนวณจาก EXP
    */

    const unlocked =
      typeof apiStage?.unlocked ===
      "boolean"
        ? apiStage.unlocked
        : exp >= expRequired;


    const completed =
      Boolean(
        apiStage?.completed
      );


    const button =
      $(
        `stage${stageNo}`
      );


    const status =
      button.querySelector(
        ".stage-status"
      );


    button
      .classList
      .remove(
        "locked",
        "unlocked",
        "completed"
      );


    if(
      completed
    ){

      button
        .classList
        .add(
          "completed"
        );


      status.textContent =
        `✅ ผ่าน Stage ${stageNo}`;

    }else if(
      unlocked
    ){

      button
        .classList
        .add(
          "unlocked"
        );


      status.textContent =
        `⚔️ Stage ${stageNo}`;

    }else{

      button
        .classList
        .add(
          "locked"
        );


      status.textContent =
        `🔒 EXP ${expRequired.toLocaleString()}`;
    }


    button.onclick =
      ()=>{

        openStage(
          stageNo,
          {
            unlocked,
            completed,
            expRequired
          }
        );

      };

  }

}


/* ============================================================
   OPEN STAGE
============================================================ */

function openStage(
  stageNo,
  stageState
){

  if(
    !stageState.unlocked &&
    !stageState.completed
  ){

    const playerExp =
      Number(
        battleState
          ?.player
          ?.exp ||
        0
      );


    const missing =
      Math.max(
        0,
        stageState.expRequired -
        playerExp
      );


    toast(
      `🔒 Stage ${stageNo} ต้องมี EXP ${stageState.expRequired.toLocaleString()} • ขาดอีก ${missing.toLocaleString()} EXP`,
      true
    );


    return;
  }


  /*
    เปิด battle_stage.html
  */

  const stagePage =
    CFG
      ?.PAGE
      ?.BATTLE_STAGE ||
    "./battle_stage.html";


  window.location
    .assign(
      `${stagePage}?stage=${encodeURIComponent(stageNo)}`
    );
}


/* ============================================================
   BACK
============================================================ */

$("backButton")
  .addEventListener(
    "click",
    ()=>{

      window.location
        .assign(
          CFG
            ?.PAGE
            ?.BATTLE ||
          "./battle.html"
        );

    }
  );


/* ============================================================
   MAP IMAGE ERROR
============================================================ */

$("mapImage")
  .addEventListener(
    "error",
    ()=>{

      toast(
        "ไม่พบไฟล์ battle map.jpeg",
        true
      );

    }
  );


/* ============================================================
   START
============================================================ */

(async()=>{

  showLoading(
    true
  );


  try{

    const ready =
      await initLine();


    if(
      ready ===
      false
    ){

      return;
    }


    /*
      Battle backend V6.x
    */

    const data =
      await postBattle(
        "mapV5"
      );


    render(
      data
    );


  }catch(error){

    console.error(
      "[BATTLE MAP]",
      error
    );


    /*
      ถ้า Token เสีย
      ให้ Login ใหม่
    */

    if(
      String(
        error?.message ||
        ""
      )
        .includes(
          "INVALID_LINE_ID_TOKEN"
        )
    ){

      try{

        liff.logout();


        liff.login({
          redirectUri:
            location.href
        });


        return;

      }catch(_){}
    }


    toast(
      error?.message ||
      String(error),
      true
    );


  }finally{

    showLoading(
      false
    );
  }

})();

</script>
