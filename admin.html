<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Mission Control</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #17325c;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .admin-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(20, 50, 100, 0.08);
      margin-bottom: 20px;
    }

    .title {
      margin: 0 0 6px;
      color: #0d3477;
      font-size: 28px;
      font-weight: 900;
    }

    .subtitle {
      color: #73809a;
      margin-bottom: 20px;
    }

    .player-info {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 14px;
      border-radius: 14px;
      background: #eef4ff;
      margin-bottom: 18px;
    }

    .player-info strong {
      color: #0c367f;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .mission {
      border: 1px solid #d9e3f2;
      border-radius: 16px;
      padding: 16px;
      background: #fff;
    }

    .mission-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .mission-name {
      font-size: 18px;
      font-weight: 900;
      color: #123d84;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .pending {
      background: #fff4cc;
      color: #8a6500;
    }

    .approved {
      background: #dbf7e7;
      color: #087443;
    }

    .cancelled {
      background: #ffe0e0;
      color: #b21f1f;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-cancel {
      background: #d62828;
      color: #fff;
    }

    .btn-reset {
      background: #0d5bd7;
      color: #fff;
    }

    .btn-cancel-all {
      background: #8f1f1f;
      color: #fff;
    }

    .btn-reset-all {
      background: #138a54;
      color: #fff;
    }

    .global-actions {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #dfe6f1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .log {
      margin-top: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      color: #53627c;
    }

    @media (max-width: 750px) {
      .mission-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="admin-card">
    <h1 class="title">🛠 Admin Mission Control</h1>
    <div class="subtitle">
      จัดการ Mission ของผู้เล่นรายวัน
    </div>

    <div class="player-info">
      <div><strong>Player ID:</strong> <span id="playerIdText">USER001</span></div>
      <div><strong>วันที่:</strong> <span id="dateText"></span></div>
    </div>

    <div id="missionList" class="mission-grid"></div>

    <div class="global-actions">
      <button class="btn-cancel-all" onclick="cancelAllMissions()">
        ❌ ยกเลิกทุก Mission วันนี้
      </button>

      <button class="btn-reset-all" onclick="resetAllMissions()">
        🔄 คืนสถานะทุก Mission ให้ทำใหม่
      </button>
    </div>

    <div class="log" id="adminLog">
      ยังไม่มีการดำเนินการ
    </div>
  </div>

</div>

<script>
  const PLAYER_ID = "USER001";

  const MISSION_LIST = [
    { id: "moveMore", name: "🚶 MOVE MORE" },
    { id: "sleepWell", name: "😴 SLEEP WELL" },
    { id: "eatSmart", name: "🥗 EAT SMART" },
    { id: "hydrate", name: "💧 HYDRATE" }
  ];

  function getTodayKey() {
    const now = new Date();

    return [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, "0"),
      String(now.getDate()).padStart(2, "0")
    ].join("-");
  }

  function getStorageKey() {
    return `mission_${PLAYER_ID}_${getTodayKey()}`;
  }

  function createDefaultData() {
    const missions = {};

    MISSION_LIST.forEach(item => {
      missions[item.id] = {
        status: "pending",
        completed: false,
        approved: false,
        rewardClaimed: false,
        cancelledByAdmin: false,
        cancelledAt: null
      };
    });

    return {
      playerId: PLAYER_ID,
      date: getTodayKey(),
      missions: missions,
      updatedAt: new Date().toISOString()
    };
  }

  function loadMissionData() {
    const key = getStorageKey();
    const saved = localStorage.getItem(key);

    if (!saved) {
      const data = createDefaultData();
      saveMissionData(data);
      return data;
    }

    try {
      return JSON.parse(saved);
    } catch (error) {
      console.error("Mission data error:", error);

      const data = createDefaultData();
      saveMissionData(data);
      return data;
    }
  }

  function saveMissionData(data) {
    data.updatedAt = new Date().toISOString();

    localStorage.setItem(
      getStorageKey(),
      JSON.stringify(data)
    );
  }

  function getStatusText(status) {
    if (status === "approved") return "อนุมัติแล้ว";
    if (status === "cancelled") return "ถูกยกเลิก";
    return "รอทำภารกิจ";
  }

  function getStatusClass(status) {
    if (status === "approved") return "approved";
    if (status === "cancelled") return "cancelled";
    return "pending";
  }

  function renderMissions() {
    const data = loadMissionData();
    const container = document.getElementById("missionList");

    document.getElementById("dateText").textContent = getTodayKey();

    container.innerHTML = "";

    MISSION_LIST.forEach(item => {
      const mission = data.missions[item.id];

      const card = document.createElement("div");
      card.className = "mission";

      card.innerHTML = `
        <div class="mission-top">
          <div class="mission-name">${item.name}</div>

          <div class="status ${getStatusClass(mission.status)}">
            ${getStatusText(mission.status)}
          </div>
        </div>

        <div class="btn-row">
          <button
            class="btn-cancel"
            onclick="cancelSingleMission('${item.id}')"
          >
            ❌ ยกเลิก Mission นี้
          </button>

          <button
            class="btn-reset"
            onclick="resetSingleMission('${item.id}')"
          >
            🔄 คืนสถานะให้ทำใหม่
          </button>
        </div>
      `;

      container.appendChild(card);
    });
  }

  /* -------------------------
     1. ยกเลิกเฉพาะ 1 Mission
  ------------------------- */
  function cancelSingleMission(missionId) {
    const ok = confirm(
      "ต้องการยกเลิก Mission นี้ของผู้เล่นใช่หรือไม่?"
    );

    if (!ok) return;

    const data = loadMissionData();
    const mission = data.missions[missionId];

    mission.status = "cancelled";
    mission.completed = false;
    mission.approved = false;
    mission.rewardClaimed = false;

    mission.cancelledByAdmin = true;
    mission.cancelledAt = new Date().toISOString();

    saveMissionData(data);

    writeLog(
      `ยกเลิก Mission "${missionId}" ของ ${PLAYER_ID}`
    );

    renderMissions();
  }

  /* -------------------------
     2. ยกเลิกทุก Mission วันนี้
  ------------------------- */
  function cancelAllMissions() {
    const ok = confirm(
      "ต้องการยกเลิกทุก Mission ของผู้เล่นในวันนี้ใช่หรือไม่?"
    );

    if (!ok) return;

    const data = loadMissionData();

    Object.keys(data.missions).forEach(missionId => {
      const mission = data.missions[missionId];

      mission.status = "cancelled";
      mission.completed = false;
      mission.approved = false;
      mission.rewardClaimed = false;

      mission.cancelledByAdmin = true;
      mission.cancelledAt = new Date().toISOString();
    });

    data.allCancelledByAdmin = true;
    data.allCancelledAt = new Date().toISOString();

    saveMissionData(data);

    writeLog(
      `ยกเลิกทุก Mission วันนี้ของ ${PLAYER_ID}`
    );

    renderMissions();
  }

  /* -------------------------
     3. คืนสถานะเฉพาะ 1 Mission
        ให้ผู้เล่นทำใหม่
  ------------------------- */
  function resetSingleMission(missionId) {
    const ok = confirm(
      "ต้องการคืน Mission นี้ให้ผู้เล่นทำใหม่ใช่หรือไม่?"
    );

    if (!ok) return;

    const data = loadMissionData();
    const mission = data.missions[missionId];

    mission.status = "pending";
    mission.completed = false;
    mission.approved = false;
    mission.rewardClaimed = false;

    mission.cancelledByAdmin = false;
    mission.cancelledAt = null;

    mission.resetByAdmin = true;
    mission.resetAt = new Date().toISOString();

    saveMissionData(data);

    writeLog(
      `คืน Mission "${missionId}" ให้ ${PLAYER_ID} ทำใหม่`
    );

    renderMissions();
  }

  /* -------------------------
     คืนทุก Mission ให้ทำใหม่
  ------------------------- */
  function resetAllMissions() {
    const ok = confirm(
      "ต้องการคืนทุก Mission ให้ผู้เล่นเริ่มทำใหม่ใช่หรือไม่?"
    );

    if (!ok) return;

    const data = loadMissionData();

    Object.keys(data.missions).forEach(missionId => {
      const mission = data.missions[missionId];

      mission.status = "pending";
      mission.completed = false;
      mission.approved = false;
      mission.rewardClaimed = false;

      mission.cancelledByAdmin = false;
      mission.cancelledAt = null;

      mission.resetByAdmin = true;
      mission.resetAt = new Date().toISOString();
    });

    data.allCancelledByAdmin = false;
    data.allResetAt = new Date().toISOString();

    saveMissionData(data);

    writeLog(
      `คืนทุก Mission วันนี้ให้ ${PLAYER_ID} ทำใหม่`
    );

    renderMissions();
  }

  function writeLog(message) {
    const time = new Date().toLocaleString("th-TH");

    document.getElementById("adminLog").innerHTML =
      `<strong>Admin Action:</strong> ${message}<br>` +
      `<small>${time}</small>`;
  }

  renderMissions();
</script>

</body>
</html>
