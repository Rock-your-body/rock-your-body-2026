<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const LIFF_ID = "2011201679-uNWz5yqF";
const LIFF_URL = "https://liff.line.me/2011201679-uNWz5yqF";
const DASHBOARD_URL =
  "https://rock-your-body.github.io/rock-your-body-2026/dashboard.html";

async function startApp() {
  try {
    // ลบ token เก่าที่อาจค้าง
    localStorage.removeItem("idToken");
    localStorage.removeItem("line_id_token");
    localStorage.removeItem("LINE_ID_TOKEN");

    sessionStorage.removeItem("idToken");
    sessionStorage.removeItem("line_id_token");
    sessionStorage.removeItem("LINE_ID_TOKEN");

    await liff.init({
      liffId: LIFF_ID
    });

    // ถ้าเปิดจาก LINE/LIFF แต่ session ยังไม่พร้อม
    // ให้กลับเข้า LIFF ใหม่ แทนการพาไป access.line.me เอง
    if (!liff.isLoggedIn()) {
      if (liff.isInClient()) {
        window.location.replace(LIFF_URL);
        return;
      }

      // กรณีเปิดจาก Safari/Chrome ภายนอก LINE
      liff.login({
        redirectUri: DASHBOARD_URL
      });
      return;
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      window.location.replace(LIFF_URL);
      return;
    }

    // ใช้ sessionStorage เท่านั้น
    // ไม่เก็บถาวรใน localStorage
    sessionStorage.setItem("LINE_ID_TOKEN", idToken);

    window.location.replace("./dashboard.html");

  } catch (err) {
    console.error("LIFF INIT ERROR:", err);

    // ห้าม redirect ไป access.line.me โดยตรง
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Arial,sans-serif;
        text-align:center;
        padding:24px;
      ">
        <div>
          <div style="font-size:22px;font-weight:800;">
            ROCK YOUR BODY 2026
          </div>

          <div style="margin-top:12px;">
            กรุณาเปิดแอปจากเมนูใน LINE อีกครั้ง
          </div>

          <button
            onclick="window.location.replace('${LIFF_URL}')"
            style="
              margin-top:20px;
              border:0;
              border-radius:14px;
              padding:14px 24px;
              font-size:16px;
              font-weight:700;
              background:#06c755;
              color:#fff;
            "
          >
            เปิด ROCK YOUR BODY
          </button>
        </div>
      </div>
    `;
  }
}

startApp();
</script>
