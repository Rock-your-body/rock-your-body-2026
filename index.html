<!doctype html>

<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>
    ROCK YOUR BODY 2026
  </title>


  <!-- =====================================================
       LINE LIFF SDK
  ====================================================== -->

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <!-- =====================================================
       CONFIG
  ====================================================== -->

  <script src="./app-config.js"></script>


  <!-- =====================================================
       COMMON
  ====================================================== -->

  <script src="./common.js"></script>


  <style>

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background: #c9c9c9;

      font-family:
        Arial,
        sans-serif;

    }


    #loading {

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #333;

    }

  </style>

</head>


<body>


<div id="loading">

  กำลังเปิด ROCK YOUR BODY...

</div>


<script>

(async function () {

  try {

    console.log(
      "INDEX START"
    );


    const ready =
      await ROCK.initLiff();


    console.log(
      "LIFF READY:",
      ready
    );


    if (!ready) {

      /*
        ถ้า LIFF กำลัง authentication
        ไม่ต้องทำอะไรเพิ่ม

        LINE จะ redirect กลับมาเอง
      */

      return;

    }


    /*
      เปิด Dashboard
    */

    window.location.replace(
      "./dashboard.html"
    );


  } catch (error) {

    console.error(
      "INDEX ERROR:",
      error
    );


    document.getElementById(
      "loading"
    ).innerHTML =

      "ไม่สามารถเปิด ROCK YOUR BODY ได้<br><br>" +

      (
        error?.message ||
        String(error)
      );

  }

})();

</script>


</body>

</html>
