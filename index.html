<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073b93">
  <title>ROCK YOUR BODY 2026 - Weight Check</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#eef6ff;
      color:#10204a;
    }

    .container{
      max-width:520px;
      margin:auto;
      padding:16px 16px 32px;
    }

    .header{
      background:#fff;
      border-radius:20px;
      padding:16px;
      text-align:center;
      margin-bottom:14px;
      box-shadow:0 8px 24px rgba(30,70,130,.08);
    }

    .title{
      font-size:28px;
      font-weight:900;
      color:#073b93;
    }

    .title span{
      color:#d71920;
    }

    .subtitle{
      color:#65758b;
      margin-top:5px;
      font-weight:700;
      font-size:13px;
    }

    .hero{
      background:linear-gradient(135deg,#063484,#0874e8);
      color:#fff;
      border-radius:22px;
      padding:20px;
      box-shadow:0 10px 28px rgba(20,60,130,.2);
    }

    .hero h1{
      margin:0 0 7px;
      font-size:27px;
    }

    .heroDesc{
      font-size:14px;
      opacity:.92;
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:16px;
    }

    .stat{
      background:rgba(255,255,255,.15);
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.15);
    }

    .label{
      font-size:12px;
      opacity:.85;
    }

    .value{
      font-size:25px;
      font-weight:900;
      margin-top:4px;
    }

    .card{
      background:#fff;
      margin-top:14px;
      border-radius:20px;
      padding:18px;
      box-shadow:0 8px 28px rgba(30,70,130,.12);
    }

    .card h2{
      margin:0 0 14px;
      font-size:19px;
    }

    .inputbox{
      position:relative;
    }

    input{
      width:100%;
      height:64px;
      border:2px solid #ccdaed;
      border-radius:15px;
      padding:0 70px 0 16px;
      font-size:28px;
      font-weight:900;
      color:#063484;
      outline:none;
    }

    input:focus{
      border-color:#0874e8;
      box-shadow:0 0 0 4px rgba(8,116,232,.1);
    }

    .unit{
      position:absolute;
      right:18px;
      top:22px;
      color:#77879a;
      font-weight:800;
    }

    button{
      width:100%;
      height:56px;
      margin-top:14px;
      border:0;
      border-radius:15px;
      background:#06c755;
      color:#fff;
      font-size:19px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(6,199,85,.2);
    }

    button:active{
      transform:translateY(1px);
    }

    .result{
      display:none;
      margin-top:14px;
      padding:14px;
      border-radius:14px;
      line-height:1.55;
    }

    .success{
      display:block;
      background:#e8f8ef;
      color:#08783c;
    }

    .warning{
      display:block;
      background:#fff0f0;
      color:#a21e1e;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .smallbox{
      padding:12px;
      border-radius:14px;
      background:#f4f8fd;
    }

    .smallTitle{
      color:#758399;
      font-size:12px;
    }

    .smallValue{
      font-size:20px;
      font-weight:900;
      margin-top:4px;
    }

    .progress{
      height:15px;
      background:#e5edf7;
      border-radius:20px;
      overflow:hidden;
      margin-top:14px;
    }

    .progressBar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#0874e8,#06c755);
      transition:width .35s;
    }

    #percent{
      margin-bottom:0;
      color:#65758b;
      font-size:13px;
    }

    .historyItem{
      padding:12px 0;
      border-bottom:1px solid #e8eef6;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .historyItem:last-child{
      border-bottom:0;
    }

    .historyDate{
      font-size:12px;
      color:#758399;
    }

    .historyWeight{
      font-size:17px;
      font-weight:900;
      color:#073b93;
    }

    .footer{
      text-align:center;
      color:#8995a7;
      font-size:11px;
      margin-top:20px;
      line-height:1.6;
    }
  </style>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">ROCK <span>YOUR</span> BODY 2026</div>
    <div class="subtitle">
      MOVE &#8226; EAT &#8226; SLEEP &#8226; HEALTH
    </div>
  </div>

  <section class="hero">

    <h1>&#9878;&#65039; WEIGHT CHECK</h1>

    <div class="heroDesc">
      &#3610;&#3633;&#3609;&#3607;&#3638;&#3585;&#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;&#3649;&#3621;&#3632;&#3605;&#3636;&#3604;&#3605;&#3634;&#3617;&#3588;&#3623;&#3634;&#3617;&#3585;&#3657;&#3634;&#3623;&#3627;&#3609;&#3657;&#3634;&#3586;&#3629;&#3591;&#3588;&#3640;&#3603;
    </div>

    <div class="stats">

      <div class="stat">
        <div class="label">
          &#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;&#3621;&#3656;&#3634;&#3626;&#3640;&#3604;
        </div>
        <div class="value">
          <span id="latest">78.5</span> kg
        </div>
      </div>

      <div class="stat">
        <div class="label">
          &#3648;&#3611;&#3657;&#3634;&#3627;&#3617;&#3634;&#3618;
        </div>
        <div class="value">72.0 kg</div>
      </div>

    </div>
  </section>

  <section class="card">

    <h2>
      &#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;&#3623;&#3633;&#3609;&#3609;&#3637;&#3657;
    </h2>

    <div class="inputbox">

      <input
        id="weight"
        type="number"
        inputmode="decimal"
        min="30"
        max="250"
        step="0.1"
        placeholder="78.2"
      >

      <span class="unit">kg</span>

    </div>

    <button id="saveButton">
      &#3610;&#3633;&#3609;&#3607;&#3638;&#3585;&#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;
    </button>

    <div id="message" class="result"></div>

  </section>

  <section class="card">

    <h2>
      &#3588;&#3623;&#3634;&#3617;&#3585;&#3657;&#3634;&#3623;&#3627;&#3609;&#3657;&#3634;
    </h2>

    <div class="row">

      <div class="smallbox">
        <div class="smallTitle">
          &#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;&#3648;&#3619;&#3636;&#3656;&#3617;&#3605;&#3657;&#3609;
        </div>

        <div class="smallValue">
          78.5 kg
        </div>
      </div>

      <div class="smallbox">
        <div class="smallTitle">
          &#3621;&#3604;&#3649;&#3621;&#3657;&#3623;
        </div>

        <div class="smallValue">
          <span id="lost">0.0</span> kg
        </div>
      </div>

    </div>

    <div class="progress">
      <div id="bar" class="progressBar"></div>
    </div>

    <p id="percent">
      0%
    </p>

  </section>

  <section class="card">

    <h2>
      &#3611;&#3619;&#3632;&#3623;&#3633;&#3605;&#3636;&#3609;&#3657;&#3635;&#3627;&#3609;&#3633;&#3585;&#3621;&#3656;&#3634;&#3626;&#3640;&#3604;
    </h2>

    <div id="history">
      -
    </div>

  </section>

  <div class="footer">
    ROCK YOUR BODY 2026<br>
    Bangkok Hospital Udon
  </div>

</div>

<script>

const LIFF_ID = "2011201679-uN62Coga";

const START_WEIGHT = 78.5;
const TARGET_WEIGHT = 72.0;
const STORAGE_KEY = "rock_weight_history";

const TEXT = {
  noData:
    "\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25",

  invalid:
    "\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e19\u0e49\u0e33\u0e2b\u0e19\u0e31\u0e01\u0e23\u0e30\u0e2b\u0e27\u0e48\u0e32\u0e07 30-250 kg",

  progress:
    "\u0e04\u0e27\u0e32\u0e21\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08 ",

  ofGoal:
    "% \u0e02\u0e2d\u0e07\u0e40\u0e1b\u0e49\u0e32\u0e2b\u0e21\u0e32\u0e22",

  great:
    "\u0e40\u0e22\u0e35\u0e48\u0e22\u0e21\u0e21\u0e32\u0e01",

  weightDown:
    "\u0e19\u0e49\u0e33\u0e2b\u0e19\u0e31\u0e01\u0e25\u0e14\u0e25\u0e07 ",

  weightUp:
    "\u0e19\u0e49\u0e33\u0e2b\u0e19\u0e31\u0e01\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e02\u0e36\u0e49\u0e19 ",

  same:
    "\u0e19\u0e49\u0e33\u0e2b\u0e19\u0e31\u0e01\u0e40\u0e17\u0e48\u0e32\u0e01\u0e31\u0e1a\u0e04\u0e23\u0e31\u0e49\u0e07\u0e01\u0e48\u0e2d\u0e19",

  saved:
    "\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08",

  fromPrevious:
    " kg \u0e08\u0e32\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07\u0e01\u0e48\u0e2d\u0e19"
};

function getHistory(){
  try{
    return JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );
  }catch{
    return [];
  }
}

function saveHistory(data){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function formatWeight(value){
  return Number(value).toFixed(1);
}

function render(){

  const data = getHistory();

  const currentWeight =
    data.length
      ? Number(data[0].weight)
      : START_WEIGHT;

  document.getElementById("latest").textContent =
    formatWeight(currentWeight);

  const lostWeight =
    Math.max(
      0,
      START_WEIGHT - currentWeight
    );

  document.getElementById("lost").textContent =
    formatWeight(lostWeight);

  const totalTarget =
    START_WEIGHT - TARGET_WEIGHT;

  let percentage =
    totalTarget > 0
      ? (lostWeight / totalTarget) * 100
      : 0;

  percentage =
    Math.max(
      0,
      Math.min(100,percentage)
    );

  document.getElementById("bar").style.width =
    percentage.toFixed(0) + "%";

  document.getElementById("percent").textContent =
    TEXT.progress +
    percentage.toFixed(0) +
    TEXT.ofGoal;

  renderHistory(data);
}

function renderHistory(data){

  const history =
    document.getElementById("history");

  if(!data.length){
    history.textContent = TEXT.noData;
    return;
  }

  history.innerHTML =
    data
      .slice(0,5)
      .map(item => {

        const date =
          new Date(item.time);

        return (
          '<div class="historyItem">' +

            '<div class="historyDate">' +
              date.toLocaleString("th-TH") +
            '</div>' +

            '<div class="historyWeight">' +
              formatWeight(item.weight) +
              ' kg' +
            '</div>' +

          '</div>'
        );

      })
      .join("");
}

function saveWeight(){

  const input =
    document.getElementById("weight");

  const weight =
    Number(input.value);

  const message =
    document.getElementById("message");

  if(
    !weight ||
    weight < 30 ||
    weight > 250
  ){

    message.className =
      "result warning";

    message.textContent =
      TEXT.invalid;

    return;
  }

  const data =
    getHistory();

  const previous =
    data.length
      ? Number(data[0].weight)
      : START_WEIGHT;

  data.unshift({
    weight:weight,
    time:new Date().toISOString()
  });

  saveHistory(
    data.slice(0,50)
  );

  const difference =
    weight - previous;

  if(difference < 0){

    message.className =
      "result success";

    message.innerHTML =
      "<b>" +
      TEXT.great +
      "</b><br>" +

      TEXT.weightDown +
      Math.abs(difference).toFixed(1) +
      TEXT.fromPrevious +

      "<br><br>" +
      "+10 ROCK COIN<br>" +
      "+5 ENERGY";

  }else if(difference > 0){

    message.className =
      "result success";

    message.innerHTML =
      "<b>" +
      TEXT.saved +
      "</b><br>" +

      TEXT.weightUp +
      difference.toFixed(1) +
      TEXT.fromPrevious;

  }else{

    message.className =
      "result success";

    message.innerHTML =
      "<b>" +
      TEXT.saved +
      "</b><br>" +
      TEXT.same;

  }

  input.value = "";

  render();
}

document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveWeight
  );

render();

</script>

</body>
</html>
