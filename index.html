<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ROCK YOUR BODY 2026</title>

  <meta
    name="theme-color"
    content="#eef5ff"
  >

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#eef5ff;
      font-family:
        "Prompt",
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    body{
      min-height:100vh;
      min-height:100dvh;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#06276c;
    }

    .loading{
      text-align:center;
      padding:24px;
    }

    .spinner{
      width:46px;
      height:46px;

      margin:0 auto 16px;

      border:5px solid #dce8f8;
      border-top-color:#075ac7;
      border-radius:50%;

      animation:spin .75s linear infinite;
    }

    .title{
      font-size:22px;
      font-weight:900;
    }

    .sub{
      margin-top:6px;
      font-size:14px;
      font-weight:700;
      opacity:.65;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loading">
    <div class="spinner"></div>

    <div class="title">
      ROCK YOUR BODY 2026
    </div>

    <div class="sub">
      กำลังเปิด HOME...
    </div>
  </div>


  <script>
    (() => {

      const target =
        "./dashboard.html?v=20260829-home-v10";

      /*
        ใช้ replace()
        เพื่อไม่ให้กดย้อนกลับมา index.html
      */
      window.location.replace(
        target
      );

    })();
  </script>

</body>
</html>
