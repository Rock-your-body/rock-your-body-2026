<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK YOUR BODY 2026 - Progress</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app-config.js"></script><script src="./common.js"></script><style>body{margin:0;background:#eef4ff;font-family:Arial,'Noto Sans Thai',sans-serif;color:#08245b}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1233}.hero{background:linear-gradient(135deg,#082d87,#1266d8);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.v{font-size:28px;font-weight:900}.bar{height:12px;background:#dbe5f4;border-radius:20px;overflow:hidden}.fill{height:100%;background:#16a34a;width:0}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#073b93;color:#fff;font-weight:900}</style></head><body><main class="wrap"><section class="card hero"><h1>📈 MY PROGRESS</h1><p>ติดตามความก้าวหน้า MOVE • EAT • SLEEP • HEALTH</p></section><section class="card grid"><div><small>น้ำหนักล่าสุด</small><div id="weight" class="v">--.- kg</div></div><div><small>เป้าหมาย</small><div id="target" class="v">--.- kg</div></div><div><small>ลดไปแล้ว</small><div id="lost" class="v">--.- kg</div></div><div><small>คะแนนสุขภาพ</small><div id="health" class="v">0</div></div></section><section class="card"><h2>เป้าหมายน้ำหนัก</h2><div class="bar"><div id="fill" class="fill"></div></div><p id="progress">0%</p></section><button class="btn" onclick="ROCK.goHome()">🏠 กลับ HOME</button></main><script>(async()=>{try{await ROCK.initLiff();const d=await ROCK.callPlayerApi({action:'progress'});const w=d.user?.weight||{};document.getElementById('weight').textContent=ROCK.fmtWeight(w.current)+' kg';document.getElementById('target').textContent=ROCK.fmtWeight(w.target)+' kg';document.getElementById('lost').textContent=(Number(w.start)&&Number(w.current)?Math.max(0,w.start-w.current).toFixed(1):'--.-')+' kg';document.getElementById('health').textContent=d.user?.healthScore??0;let pct=0;if(Number(w.start)&&Number(w.target)&&w.start!==w.target)pct=Math.max(0,Math.min(100,(w.start-w.current)/(w.start-w.target)*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('progress').textContent=pct.toFixed(0)+'%';}catch(e){document.body.innerHTML='<div style="padding:30px">❌ '+e.message+'</div>'}})()</script></body></html>
