<title>ROCK YOUR BODY 2026 - Dashboard</title>

<style>
/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;

  background: #eef5ff;
  color: #08245b;
}


/* =====================================================
   PAGE
===================================================== */

.page {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  padding: 12px;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {
  position: relative;

  width: 100%;
  max-width: 1250px;

  aspect-ratio: 2500 / 1686;

  overflow: hidden;

  background: #ffffff;

  border-radius: 18px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.12);
}


/* =====================================================
   BACKGROUND IMAGE
===================================================== */

.dashboard-bg {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  display: block;

  user-select: none;
  pointer-events: none;
}


/* =====================================================
   PROFILE PHOTO
===================================================== */

.profile-photo {
  position: absolute;

  z-index: 5;

  left: 18.85%;
  top: 35.4%;

  width: 28.4%;

  aspect-ratio: 1 / 1;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  overflow: hidden;

  pointer-events: none;
}

.profile-photo img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: none;
}


/* =====================================================
   COMMON LIVE VALUE
===================================================== */

.live-value {
  position: absolute;

  z-index: 15;

  font-weight: 900;

  white-space: nowrap;

  text-align: center;

  line-height: 1;

  pointer-events: none;
}


/* =====================================================
   ROCK COIN
===================================================== */

#rockCoinValue {
  left: 79.1%;
  top: 10.6%;

  transform:
    translate(-50%, -50%);

  min-width: 8%;

  color: #08245b;

  font-size:
    clamp(11px, 1.35vw, 22px);
}


/* =====================================================
   ENERGY
===================================================== */

#energyValue {
  left: 92.0%;
  top: 10.6%;

  transform:
    translate(-50%, -50%);

  min-width: 9%;

  color: #08245b;

  font-size:
    clamp(10px, 1.25vw, 21px);
}


/* =====================================================
   CURRENT WEIGHT
===================================================== */

#currentWeightValue {
  left: 52.8%;
  top: 40.0%;

  transform:
    translate(-50%, -50%);

  color: #08245b;

  font-size:
    clamp(13px, 1.9vw, 31px);
}


/* =====================================================
   TARGET WEIGHT
===================================================== */

#targetWeightValue {
  left: 52.8%;
  top: 61.9%;

  transform:
    translate(-50%, -50%);

  color: #d31317;

  font-size:
    clamp(13px, 1.9vw, 31px);
}


/* =====================================================
   LEVEL
===================================================== */

#levelValue {
  left: 30.85%;
  top: 64.0%;

  transform:
    translate(-50%, -50%);

  color: #ffffff;

  font-size:
    clamp(11px, 1.5vw, 24px);

  text-shadow:
    0 2px 4px rgba(0,0,0,.40);
}


/* =====================================================
   EXP BAR
===================================================== */

.exp-track {
  position: absolute;

  z-index: 14;

  left: 10.35%;
  top: 71.48%;

  width: 21.2%;
  height: 3.25%;

  padding: 3px;

  border-radius: 999px;

  overflow: hidden;

  background: transparent;

  pointer-events: none;
}

.exp-fill {
  width: 0%;
  height: 100%;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      #00b8ff 0%,
      #087bff 45%,
      #0640df 100%
    );

  box-shadow:
    inset 0 0 4px rgba(255,255,255,.55);

  transition:
    width .45s ease;
}


/* =====================================================
   CLICK AREAS
===================================================== */

.click-area {
  position: absolute;

  z-index: 30;

  border: 0;
  margin: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;

  appearance: none;
  -webkit-appearance: none;
}


/* PROFILE */

#profileButton {
  left: 2.5%;
  top: 15%;
  width: 33%;
  height: 44%;
}


/* WEIGHT CHECK */

#weightCheckButton {
  left: 59%;
  top: 15%;
  width: 18.5%;
  height: 30%;
}


/* MY PROGRESS */

#progressButton {
  left: 78.5%;
  top: 15%;
  width: 19%;
  height: 30%;
}


/* RANKING */

#rankingButton {
  left: 59%;
  top: 46%;
  width: 18.5%;
  height: 30%;
}


/* REWARDS */

#rewardsButton {
  left: 78.5%;
  top: 46%;
  width: 19%;
  height: 30%;
}


/* CURRENT WEIGHT CARD */

#weightCardButton {
  left: 35%;
  top: 24%;
  width: 22%;
  height: 21%;
}


/* TARGET CARD */

#targetButton {
  left: 35%;
  top: 46%;
  width: 22%;
  height: 25%;
}


/* HOME */

#homeButton {
  left: 1.5%;
  top: 79%;
  width: 32%;
  height: 19%;
}


/* MISSION */

#missionButton {
  left: 34%;
  top: 79%;
  width: 32%;
  height: 19%;
}


/* BATTLE */

#battleButton {
  left: 67%;
  top: 79%;
  width: 31.5%;
  height: 19%;
}


/* =====================================================
   STATUS
===================================================== */

.status {
  position: fixed;

  z-index: 300;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%);

  max-width: 90vw;

  padding: 12px 20px;

  border-radius: 999px;

  background: rgba(7,59,147,.94);

  color: white;

  text-align: center;

  font-size: 14px;
  font-weight: 800;

  box-shadow:
    0 8px 25px rgba(0,0,0,.22);

  display: none;
}

.status.show {
  display: block;
}

.status.error {
  background:
    rgba(190,27,27,.96);
}

.status.success {
  background:
    rgba(3,143,69,.95);
}


/* =====================================================
   MODAL
===================================================== */

.modal-backdrop {
  position: fixed;

  inset: 0;

  z-index: 400;

  background:
    rgba(0,0,0,.50);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 18px;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 420px;

  padding: 22px;

  border-radius: 22px;

  background: #ffffff;

  box-shadow:
    0 20px 60px rgba(0,0,0,.30);
}

.modal h2 {
  margin: 0 0 8px;

  color: #073b93;
}

.modal p {
  margin: 0 0 18px;

  color: #64748b;

  line-height: 1.5;
}

.target-input-wrap {
  display: flex;
  align-items: center;

  padding: 4px 14px;

  border:
    2px solid #c8d7ed;

  border-radius: 14px;

  background: #f8fbff;
}

.target-input-wrap input {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  padding: 14px 4px;

  font-size: 26px;
  font-weight: 900;

  color: #073b93;
}

.target-input-wrap span {
  font-size: 18px;
  font-weight: 900;

  color: #64748b;
}

.modal-actions {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 18px;
}

.modal-actions button {
  min-height: 48px;

  border: 0;

  border-radius: 12px;

  cursor: pointer;

  font-size: 16px;
  font-weight: 800;
}

.btn-cancel {
  background: #e9eef6;
  color: #334155;
}

.btn-save {
  background: #06c755;
  color: white;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

  .page {
    padding: 0;
  }

  .dashboard {
    width: 100vw;

    border-radius: 0;

    box-shadow: none;
  }

  #rockCoinValue {
    font-size:
      clamp(8px, 2.2vw, 14px);
  }

  #energyValue {
    font-size:
      clamp(8px, 2.1vw, 14px);
  }

  #currentWeightValue,
  #targetWeightValue {
    font-size:
      clamp(9px, 2.6vw, 17px);
  }

  #levelValue {
    font-size:
      clamp(8px, 2.2vw, 14px);
  }

  .exp-track {
    padding: 1px;
  }
}

</style>
</head>

<script>

/* =====================================================
   CONFIG
===================================================== */

const LIFF_ID =
  "2011201679-uNWz5yqF";


const API_URL =
  "https://nztvqdzatdpauufpvdaa.supabase.co/functions/v1/player-dashboard";


const WEIGHT_CHECK_URL =
  "https://liff.line.me/2011201679-uN62Coga";


const MISSION_URL =
  "mission.html";


const BATTLE_URL =
  "battle.html";


/*
  โหลดข้อมูลใหม่ทุก 10 วินาที
*/

const AUTO_REFRESH_MS =
  10000;


/* =====================================================
   STATE
===================================================== */

let dashboardData =
  null;

let refreshTimer =
  null;

let requestRunning =
  false;


/* =====================================================
   ELEMENTS
===================================================== */

const statusEl =
  document.getElementById(
    "status"
  );

const profileImage =
  document.getElementById(
    "profileImage"
  );

const rockCoinValue =
  document.getElementById(
    "rockCoinValue"
  );

const energyValue =
  document.getElementById(
    "energyValue"
  );

const currentWeightValue =
  document.getElementById(
    "currentWeightValue"
  );

const targetWeightValue =
  document.getElementById(
    "targetWeightValue"
  );

const levelValue =
  document.getElementById(
    "levelValue"
  );

const expBar =
  document.getElementById(
    "expBar"
  );

const targetModal =
  document.getElementById(
    "targetModal"
  );

const targetInput =
  document.getElementById(
    "targetInput"
  );


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message,
  type = ""
) {

  statusEl.textContent =
    message;

  statusEl.className =
    "status show" +
    (
      type
        ? " " + type
        : ""
    );
}


function hideStatus() {

  statusEl.className =
    "status";
}


/* =====================================================
   NUMBER FORMAT
===================================================== */

function formatInteger(
  value
) {

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    return "0";
  }

  return Math.round(number)
    .toLocaleString(
      "en-US"
    );
}


function formatWeight(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";
  }

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    return "";
  }

  return number
    .toFixed(1);
}


/* =====================================================
   API
===================================================== */

async function callAPI(
  action,
  extra = {}
) {

  const idToken =
    liff.getIDToken();

  if (!idToken) {

    throw new Error(
      "ไม่พบ LINE ID Token"
    );
  }


  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action,
            idToken,
            ...extra
          })
      }
    );


  const text =
    await response.text();


  let data;

  try {

    data =
      JSON.parse(text);

  } catch {

    throw new Error(
      "API ตอบกลับไม่ถูกต้อง"
    );
  }


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.error ||
      "โหลดข้อมูลไม่สำเร็จ"
    );
  }


  return data;
}


/* =====================================================
   RENDER
===================================================== */

function renderDashboard(
  data
) {

  dashboardData =
    data;


  /* -------------------------
     ROCK COIN
  -------------------------- */

  rockCoinValue.textContent =
    formatInteger(
      data.rockCoin
    );


  /* -------------------------
     ENERGY
  -------------------------- */

  if (
    data.energy &&
    data.energy.current !== undefined
  ) {

    energyValue.textContent =
      formatInteger(
        data.energy.current
      ) +
      " / " +
      formatInteger(
        data.energy.max
      );

  } else {

    energyValue.textContent =
      "";
  }


  /* -------------------------
     CURRENT WEIGHT
  -------------------------- */

  currentWeightValue.textContent =
    formatWeight(
      data.weight?.current
    );


  /* -------------------------
     TARGET WEIGHT
  -------------------------- */

  targetWeightValue.textContent =
    formatWeight(
      data.weight?.target
    );


  /* -------------------------
     LEVEL
  -------------------------- */

  if (
    data.level !== null &&
    data.level !== undefined
  ) {

    levelValue.textContent =
      formatInteger(
        data.level
      );

  } else {

    levelValue.textContent =
      "";
  }


  /* -------------------------
     EXP
  -------------------------- */

  const expProgress =
    Number(
      data.exp?.progress ?? 0
    );

  const safeExp =
    Math.max(
      0,
      Math.min(
        100,
        Number.isFinite(expProgress)
          ? expProgress
          : 0
      )
    );

  expBar.style.width =
    safeExp + "%";


  /*
    EXP = 0
    ช่องว่าง ไม่มีสี
  */

  if (
    safeExp <= 0
  ) {

    expBar.style.width =
      "0%";
  }


  /* -------------------------
     PROFILE
  -------------------------- */

  const pictureUrl =
    data.user?.pictureUrl;

  if (pictureUrl) {

    if (
      profileImage.src !==
      pictureUrl
    ) {

      profileImage.src =
        pictureUrl;
    }

    profileImage.style.display =
      "block";

  } else {

    profileImage.style.display =
      "none";
  }
}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(
  showLoading = true
) {

  if (requestRunning) {
    return;
  }

  requestRunning =
    true;


  if (showLoading) {

    showStatus(
      "กำลังโหลดข้อมูล..."
    );
  }


  try {

    const data =
      await callAPI(
        "dashboard"
      );

    renderDashboard(
      data
    );

    hideStatus();

  } catch (error) {

    console.error(
      "DASHBOARD LOAD ERROR:",
      error
    );

    showStatus(
      error.message ||
      "โหลดข้อมูลไม่สำเร็จ",
      "error"
    );

  } finally {

    requestRunning =
      false;
  }
}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAutoRefresh() {

  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );
  }


  refreshTimer =
    setInterval(
      function () {

        if (
          document.visibilityState ===
          "visible"
        ) {

          loadDashboard(
            false
          );
        }

      },
      AUTO_REFRESH_MS
    );
}


/* =====================================================
   TARGET MODAL
===================================================== */

function openTargetModal() {

  const current =
    dashboardData?.weight?.target;

  if (
    current !== null &&
    current !== undefined
  ) {

    targetInput.value =
      Number(current)
        .toFixed(1);

  } else {

    targetInput.value =
      "";
  }


  targetModal
    .classList
    .add(
      "show"
    );


  setTimeout(
    function () {

      targetInput
        .focus();

    },
    100
  );
}


function closeTargetModal() {

  targetModal
    .classList
    .remove(
      "show"
    );
}


/* =====================================================
   SAVE TARGET
===================================================== */

async function saveTarget() {

  const target =
    Number(
      targetInput.value
    );


  if (
    !Number.isFinite(target) ||
    target < 20 ||
    target > 400
  ) {

    alert(
      "กรุณากรอกเป้าหมายน้ำหนักที่ถูกต้อง"
    );

    return;
  }


  showStatus(
    "กำลังบันทึกเป้าหมาย..."
  );


  try {

    const data =
      await callAPI(
        "setTarget",
        {
          targetWeight:
            target
        }
      );


    renderDashboard(
      data
    );


    closeTargetModal();


    showStatus(
      "บันทึกเป้าหมายแล้ว",
      "success"
    );


    setTimeout(
      hideStatus,
      1200
    );

  } catch (error) {

    console.error(
      error
    );

    showStatus(
      error.message ||
      "บันทึกเป้าหมายไม่สำเร็จ",
      "error"
    );
  }
}


/* =====================================================
   NAVIGATION
===================================================== */

function go(
  url
) {

  window.location.href =
    url;
}


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById(
    "weightCheckButton"
  )
  .addEventListener(
    "click",
    function () {

      go(
        WEIGHT_CHECK_URL
      );
    }
  );


document
  .getElementById(
    "weightCardButton"
  )
  .addEventListener(
    "click",
    function () {

      go(
        WEIGHT_CHECK_URL
      );
    }
  );


document
  .getElementById(
    "targetButton"
  )
  .addEventListener(
    "click",
    openTargetModal
  );


document
  .getElementById(
    "homeButton"
  )
  .addEventListener(
    "click",
    function () {

      loadDashboard(
        true
      );
    }
  );


document
  .getElementById(
    "progressButton"
  )
  .addEventListener(
    "click",
    function () {

      loadDashboard(
        true
      );
    }
  );


document
  .getElementById(
    "rankingButton"
  )
  .addEventListener(
    "click",
    function () {

      alert(
        "ระบบ Ranking จะเชื่อมต่อในขั้นถัดไป"
      );
    }
  );


document
  .getElementById(
    "rewardsButton"
  )
  .addEventListener(
    "click",
    function () {

      alert(
        "ระบบ Rewards จะเชื่อมต่อในขั้นถัดไป"
      );
    }
  );


document
  .getElementById(
    "missionButton"
  )
  .addEventListener(
    "click",
    function () {

      if (
        MISSION_URL
      ) {

        go(
          MISSION_URL
        );
      }
    }
  );


document
  .getElementById(
    "battleButton"
  )
  .addEventListener(
    "click",
    function () {

      if (
        BATTLE_URL
      ) {

        go(
          BATTLE_URL
        );
      }
    }
  );


document
  .getElementById(
    "profileButton"
  )
  .addEventListener(
    "click",
    function () {

      /*
        ตอนนี้ใช้รูป LINE Profile
        ระบบ upload รูปเองทำภายหลัง
      */

    }
  );


document
  .getElementById(
    "cancelTargetButton"
  )
  .addEventListener(
    "click",
    closeTargetModal
  );


document
  .getElementById(
    "saveTargetButton"
  )
  .addEventListener(
    "click",
    saveTarget
  );


targetModal
  .addEventListener(
    "click",
    function (event) {

      if (
        event.target ===
        targetModal
      ) {

        closeTargetModal();
      }
    }
  );


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document
  .addEventListener(
    "visibilitychange",
    function () {

      if (
        document.visibilityState ===
        "visible" &&
        liff.isLoggedIn()
      ) {

        loadDashboard(
          false
        );
      }
    }
  );


/* =====================================================
   LIFF INIT
===================================================== */

async function initLIFF() {

  showStatus(
    "กำลังเชื่อมต่อ LINE..."
  );


  try {

    await liff.init({
      liffId:
        LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;
    }


    await loadDashboard(
      true
    );


    startAutoRefresh();


  } catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );


    showStatus(
      "เปิด Dashboard ไม่สำเร็จ: " +
      (
        error.message ||
        error
      ),
      "error"
    );
  }
}


/* =====================================================
   START
===================================================== */

initLIFF();

</script>
